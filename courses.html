<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Μαθήματα ΣΑΕΚ</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="shell.css?v=5">
</head>
<body>
<main class="b-main" id="main">
 <div class="b-wrap">
  <h1>Μαθήματα ΣΑΕΚ</h1>
  <p class="b-lead">20 μαθήματα σε 4 εξάμηνα. Διάλεξε μάθημα για να ανοίξεις τα κεφάλαιά του.</p>
  <section class="b-section" id="library" aria-label="Μαθήματα">
   
   <div class="b-media">
    <a href="./saek-videos.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg><span><b>Όλα τα βίντεο με τη σειρά</b><small>Από το μάθημα 01 έως το 20</small></span></a>
    <a href="./saek-images.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg><span><b>Όλες οι φωτογραφίες</b><small>Δες κάθε εικόνα χωριστά</small></span></a>
   </div>
   <div class="b-tabs" role="group" aria-label="Εξάμηνο" id="tabs"></div>
   <ul class="b-courses" id="courses"></ul>
  </section>

 </div>
</main>
<script type="module">
import {COURSES,shell,readCount,esc} from './shell.js?v=2';
shell();
let sem='all';
const tabs=document.getElementById('tabs');
tabs.innerHTML=[['all','Όλα'],['Α','Α εξάμηνο'],['Β','Β εξάμηνο'],['Γ','Γ εξάμηνο'],['Δ','Δ εξάμηνο']].map(([v,l])=>`<button type="button" data-sem="${v}" aria-pressed="${v===sem}">${l}</button>`).join('');
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sem=b.dataset.sem;tabs.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));list()});
function list(){
 document.getElementById('courses').innerHTML=COURSES.filter(c=>sem==='all'||c.semester===sem).map(c=>{
  const n=readCount(c),pct=Math.round(n/c.chapters*100);
  return `<li><a href="chapter.html?c=${c.id}&ch=1"><span class="b-num">${c.id}</span><span><b>${esc(c.title)}</b><small>${c.semester} εξάμηνο · ${c.chapters} κεφάλαια${n?` · ${n} διαβασμένα`:''}</small></span><span class="b-meter" role="img" aria-label="${pct}% διαβασμένο"><i style="width:${pct}%"></i></span></a></li>`}).join('');
}

list();
addEventListener('storage',list);addEventListener('pageshow',list);
</script>
</body>
</html>
