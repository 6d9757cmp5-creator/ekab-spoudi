<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Κεφάλαιο ΣΑΕΚ beta</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="beta.css?v=6">
</head>
<body>
<main class="b-main" id="main">
 <div class="b-reader">
  <article class="b-article" aria-live="polite">
   <nav class="b-crumbs" aria-label="Διαδρομή"><a href="index.html">Αρχική</a><span aria-hidden="true">/</span><a href="library.html">Μαθήματα ΣΑΕΚ</a><span aria-hidden="true">/</span><span id="crumb-course"></span></nav>
   <span class="b-chapnum" id="chapnum"></span>
   <h1 id="title">Φόρτωση…</h1>
   <div id="body"><p class="b-loading">Φόρτωση κεφαλαίου…</p></div>
   <div class="b-done" id="done"></div>
   <nav class="b-pager" id="pager" aria-label="Κεφάλαια"></nav>
  </article>
  <aside class="b-outline" aria-labelledby="outline-h">
   <details open><summary>Κεφάλαια μαθήματος</summary>
    <h2 id="outline-h">Κεφάλαια μαθήματος</h2>
    <ol id="outline"></ol>
   </details>
  </aside>
 </div>
</main>
<script type="module">
import {COURSES,shell,isRead,setRead,store,esc} from './beta.js?v=4';
shell('library.html');

const p=new URLSearchParams(location.search);
const course=COURSES.find(c=>c.id===p.get('c'))||COURSES[0];
const ch=Math.min(Math.max(parseInt(p.get('ch'),10)||1,1),course.chapters);
const $=id=>document.getElementById(id);
$('crumb-course').textContent=course.title;
$('chapnum').textContent=`Μάθημα ${course.id} · Κεφάλαιο ${ch} από ${course.chapters}`;
store.set('ekab.beta.last',`${course.id}:${ch}`);

const src=new URL(`../saek-course-${course.id}.html`,location.href);
const fail=()=>{$('title').textContent=course.title;$('body').innerHTML=`<p class="b-note">Το κεφάλαιο δεν φορτώθηκε. Έλεγξε τη σύνδεση και ανανέωσε τη σελίδα, ή άνοιξέ το στην <a href="${src.href}#lesson-${ch}">τρέχουσα όψη</a>.</p>`};
let titles=[];
try{
 const html=await fetch(src).then(r=>{if(!r.ok)throw 0;return r.text()});
 const doc=new DOMParser().parseFromString(html,'text/html');
 titles=[...doc.querySelectorAll('.reader-fold')].map(d=>{const h=d.querySelector('.chapter-heading')?.cloneNode(true);h?.querySelector('small')?.remove();return h?.textContent.trim()||''});
 const fold=doc.getElementById(`lesson-${ch}`);
 if(!fold)throw 0;
 const body=fold.querySelector('.reader-main')||fold.querySelector('.body');
 body.querySelectorAll('.reader-actions,script,style').forEach(n=>n.remove());
 // Links and images in the course page are relative to the site root.
 body.querySelectorAll('[src]').forEach(n=>n.setAttribute('src',new URL(n.getAttribute('src'),src).href));
 body.querySelectorAll('a[href]').forEach(n=>{const h=n.getAttribute('href');if(/^#lesson-(\d+)$/.test(h))n.href=`course.html?c=${course.id}&ch=${h.slice(8)}`;else if(!h.startsWith('#'))n.href=new URL(h,src).href});
 body.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
 const t=titles[ch-1]||course.title;
 $('title').textContent=t;document.title=`${t} · ΕΚΑΒ Σπουδή beta`;
 $('body').replaceChildren(...body.childNodes);
}catch(_){fail()}

const outline=()=>{$('outline').innerHTML=Array.from({length:course.chapters},(_,i)=>{const n=i+1,read=isRead(course.id,n);
 return `<li><a href="course.html?c=${course.id}&ch=${n}"${n===ch?' aria-current="true"':''}>${read?'✓ ':''}${n}. ${esc(titles[i]||'Κεφάλαιο '+n)}</a></li>`}).join('')};
const done=()=>{const on=isRead(course.id,ch);$('done').dataset.done=String(on);
 $('done').innerHTML=`<button class="b-btn" type="button" aria-pressed="${on}">${on?'✓ Διαβάστηκε':'Σημείωσε ως διαβασμένο'}</button>`;
 $('done').querySelector('button').onclick=()=>{if(!setRead(course.id,ch,!on)){$('done').insertAdjacentHTML('beforeend','<span class="b-note">Ο browser δεν επιτρέπει αποθήκευση.</span>');return}done();outline()}};
const pager=()=>{const prev=ch>1?`<a href="course.html?c=${course.id}&ch=${ch-1}"><small>Προηγούμενο</small>${esc(titles[ch-2]||'Κεφάλαιο '+(ch-1))}</a>`:'';
 const nextCourse=COURSES[COURSES.indexOf(course)+1];
 const next=ch<course.chapters?`<a class="next" href="course.html?c=${course.id}&ch=${ch+1}"><small>Επόμενο</small>${esc(titles[ch]||'Κεφάλαιο '+(ch+1))}</a>`:
  nextCourse?`<a class="next" href="course.html?c=${nextCourse.id}&ch=1"><small>Επόμενο μάθημα</small>${esc(nextCourse.title)}</a>`:'';
 $('pager').innerHTML=prev+next};
if(matchMedia('(max-width:1100px)').matches)document.querySelector('.b-outline details').open=false;
outline();done();pager();
// Thin reading-progress line under the top bar.
const bar=document.createElement('div');bar.className='b-readbar';bar.setAttribute('aria-hidden','true');document.body.append(bar);
const art=document.querySelector('.b-article');
const prog=()=>{const r=art.getBoundingClientRect(),h=r.height-innerHeight+120;bar.style.setProperty('--p',h>0?Math.min(Math.max(-r.top/h,0),1):1)};
addEventListener('scroll',prog,{passive:true});addEventListener('resize',prog);prog();
addEventListener('storage',()=>{outline();done()});
</script>
</body>
</html>
