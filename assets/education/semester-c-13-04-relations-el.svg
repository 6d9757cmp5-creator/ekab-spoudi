<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d">
<title id="t">Διαλογή κλήσεων — τρεις αρχές αξιολόγησης</title>
<desc id="d">Τρεις ανεξάρτητες εκπαιδευτικές αρχές χωρίς σειρά ενεργειών: προτεραιότητα βάσει εφαρμοστέων κανόνων, επανεξέταση όταν υπάρχουν νέες αναφορές, αποφυγή προσωπικής εκτίμησης πανικού. Δεν αποτελεί κλινική εντολή ή πρωτόκολλο.</desc>
