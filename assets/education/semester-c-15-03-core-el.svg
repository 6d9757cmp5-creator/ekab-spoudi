<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Ζώνες, επικοινωνία και απολογισμός — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 3. Παρουσιάζονται: Ασφαλείς περιοχές εργασίας; Ορισμένη διαδρομή μεταφοράς; Χώρος παραλαβής ασθενοφόρου. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="81" y="253" width="1015" height="469" rx="25" fill="#eaf3ef" stroke="#8aa79b" stroke-width="3"/><rect x="106" y="293" width="305" height="328" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="258" y="336" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΣΚΗΝΗ</text><circle cx="258" cy="415" r="37" fill="#4d7d70"/><path d="M258 393l20 7v16q-2 16-20 25-18-9-20-25v-16z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/><path d="M248 416h20m-17 8h14" stroke="#ffffff" stroke-width="3"/><text x="258" y="486" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Ασφαλείς περιοχές</text><text x="258" y="514" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">εργασίας</text><rect x="443" y="293" width="305" height="328" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><g transform="translate(0,-35)"><text x="595" y="371" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΟΡΓΑΝΩΣΗ</text><circle cx="595" cy="450" r="37" fill="#4d7d70"/><path d="M575 450h30m-9-10 10 10-10 10m-2-28 8-8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="581" cy="450" r="4" fill="#ffffff"/><text x="595" y="521" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font