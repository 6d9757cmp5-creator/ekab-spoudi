<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Εκτίμηση πόνου με OPQRST</title><desc id="desc">Σχηματικό περίγραμμα ασθενούς με επισήμανση υποθετικής περιοχής πόνου και αντανάκλασης, πλαισιωμένο από έξι επεξηγηματικά πεδία για έναρξη, επιδείνωση και ανακούφιση, χαρακτήρα, περιοχή και αντανάκλαση, ένταση και χρονική εξέλιξη. Το σχήμα δεν υποδεικνύει διάγνωση.</desc><rect width="1200" height="700" fill="#f3f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173d53}.head{font-size:34px;font-weight:700}.small{font-size:20px}.label{font-size:24px;font-weight:700}.fine{font-size:18px}.panel{fill:#fff;stroke:#b7cedd;stroke-width:3}.line{fill:none;stroke:#5989a2;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="600" y="50" text-anchor="middle" class="head">OPQRST · περιγραφή και παρακολούθηση πόνου</text>
<text x="600" y="85" text-anchor="middle" class="small">Το σημείο και η κατεύθυνση του πόνου είναι ενδεικτικά, όχι διαγνωστικά</text>
