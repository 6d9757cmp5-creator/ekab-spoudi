<path d="M600 486L574 574M601 486L628 574" class="line"/>
<circle cx="626" cy="334" r="26" fill="#f6c4c4" stroke="#bd6068" stroke-width="4"/>
<path d="M623 305L645 291M650 293L648 279" stroke="#bd6068" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M647 334Q696 350 715 369" stroke="#c56167" stroke-width="5" stroke-dasharray="9 7" fill="none"/>
<text x="601" y="608" text-anchor="middle" class="fine">Ενδεικτική θέση πόνου</text>
<g transform="translate(30 132)"><rect width="337" height="147" rx="17" class="panel"/><circle cx="37" cy="41" r="28" fill="#daecf5" stroke="#6494aa" stroke-width="3"/><text x="37" y="51" text-anchor="middle" class="label">O</text><text x="76" y="43" class="label" style="font-size:21px">Έναρξη</text><text x="21" y="94" class="small">Πότε ξεκίνησε;</text></g><g transform="translate(30 305)"><rect width="337" height="147" rx="17" class="panel"/><circle cx="37" cy="41" r="28" fill="#daecf5" stroke="#6494aa" stroke-width="3"/><text x="37" y="51" text-anchor="middle" class="label">P</text><text x="76" y="43" class="label" style="font-size:21px">Επιδείνωση / ανακούφιση</text><text x="21" y="94" class="small">Τι αλλάζει τον πόνο;</text></g><g transform="translate(30 478)"><rect width="337" height="147" rx="17" class="panel"/><circle cx="37" cy="41" r="28" fill="#daecf5" stroke="#6494aa" stroke-width="3"/><text x="37" y="51" text-anchor="middle" class="label">Q</text><text x="76" y="43" class="label" style="font-size:21px">Χαρακτήρας</text><text x="21" y="94" class="small">Πώς περιγράφεται;</text></g><g transform="translate(831 132)"><rect width="337" height="147" rx="17" class="panel"/><circle cx="37" cy="41" r="28" fill="#daecf5" stroke="#6494aa" stroke-width="3"/><text x="37" y="51" text-anchor="middle" class="label">R</text><text x="76" y="43" class="label" style="font-size:21px">Περιοχή / αντανάκλαση</text><text x="21" y="94" class="small">Πού εντοπίζεται;</text></g><g transform="translate(831 305)"><rect width="337" height="147" rx="17" class="panel"/><circle cx="37" cy="41" r="28" fill="#daecf5" stroke="#6494aa" stroke-width="3"/><text x="37" y="51" text-anchor="middle" class="label">S</text><text x="76" y="43" class="label" style="font-size:21px">Ένταση</text><text x="21" y="94" class="small">Πόσο έντονος είναι;</text></g><g transform="translate(831 478)"><rect width="337" height="147" rx="17" class="panel"/><circle cx="37" cy="41" r="28" fill="#daecf5" stroke="#6494aa" stroke-width="3"/><text x="37" y="51" text-anchor="middle" class="label">T</text><text x="76" y="43" class="label" style="font-size:21px">Χρόνος</text><text x="21" y="94" class="small">Πώς εξελίσσεται;</text></g>
</svg>