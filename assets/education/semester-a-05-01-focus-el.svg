<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Ασφάλεια σκηνής — βασική εισαγωγή — Κεντρικό συμπέρασμα, κεφάλαιο 05-01</title><desc id="d">Πρωτότυπο διάγραμμα του κεφαλαίου 05-01. Περιλαμβάνει Ασφάλεια χώρου και κατάλληλα ΜΑΠ προηγούνται κάθε προσέγγισης ασθενούς; ; Συνοπτική επανάληψη: Ασφάλεια σκηνής — βασική εισαγωγή. Απλουστευμένη οπτική υποστήριξη της θεωρίας, όχι αυτόνομη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f7fafd"/><rect width="1100" height="132" fill="#ae5448"/><text x="550" y="34" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">ΣΑΕΚ · Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 05 · ΚΕΦΑΛΑΙΟ 01</text><text x="550" y="79" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">Ασφάλεια σκηνής — βασική εισαγωγή</text><text x="550" y="174" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Κεντρικό συμπέρασμα</text><rect x="100" y="275" width="290" height="170" rx="28" fill="#ffffff" stroke="#ae5448" stroke-width="3"/><text x="245" y="344" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Ασφάλεια χώρου και</text><text x="245" y="373" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">κατάλληλα ΜΑΠ</text><text x="245" y="402" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">προηγούνται κάθε</text><text x="245" y="431" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">προσέγγισης ασθενούς</text><rect x="400" y="330" width="290" height="170" rx="28" fill="#e7f0f7" stroke="#ae5448" stroke-width="3"/><text x="545" y="399" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Ασφάλεια σκηνής — βασική</text><text x="545" y="428" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">εισαγωγή</text><rect x="700" y="275" width="290" height="170" rx="28" fill="#ffffff" stroke="#ae5448" stroke-width="3"/><text x="845" y="344" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Συνοπτική επανάληψη:</text><text x="845" y="373" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Ασφάλεια σκηνής — βασική</text><text x="845" y="402" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">εισαγωγή</text><rect x="55" y="596" width="990" height="69" rx="16" fill="#e7f0f7"/><text x="550" y="639" text-anchor="middle" fill="#ae5448" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Προσοχή: επιβεβαίωσε την εφαρμογή με τη γραπτή θεωρία.</text></svg>