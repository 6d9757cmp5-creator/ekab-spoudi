<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Υποψία κάκωσης σπονδυλικής στήλης — Σημεία αναγνώρισης</title><desc id="d">Τρεις ανεξάρτητες κάρτες: πόνος στη σπονδυλική στήλη, νευρολογικό έλλειμμα και μηχανισμός υψηλού κινδύνου. Σχηματική εκπαιδευτική απεικόνιση, όχι αυτόνομο πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#fff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 10</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#fff">Υποψία κάκωσης σπονδυλικής στήλης</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Σημεία αναγνώρισης</text><rect x="46" y="250" width="340" height="465" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="420" y="250" width="340" height="465" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="794" y="250" width="340" height="465" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><circle cx="216" cy="405" r="92" fill="#f5ebe7" stroke="#a75749" stroke-width="3"/><circle cx="590" cy="405" r="92" fill="#f5ebe7" stroke="#a75749" stroke-width="3"/><circle cx="964" cy="405" r="92" fill="#f5ebe7" stroke="#a75749" stroke-width="3"/><path d="M216 350v24q-22 8-5 22-18 14 4 27-17 14 2 30v20m-16-103h31m-28 40h25m-25 38h25" fill="none" stroke="#506b82" stroke-width="6" stroke-linecap="round"/><path d="M195 381h42" stroke="#a75749" stroke-width="4"/><path d="M568 451v-47q0-10 8-10 7 0 7 9v-28q0-9 8-9 7 0 7 9v25q1-9 8-8 8 0 8 9v7q2-8 9-6 7 1 7 9v25q0 18-17 28h-27q-18-4-18-13z" fill="#e8f1f7" stroke="#506b82" stroke-width="5" stroke-linejoin="round"/><path d="M554 397l-10-10m116 10 10-10" stroke="#a75749" stroke