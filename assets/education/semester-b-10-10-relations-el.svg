<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Πνευμονική εμβολή και σοβαρή δύσπνοια — προσέγγιση και αβεβαιότητα</title><desc id="d">Τρεις διαφορετικές κάρτες: παρατήρηση της αναπνευστικής και γενικής εικόνας, δομημένη διαβίβαση των ευρημάτων, και διαγνωστική αβεβαιότητα πριν από κατάλληλο έλεγχο. Δεν δίνονται κριτήρια βαρύτητας, διαγνωστικό σκορ ή θεραπευτική οδηγία.</desc><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#a95550"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 10 · ΚΕΦΑΛΑΙΟ 10</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Πνευμονική εμβολή και σοβαρή δύσπνοια</text><circle cx="197" cy="289" r="82" fill="#eef4f8" stroke="#a95550" stroke-width="3"/><g transform="translate(197 289)" fill="none" stroke="#a95550" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="-23" cy="-28" r="12"/><path d="M-48 20q1-31 25-31t25 31M3-42v22m0 0-13 11m13-11 13 11M-4-14c-18-7-28 15-26 34 2 13 14 19 24 11 7-6 7-18 7-31m6-14c18-7 28 15 26 34-2 13-14 19-24 11-7-6-7-18-7-31"/><path d="M42-22h21m-10-10v20" stroke="#c0393a" stroke-width="4"/></g><path d="M197 468V382" stroke="#a95550" stroke-width="3.5"/><path d="M190 393l7-11 7 11" fill="none" stroke="#a95550" stroke-width="3.5"/><rect x="48" y="478" width="298" height="100" rx="17" fill="#fff" stroke="#a95550" stroke-width="2"/><text x="197" y="512" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#253f52" font-weight="700" text-anchor="middle">Έλεγχος της</text><text x="197" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#253f52" font-weight="700" text-anchor="middle">εικόνας</text><text x="197" y="562" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5