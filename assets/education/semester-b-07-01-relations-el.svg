<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Τι πρέπει να αποσαφηνιστεί — επαλήθευση και ολοκλήρωση</title><desc id="d">Εκπαιδευτικό συνοπτικό διάγραμμα βάσει οδηγιών του ΕΚΑΒ για την κλήση 166. Δεν αποτελεί πρωτόκολλο διαλογής ή οδηγία κλινικής αξιολόγησης.</desc><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2b6a91"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#2b6a91"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 07 · ΚΕΦΑΛΑΙΟ 01</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">ΕΚΑΒ · επιβεβαιώστε τα στοιχεία και ακολουθήστε τη συνομιλία</text><circle cx="197" cy="303" r="84" fill="#eef4f8" stroke="#2b6a91" stroke-width="2.4"/><g transform="translate(197 303)" fill="none" stroke="#2b6a91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M-45-43h67l23 23v65h-90Z"/><path d="M22-43v24h23M-26 5l15 13 27-30"/><path d="M-26 35h52"/></g><path d="M197 473V388" fill="none" stroke="#2b6a91" stroke-width="3.5" marker-end="url(#arr)"/><rect x="48" y="490" width="298" height="96" rx="17" fill="#fff" stroke="#2b6a91" stroke-width="2"/><text x="197" y="530" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#253f52" font-weight="700" text-anchor="middle">Επαληθεύστε ακριβή θέση,</text><text x="197" y="557" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#253f52" font-weight="700" text-anchor="middle">στοιχείο προς στοιχείο</text><circle cx="555" cy="303" r="84" fill="#eef4f8" stroke="#2b6a91" stroke-width="2.4"/><g transform="translate(555 303)" fill="none" stroke="#2b6a91" stroke-width="4" stroke-linecap="round" stroke-line