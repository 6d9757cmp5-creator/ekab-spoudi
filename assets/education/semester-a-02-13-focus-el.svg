<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Ινσουλίνη, πρόσληψη γλυκόζης και αποθήκευση ως γλυκογόνο</title><desc id="d">Πρωτότυπο σχηματικό εκπαιδευτικό διάγραμμα: η ινσουλίνη προάγει την πρόσληψη γλυκόζης από κύτταρα και τη μετατροπή περίσσειας γλυκόζης σε γλυκογόνο στο ήπαρ. Δεν είναι υπό κλίμακα.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#236c63"/></marker></defs><rect width="1200" height="700" fill="#f8fbfc"/><rect width="1200" height="112" fill="#236c63"/><text x="600" y="38" fill="white" font-family="DejaVu Sans,Arial" font-size="18" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 13</text><text x="600" y="78" fill="white" font-family="DejaVu Sans,Arial" font-size="25" font-weight="700" text-anchor="middle">Η ινσουλίνη βοηθά να μειωθεί η γλυκόζη στο αίμα</text><rect x="58" y="150" width="1084" height="98" rx="22" fill="#e7f3ef" stroke="#82b7a6" stroke-width="2"/><text x="600" y="190" fill="#174f49" font-family="DejaVu Sans,Arial" font-size="20" font-weight="700" text-anchor="middle">Όταν αυξάνεται η γλυκόζη μετά το γεύμα, το πάγκρεας εκκρίνει ινσουλίνη</text><g fill="#fff" stroke="#236c63" stroke-width="3"><path d="M150 196q-17-15 0-29q17 14 0 29M185 206q-17-15 0-29q17 14 0 29M1015 199q-17-15 0-29q17 14 0 29"/></g><text x="600" y="220" fill="#385466" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Γλυκόζη στο αίμα</text><path d="M600 252V287" stroke="#236c63" stroke-width="4" marker-end="url(#a)"/><rect x="58" y="298" width="1084" height="90" rx="20" fill="#eef4f8" stroke="#91aebe" stroke-width="2"/><g transform="translate(145 343)" fill="none" stroke="#236c63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M-40-3L-27-18L-12-10L-2-27L15-20L28-6L17 5L28 18L12 25L0 13L-14 22L-25 9Z"/><path d="M-27-18L-22-2L-12-10L0 13L17 5L15-20M-22-2L-14 22"/></g><text x="600" y="336" fill="#174f49" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="middle">Ινσουλίνη</text><text x="600" y="365" fill="#385466" font-family="DejaVu Sans,Arial" font-size="15" text-anchor="middle">ορμόνη πρωτεϊνικής φύσης</text><path d="M600 390V423" stroke="#236c63" stroke-width="4" marker-end="url(#a)"/><rect x="58" y="434" width="520" height="185" rx="22" fill="#fff" stroke="#86a8bc" stroke-width="2.5"/><text x="318" y="470" fill="#174f49" font-family="DejaVu Sans,Arial" font-size="19" font-weight="700" text-anchor="middle">Κύτταρα σώματος</text><path d="M135 525Q130 490 175 490H455Q502 493 498 530V568Q490 594 452 594H178Q138 590 135 558Z" fill="#eaf3fa" stroke="#39728c" stroke-width="4"/><circle cx="207" cy="546" r="18" fill="#d6c3ea" stroke="#76599b" stroke-width="2"/><path d="M319 500v24m-10-12h20m-10 0l-8-8m8 8l8-8" stroke="#c07826" stroke-width="4" fill="none"/><g fill="#ffd77f" stroke="#af7b22" stroke-width="1.5"><circle cx="87" cy="520" r="9"/><circle cx="105" cy="552" r="9"/><circle cx="78" cy="574" r="9"/></g><path d="M111 547H205" stroke="#236c63" stroke-width="3" marker-end="url(#a)"/><text x="318" y="610" fill="#385466" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Η γλυκόζη εισέρχεται στο κύτταρο</text><rect x="622" y="434" width="520" height="185" rx="22" fill="#fff" stroke="#86a8bc" stroke-width="2.5"/><text x="882" y="470" fill="#174f49" font-family="DejaVu Sans,Arial" font-size="19" font-weight="700" text-anchor="middle">Ήπαρ</text><path d="M690 530Q716 480 827 495Q900 502 911 542Q894 586 819 584Q741 587 690 555Z" fill="#d99069" stroke="#984f3d" stroke-width="3"/><path d="M797 497Q785 522 803 544Q823 560 846 554" fill="none" stroke="#984f3d" stroke-width="2.5"/><g fill="#ffd77f" stroke="#af7b22" stroke-width="1.5"><circle cx="967" cy="511" r="8"/><circle cx="985" cy="526" r="8"/><circle cx="1003" cy="511" r="8"/></g><path d="M967 547C1000 553 997 579 962 579M940 560L958 575M982 560L964 575" fill="none" stroke="#236c63" stroke-width="3"/><text x="882" y="610" fill="#385466" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Περίσσεια γλυκόζης αποθηκεύεται ως γλυκογόνο</text><text x="600" y="665" fill="#526879" font-family="DejaVu Sans,Arial" font-size="14" text-anchor="middle">Σχηματική σύνοψη, όχι υπό κλίμακα · Δεν αποτελεί ιατρική οδηγία</text></svg>
