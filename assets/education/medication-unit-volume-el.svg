<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Βασικές μονάδες φαρμακευτικών υπολογισμών: μάζα, όγκος, συγκέντρωση</title><desc id="desc">Σχηματικά μικρή φιάλη με ετικέτα συγκέντρωσης mg ανά mL, δοσιμετρική σύριγγα χωρίς αριθμητική βαθμονόμηση, ζυγαριά μάζας και εκπαιδευτική σχέση μάζα δια συγκέντρωση ισούται με όγκο. Δεν δίνονται δοσολογικά παραδείγματα ή αριθμοί ασθενών.</desc><rect width="1200" height="680" fill="#f3f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#193b53}.h{font-size:33px;font-weight:700}.t{font-size:23px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.path{stroke:#5b88a1;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#b8ccd8;stroke-width:3}</style>
<text x="600" y="50" text-anchor="middle" class="h">Μονάδες: ποσότητα · όγκος · συγκέντρωση</text>
<text x="600" y="83" text-anchor="middle" class="s">Εκπαιδευτική σχέση μονάδων — όχι υπολογισμός ή εντολή χορήγησης</text>
<rect x="85" y="189" width="247" height="310" rx="25" fill="#dfecf5" stroke="#5b879e" stroke-width="5"/>
<rect x="125" y="149" width="165" height="62" rx="11" fill="#c9dbe5" stroke="#5b879e" stroke-width="4"/>
<rect x="113" y="298" width="194" height="137" rx="11" fill="#fff" stroke="#91acbc" stroke-width="3"/>
<text x="210" y="337" text-anchor="middle" class="t">Ετικέτα</text><text x="210" y="384" text-anchor="middle" class="t">mg/mL</text><text x="210" y="418" text-anchor="middle" class="fine">Συγκέντρωση</text>
<g transform="translate(432 247)"><rect width="371" height="66" rx="12" fill="#fff" stroke="#578ba3" stroke-width="5"/><path d="M65 0V66M102 15V51M139 15V51M176 15V51M213 15V51M250 15V51M287 15V51" stroke="#7ba3b7" stroke-width="4"/><rect x="370" y="16" width="56" height="35" rx="7" fill="#d2e4ee" stroke="#578ba3" stroke-width="4"/><path d="M427 33H464" stroke="#578ba3" stroke-width="7"/></g>
<text x="625" y="370" text-anchor="middle" class="t">Σύριγγα · όγκος mL</text>
<g transform="translate(911 244)"><path d="M20 201H168M94 30V202M33 58H155M47 58L18 116H77ZM141 58L109 116H176Z" fill="none" stroke="#5a8ca5" stroke-width="7" stroke-linejoin="round"/><text x="94" y="254" text-anchor="middle" class="t">Μάζα · mg</text></g>
<rect x="209" y="542" width="779" height="72" rx="18" fill="#e0edf5" stroke="#8aafc1" stroke-width="3"/>
<text x="600" y="575" text-anchor="middle" class="t">Μάζα (mg) ÷ συγκέντρωση (mg/mL) = όγκος (mL)</text>
<text x="600" y="601" text-anchor="middle" class="fine">Η πραγματική πράξη επαληθεύεται από αρμόδιο, εκπαιδευμένο επαγγελματία</text>
<text x="600" y="659" text-anchor="middle" class="fine">Οι μονάδες δεν αποτελούν συνταγή· ελέγχονται πρωτόκολλο, προϊόν και εντολή</text></svg>