<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d"><title id="t">Συστηματική προσέγγιση παθολογικού περιστατικού — Πρόσθετη θεματική εικόνα</title><desc id="d">Αυτόνομο εκπαιδευτικό διάγραμμα του Β΄ εξαμήνου, μάθημα 10, κεφάλαιο 6. Οι τρεις θεματικές έννοιες είναι: Ασφάλεια σκηνής; Όχι περιττή καθυστέρηση; Ενημέρωση ομάδας υποδοχής. Χρειάζεται έλεγχος ειδικού για κλινικές πράξεις.</desc><rect width="1100" height="720" fill="#f8fbfe"/><rect width="1100" height="141" fill="#aa5350"/><text x="550" y="31" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 10 · ΚΕΦ. 06</text><text x="550" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="750" text-anchor="middle" fill="#ffffff">Συστηματική προσέγγιση παθολογικού περιστατικού</text><text x="550" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="740" text-anchor="middle" fill="#aa5350">Πρόσθετη θεματική εικόνα</text><rect x="84" y="256" width="298" height="247" rx="27" fill="#ffffff" stroke="#aa5350" stroke-width="3"/><g transform="translate(233 336)" fill="none" stroke="#aa5350" stroke-width="5"><path d="M-50 4h22l12-23 13 45L10 1h17l8-15 11 18h5"/><circle cx="0" cy="2" r="38" stroke-width="2"/></g><text x="233" y="421" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="680" text-anchor="middle" fill="#293c50">Ασφάλεια σκηνής</text><rect x="424" y="295" width="298" height="247" rx="27" fill="#ffffff" stroke="#aa5350" stroke-width="3"/><g transform="translate(573 375)" fill="none" stroke="#aa5350" stroke-width="5"><path d="M-50 4h22l12-23 13 45L10 1h17l8-15 11 18h5"/><circle cx="0" cy="2" r="38" stroke-width="2"/></g><text x="573" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="680" text-anchor="middle" fill="#293c50">Όχι περιττή καθυστέρηση</text><rect x="764" y="256" width="298" height="247" rx="27" fill="#ffffff" stroke="#aa5350" stroke-width="3"/><g transform="translate(913 336)" fill="none" stroke="#aa5350" stroke-width="5"><path d="M-50 4h22l12-23 13 45L10 1h17l8-15 11 18h5"/><circle cx="0" cy="2" r="38" stroke-width="2"/></g><text x="913" y="421" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="680" text-anchor="middle" fill="#293c50">Ενημέρωση ομάδας</text><text x="913" y="448" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="680" text-anchor="middle" fill="#293c50">υποδοχής</text><rect x="59" y="651" width="982" height="43" rx="12" fill="#e4eff8"/><text x="550" y="680" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="650" text-anchor="middle" fill="#aa5350">Εκπαιδευτική απεικόνιση · ερμήνευσέ τη με τη θεωρία.</text></svg>