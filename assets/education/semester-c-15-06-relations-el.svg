<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Διοίκηση συμβάντος και ρόλοι — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 6. Παρουσιάζονται ως διακριτά θέματα: αρμοδιότητες φροντίδας, καταγραφή αριθμού θυμάτων και σαφής συντονισμός. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="52" y="265" width="336" height="424" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="220" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΡΟΛΟΙ</text><circle cx="220" cy="406" r="45" fill="#4d7d70"/><circle cx="211" cy="395" r="7" fill="none" stroke="#ffffff" stroke-width="4"/><circle cx="229" cy="395" r="7" fill="none" stroke="#ffffff" stroke-width="4"/><path d="M198 426q1-17 13-17t13 17m-4 0q1-17 13-17t13 17" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/><text x="220" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Διακριτές αρμοδιότητες</text><text x="220" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">φροντίδας</text><rect x="422" y="265" width="336" height="424" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><text x="590" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΚΑΤΑΓΡΑΦΗ</text><circle cx="590" cy="406" r="45" fill="#4d7d70"/><path d="M572 383H603L610 390V430H572Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/><path d="M601 383V392H610M580 402H601M580 412H601M580 422H595" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/><text x="590" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-