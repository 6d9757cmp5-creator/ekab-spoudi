<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Προνοσοκομειακή τηλεϊατρική: ασθενής, κλινικό δεδομένο, εξουσιοδοτημένος συμβουλευτικός σταθμός</title><desc id="desc">Σχηματικό ασθενοφόρο με ασθενή και φορητό μόνιτορ, ασφαλή μετάδοση χρήσιμων κλινικών δεδομένων και ιατρό συμβουλής σε δεύτερη οθόνη. Ο σύνδεσμος φέρει κλειδαριά προστασίας και προειδοποίηση για τεχνικές βλάβες. Δεν υποδεικνύει πραγματικό λογισμικό ή επιτρεπόμενες εξ αποστάσεως πράξεις.</desc><rect width="1200" height="720" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#183d54}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.line{fill:none;stroke:#53839d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#abc6d4;stroke-width:3}</style>
<text x="600" y="50" text-anchor="middle" class="h">Τηλεϊατρική · ασφαλής σύνδεση ομάδων</text>
<text x="600" y="84" text-anchor="middle" class="s">Η εξ αποστάσεως συμβουλή υποστηρίζει, δεν αντικαθιστά την εκτίμηση στον χώρο</text>
