<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Θώρακας και αναπνευστικό σύστημα — Βασικές σχέσεις</title><desc id="desc">Εκπαιδευτικό σχηματικό διάγραμμα για κεφάλαιο 01-03: Η θωρακική κοιλότητα προστατεύεται από πλευρές, στέρνο και θωρακικούς σπονδύλους.; Οι πνεύμονες βρίσκονται στον θώρακα, εκατέρωθεν του μεσοθωρακίου, ενώ η καρδιά βρίσκεται…; Η τραχεία διακλαδίζεται στους κύριους βρόγχους και αυτοί οδηγούν στον πνευμονικό ιστό.. Δεν αποτελεί ανεξάρτητη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f9fbfd"/><rect width="1100" height="133" fill="#286a89"/><text x="550" y="36" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 01 · ΚΕΦΑΛΑΙΟ 03</text><text x="550" y="80" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="26" font-family="DejaVu Sans,Arial,sans-serif">Θώρακας και αναπνευστικό σύστημα</text><text x="550" y="184" text-anchor="middle" fill="#286a89" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές σχέσεις</text><rect x="55" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#286a89" stroke-width="2.5"/><circle cx="208" cy="315" r="46" fill="#edf4fa" stroke="#286a89" stroke-width="3"/><path d="M180 315h56m-28-28v56" stroke="#286a89" stroke-width="3"/><text x="208" y="420" text-anchor="middle" fill="#286a89" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="208" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Η θωρακική κοιλότητα</text><text x="208" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">προστατεύεται από</text><text x="208" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">πλευρές, στέρνο και</text><text x="208" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">θωρακικούς σπονδύλους.</text><rect x="400" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#286a89" stroke-width="2.5"/><circle cx="553" cy="315" r="46" fill="#edf4fa" stroke="#286a89" stroke-width="3"/><path d="M525 315h56m-28-28v56" stroke="#286a89" stroke-width="3"/><text x="553" y="420" text-anchor="middle" fill="#286a89" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="553" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Οι πνεύμονες βρίσκονται</text><text x="553" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">στον θώρακα, εκατέρωθεν</text><text x="553" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">του μεσοθωρακίου, ενώ η</text><text x="553" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">καρδιά βρίσκεται…</text><rect x="745" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#286a89" stroke-width="2.5"/><circle cx="898" cy="315" r="46" fill="#edf4fa" stroke="#286a89" stroke-width="3"/><path d="M870 315h56m-28-28v56" stroke="#286a89" stroke-width="3"/><text x="898" y="420" text-anchor="middle" fill="#286a89" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">3</text><text x="898" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Η τραχεία διακλαδίζεται</text><text x="898" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">στους κύριους βρόγχους</text><text x="898" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">και αυτοί οδηγούν στον</text><text x="898" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">πνευμονικό ιστό.</text><rect x="55" y="607" width="990" height="62" rx="14" fill="#e4eef7"/><text x="550" y="648" text-anchor="middle" fill="#286a89" font-weight="650" font-size="20" font-family="DejaVu Sans,Arial,sans-serif">Σχηματική επεξήγηση · συνδύασέ τη με την πλήρη θεωρία.</text></svg>