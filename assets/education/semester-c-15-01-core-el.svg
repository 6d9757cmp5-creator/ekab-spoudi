<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Τι αλλάζει σε μαζικό συμβάν — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 1. Παρουσιάζονται: Ανάγκες μεγαλύτερες από πόρους; Αλλαγή οργάνωσης υπηρεσιών; Κοινή εικόνα συμβάντος. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="81" y="253" width="1015" height="469" rx="25" fill="#eaf3ef" stroke="#8aa79b" stroke-width="3"/><rect x="106" y="293" width="305" height="328" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="258" y="336" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΣΚΗΝΗ</text><circle cx="258" cy="415" r="37" fill="#4d7d70"/><circle cx="247" cy="406" r="7" fill="#ffffff"/><circle cx="269" cy="406" r="7" fill="#ffffff"/><path d="M235 429q1-15 12-15t12 15m1 0q1-15 12-15t12 15" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/><text x="258" y="486" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Ανάγκες μεγαλύτερες από</text><text x="258" y="514" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">πόρους</text><rect x="443" y="293" width="305" height="328" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><g transform="translate(0,-35)"><text x="595" y="371" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΟΡΓΑΝΩΣΗ</text><circle cx="595" cy="450" r="37" fill="#4d7d70"/><circle cx="595" cy="437" r="6" fill="#ffffff"/><circle cx="578" cy="457" r="6" fill="#ffffff"/><circle cx="612" cy="457" r="6" fill="#ffffff"/><path d="M595 443v7m-12 1 8-8m14 8-8-8" stroke="#ffffff" stroke-width="3"/><text x="595" y="521" text-anchor="mi