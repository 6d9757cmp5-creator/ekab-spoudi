<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Τι αλλάζει σε μαζικό συμβάν — Βασικά σημεία</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 15, κεφάλαιο 1: Σε περιστατικά όπου οι ανάγκες ξεπερνούν τους άμεσα διαθέσιμους πόρους; Ο στόχος είναι η ορθολογική διάθεση των περιορισμένων πόρων, με βάση το τοπικά ισχύον σχέδιο.; Μαζικό συμβάν είναι κατάσταση όπου οι ανάγκες υπερβαίνουν προσωρινά ή ουσιαστικά τους άμεσα…. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#4c8274"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 15 · ΚΕΦ. 01</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Τι αλλάζει σε μαζικό συμβάν</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">Βασικά σημεία</text><rect x="94" y="246" width="923" height="448" rx="21" fill="#eaf2ee" stroke="#87a39d" stroke-width="3"/><rect x="119" y="285" width="264" height="300" rx="22" fill="#fbe4db" stroke="#4c8274" stroke-width="3"/><text x="251" y="330" font-size="18" font-weight="720" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">ΣΥΜΒΑΝ</text><circle cx="251" cy="394" r="34" fill="#4c8274"/><text x="251" y="404" font-size="28" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#ffffff">1</text><text x="251" y="459" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Σε περιστατικά όπου</text><text x="251" y="485" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">οι ανάγκες ξεπερνούν</text><text x="251" y="511" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">τους άμεσα</text><text x="251" y="537" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">διαθέσιμους πόρους</text><rect x="424" y="321" width="264" height="300" rx="22" fill="#fff0d4" stroke="#4c8274" stroke-width="3"/><text x="556" y="366" font-size="18" font-weight="720" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">ΣΥΝΤΟΝΙΣΜΟΣ</text><circle cx="556" cy="430" r="34" fill="#4c8274"/><text x="556" y="440" font-size="28" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#ffffff">2</text><text x="556" y="495" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Ο στόχος είναι η</text><text x="556" y="521" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ορθολογική διάθεση</text><text x="556" y="547" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">των περιορισμένων</text><text x="556" y="573" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">πόρων, με βάση το</text><rect x="729" y="285" width="264" height="300" rx="22" fill="#ddede5" stroke="#4c8274" stroke-width="3"/><text x="861" y="330" font-size="18" font-weight="720" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">ΥΠΟΣΤΗΡΙΞΗ</text><circle cx="861" cy="394" r="34" fill="#4c8274"/><text x="861" y="404" font-size="28" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#ffffff">3</text><text x="861" y="459" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Μαζικό συμβάν είναι</text><text x="861" y="485" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">κατάσταση όπου οι</text><text x="861" y="511" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ανάγκες υπερβαίνουν</text><text x="861" y="537" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">προσωρινά ή</text><rect x="53" y="733" width="1005" height="40" rx="12" fill="#e5edf3"/><text x="555" y="760" font-size="16" font-weight="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">Σχηματική εικόνα από τη θεωρία · όχι αυτόνομο κλινικό ή υπηρεσιακό πρωτόκολλο.</text></svg>