<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Πιθανή δηλητηρίαση ή υπερδοσολογία: έκθεση και παρατήρηση</title><desc id="desc">Σχηματική εμφάνιση ανοιγμένης ανώνυμης συσκευασίας χαπιών και ασθενούς σε καθιστή στάση, με δείκτες για μεταβολή ανταπόκρισης, αναπνοής και άγνωστη ουσία. Δεν αποτελεί επιβεβαίωση δηλητηρίασης ή οδηγία αντιμετώπισης.</desc><rect width="1200" height="690" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#153950}.h{font-size:33px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.line{stroke:#5a88a1;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#b7cad8;stroke-width:3}</style>
