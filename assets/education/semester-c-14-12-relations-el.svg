<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Εγκαύματα και εισπνευστική κάκωση — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 12. Παρουσιάζονται: Ασφαλής απομάκρυνση από πηγή; Ψύξη με δροσερό τρεχούμενο νερό; Έλεγχος αεραγωγού. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="65" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="427" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="789" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><circle cx="227" cy="389" r="48" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><path d="M205 403l20-29 13 15 13-22" fill="none" stroke="#a75749" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="227" y="485" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#a75749">Ασφαλής απομάκρυνση</text><text x="227" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="650" fill="#213f53">Από την πηγή θερμότητας</text><circle cx="589" cy="389" r="48" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><path d="M573 368c-10 17-2 30 16 48 18-18 26-31 16-48m-15-8v42m-19-15h38" fill="none" stroke="#a75749" stroke-width="4" stroke-linecap="round"/><text x="589" y="485" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#a75749">Δροσερό τρεχούμενο νερό</text><text x="589" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="650" fill="#213f53">Πρώτες βοήθειες εγκαύματος</text><circle cx="951" cy="389" r="48" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><path d="M930 393q21-30 42 0-21 3