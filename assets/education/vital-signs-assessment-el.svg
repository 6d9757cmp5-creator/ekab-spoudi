<path d="M71 296V252Q71 242 81 242H132Q143 242 143 252V296" fill="#d9f1fb" stroke="#368bac" stroke-width="4"/>
<path d="M177 300V250H223L244 280L267 255L288 282L309 251" stroke="#368bac" stroke-width="5" fill="none" stroke-linecap="round"/>
<text x="42" y="330" class="small">Ρυθμός, βάθος, προσπάθεια</text>
<path d="M392 267H469L553 370" class="lead"/><circle cx="553" cy="370" r="6" fill="#358aa4"/>
<!-- Left bottom pulse -->
<rect x="24" y="384" width="367" height="221" rx="18" class="card"/>
<text x="42" y="424" class="label">Σφυγμός</text><text x="42" y="454" class="small">Παρατήρηση ρυθμού και ποιότητας</text>
<path d="M59 514H104L119 483L144 544L168 510H219L235 488L255 512H343" fill="none" stroke="#c45a68" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
