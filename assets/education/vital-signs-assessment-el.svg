<path d="M604 255V354" stroke="#5a8da7" stroke-width="5"/>
<path d="M590 325Q553 314 547 380Q546 417 590 423L595 350Z" fill="#b5deef" stroke="#3f93b0" stroke-width="3"/>
<path d="M618 325Q655 314 661 380Q662 417 618 423L613 350Z" fill="#b5deef" stroke="#3f93b0" stroke-width="3"/>
<path d="M604 354L581 368M604 354L627 368" stroke="#3f93b0" stroke-width="6" fill="none"/>
<path d="M602 426C579 409 573 438 602 453C630 437 624 409 602 426Z" fill="#d77e83" stroke="#b24e5a" stroke-width="3"/>
<circle cx="493" cy="490" r="10" fill="#bd5860"/><circle cx="736" cy="490" r="10" fill="#bd5860"/>
