<rect x="865" y="481" width="200" height="94" rx="21" fill="#d8f2ed" stroke="#368f84" stroke-width="4"/>
<rect x="886" y="499" width="159" height="59" rx="13" fill="#fff" stroke="#368f84" stroke-width="2"/>
<path d="M925 548V507M1002 548V507" stroke="#368f84" stroke-width="5"/>
