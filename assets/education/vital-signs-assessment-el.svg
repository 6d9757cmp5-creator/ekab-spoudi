<path d="M392 496H455L493 490" class="lead"/>
<!-- Right top blood pressure cuff -->
<rect x="810" y="141" width="367" height="207" rx="18" class="card"/>
<text x="828" y="178" class="label">Αρτηριακή πίεση</text><text x="828" y="209" class="small">Περιχειρίδα στον βραχίονα</text>
