<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Σημεία παρατήρησης και μέτρησης βασικών ζωτικών σημείων</title><desc id="desc">Σχηματική ανθρώπινη μορφή με κατευθύνσεις προς την παρατήρηση αναπνοής στον θώρακα, τη μέτρηση σφυγμού στον καρπό, την περιχειρίδα μέτρησης αρτηριακής πίεσης στον βραχίονα και τον αισθητήρα οξυμετρίας στο δάκτυλο. Οι ενδείξεις είναι εκπαιδευτικές, χωρίς υποθετικές κλινικές τιμές.</desc><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#17394d}.h{font-size:34px;font-weight:700}.sub{font-size:20px}.label{font-size:23px;font-weight:700}.small{font-size:18px}.card{fill:#fff;stroke:#b7ccda;stroke-width:2.5}.lead{fill:none;stroke:#527e94;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="700" fill="#f4f8fb"/>
<text x="600" y="46" text-anchor="middle" class="h">Βασικά ζωτικά σημεία</text>
<text x="600" y="81" text-anchor="middle" class="sub">Κλινική εικόνα, σωστή μέτρηση και επανεκτίμηση</text>
<!-- Central full-body drawing -->
<circle cx="604" cy="194" r="53" fill="#d9e9f2" stroke="#5a8da7" stroke-width="5"/>
