<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Πώς η ινσουλίνη και η γλυκαγόνη ρυθμίζουν τη γλυκόζη</title><desc id="d">Σχηματική αντιπαραβολή: υψηλή γλυκόζη διεγείρει τα β-κύτταρα του παγκρέατος να εκκρίνουν ινσουλίνη, η οποία μειώνει τη γλυκόζη. Χαμηλή γλυκόζη διεγείρει τα α-κύτταρα να εκκρίνουν γλυκαγόνη, η οποία δρα στο ήπαρ για να αυξήσει τη γλυκόζη στο αίμα.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#236c63"/></marker></defs><rect width="1200" height="760" fill="#f8fbfc"/><rect width="1200" height="112" fill="#236c63"/><text x="600" y="40" fill="#fff" font-family="DejaVu Sans,Arial" font-size="18" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 13</text><text x="600" y="80" fill="#fff" font-family="DejaVu Sans,Arial" font-size="25" font-weight="700" text-anchor="middle">Δύο ορμόνες διατηρούν τη γλυκόζη σε ισορροπία</text><rect x="52" y="150" width="526" height="550" rx="24" fill="#fff" stroke="#82b7a6" stroke-width="3"/><rect x="622" y="150" width="526" height="550" rx="24" fill="#fff" stroke="#d9a28d" stroke-width="3"/><rect x="52" y="150" width="526" height="80" rx="22" fill="#e5f2ec"/><rect x="622" y="150" width="526" height="80" rx="22" fill="#fbede6"/><text x="315" y="200" fill="#174f49" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="middle">Υψηλή γλυκόζη αίματος</text><text x="885" y="200" fill="#824b38" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="middle">Χαμηλή γλυκόζη αίματος</text><g fill="#f4c768" stroke="#a57925" stroke-width="2"><circle cx="265" cy="272" r="12"/><circle cx="297" cy="282" r="12"/><circle cx="330" cy="268" r="12"/></g><g fill="#f4c768" stroke="#a57925" stroke-width="2"><circle cx="838" cy="275" r="8"/><circle cx="865" cy="285" r="8"/></g><path d="M315 304V340" stroke="#236c63" stroke-width="4" marke