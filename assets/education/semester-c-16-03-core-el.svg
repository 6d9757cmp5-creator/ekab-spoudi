<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Εκπαίδευση με κλινικά σενάρια — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 3. Παρουσιάζονται: Ασφάλεια περιβάλλοντος; Εκτίμηση με ABCDE; Άμεση απειλή ζωής. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><polygon points="590,250 824,399 590,542 356,399" fill="#edebf9" stroke="#64569b" stroke-width="4"/><text x="590" y="393" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="750" fill="#64569b">ΕΚΤΙΜΗΣΗ</text><text x="590" y="433" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="750" fill="#64569b">ΕΥΡΗΜΑΤΩΝ</text><path d="M485 478L203 573" stroke="#64569b" stroke-width="3"/><rect x="46" y="573" width="314" height="159" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.6"/><text x="203" y="617" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Ασφάλεια περιβάλλοντος</text><path d="M590 542L590 573" stroke="#64569b" stroke-width="3"/><rect x="433" y="573" width="314" height="159" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.6"/><text x="590" y="617" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Εκτίμηση με ABCDE</text><path d="M695 478L977 573" stroke="#64569b" stroke-width="3"/><rect x="820" y="573" width="314" height="159" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.6"/><text x="977" y="617" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Άμεση απειλή ζωής</text></svg>