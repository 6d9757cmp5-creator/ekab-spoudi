<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Πρόληψη υποθερμίας τραυματία – θερμικές απώλειες</title><desc id="desc">Σχηματικός ασθενής πάνω σε φορείο με κουβέρτα, προστατευτική επιφάνεια από το έδαφος, πλευρικά βέλη αέρα/υγρασίας και επισήμανση απώλειας θερμότητας. Δεν δίνει θερμικά όρια, θερμοκρασίες ή θεραπευτική διαδικασία.</desc><rect width="1200" height="690" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163a53}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.line{fill:none;stroke:#56839e;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#aec8d9;stroke-width:3}</style>
<text x="600" y="48" class="h" text-anchor="middle">Υποθερμία τραυματία · περιορισμός θερμικής απώλειας</text>
<text x="600" y="83" class="s" text-anchor="middle">Προστασία από κρύο, άνεμο, υγρασία και επαφή με ψυχρή επιφάνεια</text>
