<text x="600" y="609" class="s" text-anchor="middle">Μονωτική επιφάνεια κάτω από τον ασθενή και προστασία από το περιβάλλον</text>
<text x="600" y="655" class="fine" text-anchor="middle">Σχηματικό · δεν αντικαθιστά εκτίμηση θερμοκρασίας και το ισχύον πρωτόκολλο</text></svg>