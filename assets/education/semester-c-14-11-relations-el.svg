<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Κακώσεις άκρων και νευροαγγειακός έλεγχος — Καταγραφή και επανέλεγχος</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 11. Παρουσιάζονται: Αισθητικότητα και κινητικότητα; Έλεγχος πριν από νάρθηκα; Έλεγχος μετά από νάρθηκα. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="65" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="427" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="789" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><circle cx="227" cy="389" r="48" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><path d="M209 406v-22a5 5 0 0 1 10 0v9-18a5 5 0 0 1 10 0v18-14a5 5 0 0 1 10 0v17-10a5 5 0 0 1 10 0v19l2-4a5 5 0 0 1 9 3l-3 20c-2 8-8 13-17 13h-10c-7 0-10-3-14-8l-8-11a5 5 0 0 1 8-6l5 5" fill="#fff" stroke="#506b82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -4)"/><circle cx="589" cy="389" r="48" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><path d="M573 356h30l13 13v47h-43z" fill="#fff" stroke="#506b82" stroke-width="4" stroke-linejoin="round"/><path d="M603 357v14h13m-34 7h24m-24 10h24m-24 10h18" fill="none" stroke="#a75749" stroke-width="3" stroke-linecap="round"/><circle cx="951" cy="389" r="48" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><path d="M964 371a24 24 0 0 1 24 19m1-13-1 13-12-3m-2 13a24 24 0 0 1-24-19m-1 13 1-13 12 3" fill="none" stroke="#a75749" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="227" y="485" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#a75749">Νευροαγγειακός έλεγχος</text><text x="227" y="533" text-anchor="middle" font-family="DejaVu San