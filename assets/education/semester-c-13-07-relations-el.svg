<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Συνεργασία με ιατρό συντονισμού — Συσχέτιση και εξήγηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 13, κεφάλαιο 7: Η καταγραφή πρέπει να διαχωρίζει τι αναφέρθηκε, ποιος έδωσε την οδηγία και πότε.; Σε εκπαιδευτικό σενάριο σχετικό με «Συνεργασία με ιατρό συντονισμού»; Σενάριο κεφαλαίου: Σε υποθετική κλήση με θέμα «Συνεργασία με ιατρό συντονισμού». Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#24728d"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 13 · ΚΕΦ. 07</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Συνεργασία με ιατρό συντονισμού</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#24728d">Συσχέτιση και εξήγηση</text><path d="M112 388H999" stroke="#24728d" stroke-width="7"/><circle cx="190" cy="388" r="58" fill="#ebf3f8" stroke="#24728d" stroke-width="4"/><text x="190" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#24728d">1</text><rect x="41" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#24728d" stroke-width="2.6"/><text x="190" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η καταγραφή πρέπει να</text><text x="190" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">διαχωρίζει τι αναφέρθηκε,</text><text x="190" y="587" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ποιος έδωσε την οδηγία</text><text x="190" y