<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Αυτόνομη ρύθμιση της καρδιακής συχνότητας</title><desc id="d">Σχηματικό παράδειγμα καρδιακού ελέγχου: καρδιακά κέντρα στον προμήκη μυελό επηρεάζουν την καρδιά. Η συμπαθητική διέγερση αυξάνει και η παρασυμπαθητική μέσω πνευμονογαστρικού μειώνει την καρδιακή συχνότητα. Οι επιδράσεις αφορούν το συγκεκριμένο παράδειγμα, όχι όλα τα όργανα.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347e75"/></marker><marker id="sym" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd6c34"/></marker><marker id="para" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397b82"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#347e75"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="555" y="30" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 04</text><text x="555" y="72" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Νευρική ρύθμιση και μεταβολισμός</text>
