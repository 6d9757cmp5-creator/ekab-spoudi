<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Οστά και αρθρώσεις – terminology — Αναλυτικές σχέσεις, κεφάλαιο 06-05</title><desc id="d">Πρωτότυπο διάγραμμα του κεφαλαίου 06-05. Περιλαμβάνει Humerus = βραχιόνιο· radius = κερκίδα· ulna = ωλένη· femur = μηριαίο.; ; . Απλουστευμένη οπτική υποστήριξη της θεωρίας, όχι αυτόνομη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f7fafd"/><rect width="1100" height="132" fill="#3973a0"/><text x="550" y="34" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">ΣΑΕΚ · Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 06 · ΚΕΦΑΛΑΙΟ 05</text><text x="550" y="79" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">Οστά και αρθρώσεις – terminology</text><text x="550" y="174" text-anchor="middle" fill="#3973a0" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Αναλυτικές σχέσεις</text><rect x="85" y="207" width="930" height="91" rx="17" fill="#ffffff" stroke="#3973a0" stroke-width="2"/><rect x="105" y="224" width="56" height="56" rx="14" fill="#3973a0"/><text x="133" y="261" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="191" y="249" text-anchor="start" fill="#213c51" font-weight="600" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Humerus = βραχιόνιο· radius = κερκίδα· ulna = ωλένη· femur = μηριαίο.</text><rect x="85" y="317" width="930" height="91" rx="17" fill="#e7f0f7" stroke="#3973a0" stroke-width="2"/><rect x="105" y="334" width="56" height="56" rx="14" fill="#3973a0"/><text x="133" y="371" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="191" y="359" text-anchor="start" fill="#213c51" font-weight="600" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Οστά και αρ