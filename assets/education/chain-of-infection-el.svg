<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="t d"><title id="t">Αλυσίδα μετάδοσης λοιμώξεων με έξι κρίκους</title><desc id="d">Έξι διαδοχικοί κρίκοι: λοιμογόνος παράγοντας, δεξαμενή, πύλη εξόδου, τρόπος μετάδοσης, πύλη εισόδου, ευπαθής ξενιστής. Τα βέλη δείχνουν τη σειρά. Τα παραδείγματα διαφέρουν ανά παθογόνο.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#276b87"/></marker></defs><rect width="1120" height="760" fill="#f8fbfe"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#173c55}.title{font-size:31px;font-weight:bold}.step{font-size:16px;font-weight:bold}.example{font-size:16px}.line{stroke:#276b87;stroke-width:5;fill:none;marker-end:url(#arrow)}.node{fill:#e6f3fb;stroke:#317c9e;stroke-width:3}.center{fill:#fff8ed;stroke:#b98338;stroke-width:2}</style><text x="560" y="47" text-anchor="middle" class="title">Αλυσίδα μετάδοσης λοιμώξεων</text><path class="line" d="M683.7 182.7L733.9 204.1"/><path class="line" d="M865.0 317.0L865.0 440.0"/><path class="line" d="M733.4 552.5L699.1 564.8"/><path class="line" d="M428.4 567.5L394.1 555.2"/><path class="line" d="M255.0 448.0L255.0 325.0"/><path class="line" d="M378.7 207.3L428.9 185.9"/><rect class="node" x="435" y="80" width="250" height="100" rx="19"/><text x="560" y="121" class="step" text-anchor="middle">1 · Παθογόνο</text><text x="560" y="152" class="example" text-anchor="middle">Ιός, βακτήριο, μύκητας</text><rect class="node" x="740" y="210" width="250" height="100" rx="19"/><text x="865" y="251" class="step" text-anchor="middle">2 · Δεξαμενή</text><text x="865" y="282" class="example" text-anchor="middle">Άνθρωπος ή περιβάλλον</text><rect class="node" x="740" y="455" width="250" height="100" rx="19"/><text x="865" y="496" class="step" text-anchor="middle">3 · Πύλη εξόδου</text><text x="865" y="527" class="example" text-anchor="middle">Εκκρίσεις, αίμα</text><rect class="node" x="435" y="565" width="250" height="100" rx="19"/><text x="560" y="606" class="step" text-anchor="middle">4 · Τρόπος μετάδοσης</text><text x="560" y="637" class="example" text-anchor="middle">Επαφή, σταγονίδια</text><rect class="node" x="130" y="455" width="250" height="100" rx="19"/><text x="255" y="496" class="step" text-anchor="middle">5 · Πύλη εισόδου</text><text x="255" y="527" class="example" text-anchor="middle">Μύτη, στόμα, τραύμα</text><rect class="node" x="130" y="210" width="250" height="100" rx="19"/><text x="255" y="251" class="step" text-anchor="middle">6 · Ευπαθής ξενιστής</text><text x="255" y="282" class="example" text-anchor="middle">Άτομο με αυξημένο κίνδυνο</text><rect class="center" x="390" y="326" width="340" height="116" rx="20"/><text x="560" y="363" font-size="21" font-weight="bold" text-anchor="middle">Σπάμε την αλυσίδα</text><text x="560" y="392" font-size="17" text-anchor="middle">με μέτρα πρόληψης</text><text x="560" y="418" font-size="16" text-anchor="middle">π.χ. υγιεινή χεριών</text><text x="560" y="722" font-size="16" text-anchor="middle">Τα παραδείγματα δεν περιγράφουν ένα συγκεκριμένο νόσημα ούτε υποκαθιστούν οδηγίες ελέγχου λοιμώξεων.</text></svg>
