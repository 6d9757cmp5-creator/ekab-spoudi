<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title description">
<title id="title">Επίπτωση και επιπολασμός σε υποθετικό πληθυσμό</title>
<desc id="description">Είκοσι άτομα πριν και μετά από περίοδο παρατήρησης. Δύο είχαν ήδη τη νόσο, τρία νέα περιστατικά εμφανίζονται σε δεκαοκτώ αρχικά υγιή. Επίπτωση περιόδου τρία στα δεκαοκτώ, σημειακός επιπολασμός στο τέλος πέντε στα είκοσι.</desc>
<rect width="960" height="650" rx="20" fill="#f7fafc"/>
<text x="480" y="42" font-family="Arial,DejaVu Sans,sans-serif" font-size="28" fill="#17324b" font-weight="700" text-anchor="middle">Επίπτωση και επιπολασμός</text>
<text x="480" y="73" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#17324b" text-anchor="middle">Υποθετικό παράδειγμα: 20 άτομα, χωρίς αποχωρήσεις ή ανάρρωση</text>
