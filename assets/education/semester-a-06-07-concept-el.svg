<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Καρδιά και κυκλοφορία – terminology — αναγνώριση σημείων</title><desc id="d">Απλοποιημένα σχήματα: άνω καρδιακός θάλαμος, κάτω καρδιακός θάλαμος και αρτηριακό αγγείο σε εγκάρσια τομή με σχετικά παχύ τοίχωμα. Δεν αποτελεί ανατομικό άτλαντα.</desc><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3a719b"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#3a719b"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 06 · ΚΕΦΑΛΑΙΟ 07</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Καρδιά και κυκλοφορία – terminology</text>
