<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Θερμορρύθμιση και αρνητική ανατροφοδότηση</title><desc id="desc">Αύξηση θερμοκρασίας, ανίχνευση, υποθάλαμος, εφίδρωση και αγγειοδιαστολή, αποβολή θερμότητας. Η απόκριση περιορίζει τη μεταβολή.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#24728e"/></marker></defs><rect width="1000" height="620" fill="#f8fcfe"/><g font-family="DejaVu Sans, sans-serif"><text x="36" y="52" font-size="30" fill="#173c54" text-anchor="start">Θερμορρύθμιση και αρνητική ανατροφοδότηση</text><rect x="60" y="120" width="240" height="85" rx="14" fill="#e7f3f8" stroke="#24728e"/><text x="180.0" y="169.5" font-size="18" fill="#173c54" text-anchor="middle">Αύξηση θερμοκρασίας</text><path d="M305 160 L365 160" stroke="#24728e" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="375" y="120" width="260" height="85" rx="14" fill="#e7f3f8" stroke="#24728e"/><text x="505.0" y="169.5" font-size="18" fill="#173c54" text-anchor="middle">Ανίχνευση μεταβολής</text><path d="M640 160 L700 160" stroke="#24728e" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="710" y="120" width="230" height="85" rx="14" fill="#e7f3f8" stroke="#24728e"/><text x="825.0" y="169.5" font-size="18" fill="#173c54" text-anchor="middle">Υποθάλαμος</text><path d="M825 210 L825 300" stroke="#24728e" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="660" y="310" width="300" height="85" rx="14" fill="#e7f3f8" stroke="#24728e"/><text x="810.0" y="359.5" font-size="18" fill="#173c54" text-anchor="middle">Εφίδρωση / αγγειοδιαστολή</text><path d="M650 350 L590 350" stroke="#24728e" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="290" y="310" width="290" height="85" rx="14" fill="#e7f3f8" stroke="#24728e"/><text x="435.0" y="359.5" font-size="18" fill="#173c54" text-anchor="middle">Αυξημένη αποβολή θερμότητας</text><path d="M290 350 H175 V230" fill="none" stroke="#24728e" stroke-width="4" marker-end="url(#arrow)"/><text x="58" y="445" font-size="26" fill="#173c54" text-anchor="start">Η απόκριση περιορίζει την αρχική απόκλιση.</text><text x="58" y="490" font-size="23" fill="#173c54" text-anchor="start">Αρνητική ανατροφοδότηση: επιστροφή προς το εύρος ρύθμισης.</text><text x="36" y="585" font-size="17" fill="#173c54" text-anchor="start">Εκπαιδευτικό σχήμα · όχι σε φυσική κλίμακα</text></g></svg>