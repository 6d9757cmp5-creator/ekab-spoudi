<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Πρωτογενής και δευτερογενής διακομιδή</title><desc id="desc">Δύο διαδρομές σε χωριστές οριζόντιες ζώνες: αρχική διακομιδή από τον τόπο συμβάντος με ασθενοφόρο σε υγειονομική μονάδα, και διακομιδή από μία υγειονομική μονάδα προς άλλη. Τα οχήματα και κτίρια είναι σχηματικά, χωρίς οδηγίες επιλογής προορισμού.</desc>
<rect width="1200" height="700" fill="#f4f8fc"/>
