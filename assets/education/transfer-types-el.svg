<text x="600" y="52" text-anchor="middle" class="h">Πρωτογενής και δευτερογενής διακομιδή</text>
<text x="600" y="86" text-anchor="middle" class="sub">Δύο διαφορετικές αφετηρίες · κοινή ανάγκη για εκτίμηση, εξοπλισμό και παράδοση</text>
