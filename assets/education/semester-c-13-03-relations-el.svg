<title id="t">Πολλαπλές κλήσεις — τρεις έννοιες διαχείρισης</title>
<desc id="d">Τρεις ανεξάρτητες εκπαιδευτικές έννοιες χωρίς αριθμημένη σειρά: αποφυγή διπλής ανάθεσης, διατήρηση νέων ευρημάτων και ενιαία επιχειρησιακή εικόνα. Δεν αποτελεί κλινική εντολή ή πρωτόκολλο.</desc>
