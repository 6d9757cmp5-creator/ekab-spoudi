<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">Λειτουργία ασύρματης επικοινωνίας μεταξύ πληρώματος, δικτύου και Συντονιστικού Κέντρου</title><desc id="desc">Σχηματικό ασθενοφόρο με κεραία και ασύρματο· βέλη προς τον σταθμό δικτύου και το Συντονιστικό Κέντρο, με βέλη επιστροφής για επικοινωνία και επιβεβαίωση. Το κάτω σημείωμα αναφέρει ότι κάλυψη, παρεμβολές ή βλάβη μπορεί να απαιτήσουν εγκεκριμένο εφεδρικό μέσο. Δεν ορίζονται συχνότητες ή πραγματική αρχιτεκτονική δικτύου.</desc><rect width="1200" height="730" fill="#f5f9fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163950}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.mini{font-size:17px}.lead{fill:none;stroke:#507c97;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#acc8d7;stroke-width:3}</style>
<text x="600" y="51" text-anchor="middle" class="h">Ασύρματη επικοινωνία · πομπός → δίκτυο → δέκτης</text>
<text x="600" y="86" text-anchor="middle" class="s">Επιβεβαίωση κρίσιμου μηνύματος · πρόβλεψη εναλλακτικής επικοινωνίας</text>
