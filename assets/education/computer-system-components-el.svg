<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Βασικά τμήματα ηλεκτρονικού συστήματος υπολογιστή και δικτύου</title><desc id="desc">Σχηματικός υπολογιστής με οθόνη, κεντρική μονάδα, πληκτρολόγιο, ποντίκι και δικτυακό εξοπλισμό. Οι επισημάνσεις αναγνωρίζουν υλικό και λογισμικό, χωρίς τεχνικές λεπτομέρειες για συγκεκριμένη πλατφόρμα.</desc><rect width="1200" height="720" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#183d54}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.line{fill:none;stroke:#53839d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#abc6d4;stroke-width:3}</style>
