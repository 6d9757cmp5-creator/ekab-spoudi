<title id="t">Φαρμακοδυναμική · εννοιολογικές συνδέσεις</title><desc id="d">Αφαιρετική καμπύλη ανταπόκρισης χωρίς τιμές, διαγραμμένο σύμβολο φαρμάκου για κίνδυνο τοξικότητας και δύο σχηματικές χρονικές καμπύλες για διάκριση δράσης και κινητικής. Δεν δίνονται αριθμοί, όρια ή δοσολογικές οδηγίες.</desc>
