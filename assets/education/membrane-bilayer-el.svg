<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Φωσφολιπιδική διπλοστιβάδα: κεφαλές και υδρόφοβος πυρήνας</title>
<desc id="desc">Τομή διπλοστιβάδας με δύο φύλλα φωσφολιπιδίων. Οι υδρόφιλες κεφαλές βλέπουν προς το εξωκυττάριο υγρό και το κυτταρόπλασμα, ενώ οι δύο ουρές κάθε μορίου στρέφονται προς τον υδρόφοβο πυρήνα. Πρωτεΐνες και χοληστερόλη παραλείπονται.</desc>
