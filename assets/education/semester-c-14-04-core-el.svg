<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Κακώσεις άκρων και υποθερμία — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 4. Τρεις θεματικές κάρτες: Πόνος και παραμόρφωση άκρου; Περιφερικός σφυγμός; Αίσθηση και κίνηση. Τα σύμβολα είναι σχηματικά, χωρίς εντοπισμό τραύματος ή κλινικά όρια.</desc><rect width="1180" height="820" fill="#f9fbfd"/>
