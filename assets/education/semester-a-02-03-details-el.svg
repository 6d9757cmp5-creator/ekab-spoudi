<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Διαφορές αρτηρίας, τριχοειδούς και φλέβας</title><desc id="d">Σχηματική σύγκριση: αρτηρία με παχύτερο μυϊκό τοίχωμα και στενότερο αυλό, τριχοειδές με πολύ λεπτό τοίχωμα και δίκτυο ανταλλαγής, φλέβα με λεπτότερο τοίχωμα, ευρύτερο αυλό και βαλβίδες όπου υπάρχουν. Εκτός κλίμακας.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347e75"/></marker><marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66818c"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#347e75"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="555" y="30" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 03</text><text x="555" y="72" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Κυκλοφορία και αιμάτωση</text>
