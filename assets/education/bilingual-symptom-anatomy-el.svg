<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Συμπτώματα: διγλωσσικός οπτικός χάρτης εντοπισμού</title><desc id="desc">Σχηματική πρόσθια ανθρώπινη μορφή με έξι περιοχές επισήμανσης για θωρακικό πόνο, κεφαλαλγία, δύσπνοια, ναυτία, ζάλη και αδυναμία, συνοδευόμενες από ελληνική και αγγλική ορολογία. Οι δείκτες είναι ενδεικτικοί και δεν καθορίζουν αιτία συμπτωμάτων.</desc><rect width="1200" height="720" fill="#f4f8fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173e55}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.en{font-size:17px;fill:#426d84}.outline{fill:none;stroke:#638fa9;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.lead{fill:none;stroke:#5986a0;stroke-width:4;stroke-linecap:round}.panel{fill:#fff;stroke:#b5cfda;stroke-width:3}</style>
