<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Χημικές, βιολογικές και ραδιολογικές απειλές — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 11. Παρουσιάζονται ως διακριτά θέματα: απόσταση/απομόνωση, ειδικές ομάδες και προστασία προσωπικού. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="52" y="265" width="336" height="424" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="220" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΑΠΟΣΤΑΣΗ</text><circle cx="220" cy="406" r="45" fill="#4d7d70"/><path d="M198 406H242M220 384V428" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><circle cx="220" cy="406" r="12" fill="none" stroke="#ffffff" stroke-width="4"/><text x="220" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Απόσταση και</text><text x="220" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">απομόνωση</text><rect x="422" y="265" width="336" height="424" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><text x="590" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΕΙΔΙΚΕΣ ΟΜΑΔΕΣ</text><circle cx="590" cy="406" r="45" fill="#4d7d70"/><circle cx="590" cy="391" r="9" fill="none" stroke="#ffffff" stroke-width="5"/><circle cx="570" cy="401" r="7" fill="none" stroke="#ffffff" stroke-width="5"/><circle cx="610" cy="401" r="7" fill="none" stroke="#ffffff" stroke-width="5"/><path d="M572 427C574 412 582 407 590 407C598 407 606 412 608 427M553 425C555 414 561 410 570 410M627 425C625 414 619 410 610 410" fill="none" stroke="#ffffff" stroke-width="5" stroke-