<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Αρχική διαλογή τραυματιών — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 7. Παρουσιάζονται ως διακριτά θέματα: νέα κατάσταση θύματος, αλλαγή διαθέσιμων μέσων και δυναμική επαναδιαλογή. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="52" y="265" width="336" height="424" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="220" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΚΑΤΑΣΤΑΣΗ</text><circle cx="220" cy="406" r="45" fill="#4d7d70"/><circle cx="220" cy="391" r="10" fill="none" stroke="#ffffff" stroke-width="5"/><path d="M197 427C199 412 207 405 220 405C233 405 241 412 243 427" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/><path d="M209 419L216 426L232 410" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Νέα εικόνα</text><text x="220" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">του θύματος</text><rect x="422" y="265" width="336" height="424" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><text x="590" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΔΙΑΘΕΣΙΜΟΤΗΤΑ</text><circle cx="590" cy="406" r="45" fill="#4d7d70"/><path d="M566 391H614M566 406H614M566 421H614" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/><text x="590" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Αλλαγή διαθέσιμω