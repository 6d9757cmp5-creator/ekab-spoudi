<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Σενάριο κρίσης και μετακριτικής σύγχυσης — Επανέλεγχος και ασφάλεια</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 10. Παρουσιάζονται: Επανεκτίμηση αεραγωγού; έλεγχος γλυκόζης μόνο όπου ενδείκνυται από τις ισχύουσες οδηγίες; καταγραφή και παράδοση του χρόνου έναρξης. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="59" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#64569b" stroke-width="3"/><circle cx="226" cy="351" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><path d="M197 350c8-15 17-22 29-22s21 7 29 22c-8 15-17 22-29 22s-21-7-29-22z" fill="none" stroke="#64569b" stroke-width="5"/><path d="M208 350h36m-18-14v28" stroke="#64569b" stroke-width="4" stroke-linecap="round"/><text x="226" y="457" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="760" fill="#64569b">ΑΕΡΑΓΩΓΟΣ</text><text x="226" y="519" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">Επανεκτίμηση αεραγωγού</text><rect x="448" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#64569b" stroke-width="3"/><circle cx="615" cy="351" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><rect x="592" y="325" width="46" height="52" rx="5" fill="none" stroke="#64569b" stroke-width="4"/><rect x="603" y="336" width="24" height="13" rx="2" fill="none" stroke="#64569b" stroke-width="3"/><path d="M603 359h24m-24 8h18" stroke="#64569b" stroke-width="3" stroke-linecap="round"/><text x="615" y="457" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="760" fill="#64569b">ΓΛΥΚΟΖΗ</text><text x="615" y="519" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill