<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Ανώτεροι και κατώτεροι αεραγωγοί — αναγνώριση σημείων</title><desc id="d">Τρία διακριτά πρωτότυπα σύμβολα: τραχεία με χόνδρινους δακτυλίους, διχασμός των κύριων βρόγχων και κυψελιδικός ασκός με σφαιρικές κυψελίδες. Απλοποιημένο διάγραμμα, όχι ανατομική τομή ούτε σε κλίμακα.</desc><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d6f91"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#2d6f91"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ffffff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 01 · ΚΕΦΑΛΑΙΟ 11</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#ffffff" font-weight="720" text-anchor="middle">Ανώτεροι και κατώτεροι αεραγωγοί</text><circle cx="197" cy="299" r="85" fill="#eef4f8" stroke="#2d6f91" stroke-width="2.4"/><g transform="translate(197 299)" fill="none" stroke="#2d6f91" stroke-linecap="round"><path d="M-19-57H19V41" stroke-width="13"/><path d="M-16-41H16M-16-27H16M-16-13H16M-16 1H16M-16 15H16M-16 29H16" stroke="#80b7c7" stroke-width="4"/><path d="M19 41L9 54M19 41L31 54" stroke-width="9"/></g><path d="M197 478L197 361" stroke="#2d6f91" stroke-width="3.5" marker-end="url(#arr)"/><rect x="48" y="487" width="298" height="93" rx="17" fill="#ffffff" stroke="#2d6f91" stroke-width="2"/><text x="197" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#253f52" font-weight="700" text-anchor="middle">Τραχεία</text><circle cx="553" cy="303" r="85" fill="#eef4f8" stroke="#2d6f91" stroke-width="2.4"/><g transform="translate(553 299)" fill="none" stroke="#2d6f91" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M0-57V-2Q0 9-10 18L-44 50M0-2Q0 9 10 18L44 50"/><path d="M-11 18