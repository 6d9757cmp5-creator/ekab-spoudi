<circle cx="868" cy="242" r="60" fill="#e2b09a" stroke="#b98472" stroke-width="3"/><path d="M805 229c4-78 113-79 126 0" stroke="#4c7185" stroke-width="19" fill="none" stroke-linecap="round"/><path d="M801 238v49m133-49v49" stroke="#4c7185" stroke-width="13" stroke-linecap="round"/><path d="M934 285c0 31-30 33-54 33" class="line"/><circle cx="876" cy="319" r="9" fill="#4c7185"/><path d="M802 371c12-65 120-65 133 0v35H802z" fill="#b7d4e4" stroke="#4c7185" stroke-width="4"/><text x="868" y="442" text-anchor="middle" class="t lab">Παραλήπτης</text><text x="868" y="470" text-anchor="middle" class="t sub">Πλήρωμα / συνεργάτης</text>
