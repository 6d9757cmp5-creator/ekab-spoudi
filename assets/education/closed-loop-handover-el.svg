<rect x="639" y="497" width="460" height="64" rx="12" fill="#e2f5ed"/><text x="655" y="520" class="t tiny">2. Επανάληψη κρίσιμου στοιχείου</text><text x="655" y="548" class="t sub">«Οδός Α, αριθμός 12, σωστά;»</text>
<path d="M542 204h76m-14-12 14 12-14 12" class="line"/><text x="580" y="187" text-anchor="middle" class="t tiny">Μήνυμα</text><path d="M619 311h-76m14-12-14 12 14 12" class="line"/><text x="580" y="290" text-anchor="middle" class="t tiny">Επανάληψη</text><path d="M542 416h76m-14-12 14 12-14 12" class="line"/><text x="580" y="394" text-anchor="middle" class="t tiny">Επιβεβαίωση</text>
