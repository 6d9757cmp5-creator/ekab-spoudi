<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 690" role="img" aria-labelledby="title desc"><title id="title">Κλειστός βρόχος επικοινωνίας μεταξύ δύο μελών ομάδας</title><desc id="desc">Τρία διαδοχικά βήματα σε συγκεκριμένο παράδειγμα διαβίβασης θέσης: αποστολέας δίνει πληροφορία, παραλήπτης την επαναλαμβάνει, αποστολέας επιβεβαιώνει ή διορθώνει. Δύο πρόσωπα με κεφαλόφωνα και κατευθυνόμενα βέλη.</desc><rect width="1160" height="690" fill="#f3f8fb"/><style>.t{font-family:Arial,'DejaVu Sans',sans-serif;fill:#183c50}.head{font-size:29px;font-weight:700}.sub{font-size:19px}.lab{font-size:22px;font-weight:700}.tiny{font-size:17px}.line{fill:none;stroke:#236d88;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#acc6d4;stroke-width:2}</style><text x="580" y="52" text-anchor="middle" class="t head">Κλειστός βρόχος επικοινωνίας</text><text x="580" y="88" text-anchor="middle" class="t sub">Το μήνυμα δεν θεωρείται κατανοητό μέχρι να επιβεβαιωθεί</text>
<rect x="49" y="134" width="488" height="445" rx="22" class="card"/><rect x="623" y="134" width="488" height="445" rx="22" class="card"/>
