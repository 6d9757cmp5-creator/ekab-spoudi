<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">Σταθμός διαβιβαστή: εικονογράφηση κάρτας συμβάντος, θέσης και χρόνων</title><desc id="desc">Πρωτότυπη σχηματική κονσόλα επείγουσας κλήσης με ακουστικά, πεδία τοποθεσίας, επικοινωνία επανάκλησης, αναφερόμενο γεγονός, αριθμό ασθενών, μεταβολή κατάστασης, αποστολή πληρώματος, χρονοσήμανση και χάρτη διαδρομής. Δείγμα οθόνης χωρίς πραγματικά δεδομένα ασθενών, αριθμούς ή εφαρμογή.</desc><rect width="1200" height="730" fill="#f5f9fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163950}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.mini{font-size:17px}.lead{fill:none;stroke:#507c97;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#acc8d7;stroke-width:3}</style>
<text x="600" y="50" text-anchor="middle" class="h">Επείγουσα κλήση · Κονσόλα συντονισμού</text>
<text x="600" y="83" text-anchor="middle" class="s">Σχηματική οθόνη — τα στοιχεία προέρχονται από αναφορά, δεν θεωρούνται διάγνωση</text>
<rect x="35" y="117" width="1129" height="537" rx="25" fill="#e6eff5" stroke="#6388a1" stroke-width="6"/>
