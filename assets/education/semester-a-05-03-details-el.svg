<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Ζωτικά σημεία — πρώτη γνωριμία — Αναλυτικές σχέσεις, κεφάλαιο 05-03</title><desc id="d">Πρωτότυπο διάγραμμα του κεφαλαίου 05-03. Περιλαμβάνει Ζωτικά: αναπνοές, σφύξεις, πίεση, κορεσμός και άλλα ανά ένδειξη; συνεχής διαδικασία, ιδιαίτερα όταν η κατάσταση αλλάζει ή μετά από παρέ; μβαση. Η τάση των τιμών μαζί με την κλινική εικόνα είναι σημαντικότερη. Απλουστευμένη οπτική υποστήριξη της θεωρίας, όχι αυτόνομη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f7fafd"/><rect width="1100" height="132" fill="#ae5448"/><text x="550" y="34" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">ΣΑΕΚ · Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 05 · ΚΕΦΑΛΑΙΟ 03</text><text x="550" y="79" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">Ζωτικά σημεία — πρώτη γνωριμία</text><text x="550" y="174" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Αναλυτικές σχέσεις</text><rect x="85" y="207" width="930" height="91" rx="17" fill="#ffffff" stroke="#ae5448" stroke-width="2"/><rect x="105" y="224" width="56" height="56" rx="14" fill="#ae5448"/><text x="133" y="261" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="191" y="249" text-anchor="start" fill="#213c51" font-weight="600" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Ζωτικά: αναπνοές, σφύξεις, πίεση, κορεσμός και άλλα ανά ένδειξη</text><rect x="85" y="317" width="930" height="91" rx="17" fill="#e7f0f7" stroke="#ae5448" stroke-width="2"/><rect x="105" y="334" width="56" height="56" rx="14" fill="#ae5448"/><text x="133" y="371" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="191" y="359" text-anchor="start" fill="#213c51" font-weight="600" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">συνεχής διαδικασία, ιδιαίτερα όταν η κατάσταση αλλάζει ή μετά από παρέ</text><rect x="85" y="427" width="930" height="91" rx="17" fill="#ffffff" stroke="#ae5448" stroke-width="2"/><rect x="105" y="444" width="56" height="56" rx="14" fill="#ae5448"/><text x="133" y="481" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">3</text><text x="191" y="469" text-anchor="start" fill="#213c51" font-weight="600" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">μβαση. Η τάση των τιμών μαζί με την κλινική εικόνα είναι σημαντικότερη</text><rect x="55" y="596" width="990" height="69" rx="16" fill="#e7f0f7"/><text x="550" y="639" text-anchor="middle" fill="#ae5448" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Ειδικό εκπαιδευτικό σχήμα · δεν αντικαθιστά την πλήρη θεωρία.</text></svg>