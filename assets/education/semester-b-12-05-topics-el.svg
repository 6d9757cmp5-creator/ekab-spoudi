<title id="t">Φαρμακοκινητική: θεματικές έννοιες — απορρόφηση, κατανομή, μεταβολισμός</title><desc id="d">Τρία διαφορετικά αφαιρετικά σύμβολα: πεπτικός σωλήνας, διασπορά μέσα στο σώμα και ήπαρ. Τα βέλη συνδέουν κάθε λεζάντα με το αντίστοιχο σύμβολο. Γενικό εννοιολογικό μνημονικό, όχι οδηγία φαρμάκου.</desc>
