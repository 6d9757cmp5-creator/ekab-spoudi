<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d"><title id="t">Φαρμακοκινητική: τι κάνει το σώμα στο φάρμακο — Αντικείμενο και βασικά στοιχεία</title><desc id="d">Αυτόνομο εκπαιδευτικό διάγραμμα του Β΄ εξαμήνου, μάθημα 12, κεφάλαιο 5. Οι τρεις θεματικές έννοιες είναι: Απορρόφηση; Κατανομή; Μεταβολισμός. Χρειάζεται έλεγχος ειδικού για κλινικές πράξεις.</desc><rect width="1100" height="720" fill="#f8fbfe"/><rect width="1100" height="141" fill="#876232"/><text x="550" y="31" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 12 · ΚΕΦ. 05</text><text x="550" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="750" text-anchor="middle" fill="#ffffff">Φαρμακοκινητική: τι κάνει το σώμα στο φάρμακο</text><text x="550" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="740" text-anchor="middle" fill="#876232">Αντικείμενο και βασικά στοιχεία</text><rect x="45" y="230" width="313" height="368" rx="26" fill="#ffffff" stroke="#876232" stroke-width="2.5"/><circle cx="201" cy="322" r="68" fill="#edf4f9" stroke="#876232" stroke-width="2"/><g transform="translate(201 322)" fill="none" stroke="#876232" stroke-width="4"><rect x="-17" y="-45" width="34" height="90" rx="13" transform="rotate(42)"/><path d="M-39-20h78" transform="rotate(42)"/></g><rect x="146" y="401" width="110" height="43" rx="20" fill="#876232"/><text x="201" y="428" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="740" text-anchor="middle" fill="#ffffff">ΣΤΟΙΧΕΙΟ 1</text><text x="201" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" text-anchor="middle" fill="#243d50">Απορρόφηση</text><path d="M361 352h33" stroke="#876232" stroke-width="3.5"/><path d="M382 343l12 9-12 9" fill="none" stroke="#876232" stroke-width="3"/><rect x="399" y="230" width="313" height="368" rx="26" fill="#ffff