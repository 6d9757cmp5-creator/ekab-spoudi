<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Ανακοπή: αναγνώριση και ενεργοποίηση — Βασικά σημεία</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 16, κεφάλαιο 7: Μη ανταπόκριση με απούσα ή μη φυσιολογική αναπνοή οδηγεί σε άμεση ενεργοποίηση επείγουσας…; Ο αυτόματος εξωτερικός απινιδωτής (AED) μπορεί να χρησιμοποιηθεί από οποιονδήποτε; Εκπαιδευτικό πλαίσιο: πράξεις μόνο με αντίστοιχη εκπαίδευση και σύμφωνα με τις ισχύουσες…. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#66569b"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦ. 07</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Ανακοπή: αναγνώριση και ενεργοποίηση</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">Βασικά σημεία</text><polygon points="556,251 769,386 556,510 343,386" fill="#efedf9" stroke="#66569b" stroke-width="4"/><text x="556" y="381" font-size="25" font-weight="730" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΚΛΙΝΙΚΗ</text><text x="556" y="414" font-size="25" font-weight="730" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΕΚΤΙΜΗΣΗ</text><path d="M462 501L196 572" stroke="#66569b" stroke-width="3"/><rect x="48" y="567" width="296" height="141" rx="19" fill="#ffffff" stroke="#66569b" stroke-width="2.5"/><text x="196" y="606" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Μη ανταπόκριση με απούσα</text><text x="196" y="633" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ή μη φυσιολογική αναπνοή</text><text x="196" y="660" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">οδηγεί σε άμεση</text><text x="196" y="687" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ενεργοποίηση επείγουσας…</text><path d="M556 501L556 572" stroke="#66569b" stroke-width="3"/><rect x="408" y="567" width="296" height="141" rx="19" fill="#ffffff" stroke="#66569b" stroke-width="2.5"/><text x="556" y="606" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Ο αυτόματος εξωτερικός</text><text x="556" y="633" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">απινιδωτής (AED) μπορεί</text><text x="556" y="660" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">να χρησιμοποιηθεί από</text><text x="556" y="687" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">οποιονδήποτε</text><path d="M650 501L916 572" stroke="#66569b" stroke-width="3"/><rect x="768" y="567" width="296" height="141" rx="19" fill="#ffffff" stroke="#66569b" stroke-width="2.5"/><text x="916" y="606" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Εκπαιδευτικό πλαίσιο:</text><text x="916" y="633" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">πράξεις μόνο με</text><text x="916" y="660" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">αντίστοιχη εκπαίδευση και</text><text x="916" y="687" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">σύμφωνα με τις ισχύουσες…</text><rect x="53" y="733" width="1005" height="40" rx="12" fill="#e5edf3"/><text x="555" y="760" font-size="16" font-weight="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">Σχηματική εικόνα από τη θεωρία · όχι αυτόνομο κλινικό ή υπηρεσιακό πρωτόκολλο.</text></svg>