<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Αλυσίδα μετάδοσης λοιμώξεων — Βασικές σχέσεις</title><desc id="desc">Εκπαιδευτικό σχηματικό διάγραμμα για κεφάλαιο 04-02: Ένα λοιμώδες νόσημα μεταδίδεται όταν υπάρχει παθογόνος παράγοντας, πηγή, πύλη εξόδου, οδός…; Η υγιεινή χεριών, τα σωστά ΜΑΠ, ο καθαρισμός επιφανειών και η σωστή διαχείριση αιχμηρών…; Η επιλογή ΜΑΠ εξαρτάται από τον κίνδυνο έκθεσης και τις ισχύουσες οδηγίες.. Δεν αποτελεί ανεξάρτητη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f9fbfd"/><rect width="1100" height="133" fill="#956b31"/><text x="550" y="36" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 04 · ΚΕΦΑΛΑΙΟ 02</text><text x="550" y="80" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="26" font-family="DejaVu Sans,Arial,sans-serif">Αλυσίδα μετάδοσης λοιμώξεων</text><text x="550" y="184" text-anchor="middle" fill="#956b31" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές σχέσεις</text><rect x="55" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#956b31" stroke-width="2.5"/><circle cx="208" cy="315" r="46" fill="#edf4fa" stroke="#956b31" stroke-width="3"/><path d="M180 315h56m-28-28v56" stroke="#956b31" stroke-width="3"/><text x="208" y="420" text-anchor="middle" fill="#956b31" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="208" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Ένα λοιμώδες νόσημα</text><text x="208" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">μεταδίδεται όταν υπάρχει</text><text x="208" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">παθογόνος παράγοντας,</text><text x="208" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">πηγή, πύλη εξόδου, οδός…</text><rect x="400" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#956b31" stroke-width="2.5"/><circle cx="553" cy="315" r="46" fill="#edf4fa" stroke="#956b31" stroke-width="3"/><path d="M525 315h56m-28-28v56" stroke="#956b31" stroke-width="3"/><text x="553" y="420" text-anchor="middle" fill="#956b31" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="553" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Η υγιεινή χεριών, τα</text><text x="553" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">σωστά ΜΑΠ, ο καθαρισμός</text><text x="553" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">επιφανειών και η σωστή</text><text x="553" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">διαχείριση αιχμηρών…</text><rect x="745" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#956b31" stroke-width="2.5"/><circle cx="898" cy="315" r="46" fill="#edf4fa" stroke="#956b31" stroke-width="3"/><path d="M870 315h56m-28-28v56" stroke="#956b31" stroke-width="3"/><text x="898" y="420" text-anchor="middle" fill="#956b31" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">3</text><text x="898" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Η επιλογή ΜΑΠ εξαρτάται</text><text x="898" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">από τον κίνδυνο έκθεσης</text><text x="898" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">και τις ισχύουσες</text><text x="898" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">οδηγίες.</text><rect x="55" y="607" width="990" height="62" rx="14" fill="#e4eef7"/><text x="550" y="648" text-anchor="middle" fill="#956b31" font-weight="650" font-size="20" font-family="DejaVu Sans,Arial,sans-serif">Σχηματική επεξήγηση · συνδύασέ τη με την πλήρη θεωρία.</text></svg>