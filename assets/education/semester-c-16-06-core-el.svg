<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Εγκεφαλικό: αναγνώριση και χρόνος — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 6. Παρουσιάζονται: FAST: ασυμμετρία προσώπου; FAST: αδυναμία άκρου; FAST: δυσκολία ομιλίας. Σχηματική υπενθύμιση σημείων αναγνώρισης, όχι διαγνωστικό εργαλείο. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><polygon points="590,250 824,399 590,542 356,399" fill="#edebf9" stroke="#64569b" stroke-width="4"/><text x="590" y="393" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="750" fill="#64569b">ΕΚΤΙΜΗΣΗ</text><text x="590" y="433" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="750" fill="#64569b">ΕΥΡΗΜΑΤΩΝ</text><path d="M485 478L203 573" stroke="#64569b" stroke-width="3"/><rect x="46" y="573" width="314" height="159" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.6"/><circle cx="203" cy="601" r="18" fill="none" stroke="#64569b" stroke-width="3.5"/><path d="M193 597Q203 588 213 597M193 606Q203 615 213 606" fill="none" stroke="#64569b" stroke-width="3" stroke-linecap="round"/><text x="203" y="655" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">FAST: ασυμμετρία</text><text x="203" y="682" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">προσώπου</text><path d="M590 542L590 573" stroke="#64569b" stroke-width="3"/><rect x="433" y="573" width="314" height="159" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.6"/><path d="M590 589V625M574 607H606M574 607L565 599M574 607L565 615M606 607L615 599M606 607L615 615" fill="none" stroke="#64569b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="654"