<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Αρχική εκτίμηση – assessment — Βασικές έννοιες, κεφάλαιο 06-09</title><desc id="d">Πρωτότυπο διάγραμμα του κεφαλαίου 06-09. Περιλαμβάνει Scene safety σημαίνει ασφάλεια σκηνής, primary survey πρωτογενής εκτίμηση, vital signs ζωτικά σημεία, history…; Patient σημαίνει ασθενής και bystander παρευρισκόμενος; εκτίμηση. Patient σημαίνει ασθενής και bystander παρευρισκόμενος.. Απλουστευμένη οπτική υποστήριξη της θεωρίας, όχι αυτόνομη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f7fafd"/><rect width="1100" height="132" fill="#3973a0"/><text x="550" y="34" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">ΣΑΕΚ · Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 06 · ΚΕΦΑΛΑΙΟ 09</text><text x="550" y="79" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">Αρχική εκτίμηση – assessment</text><text x="550" y="174" text-anchor="middle" fill="#3973a0" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές έννοιες</text><rect x="55" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#3973a0" stroke-width="2.5"/><circle cx="207" cy="314" r="52" fill="#e7f0f7" stroke="#3973a0" stroke-width="3"/><circle cx="207" cy="314" r="20" fill="none" stroke="#3973a0" stroke-width="4"/><text x="207" y="415" text-anchor="middle" fill="#3973a0" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">01</text><text x="207" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Scene safety σημαίνει</text><text x="207" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">ασφάλεια σκηνής,</text><text x="207" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="