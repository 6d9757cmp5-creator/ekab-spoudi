<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Εκτίμηση σκηνής μαζικού συμβάντος — Συσχέτιση και εξήγηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 15, κεφάλαιο 5: Τα στοιχεία χαρακτηρίζονται προσωρινά μέχρι να επιβεβαιωθούν.; Σε εκπαιδευτικό σενάριο σχετικό με «Εκτίμηση σκηνής μαζικού συμβάντος»; Σενάριο κεφαλαίου: Σε προσομοίωση πολλαπλών θυμάτων με θέμα «Εκτίμηση σκηνής μαζικού…. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#4c8274"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 15 · ΚΕΦ. 05</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Εκτίμηση σκηνής μαζικού συμβάντος</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">Συσχέτιση και εξήγηση</text><path d="M112 388H999" stroke="#4c8274" stroke-width="7"/><circle cx="190" cy="388" r="58" fill="#ebf3f8" stroke="#4c8274" stroke-width="4"/><text x="190" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">1</text><rect x="41" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#4c8274" stroke-width="2.6"/><text x="190" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Τα στοιχεία</text><text x="190" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">χαρακτηρίζονται προσωρινά</text><text x="190" y="587" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">μέχρι να επιβεβαιωθούν.</text><circle cx="550" cy="388" r="58