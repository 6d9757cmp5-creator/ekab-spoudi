<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Εκτίμηση σκηνής μαζικού συμβάντος — Βασικά θέματα αξιολόγησης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 5. Παρουσιάζονται ως διακριτά θέματα: αποφυγή εισόδου σε επικίνδυνη ζώνη, συνεργασία με αρμόδιους φορείς και επιβεβαίωση της επιχειρησιακής εικόνας. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#4d7d70"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 15 · ΚΕΦΑΛΑΙΟ 05</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Εκτίμηση σκηνής μαζικού συμβάντος</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#4d7d70">Βασικά θέματα αξιολόγησης</text><rect x="52" y="265" width="336" height="424" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="220" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΑΣΦΑΛΕΙΑ</text><circle cx="220" cy="406" r="45" fill="#4d7d70"/><path d="M220 377L247 388V407C247 425 235 438 220 446C205 438 193 425 193 407V388Z" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/><text x="220" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Όχι είσοδος σε</text><text x="220" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">επικίνδυνη ζώνη</text><rect x="422" y="265" width="336" height="424" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><text x="590" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΣΥΝΕΡΓΑΣΙΑ</text><circle cx="590" cy="406" r="45" fill="#4d7d70"/><circle cx="590" cy="391" r="10" fill="none" stroke="#ffffff" stroke-width="5"/><circle cx="568" cy="401" r="8" fill="none" stroke="#ffffff" stroke-width="5"/><circle cx="612" cy="401" r="8" fill="none" stroke="#ffffff" stroke-width="5"/><path d="M572 427C574 414 582 408 590 408C598 408 606 414 608 427M552 426C554 415 560 411 568 411M628 426C626 415 620 411 612 411" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><text x="590" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Πρόσθετοι</text><text x="590" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">αρμόδιοι φορείς</text><rect x="792" y="265" width="336" height="424" rx="25" fill="#d9eee3" stroke="#4d7d70" stroke-width="3"/><text x="960" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΕΙΚΟΝΑ</text><circle cx="960" cy="406" r="45" fill="#4d7d70"/><path d="M934 410C944 398 951 399 960 406C969 413 976 414 986 402M936 421H984" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/><circle cx="960" cy="406" r="5" fill="#ffffff"/><text x="960" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Επιβεβαίωση</text><text x="960" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">επιχειρησιακής εικόνας</text><rect x="51" y="759" width="1076" height="45" rx="13" fill="#e8eef3"/><text x="590" y="788" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="610" fill="#4d7d70">Εκπαιδευτική απεικόνιση · συμβουλεύσου την πλήρη θεωρία και τις ισ