<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Κρανιοεγκεφαλική κάκωση — Σημεία αναγνώρισης</title><desc id="d">Τρεις χωριστές κάρτες για κάκωση κεφαλής, εκτίμηση ανταπόκρισης και παρατήρηση κορών/εμέτων. Σχηματική εκπαιδευτική απεικόνιση, όχι αυτόνομο πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#fff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 09</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#fff">Κρανιοεγκεφαλική κάκωση</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Σημεία αναγνώρισης</text><rect x="46" y="250" width="340" height="465" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="420" y="250" width="340" height="465" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="794" y="250" width="340" height="465" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><circle cx="216" cy="405" r="92" fill="#f5ebe7" stroke="#a75749" stroke-width="3"/><circle cx="590" cy="405" r="92" fill="#f5ebe7" stroke="#a75749" stroke-width="3"/><circle cx="964" cy="405" r="92" fill="#f5ebe7" stroke="#a75749" stroke-width="3"/><path d="M173 409q-12-48 27-68 47-17 67 22l-9 39-19 14-4 22h-37l-4-18-15-3z" fill="#e8f1f7" stroke="#506b82" stroke-width="6" stroke-linejoin="round"/><path d="M249 371l12-10" stroke="#a75749" stroke-width="6" stroke-linecap="round"/><rect x="545" y="356" width="90" height="98" rx="10" fill="#e8f1f7" stroke="#506b82" stroke-width="5"/><text x="590" y="398" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="740" fill="#a75749">AVPU</text><text x="590" y="432" text-anchor