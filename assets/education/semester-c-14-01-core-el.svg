<title id="t">Μηχανισμός κάκωσης και ασφάλεια — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 1. Τρεις ανεξάρτητες θεματικές κάρτες: Τρόπος σύγκρουσης ή πτώσης; Πιθανή μεταφορά ενέργειας; Ασφάλεια χώρου συμβάντος. Δεν απεικονίζεται συγκεκριμένος τραυματισμός ή κλινική εντολή.</desc>
