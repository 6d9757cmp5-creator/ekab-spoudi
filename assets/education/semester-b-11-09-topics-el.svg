<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Επείγουσες εκφράσεις ασθενούς — αναγνώριση σημείων</title><desc id="d">Τρεις ονομασμένες εικόνες με βέλος σε κάθε αντίστοιχο αντικείμενο: I cannot breathe — δυσκολεύομαι, I feel dizzy — ζαλίζομαι, I have chest pain — πονά το στήθος. Αφαιρετικά σύμβολα επικοινωνίας· οι φράσεις δεν αποτελούν διαγνωστικά κριτήρια.</desc><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#506bb0"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#506bb0"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ffffff" font-weight="690" text-anchor="middle">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 11 · ΚΕΦΑΛΑΙΟ 09</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#ffffff" font-weight="720" text-anchor="middle">Επείγουσες εκφράσεις ασθενούς</text><circle cx="197" cy="299" r="85" fill="#eef4f8" stroke="#506bb0" stroke-width="2.4"/><g transform="translate(197 299)" fill="none" stroke="#506bb0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M0-38v22m0 0-13 13m13-13 13 13"/><path d="M-13-3q-18-14-23 10-5 20 5 28 13 7 23-4m23-34q18-14 23 10 5 20-5 28-13 7-23-4"/></g><path d="M197 478L197 361" stroke="#506bb0" stroke-width="3.5" marker-end="url(#arr)"/><rect x="48" y="487" width="298" height="93" rx="17" fill="#ffffff" stroke="#506bb0" stroke-width="2"/><circle cx="553" cy="303" r="85" fill="#eef4f8" stroke="#506bb0" stroke-width="2.4"/><g transform="translate(553 303)" fill="none" stroke="#506bb0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cy="-12" r="27"/><path d="M-13-12q0-12 13-12t13 12-13 12-13-12Zm-22 40h70"/><path d="M-31-34l-8-7m70 7 8-7"/></g><path d="M553 478L553 365" stroke="#506bb0" stroke-width="3.5" marker-end="url(#arr)"/><rect x="404" y="487" width="298" height="93" rx="17" fill="#ffffff" stroke="#506bb0" stroke-width="2"/><circle cx="909" cy="299" r="85" fill="#eef4f8" stroke="#506bb0" stroke-width="2.4"/><g transform="translate(909 299)" fill="none" stroke="#506bb0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M0 31S-37 4-37-15q0-20 19-20 12 0 18 13 6-13 18-13 19 0 19 20Q37 4 0 31Z"/><path d="m0-9-8 13h10L-3 18"/></g><path d="M909 478L909 361" stroke="#506bb0" stroke-width="3.5" marker-end="url(#arr)"/><rect x="760" y="487" width="298" height="93" rx="17" fill="#ffffff" stroke="#506bb0" stroke-width="2"/><text x="197" y="549" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#253f52" font-weight="700" text-anchor="middle">Δυσκολεύομαι να αναπνεύσω</text><text x="553" y="549" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#253f52" font-weight="700" text-anchor="middle">Ζαλίζομαι</text><text x="909" y="549" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#253f52" font-weight="700" text-anchor="middle">Πονάει το στήθος μου</text></svg>