<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Ασφαλής συγκράτηση μέσα στον χώρο ασθενούς ασθενοφόρου</title>
<desc id="desc">Εκπαιδευτική κάτοψη χώρου ασθενούς: φορείο με ιμάντες και βάση ασφάλισης, καθιστό πλήρωμα με ζώνη, ερμάριο που κλείνει και φιάλη οξυγόνου στερεωμένη σε βάση. Δεν απεικονίζει εγκατάσταση συγκεκριμένου κατασκευαστή.</desc>
<rect width="1100" height="700" fill="#f5f9fc"/>
<style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#15394f}.h{font-size:32px;font-weight:700}.s{font-size:19px}.label{font-size:22px;font-weight:700}.vehicle{fill:#e2eff5;stroke:#4b7890;stroke-width:9}.leader{stroke:#267a9c;stroke-width:4;fill:none;stroke-linecap:round}.call{fill:white;stroke:#a6c5d4;stroke-width:2}</style>
<text x="550" y="54" text-anchor="middle" class="h">Ασφάλιση ασθενούς, πληρώματος και υλικών</text><text x="550" y="89" text-anchor="middle" class="s">Σχηματική κάτοψη θαλάμου ασθενοφόρου</text>
<rect x="298" y="142" width="510" height="461" rx="38" class="vehicle"/><rect x="318" y="160" width="470" height="52" rx="10" fill="#b9d3e1" stroke="#739caf" stroke-width="3"/><text x="553" y="193" text-anchor="middle" class="s">Προς καμπίνα οδηγού</text>
