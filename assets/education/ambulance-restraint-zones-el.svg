<path d="M444 346H615M444 430H615" stroke="#d88848" stroke-width="16" stroke-linecap="round" opacity=".92"/>
<rect x="481" y="521" width="93" height="22" rx="5" fill="#328166"/><text x="527" y="537" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:15px;fill:white">Βάση</text>
