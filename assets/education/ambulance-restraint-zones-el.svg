<g><rect x="22" y="185" width="246" height="82" rx="15" class="call"/><text x="36" y="214" class="label">Ιμάντες ασθενούς</text><text x="36" y="241" class="s">Κατάλληλη εφαρμογή</text><text x="36" y="261" class="s">για το φορείο</text></g>
<g><rect x="22" y="403" width="248" height="71" rx="15" class="call"/><text x="36" y="433" class="label">Ζώνη πληρώματος</text><text x="36" y="460" class="s">Όσο κινείται το όχημα</text></g>
<g><rect x="22" y="577" width="258" height="67" rx="15" class="call"/><text x="36" y="607" class="label">Βάση φορείου</text><text x="36" y="630" class="s">Στερέωση και έλεγχος</text></g>
<g><rect x="835" y="192" width="246" height="84" rx="15" class="call"/><text x="850" y="223" class="label">Κλειστό ερμάριο</text><text x="850" y="248" class="s">Χωρίς ελεύθερα</text><text x="850" y="270" class="s">αντικείμενα</text></g>
<g><rect x="835" y="455" width="246" height="84" rx="15" class="call"/><text x="850" y="484" class="label">Φιάλη οξυγόνου</text><text x="850" y="510" class="s">Στερέωση στη βάση</text></g>
<text x="550" y="681" text-anchor="middle" class="s">Οι πραγματικές διατάξεις/ιμάντες ακολουθούν οδηγίες κατασκευαστή και υπηρεσίας.</text></svg>