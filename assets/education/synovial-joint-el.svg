<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="t d"><title id="t">Δομή τυπικής διάρθρωσης: οστό, χόνδρος, αρθρικός θύλακος, σύνδεσμος και τένοντας</title><desc id="d">Σχηματική τομή γενικής υμενώδους άρθρωσης με δύο οστά, αρθρικούς χόνδρους, αρθρική κοιλότητα, αρθρικό θύλακο, πλάγιο σύνδεσμο και μυ που συνδέεται με οστό μέσω τένοντα.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#286b85"/></marker></defs><rect width="1100" height="760" fill="#f8fcff"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e53}.h{font-size:31px;font-weight:bold}.s{font-size:19px}.lab{font-size:21px;font-weight:600}.lead{fill:none;stroke:#286b85;stroke-width:2.7;marker-end:url(#tip)}.sub{font-size:16px;fill:#48677a}</style><text x="550" y="52" text-anchor="middle" class="h">Δομή υμενώδους άρθρωσης (διάρθρωσης)</text><text x="550" y="84" text-anchor="middle" class="s">Σχηματική τομή · δεν παριστάνει συγκεκριμένη άρθρωση</text>
