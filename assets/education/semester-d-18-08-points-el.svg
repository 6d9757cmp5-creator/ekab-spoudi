<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 656" role="img" aria-labelledby="t d"><title id="t">Σταθμός ύποπτης κάκωσης ΣΣ — μεταφορά, κίνηση και αεραγωγός</title><desc id="d">Τρία διακριτά σχηματικά σύμβολα: φορείο μεταφοράς, ανθρώπινη μορφή με περιορισμένα σύμβολα κίνησης, και τραχεία με διακλάδωση προς τους πνεύμονες. Εκπαιδευτική αναγνώριση εννοιών, όχι οδηγία χειρισμού ή κλινικό πρωτόκολλο.</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b25e50"/></marker><marker id="motion" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b25e50"/></marker></defs><rect width="1110" height="656" fill="#f9fbfd"/><rect width="1110" height="120" fill="#b25e50"/><text x="555" y="33" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ffffff" font-weight="680" text-anchor="middle">Δ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 18 · ΚΕΦΑΛΑΙΟ 08</text><text x="555" y="81" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#ffffff" font-weight="750" text-anchor="middle">Σταθμός ύποπτης κάκωσης ΣΣ</text>
