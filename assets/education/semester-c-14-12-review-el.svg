<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Εγκαύματα και εισπνευστική κάκωση — Επανέλεγχος και ασφάλεια</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 12. Παρουσιάζονται: Πρόληψη γενικευμένης ψύξης; Αποφυγή υποθερμίας; Επείγουσα υποστήριξη όπου χρειάζεται. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 12</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Εγκαύματα και εισπνευστική κάκωση</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Επανέλεγχος και ασφάλεια</text><rect x="59" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#a75749" stroke-width="3"/><circle cx="226" cy="377" r="50" fill="#f0edf9" stroke="#a75749" stroke-width="3"/><path d="M206 377h40m-20-20v40" stroke="#a75749" stroke-width="5" stroke-linecap="round"/><text x="226" y="476" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#a75749">Κάλυψη εγκαύματος</text><text x="226" y="521" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="650" fill="#213f53">Προστασία από ψύξη</text><rect x="448" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#a75749" stroke-width="3"/><circle cx="615" cy="377" r="50" fill="#f0edf9" stroke="#a75749" stroke-width="3"/><path d="M615 347c-20 24-15 39 0 50 15-11 20-26 0-50z" fill="none" stroke="#a75749" stroke-width="5"/><text x="615" y="476" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#a75749">Υποθερμία</text><text x="615" y="521" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="650" fill="#213f53">Παρακολούθηση και πρόληψη</text><rect x="837" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#a75749" stroke-width="3"/><circle cx="1004" cy="377" r="50" fill="#f0edf9" stroke="#a75749" stroke-width="3"/><path d="M1004 345v34m-15-16q15-24 30 0m-30 18q15 24 30 0" fill="none" stroke="#a75749" stroke-width="5" stroke-linecap="round"/><text x="1004" y="476" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#a75749">Αναπνευστική υποστήριξη</text><text x="1004" y="521" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="650" fill="#213f53">Όταν χρειάζεται, κατά εκτίμηση</text><rect x="51" y="759" width="1076" height="45" rx="13" fill="#e8eef3"/><text x="590" y="788" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="610" fill="#a75749">Εκπαιδευτική απεικόνιση · συμβουλεύσου την πλήρη θεωρία και τις ισχύουσες οδηγίες.</text></svg>