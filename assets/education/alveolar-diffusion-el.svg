<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Ανταλλαγή αερίων στους πνεύμονες</title><desc id="desc">Το οξυγόνο διαχέεται από την κυψελίδα προς το αίμα και το διοξείδιο από το αίμα προς την κυψελίδα. Κανονική κατεύθυνση στην πνευμονική ανταλλαγή αερίων, όχι ανατομική τομή.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#24728e"/></marker></defs><rect width="1000" height="620" fill="#f8fcfe"/><g font-family="DejaVu Sans, sans-serif"><text x="36" y="52" font-size="30" fill="#173c54" text-anchor="start">Ανταλλαγή αερίων στους πνεύμονες</text><rect x="70" y="140" width="350" height="300" rx="35" fill="#e2f4fc" stroke="#24728e"/><rect x="580" y="140" width="350" height="300" rx="35" fill="#ffe9e8" stroke="#b45552"/><path d="M500 210 V410" stroke="#6e8790" stroke-width="3" stroke-dasharray="7 5"/><text x="245" y="200" font-size="25" fill="#173c54" text-anchor="middle">Κυψελιδικός αέρας</text><text x="755" y="200" font-size="24" fill="#173c54" text-anchor="middle">Πνευμονικό τριχοειδές</text><path d="M330 265 L660 265" stroke="#24728e" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="500" y="245" font-size="26" fill="#173c54" text-anchor="middle">O2</text><path d="M660 355 L330 355" stroke="#24728e" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="500" y="335" font-size="26" fill="#173c54" text-anchor="middle">CO2</text><text x="500" y="480" font-size="23" fill="#173c54" text-anchor="middle">Κυψελιδοτριχοειδικός φραγμός</text><text x="500" y="525" font-size="23" fill="#173c54" text-anchor="middle">Διάχυση προς τη μικρότερη μερική πίεση κάθε αερίου.</text><text x="36" y="585" font-size="17" fill="#173c54" text-anchor="start">Εκπαιδευτικό σχήμα · όχι σε φυσική κλίμακα</text></g></svg>