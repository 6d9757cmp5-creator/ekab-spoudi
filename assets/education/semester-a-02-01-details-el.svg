<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Ομοιόσταση και ανατροφοδότηση — Αναλυτική κατανόηση</title><desc id="desc">Εκπαιδευτικό σχηματικό διάγραμμα για κεφάλαιο 02-01: Η διαταραχή της ομοιόστασης βρίσκεται πίσω από πολλές επείγουσες καταστάσεις.; SOS · Ομοιόσταση = διατήρηση εσωτερικής ισορροπίας, κυρίως με αρνητική ανατροφοδότηση.; Η ομοιόσταση είναι η διατήρηση εσωτερικών μεταβλητών σε λειτουργικά όρια παρά τις αλλαγές…. Δεν αποτελεί ανεξάρτητη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f9fbfd"/><rect width="1100" height="133" fill="#267568"/><text x="550" y="36" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 01</text><text x="550" y="80" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="26" font-family="DejaVu Sans,Arial,sans-serif">Ομοιόσταση και ανατροφοδότηση</text><text x="550" y="184" text-anchor="middle" fill="#267568" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Αναλυτική κατανόηση</text><rect x="80" y="225" width="940" height="91" rx="19" fill="#fff" stroke="#267568" stroke-width="2.5"/><circle cx="135" cy="270" r="25" fill="#267568"/><text x="135" y="278" text-anchor="middle" fill="#fff" font-weight="700" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="186" y="268" text-anchor="start" fill="#233d4f" font-weight="600" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Η διαταραχή της ομοιόστασης βρίσκεται πίσω από πολλές επείγουσες</text><text x="186" y="297" text-anchor="start" fill="#233d4f" font-weight="600" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">καταστάσεις.</text><rect x="80" y="337" width="940" height="91" rx="19" fill="#edf4fa" stroke="#267568" stroke-width="2.5"/><circle cx="135" cy="382" r="25" fill="#267568"/><text x="135" y="390" text-anchor="middle" fill="#fff" font-weight="700" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="186" y="380" text-anchor="start" fill="#233d4f" font-weight="600" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">SOS · Ομοιόσταση = διατήρηση εσωτερικής ισορροπίας, κυρίως με</text><text x="186" y="409" text-anchor="start" fill="#233d4f" font-weight="600" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">αρνητική ανατροφοδότηση.</text><rect x="80" y="449" width="940" height="91" rx="19" fill="#fff" stroke="#267568" stroke-width="2.5"/><circle cx="135" cy="494" r="25" fill="#267568"/><text x="135" y="502" text-anchor="middle" fill="#fff" font-weight="700" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">3</text><text x="186" y="492" text-anchor="start" fill="#233d4f" font-weight="600" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Η ομοιόσταση είναι η διατήρηση εσωτερικών μεταβλητών σε λειτουργικά</text><text x="186" y="521" text-anchor="start" fill="#233d4f" font-weight="600" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">όρια παρά τις αλλαγές…</text><rect x="55" y="607" width="990" height="62" rx="14" fill="#e4eef7"/><text x="550" y="648" text-anchor="middle" fill="#267568" font-weight="650" font-size="20" font-family="DejaVu Sans,Arial,sans-serif">Σχηματική επεξήγηση · συνδύασέ τη με την πλήρη θεωρία.</text></svg>