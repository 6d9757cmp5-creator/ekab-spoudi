<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img" aria-labelledby="t d"><title id="t">Ουροποιητικό σύστημα: νεφροί, ουρητήρες, ουροδόχος κύστη και ουρήθρα</title><desc id="d">Πρόσθια σχηματική απεικόνιση δύο νεφρών με ουρητήρες που οδηγούν στην ουροδόχο κύστη και μία ουρήθρα που οδηγεί προς τα έξω. Το αναπαραγωγικό σύστημα δεν απεικονίζεται.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#286b85"/></marker></defs><rect width="1100" height="820" fill="#f8fcff"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e53}.h{font-size:31px;font-weight:bold}.s{font-size:19px}.lab{font-size:21px;font-weight:600}.lead{fill:none;stroke:#286b85;stroke-width:2.7;marker-end:url(#tip)}.sub{font-size:16px;fill:#48677a}</style><text x="550" y="52" class="h" text-anchor="middle">Ουροποιητικό σύστημα</text><text x="550" y="87" class="s" text-anchor="middle">Πρόσθια σχηματική όψη — πορεία των ούρων</text>
