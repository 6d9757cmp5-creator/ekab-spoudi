<text x="550" y="760" text-anchor="middle" class="sub">Πρόσθια όψη: δεξιά του ασθενούς φαίνεται αριστερά στον θεατή.</text>
<text x="550" y="790" text-anchor="middle" class="sub">Δεν περιλαμβάνει αναπαραγωγικά όργανα ή τις διαφορές ανδρικής/γυναικείας ουρήθρας.</text></svg>
