<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Ζώνες, επικοινωνία και απολογισμός — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 3. Παρουσιάζονται: Σαφή μηνύματα προς το Κέντρο; Καταγραφή κάθε διακομιδής; Απολογισμός μετά το συμβάν. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#4d7d70"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 15 · ΚΕΦΑΛΑΙΟ 03</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Ζώνες, επικοινωνία και απολογισμός</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#4d7d70">Σχέσεις και προτεραιότητες</text><rect x="65" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#4d7d70" stroke-width="3"/><rect x="427" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#4d7d70" stroke-width="3"/><rect x="789" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#4d7d70" stroke-width="3"/><circle cx="227" cy="389" r="48" fill="#e8f1f7" stroke="#4d7d70" stroke-width="4"/><path d="M214 375h26v28h-26z m6 28v7m14-7v7m-24-28q-9 8 0 16m34-16q9 8 0 16" fill="none" stroke="#4d7d70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="227" y="485" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#4d7d70">Επικοινωνία</text><text x="227" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="650" fill="#213f53">Σαφή μηνύματα στο Κέντρο</text><circle cx="589" cy="389" r="48" fill="#e8f1f7" stroke="#4d7d70" s