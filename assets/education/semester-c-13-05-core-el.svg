<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Κάρτα συμβάντος: βασικά στοιχεία — Βασικά σημεία</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 13, κεφάλαιο 5: Η καρτέλα περιλαμβάνει στοιχεία εντοπισμού; Τα συγκεκριμένα υποχρεωτικά πεδία καθορίζονται από το εκάστοτε εγκεκριμένο υπηρεσιακό σύστημα…; Η κάρτα συμβάντος είναι κοινό εργαλείο ενημέρωσης και ιχνηλασιμότητας.. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#24728d"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 13 · ΚΕΦ. 05</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Κάρτα συμβάντος: βασικά στοιχεία</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#24728d">Βασικά σημεία</text><path d="M121 385H998" stroke="#24728d" stroke-width="7"/><circle cx="178" cy="385" r="63" fill="#e5f1f7" stroke="#24728d" stroke-width="4"/><text x="178" y="394" font-size="18" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#24728d">ΚΛΗΣΗ</text><rect x="29" y="508" width="298" height="169" rx="22" fill="#ffffff" stroke="#24728d" stroke-width="3"/><text x="178" y="551" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η καρτέλα περιλαμβάνει</text><text x="178" y="578" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">στοιχεία εντοπισμού</text><circle cx="560" cy="385" r="63" fill="#e5f1f7" stroke="#24728d" stroke-width="4"/><text x="560" y="394" font-size="18" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#24728d">ΚΕΝΤΡΟ</text><rect x="411" y="508" width="298" height="169" rx="22" fill="#ffffff" stroke="#24728d" stroke-width="3"/><text x="560" y="551" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Τα συγκεκριμένα</text><text x="560" y="578" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">υποχρεωτικά πεδία</text><text x="560" y="605" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">καθορίζονται από το</text><text x="560" y="632" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">εκάστοτε εγκεκριμένο</text><text x="560" y="659" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">υπηρεσιακό σύστημα…</text><circle cx="942" cy="385" r="63" fill="#e5f1f7" stroke="#24728d" stroke-width="4"/><text x="942" y="394" font-size="18" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#24728d">ΠΛΗΡΩΜΑ</text><rect x="793" y="508" width="298" height="169" rx="22" fill="#ffffff" stroke="#24728d" stroke-width="3"/><text x="942" y="551" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η κάρτα συμβάντος είναι</text><text x="942" y="578" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">κοινό εργαλείο</text><text x="942" y="605" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ενημέρωσης και</text><text x="942" y="632" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ιχνηλασιμότητας.</text><rect x="53" y="733" width="1005" height="40" rx="12" fill="#e5edf3"/><text x="555" y="760" font-size="16" font-weight="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#24728d">Σχηματική εικόνα από τη θεωρία · όχι αυτόνομο κλινικό ή υπηρεσιακό πρωτόκολλο.</text></svg>