<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Διάχυση και ώσμωση μέσα από κυτταρική μεμβράνη</title><desc id="d">Κατακόρυφη φωσφολιπιδική διπλοστιβάδα χωρίζει δύο υδατικά διαμερίσματα. Σωματίδια κινούνται από αριστερά, όπου η συγκέντρωση είναι υψηλή, προς τα δεξιά όπου είναι χαμηλή. Το νερό περνά μέσω υδατικού καναλιού από τη δεξιά πλευρά προς την αριστερή, όπου η συγκέντρωση διαλυμένης ουσίας είναι υψηλότερη.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347e75"/></marker><marker id="diff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" height="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba6b42"/></marker><marker id="water" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" height="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3277a5"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#347e75"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="555" y="30" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 05</text><text x="555" y="72" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Μεμβράνες και μεταφορά ουσιών</text><text x="282" y="166" font-size="17" fill="#253f52" font-weight="700" text-anchor="middle">Υψηλή συγκέντρωση διαλυμένης ουσίας</text><text x="834" y="166" font-size="17" fill="#253f52" font-weight="700" text-anchor="middle">Χαμηλή συγκέντρωση διαλυμένης ουσίας</text>
