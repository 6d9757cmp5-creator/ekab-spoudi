<!-- labels with arrows --> <path d="M555 466V431" stroke="#347e75" stroke-width="3" marker-end="url(#arr)"/><text x="555" y="493" font-size="17" fill="#253f52" font-weight="700" text-anchor="middle">Μεμβράνη</text><path d="M405 316L492 285" stroke="#347e75" stroke-width="3" marker-end="url(#arr)"/><text x="300" y="324" font-size="17" fill="#253f52" font-weight="700">Διάχυση</text><path d="M725 316L619 350" stroke="#347e75" stroke-width="3" marker-end="url(#arr)"/><text x="740" y="324" font-size="17" fill="#253f52" font-weight="700">Ώσμωση</text><text x="555" y="572" font-size="14" fill="#526b78" text-anchor="middle">Διάχυση: σωματίδια υψηλή → χαμηλή · Ώσμωση: νερό προς υψηλότερη συγκέντρωση διαλυμένης ουσίας</text></g></svg>