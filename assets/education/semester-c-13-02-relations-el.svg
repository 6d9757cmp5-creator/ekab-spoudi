<title id="t">Ανάθεση μέσων και ενημέρωση — τρεις έννοιες επικοινωνίας</title>
<desc id="d">Τρεις παράλληλες εκπαιδευτικές έννοιες χωρίς αριθμημένη σειρά: ανάθεση από το Κέντρο, επιβεβαίωση λήψης και ενημέρωση για νέα δεδομένα. Δεν αποτελεί κλινική εντολή ή πρωτόκολλο.</desc>
