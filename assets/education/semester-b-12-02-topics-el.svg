<title id="t">Οδοί χορήγησης και έλεγχοι ασφάλειας — αναγνώριση σημείων</title><desc id="d">Τρεις αφαιρετικές απεικονίσεις οδού: κάψουλα δίπλα σε στόμα, εισπνευστήρας με αναπνευστικό σύμβολο, και χωριστά σχηματικά στοιχεία μυϊκού ιστού/σύριγγας και ασκού/γραμμής έγχυσης. Δεν δείχνεται θέση, γωνία, δόση ή τεχνική χορήγησης.</desc>
