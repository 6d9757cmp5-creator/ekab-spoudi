<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" role="img" aria-labelledby="title desc"><title id="title">Σχεδιασμός ασφαλούς διαδρομής μετακίνησης ασθενούς</title><desc id="desc">Κάτοψη δωματίου με κρεβάτι, πόρτα, στενό διάδρομο, σκαλοπάτια, ελεύθερη διαδρομή φορείου, καθώς και σημεία επαλήθευσης εμποδίων, προγραμματισμού βοήθειας και βοηθημάτων.</desc><rect width="1160" height="700" fill="#f5f9fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#17394d}.heading{font-size:30px;font-weight:750}.sub{font-size:19px}.tag{font-size:22px;font-weight:700}.note{font-size:17px}.line{stroke:#277699;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#b8ccd8;stroke-width:2}.arrow{fill:#247b91}</style><text x="580" y="48" text-anchor="middle" class="heading">Πριν από τη μετακίνηση: ελέγχουμε τη διαδρομή</text><text x="580" y="81" text-anchor="middle" class="sub">Κάτοψη χώρου — εντοπισμός εμποδίων και οργάνωση ομάδας</text>
<rect x="48" y="127" width="705" height="490" rx="14" fill="#e9f3f7" stroke="#456e85" stroke-width="9"/><path d="M753 273v119" stroke="#f5f9fc" stroke-width="16"/><path d="M753 270A132 132 0 0 1 621 402" stroke="#de9c62" stroke-width="4" fill="none" stroke-dasharray="8 8"/><path d="M752 272L622 272" stroke="#de9c62" stroke-width="7"/><rect x="88" y="248" width="180" height="250" rx="19" fill="#87acc0" stroke="#365f77" stroke-width="6"/><rect x="108" y="268" width="139" height="208" rx="16" fill="#fefefe" stroke="#5f95a9" stroke-width="3"/><circle cx="178" cy="300" r="27" fill="#e8bda4"/><path d="M177 339v83m0-54-38 37m38-37 38 37m-38 17-27 39m27-39 27 39" stroke="#7296ab" stroke-width="18" stroke-linecap="round" fill="none"/><text x="178" y="535" text-anchor="middle" class="sub">Κρεβάτι</text>
<rect x="387" y="453" width="186" height="96" rx="16" fill="#d5e9f0" stroke="#397791" stroke-width="5"/><rect x="403" y="468" width="153" height="59" rx="9" fill="#fff" stroke="#7ca5b8" stroke-width="3"/><circle cx="423" cy="551" r="10" fill="#334e62"/><circle cx="536" cy="551" r="10" fill="#334e62"/><text x="479" y="580" text-anchor="middle" class="sub">Φορείο</text>
<path d="M267 370H470V315H751" fill="none" stroke="#36a57d" stroke-width="11" stroke-linecap="round" stroke-dasharray="20 16"/><path d="M735 303l16 12-16 12" stroke="#21865e" stroke-width="7" fill="none" stroke-linecap="round"/><text x="468" y="285" text-anchor="middle" class="sub">Προγραμματισμένη διαδρομή</text>
<rect x="540" y="175" width="119" height="66" rx="7" fill="#e7b4ab" stroke="#b35a4b" stroke-width="4"/><path d="M546 180l108 55m0-55-108 55" stroke="#b35a4b" stroke-width="4"/><path d="M603 207L789 183H818" class="line"/>
<rect x="793" y="138" width="327" height="86" rx="14" class="panel"/><text x="810" y="171" class="tag">Έπιπλα / εμπόδια</text><text x="810" y="198" class="sub">Καθαρίζουμε τη διαδρομή</text>
<rect x="803" y="275" width="304" height="112" rx="10" fill="#e0eff5" stroke="#456e85" stroke-width="5"/><path d="M819 286h272m-272 23h272m-272 23h272m-272 23h272" stroke="#9baebc" stroke-width="4"/><text x="955" y="418" text-anchor="middle" class="tag">Σκάλες / σκαλοπάτια</text><text x="955" y="444" text-anchor="middle" class="note">Αξιολογούμε άλλο μέσο</text><text x="955" y="468" text-anchor="middle" class="note">και ανάγκη βοήθειας</text>
<path d="M739 333H795" class="line"/><rect x="794" y="506" width="326" height="93" rx="14" class="panel"/><text x="810" y="539" class="tag">Πόρτα και στροφή</text><text x="810" y="566" class="sub">Ελέγχουμε την προσπέλαση</text><path d="M743 378L824 510" class="line"/>
<text x="580" y="661" text-anchor="middle" class="note">Επιλογή βοηθημάτων και αριθμού ατόμων βάσει εκπαίδευσης, ασθενούς και πραγματικού χώρου.</text></svg>
