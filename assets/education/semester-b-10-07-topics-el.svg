<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d"><title id="t">Πόνος θώρακα και οξύ στεφανιαίο σύνδρομο — Αντικείμενο και βασικά στοιχεία</title><desc id="d">Αυτόνομο εκπαιδευτικό διάγραμμα του Β΄ εξαμήνου, μάθημα 10, κεφάλαιο 7. Οι τρεις θεματικές έννοιες είναι: Πίεση στο στήθος; Αντανάκλαση και εφίδρωση; Μη τυπική παρουσίαση είναι δυνατή. Χρειάζεται έλεγχος ειδικού για κλινικές πράξεις.</desc><rect width="1100" height="720" fill="#f8fbfe"/><rect width="1100" height="141" fill="#aa5350"/><text x="550" y="31" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 10 · ΚΕΦ. 07</text><text x="550" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="750" text-anchor="middle" fill="#ffffff">Πόνος θώρακα και οξύ στεφανιαίο σύνδρομο</text><text x="550" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="740" text-anchor="middle" fill="#aa5350">Αντικείμενο και βασικά στοιχεία</text><rect x="45" y="230" width="313" height="368" rx="26" fill="#ffffff" stroke="#aa5350" stroke-width="2.5"/><circle cx="201" cy="322" r="68" fill="#edf4f9" stroke="#aa5350" stroke-width="2"/><g transform="translate(201 322)" fill="none" stroke="#aa5350" stroke-width="5"><path d="M-50 4h22l12-23 13 45L10 1h17l8-15 11 18h5"/><circle cx="0" cy="2" r="41" stroke-width="2"/></g><rect x="146" y="401" width="110" height="43" rx="20" fill="#aa5350"/><text x="201" y="428" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="740" text-anchor="middle" fill="#ffffff">ΣΤΟΙΧΕΙΟ 1</text><text x="201" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" text-anchor="middle" fill="#243d50">Πίεση στο στήθος</text><path d="M361 352h33" stroke="#aa5350" stroke-width="3.5"/><path d="M382 343l12 9-12 9" fill="none" stroke="#aa5350" stroke-width="3"/><rect x="399" y="230" width="313" height="368" r