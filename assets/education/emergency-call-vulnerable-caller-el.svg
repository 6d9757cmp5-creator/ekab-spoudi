<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Επείγουσα κλήση από παιδί ή πανικοβλημένο καλούντα</title><desc id="desc">Δύο τηλεφωνικές συνομιλίες σε σχηματικό ζευγάρι οθονών: παιδί με κινητό και τηλεφωνητής με ακουστικά, και καλών σε ένταση με ίδιο εκπαιδευμένο τηλεφωνητή. Στοιχεία απλής γλώσσας, μιας ερώτησης τη φορά, ακρόασης και επιβεβαίωσης της θέσης χωρίς ιατρική διάγνωση.</desc><rect width="1200" height="680" fill="#f3f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#193b53}.h{font-size:33px;font-weight:700}.t{font-size:23px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.path{stroke:#5b88a1;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#b8ccd8;stroke-width:3}</style>
<text x="600" y="49" text-anchor="middle" class="h">Επικοινωνία με ευάλωτο ή αγχωμένο καλούντα</text>
<text x="600" y="83" text-anchor="middle" class="s">Ενεργητική ακρόαση, απλή γλώσσα και επιβεβαίωση κρίσιμων στοιχείων</text>
