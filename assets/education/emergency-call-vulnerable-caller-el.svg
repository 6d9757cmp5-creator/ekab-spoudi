<text x="304" y="488" text-anchor="middle" class="t">Κλήση από παιδί</text>
<text x="894" y="488" text-anchor="middle" class="t">Αγωνία / πανικός</text>
<text x="600" y="597" text-anchor="middle" class="s">Μία σύντομη ερώτηση κάθε φορά · επιβεβαίωση θέσης · αποφυγή υποθέσεων</text>
<text x="600" y="636" text-anchor="middle" class="fine">Τυχόν τηλεφωνικές οδηγίες παρέχονται μόνο βάσει εγκεκριμένου πρωτοκόλλου</text></svg>