<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Το σύστημα επείγουσας προνοσοκομειακής φροντίδας — Βασικές σχέσεις</title><desc id="desc">Εκπαιδευτικό σχηματικό διάγραμμα για κεφάλαιο 03-04: Η προνοσοκομειακή φροντίδα είναι μια οργανωμένη αλυσίδα από τη λήψη κλήσης και τη διαλογή…; Το πλήρωμα δεν λειτουργεί απομονωμένα: συνεργάζεται με κέντρο, άλλες υπηρεσίες και…; SOS · Προνοσοκομειακή αλυσίδα: κλήση, διαλογή, αποστολή, φροντίδα, διακομιδή και…. Δεν αποτελεί ανεξάρτητη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f9fbfd"/><rect width="1100" height="133" fill="#755ba4"/><text x="550" y="36" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 03 · ΚΕΦΑΛΑΙΟ 04</text><text x="550" y="80" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="26" font-family="DejaVu Sans,Arial,sans-serif">Το σύστημα επείγουσας προνοσοκομειακής φροντίδας</text><text x="550" y="184" text-anchor="middle" fill="#755ba4" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές σχέσεις</text><rect x="55" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#755ba4" stroke-width="2.5"/><circle cx="208" cy="315" r="46" fill="#edf4fa" stroke="#755ba4" stroke-width="3"/><path d="M180 315h56m-28-28v56" stroke="#755ba4" stroke-width="3"/><text x="208" y="420" text-anchor="middle" fill="#755ba4" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="208" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Η προνοσοκομειακή</text><text x="208" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">φροντίδα είναι μια</text><text x="208" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">οργανωμένη αλυσίδα από</text><text x="208" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">τη λήψη κλήσης και τη</text><text x="208" y="579" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">διαλογή…</text><rect x="400" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#755ba4" stroke-width="2.5"/><circle cx="553" cy="315" r="46" fill="#edf4fa" stroke="#755ba4" stroke-width="3"/><path d="M525 315h56m-28-28v56" stroke="#755ba4" stroke-width="3"/><text x="553" y="420" text-anchor="middle" fill="#755ba4" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="553" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Το πλήρωμα δεν</text><text x="553" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">λειτουργεί απομονωμένα:</text><text x="553" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">συνεργάζεται με κέντρο,</text><text x="553" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">άλλες υπηρεσίες και…</text><rect x="745" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#755ba4" stroke-width="2.5"/><circle cx="898" cy="315" r="46" fill="#edf4fa" stroke="#755ba4" stroke-width="3"/><path d="M870 315h56m-28-28v56" stroke="#755ba4" stroke-width="3"/><text x="898" y="420" text-anchor="middle" fill="#755ba4" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">3</text><text x="898" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">SOS · Προνοσοκομειακή</text><text x="898" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">αλυσίδα: κλήση, διαλογή,</text><text x="898" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">αποστολή, φροντίδα,</text><text x="898" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">διακομιδή και…</text><rect x="55" y="607" width="990" height="62" rx="14" fill="#e4eef7"/><text x="550" y="648" text-anchor="middle" fill="#755ba4" font-weight="650" font-size="20" font-family="DejaVu Sans,Arial,sans-serif">Σχηματική επεξήγηση · συνδύασέ τη με την πλήρη θεωρία.</text></svg>