<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Σχηματική οργάνωση διαλογής και ροής στο Τμήμα Επειγόντων Περιστατικών</title><desc id="desc">Κάτοψη τμήματος επειγόντων: είσοδος, σημείο υποδοχής και διαλογής από αρμόδιο επαγγελματία, δύο διαφορετικοί χώροι κλινικής εκτίμησης και συνεχής δυνατότητα ενημέρωσης σε περίπτωση επιδείνωσης. Το σχήμα δεν ορίζει κατηγορίες, χρώματα, χρόνους αναμονής ή εθνικό σύστημα διαλογής.</desc><rect width="1200" height="700" fill="#f3f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173d53}.head{font-size:34px;font-weight:700}.small{font-size:20px}.label{font-size:24px;font-weight:700}.fine{font-size:18px}.panel{fill:#fff;stroke:#b7cedd;stroke-width:3}.line{fill:none;stroke:#5989a2;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="600" y="50" text-anchor="middle" class="head">Διαλογή και ροή στο ΤΕΠ · σχηματική κάτοψη</text>
<text x="600" y="85" text-anchor="middle" class="small">Η προτεραιότητα καθορίζεται από το εκπαιδευμένο, αρμόδιο προσωπικό</text>
