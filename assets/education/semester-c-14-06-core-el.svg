<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Μηχανισμός κάκωσης και ενέργεια — Σημεία αναγνώρισης</title><desc id="d">Τρεις διακριτές θεματικές κάρτες: σύγκρουση οχημάτων, πτώση από ύψος και διεισδυτική κάκωση. Σχηματική εκπαιδευτική απεικόνιση, όχι κλινικό πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#fff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 06</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#fff">Μηχανισμός κάκωσης και ενέργεια</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Σημεία αναγνώρισης</text><rect x="46" y="250" width="340" height="465" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><circle cx="216" cy="405" r="92" fill="#f5ebe7" stroke="#a75749" stroke-width="3"/><path d="M147 424h138" stroke="#506b82" stroke-width="6"/><path d="M150 405l12-27h40l15 27zM208 405l15-27h39l19 27z" fill="#e8f1f7" stroke="#506b82" stroke-width="5" stroke-linejoin="round"/><circle cx="173" cy="421" r="10" fill="#a75749"/><circle cx="261" cy="421" r="10" fill="#a75749"/><path d="M209 392h14M214 384l8 8-8 8" fill="none" stroke="#a75749" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="216" y="565" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="680" fill="#213f53">Σύγκρουση οχημάτων</text><rect x="420" y="250" width="340" height="465" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><circle cx="590" cy="405" r="92" fill="#f5ebe7" stroke="#a75749" stroke-width="3"/><circle cx="590" cy="350" r="15" fill="#e9d8cb" stroke="#506b82" stroke-width="4"/><path d="M590 368v53m0