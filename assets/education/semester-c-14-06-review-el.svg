<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Μηχανισμός κάκωσης και ενέργεια — Πρόσθετη επανεκτίμηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 14, κεφάλαιο 6: Κριτήριο τεκμηρίωσης: Πτώση, πρόσκρουση ή διεισδυτικό τραύμα δείχνουν πιθανούς κινδύνους, όχι…; Η κλινική εξέταση και οι ζωτικές ενδείξεις καθορίζουν τις άμεσες προτεραιότητες.; Ο μηχανισμός κάκωσης περιγράφει πώς μεταφέρθηκε ενέργεια στο σώμα και ποια τραύματα είναι…. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#a55c4d"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦ. 06</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Μηχανισμός κάκωσης και ενέργεια</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">Πρόσθετη επανεκτίμηση</text><rect x="57" y="250" width="301" height="350" rx="24" fill="#ffffff" stroke="#a55c4d" stroke-width="3"/><circle cx="207" cy="339" r="49" fill="#eae9f7" stroke="#a55c4d" stroke-width="3"/><path d="M207 315v32m0 15v3" stroke="#a55c4d" stroke-width="8" stroke-linecap="round"/><text x="207" y="439" font-size="22" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">ΣΗΜΕΙΟ 1</text><text x="207" y="493" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Κριτήριο τεκμηρίωσης:</text><text x="207" y="517" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Πτώση, πρόσκρουση ή</text><text x="207" y="541" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">διεισδυτικό τραύμα</text><text x="207" y="565" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">δείχνουν πιθανούς</text><text x="207" y="589" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">κινδύνους, όχι…</text><rect x="406" y="294" width="301" height="350" rx="24" fill="#ffffff" stroke="#a55c4d" stroke-width="3"/><circle cx="556" cy="383" r="49" fill="#eae9f7" stroke="#a55c4d" stroke-width="3"/><path d="M556 359v32m0 15v3" stroke="#a55c4d" stroke-width="8" stroke-linecap="round"/><text x="556" y="483" font-size="22" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">ΣΗΜΕΙΟ 2</text><text x="556" y="537" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η κλινική εξέταση και οι</text><text x="556" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ζωτικές ενδείξεις</text><text x="556" y="585" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">καθορίζουν τις άμεσες</text><text x="556" y="609" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">προτεραιότητες.</text><rect x="755" y="250" width="301" height="350" rx="24" fill="#ffffff" stroke="#a55c4d" stroke-width="3"/><circle cx="905" cy="339" r="49" fill="#eae9f7" stroke="#a55c4d" stroke-width="3"/><path d="M905 315v32m0 15v3" stroke="#a55c4d" stroke-width="8" stroke-linecap="round"/><text x="905" y="439" font-size="22" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">ΣΗΜΕΙΟ 3</text><text x="905" y="493" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Ο μηχανισμός κάκωσης</text><text x="905" y="517" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">περιγράφει πώς</text><text x="905" y="541" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">μεταφέρθηκε ενέργεια στο</text><text x="905" y="565" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">σώμα και ποια τραύματα</text><text x="905" y="589" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">είναι…</text><rect x="53" y="733" width="1005" height="40" rx="12" fill="#e5edf3"/><text x="555" y="760" font-size="16" font-weight="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">Σχηματική εικόνα από τη θεωρία · όχι αυτόνομο κλινικό ή υπηρεσιακό πρωτόκολλο.</text></svg>