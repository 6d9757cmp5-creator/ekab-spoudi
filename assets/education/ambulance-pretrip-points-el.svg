<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Ασθενοφόρο: σημεία εξωτερικού και λειτουργικού ελέγχου πριν τη βάρδια</title><desc id="desc">Πλάγια σχηματική απεικόνιση ασθενοφόρου με βέλη προς τα ελαστικά, τα φώτα, τους καθρέφτες και υαλοκαθαριστήρες, τα φρένα, τα υγρά και την ασφαλή στερέωση του εξοπλισμού.</desc><rect width="1100" height="680" fill="#f6fafc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#16394e}.head{font-size:34px;font-weight:bold}.sub{font-size:21px}.lab{font-size:24px;font-weight:700}.small{font-size:19px}.micro{font-size:16px}.guide{stroke:#276b8a;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.soft{fill:#e9f3f9;stroke:#8ab1c9;stroke-width:3}.white{fill:white;stroke:#a6c0ce;stroke-width:2}.gold{fill:#fff2dc;stroke:#d0a25b;stroke-width:2}.green{fill:#e5f5eb;stroke:#76af88;stroke-width:2}</style><text x="550" y="53" text-anchor="middle" class="head">Έλεγχος ασθενοφόρου πριν από τη βάρδια</text><text x="550" y="86" text-anchor="middle" class="sub">Κύρια σημεία ελέγχου — ενδεικτικό σχέδιο οχήματος</text>
