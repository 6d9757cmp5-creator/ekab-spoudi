<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Καρδιακός κύκλος και ηλεκτρική αγωγή — Αναλυτική κατανόηση</title><desc id="desc">Εκπαιδευτικό σχηματικό διάγραμμα για κεφάλαιο 02-07: SOS · Διαστολή = γέμισμα κοιλιών· συστολή = εξώθηση αίματος· ο φλεβόκομβος είναι…; Ο όγκος παλμού είναι η ποσότητα αίματος που εξωθεί μια κοιλία σε κάθε συστολή.; Η καρδιακή παροχή είναι το γινόμενο όγκου παλμού και καρδιακής συχνότητας. Έτσι εξηγείται…. Δεν αποτελεί ανεξάρτητη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f9fbfd"/><rect width="1100" height="133" fill="#267568"/><text x="550" y="36" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 07</text><text x="550" y="80" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="26" font-family="DejaVu Sans,Arial,sans-serif">Καρδιακός κύκλος και ηλεκτρική αγωγή</text><text x="550" y="184" text-anchor="middle" fill="#267568" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Αναλυτική κατανόηση</text><rect x="80" y="225" width="940" height="91" rx="19" fill="#fff" stroke="#267568" stroke-width="2.5"/><circle cx="135" cy="270" r="25" fill="#267568"/><text x="135" y="278" text-anchor="middle" fill="#fff" font-weight="700" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="186" y="268" text-anchor="start" fill="#233d4f" font-weight="600" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">SOS · Διαστολή = γέμισμα κοιλιών· συστολή = εξώθηση αίματος· ο</text><text x="186" y="297" text-anchor="start" fill="#233d4f" font-weight="600" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">φλεβόκομβος είναι…</text><rect x="80" y="337" width="940" height="91" rx="19" fill="#edf4fa" stroke="#267568" stroke-width="2.5"/><circle cx="135" cy="382" r="25" fill="#267568"/><text x="135" y="390" text-anchor="middle" fill="#fff" font-weight="700" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="186" y="380" text-anchor="start" fill="#233d4f" font-weight="600" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Ο όγκος παλμού είναι η ποσότητα αίματος που εξωθεί μια κοιλία σε κάθε</text><text x="186" y="409" text-anchor="start" fill="#233d4f" font-weight="600" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">συστολή.</text><rect x="80" y="449" width="940" height="91" rx="19" fill="#fff" stroke="#267568" stroke-width="2.5"/><circle cx="135" cy="494" r="25" fill="#267568"/><text x="135" y="502" text-anchor="middle" fill="#fff" font-weight="700" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">3</text><text x="186" y="492" text-anchor="start" fill="#233d4f" font-weight="600" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Η καρδιακή παροχή είναι το γινόμενο όγκου παλμού και καρδιακής</text><text x="186" y="521" text-anchor="start" fill="#233d4f" font-weight="600" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">συχνότητας. Έτσι εξηγείται…</text><rect x="55" y="607" width="990" height="62" rx="14" fill="#e4eef7"/><text x="550" y="648" text-anchor="middle" fill="#267568" font-weight="650" font-size="20" font-family="DejaVu Sans,Arial,sans-serif">Σχηματική επεξήγηση · συνδύασέ τη με την πλήρη θεωρία.</text></svg>