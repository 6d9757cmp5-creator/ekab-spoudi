<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d">
<title id="t">Ηλεκτρική αγωγή της καρδιάς</title>
<desc id="d">Σχηματική μετωπιαία τομή καρδιάς με ερεθισματαγωγό σύστημα. Η ώση ξεκινά από τον φλεβόκομβο στον άνω δεξιό κόλπο, διαδίδεται στους κόλπους προς τον κολποκοιλιακό κόμβο και κατέρχεται από το δεμάτιο His και τους κλάδους στις ίνες Purkinje.</desc>
<defs><marker id="impulse" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a14d9b"/></marker></defs>
<rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="108" fill="#347e75"/>
<text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 07</text>
<text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Ερεθισματαγωγό σύστημα και καρδιακός κύκλος</text>
