<rect x="84" y="552" width="942" height="44" rx="12" fill="#f2eaf5"/>
<text x="555" y="571" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#57385e" text-anchor="middle">Κολποειδής ώση → κολποκοιλιακός κόμβος → δεμάτιο His και κλάδοι.</text>
<text x="555" y="590" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#57385e" text-anchor="middle">Οι ίνες Purkinje διανέμουν την ώση στο κοιλιακό μυοκάρδιο.</text>
