<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Κλήση 166: στοιχεία θέσης, συμβάντος και επανάκλησης</title><desc id="desc">Εκπαιδευτικό σχήμα κλήσης στο ΕΚΑΒ. Παρουσιάζει αριθμό τηλεφώνου επανάκλησης, περιοχή και διεύθυνση, χαρακτηριστικό σημείο, τι συνέβη, πόσα άτομα χρειάζονται βοήθεια και κατά προσέγγιση ηλικία και φύλο όπου είναι γνωστά. Δεν ορίζει σειρά ερωτήσεων· ακολουθήστε τον τηλεφωνητή.</desc><rect width="1100" height="680" fill="#f5f9fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#16394e}.head{font-size:34px;font-weight:bold}.sub{font-size:21px}.lab{font-size:24px;font-weight:700}.small{font-size:19px}.micro{font-size:16px}.guide{stroke:#276b8a;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.soft{fill:#e9f3f9;stroke:#8ab1c9;stroke-width:3}.white{fill:white;stroke:#a6c0ce;stroke-width:2}.gold{fill:#fff2dc;stroke:#d0a25b;stroke-width:2}.green{fill:#e5f5eb;stroke:#76af88;stroke-width:2}</style><text x="550" y="53" text-anchor="middle" class="head">Κλήση στο ΕΚΑΒ 166</text><text x="550" y="87" text-anchor="middle" class="sub">Στοιχεία κλήσης, χωρίς καθορισμένη σειρά — ακολουθήστε τον τηλεφωνητή</text>
