<rect x="93" y="476" width="280" height="59" rx="10" fill="white" stroke="#6a9baf"/><text x="233" y="499" text-anchor="middle" class="small">Οδός · αριθμός · όροφος</text><text x="233" y="522" text-anchor="middle" class="micro">Περιοχή και χαρακτηριστικό σημείο</text>
