<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Διακομιδές σε πολλά νοσοκομεία — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 10. Παρουσιάζονται: Βαρύτητα και ανάγκες θυμάτων; Δυνατότητες υποδοχής νοσοκομείων; Διαθέσιμα οχήματα. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="81" y="253" width="1015" height="469" rx="25" fill="#eaf3ef" stroke="#8aa79b" stroke-width="3"/><rect x="106" y="293" width="305" height="328" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="258" y="336" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΑΝΑΓΚΕΣ</text><circle cx="258" cy="415" r="37" fill="#4d7d70"/><g aria-hidden="true"><path d="M258 386L282 396V415C282 430 271 439 258 445C245 439 234 430 234 415V396Z" fill="none" stroke="#ffffff" stroke-width="5"/><path d="M246 411H270M258 399V423" stroke="#ffffff" stroke-width="5"/></g><text x="258" y="486" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Βαρύτητα και ανάγκες</text><text x="258" y="514" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">θυμάτων</text><rect x="443" y="293" width="305" height="328" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><g transform="translate(0,-35)"><text x="595" y="371" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΥΠΟΔΟΧΗ</text><circle cx="595" cy="450" r="37" fill="#4d7d70"/><g aria-hidden="true"><rect x="571" y="427" width="48" height="46" rx="4" fill="none" stroke="#ffffff" stroke-width="5"/><path d="M586 473V439H604V473M586 450H604M586 460H604" fill="none" stroke="#ffffff" stroke-width="4"/></g><text x="595" y="521" t