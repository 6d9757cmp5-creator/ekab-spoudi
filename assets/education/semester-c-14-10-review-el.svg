<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Υποψία κάκωσης σπονδυλικής στήλης — Επανέλεγχος και ασφάλεια</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 10. Παρουσιάζονται: Μακριά σανίδα για απεγκλωβισμό; Όχι σανίδα ως μέσο διακομιδής; Καταγραφή νευρολογικής εικόνας. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 10</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Υποψία κάκωσης σπονδυλικής στήλης</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Επανέλεγχος και ασφάλεια</text><rect x="59" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#a75749" stroke-width="3"/><circle cx="226" cy="351" r="54" fill="#f0edf9" stroke="#a75749" stroke-width="3"/><rect x="201" y="337" width="50" height="25" rx="5" fill="none" stroke="#a75749" stroke-width="4"/><path d="M211 338v24M241 338v24M194 351h7M251 351h7" fill="none" stroke="#a75749" stroke-width="4" stroke-linecap="round"/><text x="226" y="457" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="760" fill="#a75749">ΑΠΕΓΚΛΩΒΙΣΜΟΣ</text><text x="226" y="519" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">Μακριά σανίδα για</text><text x="226" y="547" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">απεγκλωβισμό</text><rect x="448" y="304" width="335" height="372" rx="24" fill="#f