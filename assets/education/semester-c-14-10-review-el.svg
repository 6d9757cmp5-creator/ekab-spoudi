<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Υποψία κάκωσης σπονδυλικής στήλης — Μεταφορά και τεκμηρίωση</title><desc id="d">Διακριτά σύμβολα για απεγκλωβισμό με σανίδα, μεταφορά με ασθενοφόρο και καταγραφή νευρολογικών ευρημάτων. Σχηματική εκπαιδευτική απεικόνιση, όχι αυτόνομο πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#fff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 10</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#fff">Υποψία κάκωσης σπονδυλικής στήλης</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Μεταφορά και τεκμηρίωση</text><rect x="59" y="260" width="335" height="372" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><circle cx="226.5" cy="420" r="68" fill="#f0edf9" stroke="#a75749" stroke-width="3"/><rect x="448" y="260" width="335" height="372" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><circle cx="615.5" cy="420" r="68" fill="#f0edf9" stroke="#a75749" stroke-width="3"/><rect x="837" y="260" width="335" height="372" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><circle cx="1004.5" cy="420" r="68" fill="#f0edf9" stroke="#a75749" stroke-width="3"/><rect x="208" y="355" width="36" height="125" rx="8" fill="#e8f1f7" stroke="#506b82" stroke-width="5"/><path d="M216 365h20m-20 15h20m-20 15h20m-20 15h20m-20 15h20m-20 15h20" stroke="#a75749" stroke-width="4"/><path d="M565 435h87v-34h-33l-17-19h-37z" fill="#e8f1f7" stroke="#506b82" stroke-width="5" stroke-linejoin="round"/><circle cx="583" cy="438" r="9" fill="#a75749"/><circle cx="631" cy="438" r="9" fill="#a75749"/><path d="M603 399v26m-13-13h26" stroke="#a7