<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 656" role="img" aria-labelledby="t d"><title id="t">Ειδικές ομάδες: ηλικιωμένος, έγκυος, παιδί — Αναγνώριση κρίσιμων σημείων</title><desc id="d">Τρία διαφορετικά σχηματικά αντικείμενα: τροχήλατο φορείο, ιμάντας με πόρπη συγκράτησης και διπλωμένη κουβέρτα θερμικής προστασίας. Τα βέλη δείχνουν στο πλαίσιο του φορείου, στην πόρπη και στην κουβέρτα. Δεν δείχνει τοποθέτηση ασθενούς, εφαρμογή ιμάντα ή επιλογή εξοπλισμού για ειδική ομάδα ασθενών.</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#297382"/></marker></defs><rect width="1110" height="656" fill="#f9fbfd"/><rect width="1110" height="120" fill="#297382"/><text x="555" y="33" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ffffff" font-weight="680" text-anchor="middle">Δ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 17 · ΚΕΦΑΛΑΙΟ 13</text><text x="555" y="81" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#ffffff" font-weight="750" text-anchor="middle">Ειδικές ομάδες: ηλικιωμένος, έγκυος, παιδί</text><circle cx="198" cy="334" r="88" fill="#edf5fa" stroke="#297382" stroke-width="2.7"/><g transform="translate(198 334)" fill="none" stroke="#297382" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-66" y="-14" width="132" height="29" rx="7" fill="#fff"/><path d="M-72 20H72M-44 20L35 49M44 20L-35 49M-46 51H46"/><circle cx="-44" cy="62" r="9" fill="#fff"/><circle cx="44" cy="62" r="9" fill="#fff"/></g><path d="M198 513L198 385" stroke="#297382" stroke-width="3.7" marker-end="url(#arrow)"/><rect x="45" y="521" width="306" height="96" rx="17" fill="#fff" stroke="#297382" stroke-width="2"/><text x="198" y="562" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#243f54" font-weight="700" text-anchor="middle">Φορείο</text><circle cx="555" cy="334" r="88" fill="#edf5fa" stroke="#297382" stroke-width="2.7"/><g transform="transl