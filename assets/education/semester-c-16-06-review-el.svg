<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Εγκεφαλικό: αναγνώριση και χρόνος — Επανέλεγχος και ασφάλεια</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 6. Παρουσιάζονται: Καταγραφή ακριβούς ώρας; Έγκαιρη διακομιδή; Προειδοποίηση νοσοκομείου. Εκπαιδευτική σύνοψη, όχι εντολή για κέντρο υποδοχής. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="59" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#64569b" stroke-width="3"/><circle cx="226" cy="351" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><circle cx="226" cy="351" r="29" fill="none" stroke="#64569b" stroke-width="5"/><path d="M226 351v-18m0 18l15 8" stroke="#64569b" stroke-width="5" stroke-linecap="round"/><path d="M247 331l8 1-4 7" fill="none" stroke="#64569b" stroke-width="4"/><text x="226" y="457" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="760" fill="#64569b">ΧΡΟΝΟΣ</text><text x="226" y="519" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">Καταγραφή ακριβούς ώρας</text><rect x="448" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#64569b" stroke-width="3"/><circle cx="615" cy="351" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><circle cx="615" cy="351" r="24" fill="none" stroke="#64569b" stroke-width="5"/><circle cx="615" cy="340" r="7" fill="none" stroke="#64569b" stroke-width="4"/><path d="M615 348v21m0-12l-12 8m12-8l12 7m-12 5l-9 13m9-13l9 13" fill="none" stroke="#64569b" stroke-width="4" stroke-linecap="round"/><text x="615" y="457" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="760" fill="#64569b">ΔΙΑΚΟΜΙΔΗ</text><text x="615" y="519" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fo