<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Ασθενής, διασώστης και ασθενοφόρο στην προνοσοκομειακή φροντίδα</title><desc id="d">Τρία διακριτά αντικείμενα αναγνώρισης: ασθενής σε φορείο, διασώστης με διακριτικό σταυρό και ασθενοφόρο. Τα βέλη δείχνουν μόνο τις ετικέτες, όχι κατεύθυνση ή διαδικασία φροντίδας.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#735998"/></marker></defs><rect width="1200" height="700" fill="#f9fbfd"/><rect width="1200" height="112" fill="#735998"/><text x="600" y="39" fill="#fff" font-family="DejaVu Sans,Arial" font-size="18" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 03 · ΚΕΦΑΛΑΙΟ 01</text><text x="600" y="80" fill="#fff" font-family="DejaVu Sans,Arial" font-size="25" font-weight="700" text-anchor="middle">Ρόλοι και μέσα στην προνοσοκομειακή φροντίδα</text><circle cx="200" cy="300" r="92" fill="#eef4f8" stroke="#735998" stroke-width="3"/><circle cx="600" cy="300" r="92" fill="#eef4f8" stroke="#735998" stroke-width="3"/><circle cx="1000" cy="300" r="92" fill="#eef4f8" stroke="#735998" stroke-width="3"/><g transform="translate(200 300)" stroke="#4e6780" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-62 34H61M-49 37v13m47-13v13m39-13v13"/><circle cx="-39" cy="-21" r="17" fill="#d8c6a2" stroke="#946c47"/><path d="M-20-22Q-4-32 11-20L28-7L18 12L-1 11L-18 1"/><path d="M-18 3L-31 23M11 11L25 24"/></g><g transform="translate(600 300)" stroke="#4e6780" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="0" cy="-42" r="18" fill="#d8c6a2" stroke="#946c47"/><path d="M-25-15Q0-29 25-15L34 24H-34Z" fill="#dbe8ef"/><path d="M-24-10L-49 12M24-10L49 12M-17 24L-25 55M17 24L25 55"/><path d="M0-6V14M-10 4H10" stroke="#b65050" stroke-width="7"/></g><g transform="translate(1000 300)" stroke="#4e6780" stroke-width="5" stroke-linec