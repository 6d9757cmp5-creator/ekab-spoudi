<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Κανάλι, μεταφορέας και αντλία στη μεμβράνη</title><desc id="d">Τρεις τρόποι μεταφοράς: κανάλι και μεταφορέας διευκολύνουν παθητική κίνηση κατά βαθμίδα συγκέντρωσης· η αντλία νατρίου-καλίου χρησιμοποιεί ATP και κινεί 3 Na⁺ προς τα έξω και 2 K⁺ προς τα μέσα. Σχηματικό και όχι σε κλίμακα.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347e75"/></marker><marker id="pass" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" height="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397b82"/></marker><marker id="active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" height="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba6b42"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#347e75"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="555" y="30" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 05</text><text x="555" y="72" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Μεμβράνες και μεταφορά ουσιών</text>
<text x="555" y="160" font-size="16" fill="#253f52" text-anchor="middle">Εξωκυττάριος χώρος</text><text x="555" y="485" font-size="16" fill="#253f52" text-anchor="middle">Κυτταρόπλασμα</text>
