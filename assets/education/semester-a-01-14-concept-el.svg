<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Ανατομικοί χώροι και τεταρτημόρια κοιλιάς — αναγνώριση</title><desc id="d">Πρόσθιος κορμός με τεταρτημόριο επισημασμένο στη σωστή πλευρά του ασθενούς. Οι πλευρές ορίζονται από την πλευρά του ασθενούς σε πρόσθια όψη.</desc><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d6f91"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#2d6f91"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ffffff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 01 · ΚΕΦΑΛΑΙΟ 14</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#ffffff" font-weight="720" text-anchor="middle">Ανατομικοί χώροι και τεταρτημόρια κοιλιάς</text><text x="555" y="149" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#38576b" font-weight="650" text-anchor="middle">ΠΡΟΣΘΙΑ ΟΨΗ · ΔΕΞΙΑ ΤΟΥ ΑΣΘΕΝΟΥΣ ΒΡΙΣΚΕΤΑΙ ΑΡΙΣΤΕΡΑ ΣΤΗΝ ΕΙΚΟΝΑ</text><circle cx="197" cy="299" r="85" fill="#eef4f8" stroke="#2d6f91" stroke-width="2.4"/><g transform="translate(197 299)"><path d="M-9-53V-43Q-19-42-29-49Q-38-47-43-35L-34-28L-27-33L-25-10L-27 46Q0 57 27 46L25-10L27-33L34-28L43-35Q38-47 29-49Q19-42 9-43V-53" fill="#f5e7df" stroke="#2d6f91" stroke-width="3" stroke-linejoin="round"/><rect x='-24' y='-8' width='24' height='27' fill='#bfe3ef'/><path d="M0-8V46M-25 19H25" fill="none" stroke="#527f97" stroke-width="2.5"/><path d="M-25-8H25" fill="none" stroke="#527f97" stroke-width="2.5"/></g><path d="M197 478L184 309" stroke="#2d6f91" stroke-width="3" marker-end="url(#arr)"/><rect x="48" y="487" width="298" height="93" rx="17" fill="#ffffff" stroke="#2d6f91" stroke-width="2"/><text x="197" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#253f52" font-weight="700" text