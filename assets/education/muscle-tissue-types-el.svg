<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="720" viewBox="0 0 1140 720" role="img" aria-labelledby="title desc">
<title id="title">Τρεις βασικοί τύποι μυϊκού ιστού</title>
<desc id="desc">Τρεις σχηματικές μικροσκοπικές όψεις με ελληνικές επισημάνσεις: σκελετικός γραμμωτός με πολλές περιφερικές πυρηνικές δομές, καρδιακός γραμμωτός με διακλαδώσεις και εμβόλιμους δίσκους, λείος ατρακτοειδής χωρίς γραμμώσεις.</desc>
