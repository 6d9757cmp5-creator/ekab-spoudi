<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 656" role="img" aria-labelledby="t d"><title id="t">Νευρολογικό επείγον — Πρόσωπο, άνω άκρο και ομιλία</title><desc id="d">Σχηματικά διακριτά σημεία FAST: πρόσωπο με ασυμμετρία, δύο άνω άκρα με άνιση θέση και σύμβολο ομιλίας. Τα βέλη δείχνουν τις αντίστοιχες έννοιες. Δεν διαγιγνώσκει εγκεφαλικό και δεν αποτελεί πρωτόκολλο.</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#297382"/></marker></defs><rect width="1110" height="656" fill="#f9fbfd"/><rect width="1110" height="120" fill="#297382"/><text x="555" y="33" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ffffff" font-weight="680" text-anchor="middle">Δ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 17 · ΚΕΦΑΛΑΙΟ 12</text><text x="555" y="81" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#ffffff" font-weight="750" text-anchor="middle">Αντιμετώπιση νευρολογικού επειγόντος: προσομοίωση</text><circle cx="198" cy="334" r="88" fill="#edf5fa" stroke="#297382" stroke-width="2.7"/><g transform="translate(198 334)" fill="none" stroke="#297382" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0-52C-25-52-39-34-39-9c0 27 16 48 39 56 23-8 39-29 39-56C39-34 25-52 0-52Z"/><path d="M-21-18q9-8 18 0m6 0q9-8 18 0M0-11v19m-20 6q12-5 20 2t20-2"/></g><path d="M198 513L198 398" stroke="#297382" stroke-width="3.7" marker-end="url(#arrow)"/><rect x="45" y="521" width="306" height="96" rx="17" fill="#fff" stroke="#297382" stroke-width="2"/><text x="198" y="562" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#243f54" font-weight="700" text-anchor="middle">Πρόσωπο</text><circle cx="555" cy="334" r="88" fill="#edf5fa" stroke="#297382" stroke-width="2.7"/><g transform="translate(555 334)" fill="none" stroke="#297382" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0-36v70M0-19l-19-18h-22v-12h26l15 14m0 16 18-1