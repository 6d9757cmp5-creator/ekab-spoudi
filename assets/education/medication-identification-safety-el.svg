<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Ασφάλεια φαρμάκων: αναγνώριση ασθενούς και συσκευασίας</title><desc id="desc">Σχηματικός πάγκος φαρμακευτικού ελέγχου με αναγνωριστικό ασθενούς, εμφανή ετικέτα σκευάσματος χωρίς πραγματικό όνομα φαρμάκου, καταχώριση γνωστών αλλεργιών και σήμανση της οδού, του χρόνου και της καταγραφής. Δεν είναι οδηγία χορήγησης ή έγκριση πράξεων.</desc><rect width="1200" height="720" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#183d54}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.line{fill:none;stroke:#53839d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#abc6d4;stroke-width:3}</style>
<text x="600" y="51" class="h" text-anchor="middle">Ασφάλεια φαρμάκων · πριν από κάθε πράξη</text>
<text x="600" y="87" class="s" text-anchor="middle">Εκπαιδευτικό σχήμα ταυτοποίησης — όχι ατομική οδηγία χορήγησης</text>
