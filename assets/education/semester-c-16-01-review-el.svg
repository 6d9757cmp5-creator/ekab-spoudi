<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Γιατί χρησιμοποιούμε πρωτόκολλα — Επανέλεγχος και ασφάλεια</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 1. Παρουσιάζονται: Μείωση πιθανών παραλείψεων; Επανεκτίμηση ασθενούς; Πρωτόκολλο δεν αντικαθιστά κρίση. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="59" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#64569b" stroke-width="3"/><circle cx="226" cy="351" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><rect x="201" y="321" width="50" height="60" rx="5" fill="#ffffff" stroke="#64569b" stroke-width="4"/><path d="M208 336l4 4 7-8m6 4h18M208 352l4 4 7-8m6 4h18M208 368l4 4 7-8m6 4h18" fill="none" stroke="#64569b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="457" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="760" fill="#64569b">ΠΛΗΡΟΤΗΤΑ</text><text x="226" y="519" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">Μείωση πιθανών παραλείψεων</text><rect x="448" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#64569b" stroke-width="3"/><circle cx="615" cy="351" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><circle cx="615" cy="334" r="9" fill="none" stroke="#64569b" stroke-width="4"/><path d="M598 378q1-23 17-23t17 23M580 347a36 36 0 0 1 24-29m-8 1 9-1-2 9M650 355a36 36 0 0 1-23 28m8 0-9 1 2-9" fill="none" stroke="#64569b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="615" y="457" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="760" fill="#64569b">ΕΠΑΝΕΚΤΙΜΗΣΗ</text><text x="615" y="519" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">Επανεκτίμηση ασθενούς</text><rect x="837" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#64569b" stroke-width="3"/><circle cx="1004" cy="351" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><circle cx="1004" cy="334" r="18" fill="none" stroke="#64569b" stroke-width="4"/><path d="M973 390q2-31 31-31t31 31M995 330q9-7 17 0m-17 9q9 7 17 0m-8-14v19" fill="none" stroke="#64569b" stroke-width="3.5" stroke-linecap="round"/><text x="1004" y="457" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="760" fill="#64569b">ΑΝΘΡΩΠΙΝΗ ΚΡΙΣΗ</text><text x="1004" y="519" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" fill="#213f53">Πρωτόκολλο δεν αντικαθιστά</text><text x="1004" y="547" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">κρίση</text></svg>