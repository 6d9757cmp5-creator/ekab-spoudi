<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Θωρακικό τραύμα και αναπνευστική δυσχέρεια — Σημεία αναγνώρισης</title><desc id="d">Τρεις διακριτές θεματικές κάρτες: σύγκρουση οχημάτων, πτώση από ύψος και διεισδυτική κάκωση. Σχηματική εκπαιδευτική απεικόνιση, όχι κλινικό πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#fff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 07</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#fff">Θωρακικό τραύμα και αναπνευστική δυσχέρεια</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Σημεία αναγνώρισης</text><rect x="46" y="250" width="340" height="465" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="420" y="250" width="340" height="465" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="794" y="250" width="340" height="465" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><circle cx="216" cy="405" r="92" fill="#f5ebe7" stroke="#a75749" stroke-width="3"/><circle cx="590" cy="405" r="92" fill="#f5ebe7" stroke="#a75749" stroke-width="3"/><circle cx="964" cy="405" r="92" fill="#f5ebe7" stroke="#a75749" stroke-width="3"/><path d="M183 374q33-18 66 0v62q-33 18-66 0z" fill="#e8f1f7" stroke="#506b82" stroke-width="5"/><path d="M205 394l10 11-10 10 11 10" fill="none" stroke="#a75749" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M549 365q41 30 82 0v80q-41-30-82 0z" fill="none" stroke="#506b82" stroke-width="6" stroke-linejoin="round"/><path d="M532 395h-17m150 0h17m-150 22h-17m150 0h17" stroke="#a75749" stroke-width="5" stroke-linecap="round"/><path d="M914 420h24l14