<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Κακώσεις άκρων και υποθερμία — Συσχέτιση και εξήγηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 14, κεφάλαιο 4: Η επιλογή μέσου ακινητοποίησης προσαρμόζεται στο άκρο και στον μηχανισμό.; Σε εκπαιδευτικό σενάριο σχετικό με «Κακώσεις άκρων και υποθερμία»; Ο μηχανισμός κάκωσης ενισχύει την υποψία, δεν αποτελεί διάγνωση.. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#a55c4d"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦ. 04</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Κακώσεις άκρων και υποθερμία</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">Συσχέτιση και εξήγηση</text><path d="M112 388H999" stroke="#a55c4d" stroke-width="7"/><circle cx="190" cy="388" r="58" fill="#ebf3f8" stroke="#a55c4d" stroke-width="4"/><text x="190" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">1</text><rect x="41" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#a55c4d" stroke-width="2.6"/><text x="190" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η επιλογή μέσου</text><text x="190" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ακινητοποίησης</text><text x="190" y="587" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">προσαρμόζεται στο άκρο</text><text x="190" y="613" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">και στον μηχανισμό.</text><circle cx="550" cy="388" r="58" fill="#ebf3f8" stroke="#a55c4d" stroke-width="4"/><text x="550" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">2</text><rect x="401" y="240" width="298" height="151" rx="19" fill="#ffffff" stroke="#a55c4d" stroke-width="2.6"/><text x="550" y="278" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Σε εκπαιδευτικό σενάριο</text><text x="550" y="304" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">σχετικό με «Κακώσεις</text><text x="550" y="330" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">άκρων και υποθερμία»</text><circle cx="910" cy="388" r="58" fill="#ebf3f8" stroke="#a55c4d" stroke-width="4"/><text x="910" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">3</text><rect x="761" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#a55c4d" stroke-width="2.6"/><text x="910" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Ο μηχανισμός κάκωσης</text><text x="910" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ενισχύει την υποψία, δεν</text><text x="910" y="587" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">αποτελεί διάγνωση.</text><rect x="53" y="733" width="1005" height="40" rx="12" fill="#e5edf3"/><text x="555" y="760" font-size="16" font-weight="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">Σχηματική εικόνα από τη θεωρία · όχι αυτόνομο κλινικό ή υπηρεσια