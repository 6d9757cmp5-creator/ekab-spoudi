<title id="t">Διαλογή και ιεράρχηση κλήσεων — τρία σημεία αναγνώρισης</title>
<desc id="d">Τρία περιγραφικά σημεία προς αναγνώριση χωρίς αριθμημένη σειρά ή οδηγίες αντιμετώπισης: αλλαγή συνείδησης, απουσία φυσιολογικής αναπνοής και μεγάλη εξωτερική αιμορραγία. Διδακτικό σχήμα, όχι αυτόνομο πρωτόκολλο.</desc>
