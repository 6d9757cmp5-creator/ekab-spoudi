<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Θώρακας, κεφαλή και σπονδυλική στήλη — Επανέλεγχος και ασφάλεια</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 3. Παρουσιάζονται: Αεραγωγός κατά προτεραιότητα; Ακριβής παράδοση ευρημάτων; Εξατομικευμένη προσέγγιση. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 03</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Θώρακας, κεφαλή και σπονδυλική στήλη</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Επανέλεγχος και ασφάλεια</text><rect x="59" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#a75749" stroke-width="3"/><circle cx="226" cy="351" r="54" fill="#f0edf9" stroke="#a75749" stroke-width="3"/><path d="M226 333v25m0-8-18 18m18-18 18 18" fill="none" stroke="#a75749" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="457" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="760" fill="#a75749">ΕΛΕΓΧΟΣ 1</text><text x="226" y="519" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">Αεραγωγός κατά</text><text x="226" y="550" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">προτεραιότητα</text><rect x="448" y="304" width="335" height="372" rx="24" fill="#ffffff" stroke="#a75749" stroke-width="3"/><circle cx="615" cy="395" r="54" fill="#f0edf9" strok