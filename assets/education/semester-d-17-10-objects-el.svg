<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 656" role="img" aria-labelledby="t d"><title id="t">Υποστήριξη αερισμού: ασκός-μάσκα, προσωπίδα και αεραγωγός</title><desc id="d">Πρωτότυπη σχηματική απεικόνιση τριών διαφορετικών δομών: αυτοδιατεινόμενος ασκός με βαλβίδα και προσωπίδα, μεμονωμένη μάσκα προσώπου, και απλουστευμένη πορεία του αεραγωγού. Τα βέλη δείχνουν τις αντίστοιχες δομές. Δεν είναι πιστή ανατομική τομή, δεν απεικονίζει τεχνική εφαρμογής ή αναλογίες εξοπλισμού.</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#246d7d"/></marker></defs><rect width="1110" height="656" fill="#f8fbfd"/><rect width="1110" height="112" fill="#246d7d"/><g font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle"><text x="555" y="32" font-size="18" fill="white">Δ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 17 · ΚΕΦΑΛΑΙΟ 10</text><text x="555" y="78" font-size="27" fill="white" font-weight="700">Υποστήριξη αερισμού — αναγνώριση βασικών μερών</text></g><g fill="#fff" stroke="#c0d4dd" stroke-width="2"><rect x="34" y="142" width="335" height="351" rx="24"/><rect x="386" y="142" width="335" height="351" rx="24"/><rect x="738" y="142" width="335" height="351" rx="24"/></g><g stroke="#327b8a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M107 305C122 276 222 276 239 305C259 332 259 355 239 380C218 398 129 398 107 380C88 355 88 331 107 305Z" fill="#cfe7ef"/><path d="M135 293L135 391M166 289L166 394M197 290L197 394M225 295L225 391" stroke="#a8d1df" stroke-width="3"/><rect x="244" y="321" width="43" height="50" rx="9" fill="#e6eef4"/><path d="M287 330L318 307L348 346L316 380L287 363Z" fill="#dff2f3"/><path d="M307 327L330 347L307 365" fill="none" stroke="#83b6b9" stroke-width="4"/></g><g stroke="#327b8a" stroke-width="5" stroke-linejoin="round"><path d="M550 248C505 260 489 303 498 344C504 378 528 400 554 400C583 400 607 375 613 343C617 298 595 261 550 248Z" fill="#def1f