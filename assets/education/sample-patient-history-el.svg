<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">SAMPLE: συστηματική συλλογή ιστορικού</title><desc id="desc">Οπτικό διάγραμμα έξι στοιχείων λήψης ιστορικού: σημεία ή συμπτώματα, αλλεργίες, φάρμακα, παρελθόν νοσημάτων, τελευταία πρόσληψη τροφής και γεγονότα πριν από το συμβάν.</desc><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173c51}.h{font-size:34px;font-weight:700}.sub{font-size:20px}.label{font-size:24px;font-weight:700}.small{font-size:19px}.card{fill:#fff;stroke:#b5cad6;stroke-width:2.4}.line{stroke:#527f95;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}</style><rect width="1200" height="790" fill="#f3f8fb"/><text x="600" y="54" text-anchor="middle" class="h">Ιστορικό ασθενούς · SAMPLE</text><text x="600" y="88" text-anchor="middle" class="sub">Έξι στοιχεία που βοηθούν να οργανώσουμε τις ερωτήσεις</text><g transform="translate(30 126)"><rect width="550" height="179" rx="22" class="card"/><rect x="15" y="14" width="182" height="150" rx="14" fill="#edf5fa"/><g transform="translate(12 10)"><path d='M20 62H52L72 27L90 102L110 63H154' class='line'/></g><circle cx="190" cy="28" r="25" fill="#318199"/><text x="190" y="37" text-anchor="middle" style="fill:white;font-size:27px;font-weight:700">S</text><text x="225" y="48" class="label">Σημεία / συμπτώματα</text><text x="220" y="103" class="small">Τι αισθάνεται ο ασθενής;</text><text x="220" y="144" class="small">Καταγραφή με ακρίβεια</text></g><g transform="translate(620 126)"><rect width="550" height="179" rx="22" class="card"/><rect x="15" y="14" width="182" height="150" rx="14" fill="#edf5fa"/><g transform="translate(12 10)"><path d='M93 23L139 42V89L93 113L47 89V42Z' fill='#fce3e4' stroke='#bf6677' stroke-width='5'/><path d='M93 45V83M73 64H113' stroke='#bf6677' stroke-width='5'/></g><circle cx="190" cy="28" r="25" fill="#318199"/><text x="190" y="37" text-anchor="middle" style="fill:white;font-size:27px;font-weight:700">A</text><text x="225" y="48" class="label">Αλλεργίες</text><text x="220" y="103" class="small">Φάρμακα, τροφές ή ουσίες</text><text x="220" y="144" class="small">Καταγραφή με ακρίβεια</text></g><g transform="translate(30 330)"><rect width="550" height="179" rx="22" class="card"/><rect x="15" y="14" width="182" height="150" rx="14" fill="#edf5fa"/><g transform="translate(12 10)"><rect x='36' y='40' width='113' height='63' rx='26' fill='#dbeef3' stroke='#4685a0' stroke-width='5'/><path d='M91 40V103' stroke='#4685a0' stroke-width='5'/></g><circle cx="190" cy="28" r="25" fill="#318199"/><text x="190" y="37" text-anchor="middle" style="fill:white;font-size:27px;font-weight:700">M</text><text x="225" y="48" class="label">Φάρμακα</text><text x="220" y="103" class="small">Συνταγογραφούμενα ή άλλα</text><text x="220" y="144" class="small">Καταγραφή με ακρίβεια</text></g><g transform="translate(620 330)"><rect width="550" height="179" rx="22" class="card"/><rect x="15" y="14" width="182" height="150" rx="14" fill="#edf5fa"/><g transform="translate(12 10)"><rect x='44' y='20' width='100' height='108' rx='13' fill='#e7e7f5' stroke='#7c75aa' stroke-width='5'/><path d='M64 49H124M64 73H124M64 97H104' stroke='#7c75aa' stroke-width='5'/></g><circle cx="190" cy="28" r="25" fill="#318199"/><text x="190" y="37" text-anchor="middle" style="fill:white;font-size:27px;font-weight:700">P</text><text x="225" y="48" class="label">Ιατρικό παρελθόν</text><text x="220" y="103" class="small">Παθήσεις και επεμβάσεις</text><text x="220" y="144" class="small">Καταγραφή με ακρίβεια</text></g><g transform="translate(30 534)"><rect width="550" height="179" rx="22" class="card"/><rect x="15" y="14" width="182" height="150" rx="14" fill="#edf5fa"/><g transform="translate(12 10)"><ellipse cx='91' cy='70' rx='64' ry='29' fill='#e5f1d4' stroke='#7d9c63' stroke-width='5'/><path d='M42 38H139M56 25H124' stroke='#7d9c63' stroke-width='5'/></g><circle cx="190" cy="28" r="25" fill="#318199"/><tex