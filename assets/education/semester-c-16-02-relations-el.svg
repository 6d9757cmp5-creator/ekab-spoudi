<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Καταγραφή κρίσιμων αλλαγών — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 2. Παρουσιάζονται: Επιτρεπόμενες παρεμβάσεις; Ανταπόκριση σε ενέργειες; Παράδοση σε ΤΕΠ. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#64569b"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦΑΛΑΙΟ 02</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Καταγραφή κρίσιμων αλλαγών</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#64569b">Σχέσεις και προτεραιότητες</text><circle cx="200" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><path d="M200 367L226 378V397C226 412 214 422 200 428C186 422 174 412 174 397V378Z" fill="none" stroke="#64569b" stroke-width="5" stroke-linejoin="round"/><path d="M187 397L197 407L214 388" fill="none" stroke="#64569b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="42" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="200" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Επιτρεπόμενες παρεμβάσεις</text><circle cx="590" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><path d="M561 399H612M600 387L612 399L600 411M619 399H568M580 387L568 399L580 411" fill="none" stroke="#64569b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="432" y="515" width="316" height="169" rx="21" fill="#ffffff" stro