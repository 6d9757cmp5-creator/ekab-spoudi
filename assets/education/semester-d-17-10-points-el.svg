<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 656" role="img" aria-labelledby="t d"><title id="t">Συνεργασία για υποστήριξη αερισμού — Αναγνώριση κρίσιμων σημείων</title><desc id="d">Σχηματική αναγνώριση μάσκας σε πρόσωπο με περίγραμμα επαφής, ανύψωσης θώρακα με βέλη κίνησης και βατότητας αεραγωγού, με τρία αντίστοιχα βέλη: Στεγανότητα μάσκας; Ανύψωση θώρακα; Βατός αεραγωγός. Δεν αποτελεί κλινικό ή τεχνικό πρωτόκολλο.</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#297382"/></marker></defs><rect width="1110" height="656" fill="#f9fbfd"/><rect width="1110" height="120" fill="#297382"/><text x="555" y="33" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ffffff" font-weight="680" text-anchor="middle">Δ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 17 · ΚΕΦΑΛΑΙΟ 10</text><text x="555" y="81" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#ffffff" font-weight="750" text-anchor="middle">Συνεργασία για υποστήριξη αερισμού</text><circle cx="198" cy="334" r="88" fill="#edf5fa" stroke="#297382" stroke-width="2.7"/><g transform="translate(198 334)" fill="none" stroke="#297382" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-4" rx="49" ry="64" fill="#f6fafc" stroke="#9bc4d3"/><path d="M0-31C-12-27-34-2-32 19Q-28 43 0 45Q28 43 32 19C34-2 12-27 0-31Z" fill="#d8edf1"/><path d="M0-20C-9-15-23 3-23 19Q-20 34 0 35Q20 34 23 19C23 3 9-15 0-20Z" stroke="#629da9" stroke-dasharray="4 5"/><circle cx="0" cy="8" r="9" fill="#fff"/></g><path d="M198 513L198 373" stroke="#297382" stroke-width="3.7" marker-end="url(#arrow)"/><rect x="45" y="521" width="306" height="96" rx="17" fill="#fff" stroke="#297382" stroke-width="2"/><text x="198" y="562" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#243f54" font-weight="700" text-anchor="middle">Στεγανότητα μάσκας</text><circle cx="555" cy="334" r="88" fill="#edf5fa" stroke="#2973