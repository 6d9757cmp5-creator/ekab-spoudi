<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 656" role="img" aria-labelledby="t d"><title id="t">Συνεργασία για υποστήριξη αερισμού — Αναγνώριση κρίσιμων σημείων</title><desc id="d">Σχηματική αναγνώριση στεγανότητας μάσκας, ανύψωσης θώρακα με βέλη κίνησης και πνευμόνων, με τρία αντίστοιχα βέλη: Στεγανότητα μάσκας; Ανύψωση θώρακα; Πνεύμονες. Δεν αποτελεί κλινικό ή τεχνικό πρωτόκολλο.</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#297382"/></marker></defs><rect width="1110" height="656" fill="#f9fbfd"/><rect width="1110" height="120" fill="#297382"/><text x="555" y="33" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ffffff" font-weight="680" text-anchor="middle">Δ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 17 · ΚΕΦΑΛΑΙΟ 10</text><text x="555" y="81" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#ffffff" font-weight="750" text-anchor="middle">Συνεργασία για υποστήριξη αερισμού</text><circle cx="198" cy="334" r="88" fill="#edf5fa" stroke="#297382" stroke-width="2.7"/><g transform="translate(198 334)" fill="none" stroke="#297382" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-39 31q-17-26 0-48q39-24 78 0q17 22 0 48q-39 24-78 0Z"/><path d="M0-19v-33m0 9q-42-23-42-3t42 12q42-28 42-12"/></g><path d="M198 513L198 364" stroke="#297382" stroke-width="3.7" marker-end="url(#arrow)"/><rect x="45" y="521" width="306" height="96" rx="17" fill="#fff" stroke="#297382" stroke-width="2"/><text x="198" y="562" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#243f54" font-weight="700" text-anchor="middle">Στεγανότητα μάσκας</text><circle cx="555" cy="334" r="88" fill="#edf5fa" stroke="#297382" stroke-width="2.7"/><g transform="translate(555 334)" stroke="#297382" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-47q20-9 40 0l7 18 26 15q8 5 5 18l-14 47h-88L-58 4q-3-13 5-18l26-15Z" fill="#e7f2