<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Κοινωνικοί προσδιοριστές υγείας και διαδρομές επίδρασης</title><desc id="desc">Τρεις ενδεικτικές αιτιώδεις διαδρομές: στέγαση προς έκθεση σε κινδύνους, μετακίνηση προς πρόσβαση σε υπηρεσίες, εργασία προς επαγγελματική έκθεση. Καταλήγουν σε επιπτώσεις στην υγεία χωρίς να υπονοούν ντετερμινιστική σχέση.</desc><rect width="1120" height="650" fill="#f6fafc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#17394d}.head{font-size:31px;font-weight:700}.step{font-size:23px;font-weight:700}.small{font-size:19px}.box{fill:#fff;stroke:#9ebccf;stroke-width:2.5}.mid{fill:#eaf4fb;stroke:#86b3d0;stroke-width:2.5}.out{fill:#e4f4e9;stroke:#7daf90;stroke-width:2.5}.arrow{stroke:#2d7898;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="560" y="52" text-anchor="middle" class="head">Κοινωνικοί προσδιοριστές της υγείας</text><text x="560" y="87" text-anchor="middle" class="small">Παραδείγματα διαδρομών που επηρεάζουν την υγεία πληθυσμών</text><text x="195" y="132" text-anchor="middle" class="step">Συνθήκη ζωής</text><text x="550" y="132" text-anchor="middle" class="step">Ενδιάμεσος μηχανισμός</text><text x="930" y="132" text-anchor="middle" class="step">Πιθανή επίδραση</text>
<g><rect x="30" y="165" width="330" height="104" rx="18" class="box"/><text x="195" y="209" text-anchor="middle" class="step">Στέγαση</text><text x="195" y="239" text-anchor="middle" class="small">Υγρασία, αερισμός</text><rect x="395" y="165" width="330" height="104" rx="18" class="mid"/><text x="560" y="209" text-anchor="middle" class="step">Έκθεση</text><text x="560" y="239" text-anchor="middle" class="small">σε ερεθιστικούς παράγοντες</text><rect x="760" y="165" width="330" height="104" rx="18" class="out"/><text x="925" y="209" text-anchor="middle" class="step">Αναπνευστική υγεία</text><text x="925" y="239" text-anchor="middle" class="small">ενδεικτική συσχέτιση</text></g>
<g><rect x="30" y="310" width="330" height="104" rx="18" class="box"/><text x="195" y="354" text-anchor="middle" class="step">Μετακίνηση</text><text x="195" y="384" text-anchor="middle" class="small">Διαθέσιμα μέσα</text><rect x="395" y="310" width="330" height="104" rx="18" class="mid"/><text x="560" y="354" text-anchor="middle" class="step">Πρόσβαση</text><text x="560" y="384" text-anchor="middle" class="small">σε υπηρεσίες υγείας</text><rect x="760" y="310" width="330" height="104" rx="18" class="out"/><text x="925" y="354" text-anchor="middle" class="step">Έγκαιρη φροντίδα</text><text x="925" y="384" text-anchor="middle" class="small">ή καθυστέρηση</text></g>
<g><rect x="30" y="455" width="330" height="104" rx="18" class="box"/><text x="195" y="499" text-anchor="middle" class="step">Συνθήκες εργασίας</text><text x="195" y="529" text-anchor="middle" class="small">Περιβάλλον, προστασία</text><rect x="395" y="455" width="330" height="104" rx="18" class="mid"/><text x="560" y="499" text-anchor="middle" class="step">Επαγγελματικός</text><text x="560" y="529" text-anchor="middle" class="small">κίνδυνος</text><rect x="760" y="455" width="330" height="104" rx="18" class="out"/><text x="925" y="499" text-anchor="middle" class="step">Τραυματισμοί</text><text x="925" y="529" text-anchor="middle" class="small">και νοσηρότητα</text></g>
<path d="M365 217h23m-10-10 10 10-10 10M730 217h23m-10-10 10 10-10 10M365 362h23m-10-10 10 10-10 10M730 362h23m-10-10 10 10-10 10M365 507h23m-10-10 10 10-10 10M730 507h23m-10-10 10 10-10 10" class="arrow"/><text x="560" y="617" text-anchor="middle" class="small">Οι σχέσεις είναι πολυπαραγοντικές· το σχήμα δεν προβλέπει ατομική έκβαση.</text></svg>