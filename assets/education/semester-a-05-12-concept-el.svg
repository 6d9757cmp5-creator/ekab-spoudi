<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Λήψη ιστορικού — δομή SAMPLE — Βασικές σχέσεις</title><desc id="desc">Εκπαιδευτικό σχηματικό διάγραμμα για κεφάλαιο 05-12: Σε ασθενή που μπορεί να επικοινωνήσει, το ιστορικό περιλαμβάνει συμπτώματα, αλλεργίες,…; Το SAMPLE αποτελεί μνημονικό βοήθημα για τη συστηματική συλλογή αυτών των πληροφοριών.; SOS · SAMPLE: Symptoms, Allergies, Medications, Past history, Last oral intake, Events.. Δεν αποτελεί ανεξάρτητη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f9fbfd"/><rect width="1100" height="133" fill="#ae5448"/><text x="550" y="36" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 05 · ΚΕΦΑΛΑΙΟ 12</text><text x="550" y="80" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="26" font-family="DejaVu Sans,Arial,sans-serif">Λήψη ιστορικού — δομή SAMPLE</text><text x="550" y="184" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές σχέσεις</text><rect x="55" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#ae5448" stroke-width="2.5"/><circle cx="208" cy="315" r="46" fill="#edf4fa" stroke="#ae5448" stroke-width="3"/><path d="M180 315h56m-28-28v56" stroke="#ae5448" stroke-width="3"/><text x="208" y="420" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="208" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Σε ασθενή που μπορεί να</text><text x="208" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">επικοινωνήσει, το</text><text x="208" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">ιστορικό περιλαμβάνει</text><text x="208" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">συμπτώματα, αλλεργίες,…</text><rect x="400" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#ae5448" stroke-width="2.5"/><circle cx="553" cy="315" r="46" fill="#edf4fa" stroke="#ae5448" stroke-width="3"/><path d="M525 315h56m-28-28v56" stroke="#ae5448" stroke-width="3"/><text x="553" y="420" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="553" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Το SAMPLE αποτελεί</text><text x="553" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">μνημονικό βοήθημα για τη</text><text x="553" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">συστηματική συλλογή</text><text x="553" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">αυτών των πληροφοριών.</text><rect x="745" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#ae5448" stroke-width="2.5"/><circle cx="898" cy="315" r="46" fill="#edf4fa" stroke="#ae5448" stroke-width="3"/><path d="M870 315h56m-28-28v56" stroke="#ae5448" stroke-width="3"/><text x="898" y="420" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">3</text><text x="898" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">SOS · SAMPLE: Symptoms,</text><text x="898" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Allergies, Medications,</text><text x="898" y="523" text-anchor="mid