<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">Ασθενοφόρο φορείο εξοπλισμός - δίγλωσση εκπαιδευτική απεικόνιση</title><desc id="desc">Πλάγια σχηματική όψη ασθενοφόρου με φορείο, ζώνη ασθενούς, ζώνη πληρώματος, ερμάριο ιατροτεχνολογικού εξοπλισμού, και νοσοκομειακό χώρο παράδοσης. Ελληνικές και αγγλικές ετικέτες ταυτοποιούν τις δομές και τον σκοπό τους χωρίς διαδικαστικές οδηγίες.</desc><rect width="1200" height="730" rx="16" fill="#f3f8fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163950}.h{font-size:32px;font-weight:700}.t{font-size:23px;font-weight:700}.s{font-size:19px}.en{font-size:17px;fill:#396e88}.lead{fill:none;stroke:#58869f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.line{fill:none;stroke:#587f96;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.blue{fill:#deedf6;stroke:#6392aa;stroke-width:4}</style>
