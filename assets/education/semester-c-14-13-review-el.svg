<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Υποθερμία τραυματία και πρόληψη — Επανέλεγχος και ασφάλεια</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 13. Παρουσιάζονται: Επανέλεγχος ζωτικών; Θερμική προστασία στη μεταφορά; Καταγραφή μεταβολών. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 13</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Υποθερμία τραυματία και πρόληψη</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Επανέλεγχος και ασφάλεια</text><rect x="59" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#a75749" stroke-width="3"/><circle cx="226" cy="377" r="50" fill="#f0edf9" stroke="#a75749" stroke-width="3"/><path d="M195 378h11l9-16 16 32 9-16h17" fill="none" stroke="#a75749" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="476" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#a75749">Ζωτικά σημεία</text><text x="226" y="521" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="650" fill="#213f53">Σειριακός επανέλεγχος</text><rect x="448" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#a75749" stroke-width="3"/><circle cx="615" cy="377" r="50" fill="#f0edf9" stroke="#a75749" stroke-width="3"/><path d="M590 354h50v45q-25 9-50 0z" fill="none" stroke="#a75749" stroke-width="4" stroke-linejoin="round"/><path d="M600 369q5 7 10 0t1