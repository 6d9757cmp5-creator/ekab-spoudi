<rect x="123" y="298" width="84" height="28" rx="12" fill="#e2f0f9" stroke="#9fb9c5" stroke-width="3"/>
<circle cx="184" cy="308" r="12" fill="#f1d3bb"/><path d="M197 309H356" stroke="#9bbbd0" stroke-width="20" stroke-linecap="round"/>
<path d="M118 377V463M461 377V463" class="lead"/>
<circle cx="118" cy="471" r="18" fill="#617b91"/><circle cx="461" cy="471" r="18" fill="#617b91"/>
