<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">Συντονισμένη μετακίνηση ασθενούς μεταξύ κλίνης και φορείου</title>
<desc id="desc">Εκπαιδευτική πλάγια όψη κλίνης και φορείου με συμβολική εξίσωση ύψους, ασφαλισμένους τροχούς, ορατές ιατρικές γραμμές και δύο μέλη ομάδας που συντονίζουν την κίνηση. Το σχέδιο δεν παρουσιάζει πλήρη τεχνική μεταφοράς ή ακριβή τοποθέτηση προσωπικού, διότι η επιλογή μεθόδου και βοηθημάτων εξαρτάται από τον ασθενή και τις οδηγίες της ομάδας.</desc>
<rect width="1200" height="670" fill="#f3f8fb"/>
<style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173e55}.head{font-size:34px;font-weight:700}.lab{font-size:24px;font-weight:700}.small{font-size:19px}.lead{stroke:#577f9b;stroke-width:5;fill:none;stroke-linejoin:round;stroke-linecap:round}.frame{fill:#fff;stroke:#bacdda;stroke-width:3}</style>
<text x="600" y="48" text-anchor="middle" class="head">Ασφαλής μετακίνηση: κλίνη ↔ φορείο</text>
<text x="600" y="84" text-anchor="middle" class="small">Σχεδιασμός · κατάλληλο βοήθημα · κοινή εντολή ομάδας</text>
<rect x="30" y="120" width="1140" height="431" rx="21" class="frame"/>
<!-- bed left -->
<text x="282" y="165" text-anchor="middle" class="lab">Κλίνη</text>
