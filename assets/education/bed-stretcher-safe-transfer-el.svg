<text x="601" y="285" text-anchor="middle" class="small">Συντονισμός</text>
<!-- line and tubing awareness -->
<path d="M357 306Q406 227 469 251" stroke="#9a80b9" stroke-width="5" stroke-dasharray="10 7" fill="none"/>
<circle cx="474" cy="252" r="11" fill="#e8d8f8" stroke="#9a80b9" stroke-width="4"/>
<path d="M477 252L566 213" stroke="#9a80b9" stroke-width="4"/>
<text x="612" y="212" class="small">Γραμμές / σωληνώσεις</text>
<text x="287" y="526" text-anchor="middle" class="small">Σταθεροποίηση και έλεγχος φρένων</text>
<text x="914" y="526" text-anchor="middle" class="small">Ύψος, ακινητοποίηση και ασφάλεια</text>


