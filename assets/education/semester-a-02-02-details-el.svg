<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d">
<title id="t">Ανταλλαγή οξυγόνου και διοξειδίου του άνθρακα στην κυψελίδα</title><desc id="d">Σχηματική κυψελίδα περιβαλλόμενη από τριχοειδές. Το οξυγόνο διαχέεται από τον αέρα της κυψελίδας προς το αίμα και το διοξείδιο του άνθρακα από το αίμα προς την κυψελίδα. Δεν είναι σε κλίμακα.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347e75"/></marker><marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287c9b"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a44b4b"/></marker></defs>
<rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#347e75"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="555" y="30" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 02</text><text x="555" y="72" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Φυσιολογία της αναπνοής</text>
