<!-- capillary --> <path d="M445 223C386 255 394 344 441 377M650 218C708 251 704 344 655 377" fill="none" stroke="#a44b4b" stroke-width="19" stroke-linecap="round"/><path d="M410 240Q433 226 450 232M688 239Q666 226 650 232" fill="none" stroke="#db9a93" stroke-width="7"/>
<!-- membrane --> <path d="M455 248Q430 302 458 350M645 248Q672 302 642 350" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="5 6"/>
<circle cx="505" cy="260" r="15" fill="#287c9b"/><text x="505" y="266" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">O₂</text><circle cx="604" cy="337" r="15" fill="#a44b4b"/><text x="604" y="343" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">CO₂</text>
<!-- Gas arrows follow gradients -->
<path d="M510 275L462 289" stroke="#287c9b" stroke-width="4" marker-end="url(#arrBlue)"/><path d="M646 324L577 322" stroke="#a44b4b" stroke-width="4" marker-end="url(#arrRed)"/>
<ellipse cx="415" cy="293" rx="18" ry="9" fill="#ca7771" stroke="#8c4343" stroke-width="2" transform="rotate(-28 415 293)"/><ellipse cx="685" cy="300" rx="18" ry="9" fill="#d9958e" stroke="#a3534d" stroke-width="2" transform="rotate(25 685 300)"/>
<text x="555" y="322" font-size="17" fill="#7f4945" font-weight="700" text-anchor="middle">Αέρας κυψελίδας</text></g>
<path d="M384 195L445 225" stroke="#347e75" stroke-width="3" marker-end="url(#arr)"/><text x="248" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#253f52" font-weight="700">Τριχοειδές</text>
<path d="M738 218L652 246" stroke="#347e75" stroke-width="3" marker-end="url(#arr)"/><text x="746" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#253f52" font-weight="700">Κυψελίδα</text>
<text x="555" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#253f52" font-weight="700" text-anchor="middle">O₂: κυψελίδα → αίμα · CO₂: αίμα → κυψελίδα</text><text x="555" y="514" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#526b78" text-anchor="middle">Διάχυση κατά μήκος μερικών πιέσεων · σχετικές κατευθύνσεις σχηματικές</text>
<text x="555" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#526b78" text-anchor="middle">Δεν απεικονίζονται ποσοστά αερίων, διαγνωστικές τιμές ή φυσική κλίμακα.</text>
</svg>