<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 656" role="img" aria-labelledby="t d"><title id="t">Σταθμός ύποπτης κάκωσης ΣΣ — βασικές ανατομικές δομές</title><desc id="d">Τρία σχηματικά, όχι υπό κλίμακα σχέδια: ολόκληρη σπονδυλική στήλη σε πλάγια όψη, αυχενική μοίρα με επτά σπονδύλους επισημασμένους ως περιοχή, και εγκάρσια τομή σπονδύλου με τον νωτιαίο μυελό στο σπονδυλικό τρήμα. Εκπαιδευτική απεικόνιση, όχι διάγνωση ή κλινικό πρωτόκολλο.</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b25e50"/></marker></defs><rect width="1110" height="656" fill="#f9fbfd"/><rect width="1110" height="120" fill="#b25e50"/><text x="555" y="33" font-family="Arial,sans-serif" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">Δ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 18 · ΚΕΦΑΛΑΙΟ 08</text><text x="555" y="81" font-family="Arial,sans-serif" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">Σταθμός ύποπτης κάκωσης ΣΣ</text>
