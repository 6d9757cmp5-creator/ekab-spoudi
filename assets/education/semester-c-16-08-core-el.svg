<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Σενάριο οξείας δύσπνοιας — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 8. Παρουσιάζονται: Αυξημένο έργο αναπνοής; Δυσκολία στην ομιλία; Βατότητα αεραγωγού. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#64569b"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦΑΛΑΙΟ 08</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Σενάριο οξείας δύσπνοιας</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#64569b">Σημεία αναγνώρισης</text><polygon points="590,250 824,399 590,542 356,399" fill="#edebf9" stroke="#64569b" stroke-width="4"/><text x="590" y="393" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="750" fill="#64569b">ΕΚΤΙΜΗΣΗ</text><text x="590" y="433" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="750" fill="#64569b">ΕΥΡΗΜΑΤΩΝ</text><path d="M485 478L203 573" stroke="#64569b" stroke-width="3"/><rect x="46" y="573" width="314" height="159" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.6"/><path d="M203 581V592M203 592C192 584 183 590 183 602C183 612 191 617 203 611M203 592C214 584 223 590 223 602C223 612 215 617 203 611" fill="none" stroke="#64569b" stroke-width="3.5" stroke-linecap="round"/><text x="203" y="655" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Αυξημένο έργο αναπνοής</text><path d="M590 542L590 573" stroke="#64569b" stroke-width="3"