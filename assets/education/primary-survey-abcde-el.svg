<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 105 1200 555" role="img" aria-labelledby="title desc">
<title id="title">Ανατομική επισκόπηση της πρωτογενούς εκτίμησης ABCDE</title>
<desc id="desc">Σχηματική ανθρώπινη μορφή με οπτικούς δείκτες στον αεραγωγό, τους πνεύμονες, την κυκλοφορία, τον εγκέφαλο και την εξωτερική εξέταση. Οι πέντε ετικέτες A B C D E εξηγούν τις κατηγορίες αξιολόγησης, ενώ υπενθυμίζεται η προτεραιότητα της ασφάλειας, της σοβαρής εξωτερικής αιμορραγίας και της επανεκτίμησης.</desc>
<rect width="1200" height="740" rx="18" fill="#f3f8fc"/>
<style>text[fill='#fff']{fill:#fff}text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173c51}.heading{font-size:34px;font-weight:700}.sub{font-size:19px}.label{font-size:24px;font-weight:700}.detail{font-size:18px}.panel{fill:#fff;stroke:#b5ccda;stroke-width:2.5}.lead{stroke:#4a819a;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>


<!-- Body outline with head and limbs -->
<g fill="#e1eef5" stroke="#5b8da8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
 <circle cx="600" cy="199" r="66"/>
