<title id="t">Καταστροφική αιμορραγία — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 2. Τρεις ανεξάρτητες θεματικές κάρτες: Μεγάλη εξωτερική αιμορραγία; Αναγνώριση σημείου απώλειας; Άμεσος κίνδυνος ζωής. Δεν δείχνεται θέση τραύματος ή οδηγία αντιμετώπισης.</desc>
