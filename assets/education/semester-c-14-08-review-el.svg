<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Κοιλιακό και πυελικό τραύμα — Πρόσθετη επανεκτίμηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 14, κεφάλαιο 8: Σενάριο κεφαλαίου: Σε εκπαιδευτικό τραυματολογικό συμβάν σχετικό με «Κοιλιακό και πυελικό…; Πρόκειται για εκπαιδευτική άσκηση και όχι οδηγία αυτόνομης κλινικής παρέμβασης.; Αποφεύγονται περιττές μετακινήσεις και μη αναγκαίοι χειρισμοί· αναγνωρίζονται σημεία σοκ και…. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#a55c4d"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦ. 08</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Κοιλιακό και πυελικό τραύμα</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">Πρόσθετη επανεκτίμηση</text><rect x="57" y="250" width="301" height="350" rx="24" fill="#ffffff" stroke="#a55c4d" stroke-width="3"/><circle cx="207" cy="339" r="49" fill="#eae9f7" stroke="#a55c4d" stroke-width="3"/><path d="M207 315v32m0 15v3" stroke="#a55c4d" stroke-width="8" stroke-linecap="round"/><text x="207" y="439" font-size="22" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">ΣΗΜΕΙΟ 1</text><text x="207" y="493" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Σενάριο κεφαλαίου: Σε</text><text x="207" y="517" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">εκπαιδευτικό</text><text x="207" y="541" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d