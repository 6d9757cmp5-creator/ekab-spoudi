<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Σενάριο παιδιατρικού επείγοντος — Πρόσθετη επανεκτίμηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 16, κεφάλαιο 11: Κριτήριο τεκμηρίωσης: Παιδιατρικό επείγον: ηλικιακή αξιολόγηση; Η ηλικία, το βάρος και οι παιδιατρικοί αλγόριθμοι επηρεάζουν τον εξοπλισμό και τις ενέργειες.; Τα παιδιά διαφέρουν από τους ενήλικες στην ανατομία. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#66569b"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦ. 11</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Σενάριο παιδιατρικού επείγοντος</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">Πρόσθετη επανεκτίμηση</text><rect x="57" y="250" width="301" height="350" rx="24" fill="#ffffff" stroke="#66569b" stroke-width="3"/><circle cx="207" cy="339" r="49" fill="#eae9f7" stroke="#66569b" stroke-width="3"/><path d="M207 315v32m0 15v3" stroke="#66569b" stroke-width="8" stroke-linecap="round"/><text x="207" y="439" font-size="22" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΣΗΜΕΙΟ 1</text><text x="207" y="493" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Κριτήριο τεκμηρίωσης:</text><text x="207" y="517" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Παιδιατρικό επείγον:</text><text x="207" y="541" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ηλικιακή αξιολόγηση</text><rect x="