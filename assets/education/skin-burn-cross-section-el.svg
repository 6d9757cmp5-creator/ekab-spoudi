<rect x="24" y="95" width="480" height="67" rx="6" fill="#e9aaaa" stroke="#ba8d83" stroke-width="3"/>
<rect x="24" y="162" width="480" height="100" fill="#ecc7ba" stroke="#bb9587" stroke-width="3"/>
