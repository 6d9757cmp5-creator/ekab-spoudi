<rect x="24" y="162" width="480" height="100" fill="#ecc7ba" stroke="#bb9587" stroke-width="3"/>
<rect x="24" y="262" width="480" height="91" fill="#f7e1a9" stroke="#c6a96f" stroke-width="3"/>
<path d="M50 292Q94 253 136 296T232 295T330 296T435 294" stroke="#dcbd7c" stroke-width="5" fill="none"/>

<text x="263" y="52" class="t" text-anchor="middle">Σχηματικό υγιές δέρμα</text>
</g><g transform="translate(624 166)">
