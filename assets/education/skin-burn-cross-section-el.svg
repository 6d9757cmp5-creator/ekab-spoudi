</g>
<path d="M573 310H617" class="line" stroke-dasharray="8 8"/>
<rect x="407" y="585" width="20" height="18" fill="#f6dfd4" stroke="#ba8d83" stroke-width="2"/><text x="435" y="600" class="s">Επιδερμίδα</text><rect x="571" y="585" width="20" height="18" fill="#ecc7ba" stroke="#bb9587" stroke-width="2"/><text x="599" y="600" class="s">Χόριο</text><rect x="676" y="585" width="20" height="18" fill="#f7e1a9" stroke="#c6a96f" stroke-width="2"/><text x="704" y="600" class="s">Υποδόριο</text>
<text x="600" y="656" class="s" text-anchor="middle">Η εικόνα δεν υποκαθιστά εκτίμηση βάθους, έκτασης ή κινδύνου εισπνευστικής κάκωσης</text></svg>
