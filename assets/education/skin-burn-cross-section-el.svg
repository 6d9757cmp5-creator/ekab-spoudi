<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Θερμικό έγκαυμα: σχηματική τομή στιβάδων δέρματος</title><desc id="desc">Δύο τομές δέρματος με επιδερμίδα, χόριο και υποδόριο λίπος. Η αριστερή απεικονίζει ακεραιότητα της επιφάνειας, ενώ η δεξιά μια ενδεικτική θερμική κάκωση επιφάνειας. Δεν παρουσιάζει ταξινόμηση βαθμού εγκαύματος, έκταση, κλινική διάγνωση ή οδηγίες φροντίδας.</desc><rect width="1200" height="690" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163a53}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.line{fill:none;stroke:#56839e;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#aec8d9;stroke-width:3}</style>
<text x="600" y="49" class="h" text-anchor="middle">Θερμικό έγκαυμα · τι διαφέρει στο δέρμα;</text>
<text x="600" y="84" class="s" text-anchor="middle">Ανατομική τομή — το βάθος και η έκταση απαιτούν κλινική αξιολόγηση</text>
<g transform="translate(45 166)">
