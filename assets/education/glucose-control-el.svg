<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="t d"><title id="t">Αντίρροπη ρύθμιση της γλυκόζης</title><desc id="d">Φυσιολογική ρύθμιση· δεν είναι αλγόριθμος διαβητικού επείγοντος.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#20738a"/></marker></defs><rect width="1000" height="680" fill="#f8fcfe"/><g fill="#183e51" font-family="DejaVu Sans,sans-serif"><text x="500" y="48" font-size="28" text-anchor="middle">Αντίρροπη ρύθμιση της γλυκόζης</text><rect x="55" y="130" width="250" height="85" rx="13" fill="#e9f5f8" stroke="#20738a"/><text x="180.0" y="179.5" font-size="21" text-anchor="middle">Αύξηση γλυκόζης</text><path d="M310 170 L365 170" fill="none" stroke="#20738a" stroke-width="4" marker-end="url(#a)"/><rect x="375" y="130" width="250" height="85" rx="13" fill="#e9f5f8" stroke="#20738a"/><text x="500.0" y="179.5" font-size="21" text-anchor="middle">β-κύτταρα: ινσουλίνη</text><path d="M630 170 L685 170" fill="none" stroke="#20738a" stroke-width="4" marker-end="url(#a)"/><rect x="695" y="130" width="250" height="85" rx="13" fill="#e9f5f8" stroke="#20738a"/><text x="820.0" y="166.5" font-size="21" text-anchor="middle">Πρόσληψη /</text><text x="820.0" y="192.5" font-size="21" text-anchor="middle">αποθήκευση</text><rect x="55" y="350" width="250" height="85" rx="13" fill="#e9f5f8" stroke="#20738a"/><text x="180.0" y="399.5" font-size="21" text-anchor="middle">Μείωση γλυκόζης</text><path d="M310 390 L365 390" fill="none" stroke="#20738a" stroke-width="4" marker-end="url(#a)"/><rect x="375" y="350" width="250" height="85" rx="13" fill="#e9f5f8" stroke="#20738a"/><text x="500.0" y="399.5" font-size="21" text-anchor="middle">α-κύτταρα: γλυκαγόνη</text><path d="M630 390 L685 390" fill="none" stroke="#20738a" stroke-width="4" marker-end="url(#a)"/><rect x="695" y="350" width="250" height="85" rx="13" fill="#e9f5f8" stroke="#20738a"/><text x="820.0" y="399.5" font-size="21" text-anchor="middle">Ήπαρ: απελευθέρωση</text><text x="820" y="260" font-size="21" text-anchor="middle">Τάση μείωσης γλυκόζης</text><text x="820" y="485" font-size="21" text-anchor="middle">Τάση αύξησης γλυκόζης</text><text x="500" y="645" font-size="17" text-anchor="middle">Φυσιολογική ρύθμιση· δεν είναι αλγόριθμος διαβητικού επείγοντος.</text></g></svg>