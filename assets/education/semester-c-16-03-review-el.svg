<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Εκπαίδευση με κλινικά σενάρια — Επανέλεγχος και ασφάλεια</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 3. Παρουσιάζονται: Ασφαλής διακομιδή; Αιτιολόγηση απόφασης; Εκπαιδευτική ανατροφοδότηση. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#64569b"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦΑΛΑΙΟ 03</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Εκπαίδευση με κλινικά σενάρια</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#64569b">Επανέλεγχος και ασφάλεια</text><rect x="59" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#64569b" stroke-width="3"/><circle cx="226" cy="351" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><path d="M194 342h30v24h-30zM224 349h13l11 11v6h-24z" fill="none" stroke="#64569b" stroke-width="4" stroke-linejoin="round"/><circle cx="203" cy="369" r="5" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><circle cx="232" cy="369" r="5" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><path d="M232 354v10h9m-9-10h6v6" fill="none" stroke="#64569b" stroke-width="3" stroke-linejoin="round"/><text x="226" y="457" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="760" fill="#64569b">ΕΛΕΓΧΟΣ 1</text><text x="226" y="519" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">Ασφαλής διακομιδή</text><rect x="448" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#645