<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Παρακολούθηση και ανεπιθύμητες ενέργειες — χρονική συσχέτιση και ενημέρωση</title><desc id="d">Σχηματικά μνημονικά για χρόνο εμφάνισης με προειδοποίηση, χρονική συσχέτιση δύο καταγεγραμμένων γεγονότων χωρίς αιτιώδες βέλος, και ενημέρωση ομάδας. Η χρονική συσχέτιση δεν αποδεικνύει ότι προηγούμενη πράξη προκάλεσε σύμπτωμα.</desc><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6f7396"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#6f7396"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 12 · ΚΕΦΑΛΑΙΟ 04</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Παρακολούθηση και ανεπιθύμητες ενέργειες</text><circle cx="197" cy="299" r="85" fill="#eef4f8" stroke="#6f7396" stroke-width="2.4"/><g transform="translate(197 299)" fill="none" stroke="#6f7396" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="-16" cy="-12" r="31"/><path d="M-16-31v20l15 9"/><path d="M22-31 48 14H-4Z"/><path d="M22-17v15m0 7v1"/></g><path d="M197 478L197 361" stroke="#6f7396" stroke-width="3.5" marker-end="url(#arr)"/><rect x="48" y="487" width="298" height="93" rx="17" fill="#fff" stroke="#6f7396" stroke-width="2"/><text x="197" y="516" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#253f52" font-weight="700" text-anchor="middle">Χρόνος εμφάνισης νέου</text><text x="197" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#253f52" font-weight="700" text-anchor="middle">συμπτώματος</text><circle cx="553" cy="299" r="85" fill="#eef4f8" stroke="#6f7396" stroke-width="2.4"/><g transform="translate(553 299