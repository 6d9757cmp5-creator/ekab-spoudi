<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Χρήση χρονοσήμανσης και ιχνηλασιμότητας — Συσχέτιση και εξήγηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 13, κεφάλαιο 8: Η ιχνηλασιμότητα βοηθά στην αξιολόγηση ανταπόκρισης και στην ποιότητα των υπηρεσιών; Παράδειγμα: «ο πόνος άρχισε περίπου πριν από μία ώρα» και «λήψη κλήσης 14:20» είναι δύο…; Το Κέντρο χρειάζεται σαφή διάκριση αρχικής πληροφορίας, επιβεβαίωσης και νεότερης μεταβολής.. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#24728d"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 13 · ΚΕΦ. 08</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Χρήση χρονοσήμανσης και ιχνηλασιμότητας</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#24728d">Συσχέτιση και εξήγηση</text><path d="M112 388H999" stroke="#24728d" stroke-width="7"/><circle cx="190" cy="388" r="58" fill="#ebf3f8" stroke="#24728d" stroke-width="4"/><text x="190" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#24728d">1</text><rect x="41" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#24728d" stroke-width="2.6"/><text x="190" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η ιχνηλασιμότητα βοηθά</text><text x="190" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">στην αξιολόγηση</text><text x="190" y="587" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ανταπόκρισης και στην</text><text x="190" y="613" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ποιότητα των υπηρεσιών</text><circle cx="550" cy="388" r="58" fill="#ebf3f8" stroke="#24728d" stroke-width="4"/><text x="550" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#24728d">2</text><rect x="401" y="240" width="298" height="151" rx="19" fill="#ffffff" stroke="#24728d" stroke-width="2.6"/><text x="550" y="278" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Παράδειγμα: «ο πόνος</text><text x="550" y="304" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">άρχισε περίπου πριν από</text><text x="550" y="330" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">μία ώρα» και «λήψη κλήσης</text><text x="550" y="356" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">14:20» είναι δύο…</text><circle cx="910" cy="388" r="58" fill="#ebf3f8" stroke="#24728d" stroke-width="4"/><text x="910" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#24728d">3</text><rect x="761" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#24728d" stroke-width="2.6"/><text x="910" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Το Κέντρο χρειάζεται σαφή</text><text x="910" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">διάκριση αρχικής</text><text x="910" y="587" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">πληροφορίας, επιβεβαίωσης</text><text x="910" y="613" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">και νεότερης μεταβολής.</text><rect x="53" y="733" width="1005" height="40" rx="12" fill="#e5edf3"/><text x="555" y="760" font-size="16" font-weight="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#24728d">Σχηματική εικόνα από τη θεωρία · όχι αυτόνομο κλινικό ή υπηρεσιακό πρωτόκολλο.</text></svg>