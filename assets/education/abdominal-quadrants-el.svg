<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Τα τέσσερα τεταρτημόρια της κοιλιάς</title><desc id="desc">Σχηματικός χάρτης τεταρτημορίων σε πρόσθια όψη. Η δεξιά πλευρά του ασθενούς εμφανίζεται αριστερά στον παρατηρητή. Δεν είναι απεικόνιση οργάνων.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#24728e"/></marker></defs><rect width="1000" height="620" fill="#f8fcfe"/><g font-family="DejaVu Sans, sans-serif"><text x="36" y="52" font-size="30" fill="#173c54" text-anchor="start">Τα τέσσερα τεταρτημόρια της κοιλιάς</text><text x="500" y="100" font-size="22" fill="#173c54" text-anchor="middle">Πρόσθια όψη — δεξιά και αριστερά του ασθενούς</text><rect x="175" y="155" width="320" height="150" rx="14" fill="#e7f3f8" stroke="#24728e"/><text x="335.0" y="237.0" font-size="18" fill="#173c54" text-anchor="middle">Δεξιό άνω</text><rect x="505" y="155" width="320" height="150" rx="14" fill="#e7f3f8" stroke="#24728e"/><text x="665.0" y="237.0" font-size="18" fill="#173c54" text-anchor="middle">Αριστερό άνω</text><rect x="175" y="315" width="320" height="150" rx="14" fill="#e7f3f8" stroke="#24728e"/><text x="335.0" y="397.0" font-size="18" fill="#173c54" text-anchor="middle">Δεξιό κάτω</text><rect x="505" y="315" width="320" height="150" rx="14" fill="#e7f3f8" stroke="#24728e"/><text x="665.0" y="397.0" font-size="18" fill="#173c54" text-anchor="middle">Αριστερό κάτω</text><path d="M500 145 V475 M165 310 H835" stroke="#bd693d" stroke-width="4" stroke-dasharray="8 5"/><circle cx="500" cy="310" r="9" fill="#173c54"/><text x="500" y="520" font-size="22" fill="#173c54" text-anchor="middle">Η διασταύρωση των γραμμών περνά από τον ομφαλό.</text><text x="36" y="585" font-size="17" fill="#173c54" text-anchor="start">Εκπαιδευτικό σχήμα · όχι σε φυσική κλίμακα</text></g></svg>