<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Θωρακικός πόνος και καρδιαγγειακά — αναγνώριση σημείων</title><desc id="d">Τρεις ονομασμένες εικόνες με βέλος σε κάθε αντίστοιχο αντικείμενο: Εκτίμηση ζωτικών σημείων, Έγκαιρη ενημέρωση υποδοχής, Δεν τεκμηριώνει μόνο ένα αίτιο. Απλοποιημένα σύμβολα· δεν προσδιορίζουν αιτία ή διάγνωση.</desc><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a95550"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#a95550"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ffffff" font-weight="690" text-anchor="middle">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 10 · ΚΕΦΑΛΑΙΟ 01</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#ffffff" font-weight="720" text-anchor="middle">Θωρακικός πόνος και καρδιαγγειακά</text><circle cx="197" cy="299" r="85" fill="#eef4f8" stroke="#a95550" stroke-width="2.4"/><g transform="translate(197 299)" fill="none" stroke="#a95550" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M-46-38H46V26H-46Z"/><path d="M-34-7H-20L-12-25L0 14L13-15L22 0H35"/><path d="M-18 43H18"/></g><path d="M197 478L197 361" stroke="#a95550" stroke-width="3.5" marker-end="url(#arr)"/><rect x="48" y="487" width="298" height="93" rx="17" fill="#ffffff" stroke="#a95550" stroke-width="2"/><text x="197" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#253f52" font-weight="700" text-anchor="middle">Εκτίμηση ζωτικών σημείων</text><circle cx="553" cy="303" r="85" fill="#eef4f8" stroke="#a95550" stroke-width="2.4"/><g transform="translate(553 303)" fill="none" stroke="#a95550" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M-23-54Q-46-54-46-30V10Q-46 34-23 34H-8L9 53V34H23Q46 34 46 10V-30Q46-54 23-54Z"/><path d="M-26