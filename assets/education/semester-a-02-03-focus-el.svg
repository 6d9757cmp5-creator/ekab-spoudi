<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Κυκλοφορία και αιμάτωση — Κεντρικό συμπέρασμα, κεφάλαιο 02-03</title><desc id="d">Πρωτότυπο διάγραμμα του κεφαλαίου 02-03. Περιλαμβάνει Καρδιακή παροχή = συχνότητα × όγκος παλμού; ταραχές σφυγμού.; Συνοπτική επανάληψη: Κυκλοφορία και αιμάτωση. Απλουστευμένη οπτική υποστήριξη της θεωρίας, όχι αυτόνομη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f7fafd"/><rect width="1100" height="132" fill="#267568"/><text x="550" y="34" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">ΣΑΕΚ · Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 03</text><text x="550" y="79" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">Κυκλοφορία και αιμάτωση</text><text x="550" y="174" text-anchor="middle" fill="#267568" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Κεντρικό συμπέρασμα</text><rect x="100" y="275" width="290" height="170" rx="28" fill="#ffffff" stroke="#267568" stroke-width="3"/><text x="245" y="344" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Καρδιακή παροχή =</text><text x="245" y="373" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">συχνότητα × όγκος παλμού</text><rect x="400" y="330" width="290" height="170" rx="28" fill="#e7f0f7" stroke="#267568" stroke-width="3"/><text x="545" y="399" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">ταραχές σφυγμού.</text><rect x="700" y="275" width="290" height="170" rx="28" fill="#ffffff" stroke="#267568" stroke-width="3"/><text x="845" y="344" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Συνοπτική επανάληψη:</text><text x="845" y="373" text-anchor="middle" fill="#233a4c" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Κυκλοφορία και αιμάτωση</text><rect x="55" y="596" width="990" height="69" rx="16" fill="#e7f0f7"/><text x="550" y="639" text-anchor="middle" fill="#267568" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Προσοχή: επιβεβαίωσε την εφαρμογή με τη γραπτή θεωρία.</text></svg>