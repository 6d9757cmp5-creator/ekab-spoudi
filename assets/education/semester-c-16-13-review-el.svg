<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Ομαδική επικοινωνία και ανατροφοδότηση σεναρίου — Πρόσθετη επανεκτίμηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 16, κεφάλαιο 13: Το λάθος αξιοποιείται για μάθηση και επανάληψη, όχι απόκρυψη.; Η ανασκόπηση σεναρίου εξετάζει τόσο τις τεχνικές όσο και τον τρόπο συνεργασίας.; Το debriefing διαχωρίζει τις παρατηρήσεις από τις κρίσεις για τα άτομα. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#66569b"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦ. 13</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Ομαδική επικοινωνία και ανατροφοδότηση σεναρίου</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">Πρόσθετη επανεκτίμηση</text><rect x="57" y="250" width="301" height="350" rx="24" fill="#ffffff" stroke="#66569b" stroke-width="3"/><circle cx="207" cy="339" r="49" fill="#eae9f7" stroke="#66569b" stroke-width="3"/><path d="M207 315v32m0 15v3" stroke="#66569b" stroke-width="8" stroke-linecap="round"/><text x="207" y="439" font-size="22" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΣΗΜΕΙΟ 1</text><text x="207" y="493" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Το λάθος αξιοποιείται</text><text x="207" y="517" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">για μάθηση και</text><text x="207" y="541" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">επανάληψη, όχι απόκρυψη.</text><rect x="406" y="294" width="301" height="350" rx="24" fill="#ffffff" stroke="#66569b" stroke-width="3"/><circle cx="556" cy="383" r="49" fill="#eae9f7" stroke="#66569b" stroke-width="3"/><path d="M556 359v32m0 15v3" stroke="#66569b" stroke-width="8" stroke-linecap="round"/><text x="556" y="483" font-size="22" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΣΗΜΕΙΟ 2</text><text x="556" y="537" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η ανασκόπηση σεναρίου</text><text x="556" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">εξετάζει τόσο τις</text><text x="556" y="585" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">τεχνικές όσο και τον</text><text x="556" y="609" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">τρόπο συνεργασίας.</text><rect x="755" y="250" width="301" height="350" rx="24" fill="#ffffff" stroke="#66569b" stroke-width="3"/><circle cx="905" cy="339" r="49" fill="#eae9f7" stroke="#66569b" stroke-width="3"/><path d="M905 315v32m0 15v3" stroke="#66569b" stroke-width="8" stroke-linecap="round"/><text x="905" y="439" font-size="22" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΣΗΜΕΙΟ 3</text><text x="905" y="493" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Το debriefing διαχωρίζει</text><text x="905" y="517" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">τις παρατηρήσεις από τις</text><text x="905" y="541" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">κρίσεις για τα άτομα</text><rect x="53" y="733" width="1005" height="40" rx="12" fill="#e5edf3"/><text x="555" y="760" font-size="16" font-weight="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">Σχηματική εικόνα από τη θεωρία · όχι αυτόνομο κλινικό ή υπηρεσιακό πρωτόκολλο.</text></svg>