<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Εγκεφαλικό: αναγνώριση και χρόνος — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 6. Παρουσιάζονται: Τελευταία ώρα χωρίς συμπτώματα; Έλεγχος γλυκόζης όπου προβλέπεται; Ενεργοποίηση επείγουσας ανταπόκρισης. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><circle cx="200" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><circle cx="200" cy="399" r="25" fill="none" stroke="#64569b" stroke-width="4"/><path d="M200 383V399L212 407" fill="none" stroke="#64569b" stroke-width="4" stroke-linecap="round"/><rect x="42" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="200" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Τελευταία ώρα χωρίς</text><text x="200" y="595" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">συμπτώματα</text><circle cx="590" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><path d="M578 381H602V417H578Z" fill="none" stroke="#64569b" stroke-width="3.5"/><path d="M582 391H598M582 399H598M582 407H595M584 377V384M596 377V384" stroke="#64569b" stroke-width="3" stroke-linecap="round"/><rect x="432" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="590" y="558" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Έλεγχος γλυκόζης όπου</text><text x="590" y="587" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">προβλέπεται</text><circle cx="980" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><path d="M955 400