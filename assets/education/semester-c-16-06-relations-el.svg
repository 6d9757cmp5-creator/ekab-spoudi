<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Εγκεφαλικό: αναγνώριση και χρόνος — Συσχέτιση και εξήγηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 16, κεφάλαιο 6: Η εκτίμηση περιλαμβάνει και άλλες επείγουσες αιτίες μεταβολής συνείδησης σύμφωνα με το πρωτόκολλο.; Σε εκπαιδευτικό σενάριο σχετικό με «Εγκεφαλικό: αναγνώριση και χρόνος»; Σενάριο κεφαλαίου: Σε σενάριο εφαρμογής του πρωτοκόλλου «Εγκεφαλικό: αναγνώριση και χρόνος»,…. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#66569b"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦ. 06</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Εγκεφαλικό: αναγνώριση και χρόνος</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">Συσχέτιση και εξήγηση</text><path d="M112 388H999" stroke="#66569b" stroke-width="7"/><circle cx="190" cy="388" r="58" fill="#ebf3f8" stroke="#66569b" stroke-width="4"/><text x="190" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">1</text><rect x="41" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#66569b" stroke-width="2.6"/><text x="190" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η εκτίμηση περιλαμβάνει</text><text x="190" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">και άλλες επείγουσες</text><text x="190" y="587" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">αιτίες με