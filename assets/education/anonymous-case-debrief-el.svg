<text x="600" y="621" text-anchor="middle" class="s">Σύντομη ανατροφοδότηση, υποστήριξη ομάδας και συγκεκριμένο σημείο μάθησης</text>
<text x="600" y="669" text-anchor="middle" class="en">Χωρίς όνομα, φωτογραφία ή άλλο αναγνωριστικό του πραγματικού ασθενούς</text></svg>