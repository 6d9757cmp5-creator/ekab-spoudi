<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Θώρακας, κεφαλή και σπονδυλική στήλη — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 3. Παρουσιάζονται: Παρατήρηση κορών και εμέτων; Αναπνευστική επανεκτίμηση; Προσεκτικές μετακινήσεις. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 03</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Θώρακας, κεφαλή και σπονδυλική στήλη</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Σχέσεις και προτεραιότητες</text><g fill="#ffffff" stroke="#a75749" stroke-width="2.8"><rect x="42" y="286" width="340" height="360" rx="22"/><rect x="420" y="286" width="340" height="360" rx="22"/><rect x="798" y="286" width="340" height="360" rx="22"/></g>
