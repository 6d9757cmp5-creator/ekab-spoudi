<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d">
<title id="t">Δράση, ένδειξη και αντένδειξη — αναγνώριση σημείων</title><desc id="d">Τρεις σχηματικές συνδέσεις: κάψουλα προς αφαιρετικό υποδοχέα για μηχανισμό δράσης, πρόσωπο με προειδοποιητικό σύμβολο για ανεπιθύμητες ενέργειες, και σήμα ταυτότητας με έλεγχο για έγκριση εντός αρμοδιοτήτων. Τα βέλη οδηγούν στα αντίστοιχα σύμβολα. Δεν απεικονίζεται δοσολογία, συγκεκριμένη θεραπεία ή άδεια πράξης.</desc>
