<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Ανακοπή: αναγνώριση και ενεργοποίηση — Πρόσθετη επανεκτίμηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 16, κεφάλαιο 7: Σενάριο κεφαλαίου: Σε σενάριο εφαρμογής του πρωτοκόλλου «Ανακοπή: αναγνώριση και ενεργοποίηση»,…; Πρόκειται για εκπαιδευτική άσκηση και όχι οδηγία αυτόνομης κλινικής παρέμβασης.; Για ΚΑΡΠΑ σε ενήλικο ασθενή προβλέπονται θωρακικές συμπιέσεις 100–120/λεπτό. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#66569b"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦ. 07</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Ανακοπή: αναγνώριση και ενεργοποίηση</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">Πρόσθετη επανεκτίμηση</text><rect x="57" y="250" width="301" height="350" rx="24" fill="#ffffff" stroke="#66569b" stroke-width="3"/><circle cx="207" cy="339" r="49" fill="#eae9f7" stroke="#66569b" stroke-width="3"/><path d="M207 315v32m0 15v3" stroke="#66569b" stroke-width="8" stroke-linecap="round"/><text x="207" y="439" font-size="22" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΣΗΜΕΙΟ 1</text><text x="207" y="493" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Σενάριο κεφαλαίου: Σε</text><text x="207" y="517" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">σενάριο εφαρμογής του</text><text x="207" y="541" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">πρωτοκόλλου «Ανακοπή:</text><text x="207" y="565" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">αναγνώριση και</text><text x="207" y="589" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ενεργοποίηση»,…</text><rect x="406" y="294" width="301" height="350" rx="24" fill="#ffffff" stroke="#66569b" stroke-width="3"/><circle cx="556" cy="383" r="49" fill="#eae9f7" stroke="#66569b" stroke-width="3"/><path d="M556 359v32m0 15v3" stroke="#66569b" stroke-width="8" stroke-linecap="round"/><text x="556" y="483" font-size="22" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΣΗΜΕΙΟ 2</text><text x="556" y="537" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Πρόκειται για</text><text x="556" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">εκπαιδευτική άσκηση και</text><text x="556" y="585" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">όχι οδηγία αυτόνομης</text><text x="556" y="609" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">κλινικής παρέμβασης.</text><rect x="755" y="250" width="301" height="350" rx="24" fill="#ffffff" stroke="#66569b" stroke-width="3"/><circle cx="905" cy="339" r="49" fill="#eae9f7" stroke="#66569b" stroke-width="3"/><path d="M905 315v32m0 15v3" stroke="#66569b" stroke-width="8" stroke-linecap="round"/><text x="905" y="439" font-size="22" font-weight="740" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΣΗΜΕΙΟ 3</text><text x="905" y="493" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Για ΚΑΡΠΑ σε ενήλικο