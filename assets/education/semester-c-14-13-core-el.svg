<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Υποθερμία τραυματία και πρόληψη — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 13. Παρουσιάζονται: Έκθεση τραυματία στο περιβάλλον; Υγρά ρούχα και απώλεια θερμότητας; Υποθερμία και παρακολούθηση θερμοκρασίας. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><text x="590" y="258" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" fill="#506b82">Έκθεση και απώλεια θερμότητας</text><rect x="69" y="300" width="322" height="350" rx="22" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="429" y="300" width="322" height="350" rx="22" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="789" y="300" width="322" height="350" rx="22" fill="#fff" stroke="#a75749" stroke-width="3"/><path d="M210 390c0-13 10-23 23-23 5-16 28-18 36-4 16-2 26 18 16 30" fill="none" stroke="#506b82" stroke-width="5" stroke-linecap="round"/><path d="M221 407l-5 12m22-12-5 12m22-12-5 12" stroke="#a75749" stroke-width="5" stroke-linecap="round"/><text x="230" y="541" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#213f53">Έκθεση στο περιβάλλον</text><text x="230" y="575" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="650" fill="#213f53">Κίνδυνος απώλειας θερμότητας</text><path d="M578 372l12 8 12-8 18 13-10 16-10-6v49h-32v-49l-10 6-10-16z" fill="#daecf5" stroke="#506b82" stroke-width="4" stroke-linejoin="round"/><path d="M590 389v35" stroke="#a75749" stroke-width="4"/><text x="590" y="541" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#213f53">Υγρά ρούχα</text><text x="590" y="575" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="