<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Υποθερμία τραυματία και πρόληψη — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 13. Παρουσιάζονται: Έκθεση τραυματία στο περιβάλλον; Υγρά ρούχα και απώλεια θερμότητας; Υποθερμία και σε ήπιο καιρό. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 13</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Υποθερμία τραυματία και πρόληψη</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Σημεία αναγνώρισης</text><text x="590" y="258" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" fill="#506b82">Έκθεση και απώλεια θερμότητας</text><rect x="69" y="300" width="322" height="350" rx="22" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="429" y="300" width="322" height="350" rx="22" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="789" y="300" width="322" height="350" rx="22" fill="#fff" stroke="#a75749" stroke-width="3"/><path d="M230 367c-26 32-30 87-5 124h42c25-37 21-92-5-124z" fill="#daecf5" stroke="#506b82" stroke-width="4"/><path d="M205 410h50m-44 20h38m-32 20h26" stroke="#a75749" stroke-width="5" stroke-linecap="round"/><text x="230" y="541" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#213f53">Έκθεση στο περιβάλλον</text><text x="230" y="575" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fon