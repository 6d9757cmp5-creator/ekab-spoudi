<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Ορισμός μαζικού συμβάντος — Διακριτά θέματα και πόροι</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 4. Παρουσιάζονται ως διακριτά θέματα: αιτήματα ενίσχυσης, διαχείριση διαθέσιμων μέσων και ενεργοποίηση σχεδίου. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="52" y="265" width="336" height="424" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="220" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΕΝΙΣΧΥΣΗ</text><circle cx="220" cy="406" r="45" fill="#4d7d70"/><path d="M197 400h35m-10-10 10 10-10 10m-9-26v-8m12 8v-8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Αιτήματα</text><text x="220" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">ενίσχυσης</text><rect x="422" y="265" width="336" height="424" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><text x="590" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΠΟΡΟΙ</text><circle cx="590" cy="406" r="45" fill="#4d7d70"/><path d="M571 388h38v28h-38z m8-8h22m-22 36h22m-19-28h16m-16 8h16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/><text x="590" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Διαχείριση</text><text x="590" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">διαθέσιμων μέσων</text><rect x="792" y="