<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" role="img" aria-labelledby="title desc"><title id="title">Κόπωση οδηγού ασθενοφόρου: ενδείξεις και ασφαλής αντίδραση</title><desc id="desc">Σχηματική οδός με ασθενοφόρο κοντά στη διαχωριστική γραμμή και τρεις παρατηρήσιμες ενδείξεις κόπωσης: υπνηλία, αργή αντίδραση, παρέκκλιση από λωρίδα. Στο δεξί τμήμα προτείνεται αναφορά στην υπηρεσία και ασφαλής στάση αντί συνέχισης της οδήγησης.</desc><rect width="1160" height="700" fill="#f3f8fb"/><style>.t{font-family:Arial,'DejaVu Sans',sans-serif;fill:#183c50}.head{font-size:29px;font-weight:700}.sub{font-size:19px}.lab{font-size:22px;font-weight:700}.tiny{font-size:17px}.line{fill:none;stroke:#236d88;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#acc6d4;stroke-width:2}</style><text x="580" y="49" text-anchor="middle" class="t head">Κόπωση στην οδήγηση ασθενοφόρου</text><text x="580" y="83" text-anchor="middle" class="t sub">Αναγνώριση ενδείξεων πριν οδηγήσουν σε ατύχημα</text>
<!-- road perspective -->
<path d="M220 160L64 598H691L524 160z" fill="#7e909c" stroke="#4b697b" stroke-width="6"/><path d="M372 161v437" stroke="#f6f3e5" stroke-width="6" stroke-dasharray="29 21"/><path d="M242 161L106 598m397-437 145 437" stroke="#dce5e9" stroke-width="6"/><path d="M477 285l37 116" stroke="#f0c66d" stroke-width="5" stroke-dasharray="14 12"/>
<!-- vehicle on road, drifting to lane boundary -->
<g transform="translate(408 360) rotate(-10)"><rect x="-70" y="-100" width="140" height="210" rx="22" fill="white" stroke="#426d83" stroke-width="6"/><rect x="-54" y="-81" width="108" height="59" rx="9" fill="#acd1e2"/><path d="M0-6v58m-28-29h56" stroke="#d25b60" stroke-width="17" stroke-linecap="round"/><rect x="-59" y="-113" width="118" height="13" rx="6" fill="#408ebc"/><rect x="-84" y="-47" width="13" height="52" rx="5" fill="#354e61"/><rect x="71" y="-47" width="13" height="52" rx="5" fill="#354e61"/><circle cx="-45" cy="85" r="12" fill="#c95858"/><circle cx="45" cy="85" r="12" fill="#c95858"/></g>
<!-- visual warning signs -->
<rect x="31" y="169" width="181" height="79" rx="12" fill="#fff1d9" stroke="#d9a966" stroke-width="3"/><text x="122" y="200" text-anchor="middle" class="t lab">Υπνηλία</text><text x="122" y="227" text-anchor="middle" class="t tiny">Βαριά βλέφαρα</text>
<rect x="28" y="276" width="199" height="91" rx="12" fill="#fff1d9" stroke="#d9a966" stroke-width="3"/><text x="127" y="308" text-anchor="middle" class="t lab">Αργή αντίδραση</text><text x="127" y="337" text-anchor="middle" class="t tiny">Καθυστερημένη κρίση</text>
<rect x="35" y="400" width="207" height="84" rx="12" fill="#fff1d9" stroke="#d9a966" stroke-width="3"/><text x="138" y="433" text-anchor="middle" class="t lab">Παρέκκλιση</text><text x="138" y="462" text-anchor="middle" class="t tiny">Από τη λωρίδα</text>
<path d="M230 446l109-10" stroke="#d99649" stroke-width="5" fill="none"/>
<!-- safe response card -->
<rect x="730" y="154" width="400" height="432" rx="22" class="card"/><circle cx="784" cy="215" r="31" fill="#e8b66b"/><path d="M784 197v24m0 13v2" stroke="#603e26" stroke-width="7" stroke-linecap="round"/><text x="832" y="223" class="t lab">Ασφαλής αντίδραση</text>
<rect x="755" y="267" width="351" height="87" rx="13" fill="#e8f3f9"/><text x="774" y="302" class="t lab">1. Αναγνώριση κόπωσης</text><text x="774" y="330" class="t tiny">Δεν αγνοούμε τα συμπτώματα</text>
<rect x="755" y="368" width="351" height="87" rx="13" fill="#e8f3f9"/><text x="774" y="403" class="t lab">2. Ενημέρωση υπηρεσίας</text><text x="774" y="431" class="t tiny">Αναφορά αδυναμίας ασφαλούς οδήγησης</text>
<rect x="755" y="469" width="351" height="87" rx="13" fill="#e5f4eb"/><text x="774" y="503" class="t lab">3. Ασφαλής στάση</text><text x="774" y="533" class="t tiny">Δεν συνεχίζουμε ενώ νυστάζουμε</text>
<text x="580" y="636" text-anchor="middle" class="t sub">Η κόπωση μειώνει την εγρήγορση και αυξάνει τον κίνδυνο σφάλματος.</text></svg>