<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Ενημερωμένη συναίνεση: οπτικό πλαίσιο επαγγελματικής επικοινωνίας</title><desc id="desc">Σχηματική συνομιλία διασώστη και ασθενούς. Ο διασώστης εξηγεί με απλή γλώσσα τι πρόκειται να γίνει και δίνει χώρο για απορίες, ενώ ο ασθενής εκφράζει απόφαση. Το διάγραμμα υπενθυμίζει ότι η αξιολόγηση ικανότητας, οι εξαιρέσεις σε επείγουσες περιστάσεις και η νομιμότητα καθορίζονται από ισχύον πλαίσιο, δεν δίνει απόλυτο κανόνα.</desc><rect width="1200" height="720" fill="#f4f8fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173e55}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.en{font-size:17px;fill:#426d84}.outline{fill:none;stroke:#638fa9;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.lead{fill:none;stroke:#5986a0;stroke-width:4;stroke-linecap:round}.panel{fill:#fff;stroke:#b5cfda;stroke-width:3}</style>
<text x="600" y="49" text-anchor="middle" class="h">Ενημέρωση, κατανόηση και συναίνεση</text>
<text x="600" y="82" text-anchor="middle" class="s">Η ανθρώπινη επικοινωνία γίνεται με σεβασμό και μέσα στα επαγγελματικά όρια</text>
<!-- paramedic -->
<g transform="translate(155 211)"><circle cx="133" cy="71" r="68" fill="#d8eaf4" stroke="#648fa9" stroke-width="5"/><path d="M47 300Q45 182 133 169Q220 180 220 300Z" fill="#d9eaf4" stroke="#648fa9" stroke-width="5"/><path d="M134 198V276M97 238H170" stroke="#c15b68" stroke-width="17"/><text x="133" y="346" text-anchor="middle" class="t">Διασώστης</text></g>
<!-- patient -->
<g transform="translate(771 211)"><circle cx="133" cy="71" r="68" fill="#efe4d8" stroke="#ae9278" stroke-width="5"/><path d="M47 300Q45 182 133 169Q220 180 220 300Z" fill="#efe4d8" stroke="#ae9278" stroke-width="5"/><text x="133" y="346" text-anchor="middle" class="t">Ασθενής</text></g>
<!-- speech balloons -->
<rect x="376" y="165" width="239" height="119" rx="24" fill="#e2f2f5" stroke="#4f849b" stroke-width="4"/>
<path d="M396 283L366 309L410 287" fill="#e2f2f5" stroke="#4f849b" stroke-width="4"/>
<text x="495" y="206" text-anchor="middle" class="s">Εξηγώ τον σκοπό</text><text x="495" y="235" text-anchor="middle" class="s">και ζητώ απορίες</text>
<rect x="620" y="324" width="240" height="115" rx="24" fill="#f7ece1" stroke="#b48b68" stroke-width="4"/>
<path d="M840 434L870 458L824 437" fill="#f7ece1" stroke="#b48b68" stroke-width="4"/>
<text x="740" y="366" text-anchor="middle" class="s">Καταλαβαίνω και</text><text x="740" y="395" text-anchor="middle" class="s">εκφράζω την επιλογή μου</text>
<rect x="109" y="590" width="980" height="85" rx="17" class="panel"/>
<text x="600" y="625" text-anchor="middle" class="s">Η συναίνεση και η ικανότητα απόφασης αξιολογούνται σύμφωνα με το ισχύον πλαίσιο.</text>
<text x="600" y="656" text-anchor="middle" class="en">Οι εξαιρέσεις σε επείγουσες περιστάσεις δεν καλύπτονται από το σχήμα.</text></svg>