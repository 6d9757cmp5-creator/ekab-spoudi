<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Βασικά συμπτώματα – symptoms — Βασικές σχέσεις</title><desc id="desc">Εκπαιδευτικό σχηματικό διάγραμμα για κεφάλαιο 06-08: Pain σημαίνει πόνος, chest pain πόνος στο στήθος, headache πονοκέφαλος, dizziness ζάλη,…; Fever σημαίνει πυρετός και cough βήχας.; SOS · Dizziness = ζάλη· nausea = ναυτία· weakness = αδυναμία· seizure = επιληπτική κρίση.. Δεν αποτελεί ανεξάρτητη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f9fbfd"/><rect width="1100" height="133" fill="#3973a0"/><text x="550" y="36" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 06 · ΚΕΦΑΛΑΙΟ 08</text><text x="550" y="80" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="26" font-family="DejaVu Sans,Arial,sans-serif">Βασικά συμπτώματα – symptoms</text><text x="550" y="184" text-anchor="middle" fill="#3973a0" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές σχέσεις</text><rect x="55" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#3973a0" stroke-width="2.5"/><circle cx="208" cy="315" r="46" fill="#edf4fa" stroke="#3973a0" stroke-width="3"/><path d="M180 315h56m-28-28v56" stroke="#3973a0" stroke-width="3"/><text x="208" y="420" text-anchor="middle" fill="#3973a0" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="208" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Pain σημαίνει πόνος,</text><text x="208" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">chest pain πόνος στο</text><text x="208" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">στήθος, headache</text><text x="208" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">πονοκέφαλος, dizziness</text><text x="208" y="579" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">ζάλη,…</text><rect x="400" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#3973a0" stroke-width="2.5"/><circle cx="553" cy="315" r="46" fill="#edf4fa" stroke="#3973a0" stroke-width="3"/><path d="M525 315h56m-28-28v56" stroke="#3973a0" stroke-width="3"/><text x="553" y="420" text-anchor="middle" fill="#3973a0" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="553" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Fever σημαίνει πυρετός</text><text x="553" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">και cough βήχας.</text><rect x="745" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#3973a0" stroke-width="2.5"/><circle cx="898" cy="315" r="46" fill="#edf4fa" stroke="#3973a0" stroke-width="3"/><path d="M870 315h56m-28-28v56" stroke="#3973a0" stroke-width="3"/><text x="898" y="420" text-anchor="middle" fill="#3973a0" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">3</text><text x="898" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">SOS · Dizziness = ζάλη·</text><text x="898" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">nausea = ναυτία·</text><text x="898" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">weakness = αδυναμία·</text><text x="898" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">seizure = επιληπτική</text><text x="898" y="579" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">κρίση.</text><rect x="55" y="607" width="990" height="62" rx="14" fill="#e4eef7"/><text x="550" y="648" text-anchor="middle" fill="#3973a0" font-weight="650" font-size="20" font-family="DejaVu Sans,Arial,sans-serif">Σχηματική επεξήγηση · συνδύασέ τη με την πλήρη θεωρία.</text></svg>