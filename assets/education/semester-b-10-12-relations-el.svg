<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Αναφυλαξία και σοβαρή αλλεργική αντίδραση — επισήμανση και πρωτόκολλο</title><desc id="d">Τρία διαφορετικά σύμβολα: δέρμα χωρίς υποχρεωτικό εξάνθημα, συσκευή αυτοχορήγησης αδρεναλίνης χωρίς δόση ή οδηγία χρήσης, και έγγραφο εγκεκριμένου πρωτοκόλλου. Συμβουλευτικό εκπαιδευτικό διάγραμμα· εφαρμογή μόνο σύμφωνα με τοπική εκπαίδευση και ισχύον πρωτόκολλο.</desc><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a95550"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#a95550"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 10 · ΚΕΦΑΛΑΙΟ 12</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Αναφυλαξία και σοβαρή αλλεργική αντίδραση</text><circle cx="197" cy="299" r="85" fill="#eef4f8" stroke="#a95550" stroke-width="3"/><path d="M197 248v18m0 0-15 12m15-12 15 12m-15-2v51m0 0-27 28m27-28 27 28m-27-28-21 34m21-34 21 34" fill="none" stroke="#a95550" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M161 263q8-12 16 0t16 0m25 2q8-12 16 0t16 0" fill="none" stroke="#256e91" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 7"/><path d="M197 478L197 361" stroke="#a95550" stroke-width="3.5" marker-end="url(#arr)"/><rect x="48" y="487" width="298" height="93" rx="17" fill="#fff" stroke="#a95550" stroke-width="2"/><text x="197" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#253f52" font-weight="700" text-anchor="middle">Μπορεί να λείπει</text><text x="197" y="552" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#253f52" font-weight="700" text-anchor="middle">το εξάνθημα