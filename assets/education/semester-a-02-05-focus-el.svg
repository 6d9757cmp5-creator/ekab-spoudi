<text x="555" y="592" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#536878" text-anchor="middle">Αντλία Na⁺/K⁺: ATP · Διάχυση και διευκολυνόμενη διάχυση: χωρίς ATP.</text>
