<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d">
<title id="t">Μεμβρανική μεταφορά — διάχυση, αντλία ιόντων και μεταφορέας</title>
<desc id="d">Τρία διαφορετικά διαγράμματα: διάχυση σωματιδίων κατά μήκος της συγκέντρωσης, αντλία νατρίου καλίου που καταναλώνει ATP και μεταφορέας που διευκολύνει τη μετακίνηση γλυκόζης.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347e75"/></marker><marker id="ion" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b25548"/></marker></defs>
