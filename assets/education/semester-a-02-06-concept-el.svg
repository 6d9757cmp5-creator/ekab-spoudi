<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Νευρώνας, νευράξονας και χημική σύναψη</title><desc id="d">Σχηματικός νευρώνας με δενδρίτες, σώμα, μυελινωμένο νευράξονα και τελικά κομβία. Το δυναμικό ενέργειας διαδίδεται κατά μήκος του νευράξονα· στη χημική σύναψη απελευθερώνονται νευροδιαβιβαστές που δεσμεύονται σε υποδοχείς του επόμενου κυττάρου.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347e75"/></marker><marker id="impulse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" height="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd6c34"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#347e75"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="555" y="30" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 06</text><text x="555" y="72" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Νευρική ώση και αντανακλαστικά</text>
