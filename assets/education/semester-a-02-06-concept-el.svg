<!-- anatomy pointers --> <path d="M140 450L190 352" stroke="#347e75" stroke-width="3" marker-end="url(#arr)"/><text x="94" y="480" font-size="17" fill="#253f52" font-weight="700">Σώμα / δενδρίτες</text><path d="M530 450L530 330" stroke="#347e75" stroke-width="3" marker-end="url(#arr)"/><text x="482" y="480" font-size="17" fill="#253f52" font-weight="700">Νευράξονας</text><path d="M874 450L850 323" stroke="#347e75" stroke-width="3" marker-end="url(#arr)"/><text x="845" y="480" font-size="17" fill="#253f52" font-weight="700">Σύναψη</text><text x="555" y="552" font-size="15" fill="#526b78" text-anchor="middle">Η ώση φτάνει στο τελικό άκρο· νευροδιαβιβαστές μεταφέρουν το σήμα στη σύναψη</text><text x="555" y="583" font-size="14" fill="#526b78" text-anchor="middle">Σχηματική τομή, όχι σε κλίμακα</text></g></svg>