<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Νευρική ώση και αντανακλαστικά — Βασικές σχέσεις</title><desc id="desc">Εκπαιδευτικό σχηματικό διάγραμμα για κεφάλαιο 02-06: Οι νευρώνες μεταφέρουν σήματα μέσω μεταβολών του ηλεκτρικού δυναμικού της μεμβράνης. Ένα…; SOS · Η νευρική ώση είναι δυναμικό ενέργειας· οι συνάψεις συνήθως μεταφέρουν σήματα με…; Το αντανακλαστικό είναι ταχεία και σχετικά στερεότυπη απάντηση σε ερέθισμα μέσω…. Δεν αποτελεί ανεξάρτητη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f9fbfd"/><rect width="1100" height="133" fill="#267568"/><text x="550" y="36" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 06</text><text x="550" y="80" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="26" font-family="DejaVu Sans,Arial,sans-serif">Νευρική ώση και αντανακλαστικά</text><text x="550" y="184" text-anchor="middle" fill="#267568" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές σχέσεις</text><rect x="55" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#267568" stroke-width="2.5"/><circle cx="208" cy="315" r="46" fill="#edf4fa" stroke="#267568" stroke-width="3"/><path d="M180 315h56m-28-28v56" stroke="#267568" stroke-width="3"/><text x="208" y="420" text-anchor="middle" fill="#267568" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="208" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Οι νευρώνες μεταφέρουν</text><text x="208" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">σήματα μέσω μεταβολών</text><text x="208" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-s