<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Δευτεροβάθμια εξέταση και ιστορικό τραύματος — Βασικά σημεία</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 14, κεφάλαιο 14: Μετά τις άμεσες απειλές ζωής γίνεται συστηματική επισκόπηση; SOS · Δευτεροβάθμια εξέταση και SAMPLE δεν καθυστερούν αντιμετώπιση απειλών ζωής και αναγκαία…; Χρησιμοποιούνται ιστορικό, παρατήρηση του σώματος και πληροφορίες μάρτυρων, ανάλογα με τη…. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#a55c4d"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦ. 14</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Δευτεροβάθμια εξέταση και ιστορικό τραύματος</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">Βασικά σημεία</text><ellipse cx="555" cy="301" rx="46" ry="53" fill="#edd2ba" stroke="#516f80" stroke-width="3"/><path d="M521 361Q487 373 495 413L507 547L530 544L535 492L546 667L568 667L581 492L593 667L615 667L624 495L630 548L650 544L641 410Q629 373 595 360Z" fill="#dbeaf0" stroke="#516f80" stroke-width="4"/><circle cx="555" cy="403" r="33" fill="#eaa28e" fill-opacity=".55" stroke="#a55c4d" stroke-width="4"/><path d="M555 403L321 287" stroke="#a55c4d" fill="none" stroke-width="2.5"/><text x="242" y="287" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Μετά τις άμεσες απειλές</text><text x="242" y="313" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ζωής γίνεται συστηματική</text><text x="242" y="339" font-size="20" font-weight="650" text-anchor="mi