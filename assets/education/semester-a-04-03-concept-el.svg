<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Πρόληψη και ευάλωτοι πληθυσμοί — Βασικές έννοιες, κεφάλαιο 04-03</title><desc id="d">Πρωτότυπο διάγραμμα του κεφαλαίου 04-03. Περιλαμβάνει Η πρωτογενής πρόληψη αποσκοπεί στην αποφυγή νόσου, η δευτερογενής στην έγκαιρη ανίχνευση και η τριτογενής στη…; Σε ηλικιωμένους, παιδιά, εγκύους και άτομα με χρόνια νοσήματα μπορεί να απαιτείται ιδιαίτερη προσοχή στη συνε…; Ο διασώστης συμβάλλει με ασφαλή πρακτική και ορθή ενημέρωση. Απλουστευμένη οπτική υποστήριξη της θεωρίας, όχι αυτόνομη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f7fafd"/><rect width="1100" height="132" fill="#956b31"/><text x="550" y="34" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">ΣΑΕΚ · Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 04 · ΚΕΦΑΛΑΙΟ 03</text><text x="550" y="79" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">Πρόληψη και ευάλωτοι πληθυσμοί</text><text x="550" y="174" text-anchor="middle" fill="#956b31" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές έννοιες</text><rect x="55" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#956b31" stroke-width="2.5"/><circle cx="207" cy="314" r="52" fill="#e7f0f7" stroke="#956b31" stroke-width="3"/><circle cx="207" cy="314" r="20" fill="none" stroke="#956b31" stroke-width="4"/><text x="207" y="415" text-anchor="middle" fill="#956b31" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">01</text><text x="207" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Η πρωτογενής πρόληψη</text><text x="207" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">αποσκοπεί στην</text><text x="207" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">αποφυγή νόσου, η</text><text x="207" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">δευτερογενής στην</text><rect x="400" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#956b31" stroke-width="2.5"/><circle cx="552" cy="314" r="52" fill="#e7f0f7" stroke="#956b31" stroke-width="3"/><circle cx="552" cy="314" r="27" fill="none" stroke="#956b31" stroke-width="4"/><text x="552" y="415" text-anchor="middle" fill="#956b31" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">02</text><text x="552" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Σε ηλικιωμένους,</text><text x="552" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">παιδιά, εγκύους και</text><text x="552" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">άτομα με χρόνια</text><text x="552" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">νοσήματα μπορεί να</text><rect x="745" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#956b31" stroke-width="2.5"/><circle cx="897" cy="314" r="52" fill="#e7f0f7" stroke="#956b31" stroke-width="3"/><circle cx="897" cy="314" r="34" fill="none" stroke="#956b31" stroke-width="4"/><text x="897" y="415" text-anchor="middle" fill="#956b31" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">03</text><text x="897" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Ο διασώστης συμβάλλει</text><text x="897" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">με ασφαλή πρακτική</text><text x="897" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">και ορθή ενημέρωση</text><rect x="55" y="596" width="990" height="69" rx="16" fill="#e7f0f7"/><text x="550" y="639" text-anchor="middle" fill="#956b31" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Ειδικό εκπαιδευτικό σχήμα · δεν αντικαθιστά την πλήρη θεωρία.</text></svg>