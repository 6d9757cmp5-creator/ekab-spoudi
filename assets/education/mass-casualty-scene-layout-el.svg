<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Οργανωτική επισκόπηση σκηνής μαζικού συμβάντος</title>
<desc id="desc">Σχηματική κάτοψη με τροχαίο πολλών εμπλεκομένων, περιορισμένη περιοχή κινδύνου, σημείο διοίκησης και συντονισμού, χώρο αρχικής εκτίμησης και συγκέντρωσης ασθενών, προετοιμασία μεταφορών με δύο ασθενοφόρα και δρομολόγηση προς κατάλληλα νοσοκομεία. Δεν δείχνει επίσημη χωροθέτηση, ασφαλείς αποστάσεις, χρωματικές κατηγορίες ή θεραπευτικό αλγόριθμο.</desc>
<rect width="1200" height="750" fill="#f3f8fc"/>
<style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163b53}.h{font-size:33px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:18px}.panel{fill:#fff;stroke:#aec9d7;stroke-width:3}.road{fill:#e4ecf2;stroke:#abc2d0;stroke-width:4}.line{fill:none;stroke:#56839a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="600" y="51" text-anchor="middle" class="h">Μαζικό συμβάν · κατόψεις χώρων και συντονισμού</text>
<text x="600" y="84" text-anchor="middle" class="s">Εννοιολογικό σχέδιο — η πραγματική χωροθέτηση ορίζεται από διοίκηση συμβάντος</text>
