<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Οστά του κορμού και των άκρων — Βασικές έννοιες, κεφάλαιο 01-02</title><desc id="d">Πρωτότυπο διάγραμμα του κεφαλαίου 01-02. Περιλαμβάνει Ο αξονικός σκελετός περιλαμβάνει το κρανίο, τη σπονδυλική στήλη, τις πλευρές και το στέρνο; Ο σκελετός των άκρων περιλαμβάνει την ωμική ζώνη, τα οστά των άνω άκρων, την πύελο και τα οστά των κάτω άκρων; Στο άνω άκρο αναγνωρίζουμε βραχιόνιο, κερκίδα και ωλένη. Απλουστευμένη οπτική υποστήριξη της θεωρίας, όχι αυτόνομη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f7fafd"/><rect width="1100" height="132" fill="#286a89"/><text x="550" y="34" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">ΣΑΕΚ · Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 01 · ΚΕΦΑΛΑΙΟ 02</text><text x="550" y="79" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">Οστά του κορμού και των άκρων</text><text x="550" y="174" text-anchor="middle" fill="#286a89" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές έννοιες</text><rect x="55" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#286a89" stroke-width="2.5"/><circle cx="207" cy="314" r="52" fill="#e7f0f7" stroke="#286a89" stroke-width="3"/><circle cx="207" cy="314" r="20" fill="none" stroke="#286a89" stroke-width="4"/><text x="207" y="415" text-anchor="middle" fill="#286a89" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">01</text><text x="207" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Ο αξονικός σκελετός</text><text x="207" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">περιλαμβάνει το</text><text x="207" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">κρανίο, τη σπονδυλική</text><text x="207" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">στήλη, τις πλευρές</text><rect x="400" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#286a89" stroke-width="2.5"/><circle cx="552" cy="314" r="52" fill="#e7f0f7" stroke="#286a89" stroke-width="3"/><circle cx="552" cy="314" r="27" fill="none" stroke="#286a89" stroke-width="4"/><text x="552" y="415" text-anchor="middle" fill="#286a89" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">02</text><text x="552" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Ο σκελετός των άκρων</text><text x="552" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">περιλαμβάνει την</text><text x="552" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">ωμική ζώνη, τα οστά</text><text x="552" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">των άνω άκρων, την</text><rect x="745" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#286a89" stroke-width="2.5"/><circle cx="897" cy="314" r="52" fill="#e7f0f7" stroke="#286a89" stroke-width="3"/><circle cx="897" cy="314" r="34" fill="none" stroke="#286a89" stroke-width="4"/><text x="897" y="415" text-anchor="middle" fill="#286a89" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">03</text><text x="897" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Στο άνω άκρο</text><text x="897" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">αναγνωρίζουμε</text><text x="897" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">βραχιόνιο, κερκίδα</text><text x="897" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">και ωλένη</text><rect x="55" y="596" width="990" height="69" rx="16" fill="#e7f0f7"/><text x="550" y="639" text-anchor="middle" fill="#286a89" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Ειδικό εκπαιδευτικό σχήμα · δεν αντικαθιστά την πλήρη θεωρία.</text></svg>