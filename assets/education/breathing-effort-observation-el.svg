<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Αναπνευστική προσπάθεια: παρατήρηση θώρακα και επικουρικών μυών</title><desc id="desc">Σχηματική σύγκριση αναπνευστικής κίνησης με αυξημένο έργο αναπνοής. Δύο θώρακες σε πρόσθια όψη δείχνουν τραχεία, δύο πνεύμονες, διάφραγμα, κίνηση θωρακικού τοιχώματος και, στη δεύτερη εικόνα, συμμετοχή μυών τραχήλου και εντονότερη αναπνευστική προσπάθεια. Οι εικόνες δεν αρκούν για διάγνωση.</desc><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#17394d}.h{font-size:34px;font-weight:700}.sub{font-size:20px}.label{font-size:23px;font-weight:700}.small{font-size:18px}.card{fill:#fff;stroke:#b7ccda;stroke-width:2.5}.lead{fill:none;stroke:#527e94;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="710" fill="#f4f8fb"/>
<text x="600" y="51" text-anchor="middle" class="h">Παρατήρηση αναπνευστικής προσπάθειας</text>
<text x="600" y="85" text-anchor="middle" class="sub">Ορατή κίνηση θώρακα δεν αποδεικνύει από μόνη της επαρκή αερισμό</text>
<rect x="25" y="124" width="550" height="504" rx="24" class="card"/>
<rect x="625" y="124" width="550" height="504" rx="24" class="card"/>
