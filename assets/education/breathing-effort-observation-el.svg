<text x="300" y="600" text-anchor="middle" class="small">Αρμονική κίνηση θωρακικού τοιχώματος</text>
<text x="900" y="600" text-anchor="middle" class="small">Εντονότερη μυϊκή προσπάθεια</text>
<text x="600" y="664" text-anchor="middle" class="sub">Ελέγχουμε συχνότητα, βάθος, συμμετρία, ήχους και συνολική κλινική εικόνα</text>
<text x="600" y="692" text-anchor="middle" class="small">Ενδεικτικά σχέδια, όχι διαγνωστική κλίμακα ή οδηγίες παρεμβάσεων</text></svg>