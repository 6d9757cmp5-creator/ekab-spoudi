<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Σενάριο παιδιατρικού επείγοντος — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 11. Παρουσιάζονται τρεις διακριτές παράμετροι χωρίς σειρά προτεραιότητας: περιφερική αιμάτωση, ηλικία και βάρος, παιδιατρικός αλγόριθμος. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#64569b"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦΑΛΑΙΟ 11</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Σενάριο παιδιατρικού επείγοντος</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#64569b">Σχέσεις και προτεραιότητες</text><rect x="42" y="300" width="316" height="380" rx="22" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><circle cx="200" cy="394" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><path d="M200 365c-5-9-21-8-24 3-4 15 17 30 24 35 7-5 28-20 24-35-3-11-19-12-24-3z" fill="none" stroke="#64569b" stroke-width="3"/><path d="M178 394h12l5-9 8 18 6-10h13" fill="none" stroke="#64569b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Περιφερική αιμάτωση</text><rect x="432" y="300" width="316" height="380" rx="22" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><circle cx="590" cy="394" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><path d="M570 364v59m0-52h12m-12 14h9m-9 14h12m-12 14h9m24-51v46m-8-42h8m-8 10h8m-8 10h8m-8 10h8m-8 10h8" fil