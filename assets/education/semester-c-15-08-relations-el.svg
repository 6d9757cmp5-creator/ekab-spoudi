<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Ζώνες συμβάντος και ασφάλεια — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 8. Παρουσιάζονται ως διακριτά θέματα: ελεγχόμενη πρόσβαση, κατάλληλα μέσα προστασίας και προσέγγιση από ασφαλή σημεία. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="52" y="265" width="336" height="424" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="220" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΠΡΟΣΒΑΣΗ</text><circle cx="220" cy="406" r="45" fill="#4d7d70"/><path d="M207 406V398C207 391 213 385 220 385C227 385 233 391 233 398V406M202 406H238V430H202Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/><circle cx="220" cy="417" r="3" fill="#ffffff"/><text x="220" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Είσοδος μόνο</text><text x="220" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">από αρμοδίους</text><rect x="422" y="265" width="336" height="424" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><text x="590" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΠΡΟΣΤΑΣΙΑ</text><circle cx="590" cy="406" r="45" fill="#4d7d70"/><path d="M568 405C570 392 579 384 590 384C601 384 610 392 612 405M565 406H615M583 405V393M597 405V393M573 414H607M574 414C574 423 584 424 588 417M592 417C596 424 606 423 606 414" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" f