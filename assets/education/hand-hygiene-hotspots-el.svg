<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Υγιεινή χεριών: επιφάνειες που συχνά παραλείπονται και επιλογή μεθόδου</title><desc id="desc">Πρωτότυπο σχηματικό σχέδιο παλάμης με επισήμανση αντίχειρα, άκρων δακτύλων, μεσοδακτύλιων διαστημάτων και παλάμης. Δίπλα παρουσιάζεται επιλογή αντισηπτικού όταν τα χέρια δεν είναι εμφανώς λερωμένα ή πλύσιμο με σαπούνι και νερό όταν είναι ορατά λερωμένα. Τα γάντια δεν αντικαθιστούν την υγιεινή χεριών.</desc><rect width="1200" height="700" fill="#f4f9fc"/><style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#143a52}.heading{font-size:30px;font-weight:700}.sub{font-size:22px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.panel{fill:#fff;stroke:#b9d0dc;stroke-width:2}.leader{fill:none;stroke:#207b9a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.hot{fill:#f5a45d;stroke:#b85d24;stroke-width:3}.hand{fill:#f2d5bb;stroke:#865d47;stroke-width:4;stroke-linejoin:round}</style><text x="600" y="50" class="heading" text-anchor="middle">Υγιεινή χεριών — σημεία που συχνά παραλείπονται</text><rect class="panel" x="22" y="80" width="700" height="560" rx="20"/><rect class="panel" x="740" y="80" width="438" height="560" rx="20"/><text x="372" y="119" class="sub" text-anchor="middle">Σχηματική παλάμη (όχι σε κλίμακα)</text><path class="hand" d="M340 565 L340 470 C335 440 310 422 292 405 C272 390 255 372 257 356 C260 340 278 338 292 350 L327 373 L316 234 C315 217 325 206 338 208 C350 209 356 219 356 233 L362 353 L365 197 C365 178 376 169 390 172 C402 175 407 187 407 201 L407 349 L421 212 C423 195 435 187 449 191 C462 195 467 208 464 223 L452 359 L472 256 C475 240 488 235 501 240 C514 246 517 260 513 274 L485 407 C475 450 466 470 467 565 Z"/><g class="hot"><ellipse cx="277" cy="360" rx="17" ry="13"/><ellipse cx="338" cy="230" rx="15" ry="14"/><ellipse cx="389" cy="196" rx="16" ry="14"/><ellipse cx="444" cy="213" rx="15" ry="14"/><ellipse cx="494" cy="260" rx="15" ry="13"/><circle cx="360" cy="357" r="9"/><circle cx="413" cy="353" r="9"/><circle cx="456" cy="362" r="9"/></g><g class="leader"><path d="M195 308 L235 330 L277 360"/><path d="M580 198 L505 198 L444 213"/><path d="M535 351 L485 346 L413 353"/><path d="M198 494 L300 474 L390 440"/></g><text x="72" y="295" class="sub" >Αντίχειρας</text><text x="600" y="155" class="sub" >Άκρες</text><text x="600" y="182" class="sub" >δακτύλων</text><text x="520" y="335" class="sub" >Μεσοδακτύλια</text><text x="90" y="483" class="sub" >Παλάμη</text><text x="372" y="606" class="small" text-anchor="middle">Κάλυψε όλες τις επιφάνειες των χεριών.</text><text x="959" y="120" class="sub" text-anchor="middle">Επιλογή κατάστασης</text><rect x="765" y="145" width="388" height="175" rx="15" fill="#e7f5f5" stroke="#9ccbc7" stroke-width="2"/><rect x="791" y="180" width="55" height="94" rx="10" fill="#c5e8eb" stroke="#227e8c" stroke-width="3"/><rect x="802" y="166" width="32" height="16" rx="4" fill="#227e8c"/><path d="M817 160v-12h32" fill="none" stroke="#227e8c" stroke-width="6" stroke-linecap="round"/><text x="868" y="190" class="body" >Χωρίς ορατούς</text><text x="868" y="218" class="body" >ρύπους:</text><text x="868" y="252" class="sub" >αλκοολούχο</text><text x="868" y="281" class="sub" >αντισηπτικό</text><rect x="765" y="337" width="388" height="175" rx="15" fill="#fdf2e9" stroke="#e3bc94" stroke-width="2"/><path d="M788 405h68v32q0 18-34 18t-34-18z" fill="#c8e5f0" stroke="#487b97" stroke-width="4"/><path d="M799 383v-20h37v20" fill="none" stroke="#487b97" stroke-width="6"/><path d="M820 389v20" stroke="#4094c2" stroke-width="5" stroke-linecap="round"/><circle cx="821" cy="416" r="5" fill="#4094c2"/><text x="868" y="382" class="body" >Ορατοί ρύποι:</text><text x="868" y="419" class="sub" >σαπούνι</text><text x="868" y="448" class="sub" >και νερό</text><text x="959" y="552" class="sub" text-anchor="middle">Γάντια ≠ υγιεινή χεριών</text><text x="959" y="581" class="small" text-anchor="middle">Καθάρισε τα χέρια μετά την αφαίρεση.</text><text x="600" y="675" class="small" text-anchor="middle">Εκπαιδευτική σχηματική εικόνα · Ακολούθησε τις ισχύουσες οδηγίες της υπηρεσίας.</text></svg>