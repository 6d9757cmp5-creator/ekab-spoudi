<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Σενάριο σοβαρής αλλεργίας — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 9. Παρουσιάζονται: Άμεση αναγνώριση αναφυλαξίας; Ενεργοποίηση κατάλληλων πόρων; Θεραπεία από εξουσιοδοτημένους. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#64569b"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦΑΛΑΙΟ 09</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Σενάριο σοβαρής αλλεργίας</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#64569b">Σχέσεις και προτεραιότητες</text><path d="M160 399H1020" stroke="#64569b" stroke-width="7" stroke-linecap="round"/><circle cx="200" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><text x="200" y="412" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="760" fill="#64569b">1</text><rect x="42" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="200" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Άμεση αναγνώριση αναφυλαξίας</text><circle cx="590" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><text x="590" y="412" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="760" fill="#64569b">2</text><rect x="432" y="252" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="590" y="303" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Ενεργοποίηση κατάλληλων</text><text x="590" y="332" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">πόρων</text><circle cx="980" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><text x="980" y="412" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="760" fill="#64569b">3</text><rect x="822" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="980" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Θεραπεία από</text><text x="980" y="595" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">εξουσιοδοτημένους</text><rect x="51" y="759" width="1076" height="45" rx="13" fill="#e8eef3"/><text x="590" y="788" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="610" fill="#64569b">Εκπαιδευτική απεικόνιση · συμβουλεύσου την πλήρη θεωρία και τις ισχύουσες οδηγίες.</text></svg>