<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Σενάριο σοβαρής αλλεργίας — Ενέργειες και υποστήριξη</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 9. Παρουσιάζονται: Παράλληλες θεματικές: αναγνώριση σοβαρών συμπτωμάτων; κλήση για βοήθεια; εφαρμογή ισχυουσών οδηγιών. Δεν παρουσιάζεται θεραπευτική σειρά ή δοσολογία. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><circle cx="200" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><path d="M200 371C192 363 178 370 182 383C186 394 200 403 200 403S214 394 218 383C222 370 208 363 200 371Z" fill="none" stroke="#64569b" stroke-width="4" stroke-linejoin="round"/><path d="M184 383H194L199 376L205 390L210 383H216" fill="none" stroke="#64569b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="42" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="200" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Αναγνώριση σοβαρών</text><text x="200" y="595" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">συμπτωμάτων</text><circle cx="590" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><path d="M576 385Q590 373 604 385V403Q604 409 598 409H585L576 416L579 409Q576 408 576 403Z" fill="none" stroke="#64569b" stroke-width="3.5" stroke-linejoin="round"/><path d="M582 391H598M582 398H594" stroke="#64569b" stroke-width="3" stroke-linecap="round"/><rect x="432" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="590" y="558" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Κλήση για βοήθεια</text><circle cx="980" cy="399" r=