<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Ασφάλεια πληρώματος και συνεχής εκπαίδευση — Βασικές σχέσεις</title><desc id="desc">Εκπαιδευτικό σχηματικό διάγραμμα για κεφάλαιο 03-03: Η εργασία στην προνοσοκομειακή φροντίδα ενέχει σωματικούς και ψυχικούς κινδύνους.; Οι ασφαλείς τεχνικές μεταφοράς, τα μέσα ατομικής προστασίας και η αναγνώριση επικίνδυνων…; Η επιμόρφωση στις νέες οδηγίες είναι ουσιώδης, επειδή οι κλινικές συστάσεις και ο…. Δεν αποτελεί ανεξάρτητη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f9fbfd"/><rect width="1100" height="133" fill="#755ba4"/><text x="550" y="36" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 03 · ΚΕΦΑΛΑΙΟ 03</text><text x="550" y="80" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="26" font-family="DejaVu Sans,Arial,sans-serif">Ασφάλεια πληρώματος και συνεχής εκπαίδευση</text><text x="550" y="184" text-anchor="middle" fill="#755ba4" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές σχέσεις</text><rect x="55" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#755ba4" stroke-width="2.5"/><circle cx="208" cy="315" r="46" fill="#edf4fa" stroke="#755ba4" stroke-width="3"/><path d="M180 315h56m-28-28v56" stroke="#755ba4" stroke-width="3"/><text x="208" y="420" text-anchor="middle" fill="#755ba4" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="208" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Η εργασία στην</text><text x="208" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">προνοσοκομειακή φροντίδα</text><text x="208" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">ενέχει σωματικούς και</text><text x="208" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">ψυχικούς κινδύνους.</text><rect x="400" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#755ba4" stroke-width="2.5"/><circle cx="553" cy="315" r="46" fill="#edf4fa" stroke="#755ba4" stroke-width="3"/><path d="M525 315h56m-28-28v56" stroke="#755ba4" stroke-width="3"/><text x="553" y="420" text-anchor="middle" fill="#755ba4" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="553" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Οι ασφαλείς τεχνικές</text><text x="553" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">μεταφοράς, τα μέσα</text><text x="553" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">ατομικής προστασίας και</text><text x="553" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">η αναγνώριση</text><text x="553" y="579" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">επικίνδυνων…</text><rect x="745" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#755ba4" stroke-width="2.5"/><circle cx="898" cy="315" r="46" fill="#edf4fa" stroke="#755ba4" stroke-width="3"/><path d="M870 315h56m-28-28v56" stroke="#755ba4" stroke-width="3"/><text x="898" y="420" text-anchor="middle" fill="#755ba4" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">3</text><text x="898" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Η επιμόρφωση στις νέες</text><text x="898" y="495" text-anchor="middle" fil