<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Ζωτικά σημεία — πρώτη γνωριμία — Βασικές έννοιες, κεφάλαιο 05-03</title><desc id="d">Πρωτότυπο διάγραμμα του κεφαλαίου 05-03. Περιλαμβάνει Καταγράφονται οι μεταβολές σε αναπνευστική συχνότητα, σφυγμό, αρτηριακή πίεση, επίπεδο συνείδησης, θερμοκρασί…; Η επανεκτίμηση είναι συνεχής διαδικασία, ιδιαίτερα όταν η κατάσταση αλλάζει ή μετά από παρέμβαση; Η τάση των τιμών μαζί με την κλινική εικόνα είναι σημαντικότερη από μεμονωμένο αριθμό. Απλουστευμένη οπτική υποστήριξη της θεωρίας, όχι αυτόνομη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f7fafd"/><rect width="1100" height="132" fill="#ae5448"/><text x="550" y="34" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">ΣΑΕΚ · Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 05 · ΚΕΦΑΛΑΙΟ 03</text><text x="550" y="79" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">Ζωτικά σημεία — πρώτη γνωριμία</text><text x="550" y="174" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές έννοιες</text><rect x="55" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#ae5448" stroke-width="2.5"/><circle cx="207" cy="314" r="52" fill="#e7f0f7" stroke="#ae5448" stroke-width="3"/><circle cx="207" cy="314" r="20" fill="none" stroke="#ae5448" stroke-width="4"/><text x="207" y="415" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">01</text><text x="207" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Καταγράφονται οι</text><text x="207" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">μεταβολές σε</text><text x="207" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">αναπνευστική</text><text x="207" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">συχνότητα, σφυγμό,</text><rect x="400" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#ae5448" stroke-width="2.5"/><circle cx="552" cy="314" r="52" fill="#e7f0f7" stroke="#ae5448" stroke-width="3"/><circle cx="552" cy="314" r="27" fill="none" stroke="#ae5448" stroke-width="4"/><text x="552" y="415" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">02</text><text x="552" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Η επανεκτίμηση είναι</text><text x="552" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">συνεχής διαδικασία,</text><text x="552" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">ιδιαίτερα όταν η</text><text x="552" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">κατάσταση αλλάζει ή</text><rect x="745" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#ae5448" stroke-width="2.5"/><circle cx="897" cy="314" r="52" fill="#e7f0f7" stroke="#ae5448" stroke-width="3"/><circle cx="897" cy="314" r="34" fill="none" stroke="#ae5448" stroke-width="4"/><text x="897" y="415" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">03</text><text x="897" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Η τάση των τιμών μαζί</text><text x="897" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">με την κλινική εικόνα</text><text x="897" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">είναι σημαντικότερη</text><text x="897" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">από μεμονωμένο αριθμό</text><rect x="55" y="596" width="990" height="69" rx="16" fill="#e7f0f7"/><text x="550" y="639" text-anchor="middle" fill="#ae5448" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Ειδικό εκπαιδευτικό σχήμα · δεν αντικαθιστά την πλήρη θεωρία.</text></svg>