<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" role="img" aria-labelledby="title desc"><title id="title">Μετάδοση επιχειρησιακών δεδομένων από την επείγουσα κλήση στο πλήρωμα</title><desc id="desc">Σχηματική απεικόνιση τηλεφωνητή σε κονσόλα με εντοπισμένη διεύθυνση, αριθμό ασθενών και κίνδυνο ολισθηρού οδοστρώματος, προς ασθενοφόρο μέσω ραδιοεπικοινωνίας. Η πληροφορία ως αναφορά διακρίνεται από επιβεβαιωμένο γεγονός.</desc><rect width="1160" height="700" fill="#f5f9fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#17394d}.heading{font-size:30px;font-weight:750}.sub{font-size:19px}.tag{font-size:22px;font-weight:700}.note{font-size:17px}.line{stroke:#277699;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#b8ccd8;stroke-width:2}.arrow{fill:#247b91}</style><text x="580" y="51" text-anchor="middle" class="heading">Από την επείγουσα κλήση στο πλήρωμα</text><text x="580" y="87" text-anchor="middle" class="sub">Συνοπτικά στοιχεία που βοηθούν την ασφαλή προσέγγιση</text>
<rect x="42" y="144" width="337" height="405" rx="25" fill="#e1eff6" stroke="#608ea6" stroke-width="4"/><rect x="66" y="175" width="289" height="184" rx="17" fill="#fff" stroke="#7aa4b6" stroke-width="3"/><path d="M106 197v127m48-127v127m48-127v127m48-127v127m48-127v127M82 230h257M82 278h257" stroke="#d5e4e9" stroke-width="6"/><path d="M221 223c-18 0-32 16-32 32 0 23 32 56 32 56s32-33 32-56c0-16-14-32-32-32z" fill="#db595a"/><circle cx="221" cy="256" r="11" fill="#fff"/><text x="210" y="385" text-anchor="middle" class="tag">Επαληθευμένη θέση</text><path d="M140 452c-12-26-3-51 18-60m-18 60c15 26 42 33 61 27" stroke="#365f7d" stroke-width="14" fill="none" stroke-linecap="round"/><circle cx="179" cy="438" r="21" fill="#5f98b3"/><text x="210" y="521" text-anchor="middle" class="sub">Κέντρο λήψης κλήσης</text>
<rect x="425" y="132" width="345" height="428" rx="22" class="panel"/><text x="597" y="174" text-anchor="middle" class="tag">Στοιχεία αποστολής</text>
<rect x="448" y="196" width="299" height="64" rx="10" fill="#e5f4ec" stroke="#8bbfa0"/><text x="461" y="223" class="sub">Σημείο και είσοδος</text><text x="461" y="248" class="note">Οδός, αριθμός, πρόσβαση</text>
<rect x="448" y="270" width="299" height="64" rx="10" fill="#e7f1fa" stroke="#9ebfd5"/><text x="461" y="297" class="sub">Πλήθος ασθενών</text><text x="461" y="323" class="note">Όσα γνωρίζουμε έως τώρα</text>
<rect x="448" y="344" width="299" height="64" rx="10" fill="#fff0db" stroke="#dabb8a"/><text x="461" y="371" class="sub">Κίνδυνοι σκηνής</text><text x="461" y="397" class="note">Π.χ. ολισθηρό οδόστρωμα</text>
<rect x="448" y="418" width="299" height="104" rx="10" fill="#fbe9e8" stroke="#d6aaaa"/><text x="461" y="445" class="sub">Αναφορά ≠ διάγνωση</text><text x="461" y="472" class="note">Λέμε «ο καλών αναφέρει»</text><text x="461" y="497" class="note">όταν δεν έχει επιβεβαιωθεί</text>
<path d="M381 336H417" class="line"/><path d="M407 324l12 12-12 12" class="line"/>
<path d="M771 336H820" stroke="#267699" stroke-width="6" stroke-dasharray="12 8"/><path d="M807 325l13 11-13 11" class="line"/>
<rect x="828" y="180" width="290" height="329" rx="25" fill="#e5f0f5" stroke="#a6becc" stroke-width="3"/><path d="M903 238l33-44 27 44" class="line"/><circle cx="935" cy="192" r="10" fill="#db6c65"/><path d="M893 191c17-28 68-28 85 0m-96-21c27-40 88-40 106 0" stroke="#2785a5" stroke-width="4" fill="none"/>
<rect x="864" y="341" width="212" height="103" rx="15" fill="#fff" stroke="#3c6c83" stroke-width="4"/><path d="M863 404h213" stroke="#d96d70" stroke-width="17"/><path d="M944 365v42m-21-21h42" stroke="#dc676b" stroke-width="12" stroke-linecap="round"/><circle cx="899" cy="445" r="20" fill="#35566a"/><circle cx="1041" cy="445" r="20" fill="#35566a"/><text x="973" y="475" text-anchor="middle" class="sub">Πλήρωμα ασθενοφόρου</text>
<text x="580" y="609" text-anchor="middle" class="sub">Αλλαγές της κατάστασης διαβιβάζονται με το εγκεκριμένο σύστημα επικοινωνίας.</text></svg>