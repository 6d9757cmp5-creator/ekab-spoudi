<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Επιληπτική κρίση και μετακριτική παρατήρηση</title><desc id="desc">Δύο εικόνες εγκεφάλου. Στην πρώτη σχηματικά έντονα νευρωνικά ηλεκτρικά σήματα, στη δεύτερη περίοδος παρατήρησης και σταδιακής ανάκτησης ανταπόκρισης με ρολόι. Οι απεικονίσεις δεν είναι πραγματικό ηλεκτροεγκεφαλογράφημα ή οδηγία αντιμετώπισης κρίσεων.</desc><rect width="1200" height="710" fill="#f4f8fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163a52}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.sub{font-size:17px}.line{fill:none;stroke:#587e9c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#b9d2df;stroke-width:3}</style>
<text x="600" y="49" class="h" text-anchor="middle">Επιληπτική κρίση και μετακριτική περίοδος</text>
<text x="600" y="85" class="s" text-anchor="middle">Οι μεταβολές συνείδησης απαιτούν παρακολούθηση και κλινική αξιολόγηση</text>
