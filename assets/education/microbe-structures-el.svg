<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Δομή βακτηρίου, ελυτροφόρου ιού και ζυμομύκητα</title>
<desc id="desc">Τρία ανεξάρτητα σχηματικά παραδείγματα: βακτήριο με τοίχωμα, ριβοσώματα και νουκλεοειδές, ελυτροφόρος ιός με ακίδες, καψίδιο και γονιδίωμα, και ζυμομύκητας με πυρήνα και εκβλάστηση. Δεν είναι στην ίδια κλίμακα.</desc>
<style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#16364d}.head{font-size:25px;font-weight:700}.sub{font-size:17px}.label{font-size:18px}.panel{fill:#fff;stroke:#c8d7e3;stroke-width:2}.lead{fill:none;stroke:#28465f;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#265e89}</style>
<rect width="1200" height="590" fill="#f4f8fc"/><text x="600" y="40" text-anchor="middle" class="head">Βακτήριο · Ιός · Μύκητας: διαφορετική βιολογική δομή</text>
<g><rect class="panel" x="16" y="70" width="378" height="492" rx="16"/><text x="205" y="111" text-anchor="middle" class="head">Βακτήριο</text><text x="205" y="138" text-anchor="middle" class="sub">Προκαρυωτικό κύτταρο</text>
<rect x="63" y="195" width="284" height="144" rx="72" fill="#d2a66a" stroke="#91632f" stroke-width="4"/><rect x="75" y="207" width="260" height="120" rx="60" fill="#bce7d2" stroke="#34856a" stroke-width="3"/>
<path d="M145 260q20 -39 52 0t48 0q25 -25 39 4t-35 22q-22 -18 -49 7t-51 -5" fill="none" stroke="#853d80" stroke-width="7" stroke-linecap="round"/>
<g class="dot"><circle cx="120" cy="235" r="5"/><circle cx="285" cy="242" r="5"/><circle cx="121" cy="298" r="5"/><circle cx="270" cy="306" r="5"/><circle cx="157" cy="315" r="5"/><circle cx="295" cy="280" r="5"/></g>
<path class="lead" d="M194 282L177 370L54 370"/><circle cx="194" cy="282" r="4" fill="#853d80"/><text x="54" y="394" class="label">Νουκλεοειδές (DNA)</text>
<path class="lead" d="M285 242L305 418L54 418"/><circle cx="285" cy="242" r="4" fill="#265e89"/><text x="54" y="442" class="label">Ριβοσώματα</text>
<path class="lead" d="M92 210L85 467L54 467"/><circle cx="92" cy="210" r="4" fill="#91632f"/><text x="54" y="491" class="label">Κυτταρικό τοίχωμα</text></g>
<g><rect class="panel" x="411" y="70" width="378" height="492" rx="16"/><text x="600" y="111" text-anchor="middle" class="head">Ιός με έλυτρο</text><text x="600" y="138" text-anchor="middle" class="sub">Ακυτταρικό σωματίδιο</text>
<circle cx="600" cy="267" r="91" fill="#e9b5be" stroke="#b35e73" stroke-width="5"/>
<g stroke="#a8425e" stroke-width="7" stroke-linecap="round"><path d="M600 176v-23M600 358v23M509 267h-23M691 267h23M535 202l-17 -17M665 332l17 17M665 202l17 -17M535 332l-17 17"/></g>
<circle cx="600" cy="267" r="57" fill="#fff1d6" stroke="#d09539" stroke-width="5"/>
<path d="M567 258q18 -34 37 0t31 0q-13 42 -37 18t-28 16" fill="none" stroke="#604e9b" stroke-width="6" stroke-linecap="round"/>
<path class="lead" d="M486 267L465 377L449 377"/><circle cx="486" cy="267" r="4" fill="#a8425e"/><text x="449" y="401" class="label">Επιφανειακές ακίδες</text>
<path class="lead" d="M654 267L707 420L449 420"/><circle cx="654" cy="267" r="4" fill="#d09539"/><text x="449" y="444" class="label">Πρωτεϊνικό καψίδιο</text>
<path class="lead" d="M595 267L630 466L449 466"/><circle cx="595" cy="267" r="4" fill="#604e9b"/><text x="449" y="490" class="label">Γονιδίωμα: DNA ή RNA</text></g>
<g><rect class="panel" x="806" y="70" width="378" height="492" rx="16"/><text x="995" y="111" text-anchor="middle" class="head">Ζυμομύκητας</text><text x="995" y="138" text-anchor="middle" class="sub">Ευκαρυωτικό κύτταρο</text>
<ellipse cx="980" cy="270" rx="94" ry="109" fill="#e6c9f2" stroke="#8b5ca3" stroke-width="8"/><ellipse cx="980" cy="270" rx="84" ry="99" fill="none" stroke="#c49ad8" stroke-width="3"/>
