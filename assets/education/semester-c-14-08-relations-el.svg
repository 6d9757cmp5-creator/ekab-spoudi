<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Κοιλιακό και πυελικό τραύμα — Σημεία αξιολόγησης και τεκμηρίωσης</title><desc id="d">Τρία παράλληλα θέματα: εκτίμηση δέρματος και ζωτικών σημείων, αποφυγή άσκοπης μετακίνησης και καταγραφή μηχανισμού κάκωσης. Δεν υποδεικνύεται σειρά ενεργειών και το σχήμα δεν αποτελεί τοπικό κλινικό πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><g fill="#fff" stroke="#a75749" stroke-width="3"><rect x="42" y="286" width="340" height="360" rx="24"/><rect x="420" y="286" width="340" height="360" rx="24"/><rect x="798" y="286" width="340" height="360" rx="24"/></g><circle cx="212" cy="382" r="50" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><path d="M195 354h34a7 7 0 0 1 7 7v44h-48v-44a7 7 0 0 1 7-7Z" fill="#fff" stroke="#506b82" stroke-width="5"/><path d="M203 354v-7h18v7m-25 25h9l6-10 7 20 6-10h8" fill="none" stroke="#a75749" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="590" cy="382" r="50" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><path d="M590 350v62m-13-49 13 8 13-8m-13 31-13 8m13-8 13 8" fill="none" stroke="#506b82" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M558 370v26m-7-19 7-7 7 7m57 17v-26m-7 7 7-7 7 7" fill="none" stroke="#a75749" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M580 382l10-8 10 8" fill="none" stroke="#a75749" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="968" cy="382" r="50" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><path d="M946 353h31l15 15v44h-49a7 7 0 0 1-7-7v-45a7 7 0 0 1 10-7Z" fill="#fff" stroke="#506b82" stroke-width="5" stroke-linejoin="round"/><path d="M977 354v16h15m-39 5h27m-27 12h27m-27 12h17" fill="none" stroke="#a75749" stroke-width="4" stroke-linecap="round"/><text x="212" y="482" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="720"