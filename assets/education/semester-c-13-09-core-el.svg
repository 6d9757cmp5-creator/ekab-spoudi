<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Αναβάθμιση προτεραιότητας συμβάντος — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 13, κεφάλαιο 9. Παρουσιάζονται: Νέα απώλεια συνείδησης; Αλλαγή στην αναπνοή; Σοβαρή αιμορραγία. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#256e91"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 13 · ΚΕΦΑΛΑΙΟ 09</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Αναβάθμιση προτεραιότητας συμβάντος</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#256e91">Σημεία αναγνώρισης</text><g fill="#ffffff" stroke="#256e91" stroke-width="2.8"><rect x="42" y="286" width="340" height="360" rx="22"/><rect x="420" y="286" width="340" height="360" rx="22"/><rect x="798" y="286" width="340" height="360" rx="22"/></g>
