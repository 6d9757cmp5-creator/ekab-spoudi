<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Απλό σωματικό αντανακλαστικό τόξο</title><desc id="d">Ερέθισμα ενεργοποιεί αισθητικό υποδοχέα. Ο αισθητικός νευρώνας μεταφέρει σήμα στον νωτιαίο μυελό, όπου το κύκλωμα το ενσωματώνει. Κινητικός νευρώνας μεταφέρει εντολή προς σκελετικό μυ και προκαλεί απόκριση. Απλοποιημένο αντανακλαστικό τόξο.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347e75"/></marker><marker id="sens" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" height="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3277a5"/></marker><marker id="motor" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" height="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd6c34"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#347e75"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="555" y="30" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 06</text><text x="555" y="72" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Νευρική ώση και αντανακλαστικά</text>
<!-- receptor --> <path d="M95 241Q120 223 145 241V361H95Z" fill="#f0d9cd" stroke="#bd927b" stroke-width="3"/><path d="M120 262V315M108 277L120 292L132 277" fill="none" stroke="#bd6c34" stroke-width="4" stroke-linecap="round"/><text x="120" y="397" font-size="16" fill="#253f52" font-weight="700" text-anchor="middle">Υποδοχέας</text>
<!-- spinal cord transverse section --> <ellipse cx="558" cy="303" rx="110" ry="146" fill="#eef0f4" stroke="#7b8192" stroke-width="4"/><path d="M558 225Q518 247 520 282Q523 300 548 303Q520 312 520 341Q521 365 558 383Q595 365 596 341Q596 312 568 303Q593 300 596 282Q598 247 558 225Z" fill="#ddcfe1" stroke="#9b83a4" stroke-width="3"/><circle cx="558" cy="303" r="8" fill="#7b8192"/><text x="558" y="490" font-size="17" fill="#253f52" font-weight="700" text-anchor="middle">Νωτιαίος μυελός</text>
<!-- afferent sensory route to dorsal side --> <path d="M150 276C264 218 361 218 458 256" fill="none" stroke="#3277a5" stroke-width="5" marker-end="url(#sens)"/><path d="M458 256L518 277" fill="none" stroke="#3277a5" stroke-width="5" marker-end="url(#sens)"/><text x="302" y="206" font-size="16" fill="#2c6687" font-weight="700" text-anchor="middle">Αισθητικός νευρώνας</text>
<!-- interneuron connection inside cord --> <path d="M540 279L562 319" stroke="#847194" stroke-width="5"/><circle cx="540" cy="279" r="7" fill="#847194"/><circle cx="562" cy="319" r="7" fill="#847194"/>
<!-- efferent motor route --> <path d="M598 333C698 383 769 385 855 338" fill="none" stroke="#bd6c34" stroke-width="5" marker-end="url(#motor)"/><text x="729" y="424" font-size="16" fill="#8c4a28" font-weight="700" text-anchor="middle">Κινητικός νευρώνας</text>
<!-- skeletal muscle --> <rect x="879" y="267" width="144" height="96" rx="28" fill="#d88e82" stroke="#9e5c55" stroke-width="3"/><g stroke="#a45f57" stroke-width="3"><path d="M906 279V351M927 275V355M948 275V355M969 275V355M990 279V351"/></g><text x="951" y="397" font-size="16" fill="#253f52" font-weight="700" text-anchor="middle">Σκελετικός μυς</text><text x="951" y="420" font-size="14" fill="#526b78" text-anchor="middle">κινητική απόκριση</text>

<text x="555" y="548" font-size="15" fill="#526b78" text-anchor="middle">Υποδοχέας → αισθητική οδός → νωτιαίος μυελός → κινητική οδός → μυς</text><text x="555" y="579" font-size="14" fill="#526b78" text-anchor="middle">Απλουστευμένο αντανακλαστικό τόξο· δεν αποτελεί πλήρη νευρολογική εκτίμηση</text></g></svg>