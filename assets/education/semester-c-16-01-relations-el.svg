<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Γιατί χρησιμοποιούμε πρωτόκολλα — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 1. Παρουσιάζονται: Αναγνώριση συγκεκριμένου ευρήματος; Έγκαιρη κλιμάκωση; Ενημέρωση συντονισμού. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#64569b"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦΑΛΑΙΟ 01</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Γιατί χρησιμοποιούμε πρωτόκολλα</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#64569b">Σχέσεις και προτεραιότητες</text><circle cx="200" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><circle cx="193" cy="392" r="16" fill="none" stroke="#64569b" stroke-width="5"/><path d="M205 404L219 418" stroke="#64569b" stroke-width="6" stroke-linecap="round"/><rect x="42" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="200" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Αναγνώριση συγκεκριμένου</text><text x="200" y="595" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">ευρήματος</text><circle cx="590" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><path d="M590 426V374M572 392L590 374L608 392" fill="none" stroke="#64569b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="432" y="515" width="316" height="169" rx="21" fill="#