<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d"><title id="t">Ενεργοποίηση πρόσθετων υπηρεσιών — Αντικείμενο και βασικά στοιχεία</title><desc id="d">Αυτόνομο εκπαιδευτικό διάγραμμα του Β΄ εξαμήνου, μάθημα 7, κεφάλαιο 6. Οι τρεις θεματικές έννοιες είναι: Τροχαίο με εγκλωβισμό; Πυρκαγιά ή ύποπτη βία; Χημική ή άλλη έκθεση. Χρειάζεται έλεγχος ειδικού για κλινικές πράξεις.</desc><rect width="1100" height="720" fill="#f8fbfe"/><rect width="1100" height="141" fill="#2a667e"/><text x="550" y="31" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 07 · ΚΕΦ. 06</text><text x="550" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="750" text-anchor="middle" fill="#ffffff">Ενεργοποίηση πρόσθετων υπηρεσιών</text><text x="550" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="740" text-anchor="middle" fill="#2a667e">Αντικείμενο και βασικά στοιχεία</text><rect x="45" y="230" width="313" height="368" rx="26" fill="#ffffff" stroke="#2a667e" stroke-width="2.5"/><circle cx="201" cy="322" r="68" fill="#edf4f9" stroke="#2a667e" stroke-width="2"/><g transform="translate(201 322)" fill="none" stroke="#2a667e" stroke-width="5"><rect x="-42" y="-43" width="84" height="87" rx="16"/><path d="M-21-20q10 37 44 40M-24-21l10-9m37 52 10-10"/><circle cx="-16" cy="36" r="3" fill="#2a667e"/></g><rect x="146" y="401" width="110" height="43" rx="20" fill="#2a667e"/><text x="201" y="428" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="740" text-anchor="middle" fill="#ffffff">ΣΤΟΙΧΕΙΟ 1</text><text x="201" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" text-anchor="middle" fill="#243d50">Τροχαίο με εγκλωβισμό</text><path d="M361 352h33" stroke="#2a667e" stroke-width="3.5"/><path d="M382 343l12 9-12 9" fill="none" stroke="#2a667e" stroke-width="3"/><rect x="399" y=