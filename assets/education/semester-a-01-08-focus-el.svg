<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Κρανίο, εγκέφαλος και μήνιγγες — Ειδική επανάληψη</title><desc id="desc">Εκπαιδευτικό σχηματικό διάγραμμα για κεφάλαιο 01-08: Κρανίο: οστέινη προστασία εγκεφάλου; Σκληρά, αραχνοειδής και χοριοειδής μήνιγγα; Νωτιαίος μυελός: συνέχεια του κεντρικού νευρικού συστήματος. Δεν αποτελεί ανεξάρτητη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f9fbfd"/><rect width="1100" height="133" fill="#286a89"/><text x="550" y="36" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 01 · ΚΕΦΑΛΑΙΟ 08</text><text x="550" y="80" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="26" font-family="DejaVu Sans,Arial,sans-serif">Κρανίο, εγκέφαλος και μήνιγγες</text><text x="550" y="184" text-anchor="middle" fill="#286a89" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Ειδική επανάληψη</text><rect x="60" y="249" width="310" height="214" rx="25" fill="#fff" stroke="#286a89" stroke-width="3"/><rect x="180" y="236" width="70" height="30" rx="14" fill="#286a89"/><text x="215" y="258" text-anchor="middle" fill="#fff" font-weight="700" font-size="17" font-family="DejaVu Sans,Arial,sans-serif">01</text><text x="215" y="322" text-anchor="middle" fill="#20394e" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Κρανίο: οστέινη προστασία</text><text x="215" y="352" text-anchor="middle" fill="#20394e" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">εγκεφάλου</text><rect x="407" y="295" width="310" height="214" rx="25" fill="#edf4fa" stroke="#286a89" stroke-width="3"/><rect x="527" y="282" width="70" height="30" rx="14" fill="#286a89"/><text x="562" y="304" text-anchor="middle" fill="#fff" font-weight="700" font-size="17" font-family="DejaVu Sans,Arial,sans-serif">02</text><text x="562" y="368" text-anchor="middle" fill="#20394e" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Σκληρά, αραχνοειδής και</text><text x="562" y="398" text-anchor="middle" fill="#20394e" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">χοριοειδής μήνιγγα</text><rect x="754" y="249" width="310" height="214" rx="25" fill="#fff" stroke="#286a89" stroke-width="3"/><rect x="874" y="236" width="70" height="30" rx="14" fill="#286a89"/><text x="909" y="258" text-anchor="middle" fill="#fff" font-weight="700" font-size="17" font-family="DejaVu Sans,Arial,sans-serif">03</text><text x="909" y="322" text-anchor="middle" fill="#20394e" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Νωτιαίος μυελός: συνέχεια</text><text x="909" y="352" text-anchor="middle" fill="#20394e" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">του κεντρικού νευρικού</text><text x="909" y="382" text-anchor="middle" fill="#20394e" font-weight="700" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">συστήματος</text><rect x="55" y="607" width="990" height="62" rx="14" fill="#e4eef7"/><text x="550" y="648" text-anchor="middle" fill="#286a89" font-weight="650" font-size="20" font-family="DejaVu Sans,Arial,sans-serif">Σχηματική επεξήγηση · συνδύασέ τη με την πλήρη θεωρία.</text></svg>