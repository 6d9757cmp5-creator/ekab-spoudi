<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Καταγραφή κρίσιμων αλλαγών — Βασικά σημεία</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 16, κεφάλαιο 2: Σε κάθε συχνό επείγον όπως δύσπνοια, θωρακικό άλγος, διαταραχή συνείδησης ή τραύμα…; Η επιβεβαίωση της επικοινωνίας με τον φορέα υποδοχής βοηθά στη συνέχεια της περίθαλψης.; Η επανεκτίμηση συνδέει τα νέα κλινικά στοιχεία με τις προηγούμενες μετρήσεις.. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#66569b"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦ. 02</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Καταγραφή κρίσιμων αλλαγών</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">Βασικά σημεία</text><polygon points="556,251 769,386 556,510 343,386" fill="#efedf9" stroke="#66569b" stroke-width="4"/><text x="556" y="381" font-size="25" font-weight="730" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΚΛΙΝΙΚΗ</text><text x="556" y="414" font-size="25" font-weight="730" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΕΚΤΙΜΗΣΗ</text><path d="M462 501L196 572" stroke="#66569b" stroke-width="3"/><rect x="48" y="567" width="296" height="141" rx="19" fill="#ffffff" stroke="#66569b" stroke-width="2.5"/><text x="196" y="606" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Σε κάθε συχνό επείγον</text><text x="196" y="633" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">όπως δύσπνοια, θωρακικό</text><text x="196" y="660" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">άλγος, διαταραχή</text><text x="196" y="687" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">συνείδησης ή τραύμα…</text><path d="M556 501L556 572" stroke="#66569b" stroke-width="3"/><rect x="408" y="567" width="296" height="141" rx="19" fill="#ffffff" stroke="#66569b" stroke-width="2.5"/><text x="556" y="606" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η επιβεβαίωση της</text><text x="556" y="633" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">επικοινωνίας με τον φορέα</text><text x="556" y="660" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">υποδοχής βοηθά στη</text><text x="556" y="687" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">συνέχεια της περίθαλψης.</text><path d="M650 501L916 572" stroke="#66569b" stroke-width="3"/><rect x="768" y="567" width="296" height="141" rx="19" fill="#ffffff" stroke="#66569b" stroke-width="2.5"/><text x="916" y="606" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η επανεκτίμηση συνδέει τα</text><text x="916" y="633" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">νέα κλινικά στοιχεία με</text><text x="916" y="660" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">τις προηγούμενες</text><text x="916" y="687" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">μετρήσεις.</text><rect x="53" y="733" width="1005" height="40" rx="12" fill="#e5edf3"/><text x="555" y="760" font-size="16" font-weight="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">Σχηματική εικόνα από τη θεωρία · όχι αυτόνομο κλινικό ή υπηρεσιακό πρωτόκολλο.</text></svg>