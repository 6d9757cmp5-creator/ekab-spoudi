<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Καθαρισμός, απολύμανση και αποστείρωση: τρεις διαφορετικοί στόχοι</title><desc id="desc">Τρεις πίνακες δείχνουν σχηματικά την αφαίρεση ρύπων και μέρους των μικροοργανισμών με καθαρισμό, τη μείωση μικροοργανισμών με κατάλληλη απολύμανση και τον στόχο επικυρωμένης αποστείρωσης. Τα μικρόβια είναι συμβολικά, δεν δείχνουν αριθμητική αποτελεσματικότητα.</desc><rect width="1200" height="650" fill="#f5f9fc"/><style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#153a52}.heading{font-size:32px;font-weight:bold}.label{font-size:27px;font-weight:bold}.small{font-size:19px}.panel{fill:#fff;stroke:#b6cbd9;stroke-width:2}.surface{fill:#d9e9f1;stroke:#47758d;stroke-width:4}.microbe{fill:#d66c50;stroke:#8b3828;stroke-width:2}.dirt{fill:#9b7c5a}.arrow{fill:none;stroke:#247b9c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style><text x="600" y="52" text-anchor="middle" class="heading">Καθαρισμός ≠ Απολύμανση ≠ Αποστείρωση</text>
<g transform="translate(22 90)"><rect class="panel" width="370" height="485" rx="20"/><text class="label" x="185" y="44" text-anchor="middle">1. Καθαρισμός</text><rect class="surface" x="40" y="120" width="125" height="80" rx="10"/><path class="dirt" d="M52 138q22-25 35 4t30-2t30 25q-32 20-75 7Z"/><g class="microbe"><circle cx="145" cy="185" r="8"/><circle cx="95" cy="189" r="7"/></g><path class="arrow" d="M180 163h48m-14-12 14 12-14 12"/><rect class="surface" x="245" y="120" width="88" height="80" rx="10"/><path d="M257 147l60-20m-60 36 60-20m-60 36 60-20" stroke="#79b2cb" stroke-width="7"/><circle class="microbe" cx="319" cy="186" r="7"/><text x="185" y="254" class="small" text-anchor="middle">Αφαίρεση ρύπων και μικροβίων</text><text x="185" y="284" class="small" text-anchor="middle">και οργανικού υλικού</text><text x="185" y="338" class="small" text-anchor="middle">Με νερό / απορρυπαντικό</text><text x="185" y="369" class="small" text-anchor="middle">όπως ενδείκνυται</text><text x="185" y="435" class="small" text-anchor="middle">Δεν σημαίνει αποστείρωση</text></g>
<g transform="translate(415 90)"><rect class="panel" width="370" height="485" rx="20"/><text class="label" x="185" y="44" text-anchor="middle">2. Απολύμανση</text><rect class="surface" x="39" y="120" width="125" height="80" rx="10"/><g class="microbe"><circle cx="63" cy="148" r="9"/><circle cx="102" cy="168" r="10"/><circle cx="137" cy="147" r="8"/><circle cx="82" cy="187" r="7"/><circle cx="145" cy="185" r="7"/></g><path class="arrow" d="M178 163h48m-14-12 14 12-14 12"/><rect class="surface" x="244" y="120" width="89" height="80" rx="10"/><g class="microbe"><circle cx="281" cy="162" r="7"/></g><text x="185" y="254" class="small" text-anchor="middle">Καταστροφή / αδρανοποίηση</text><text x="185" y="284" class="small" text-anchor="middle">πολλών παθογόνων</text><text x="185" y="338" class="small" text-anchor="middle">Κατάλληλο προϊόν και</text><text x="185" y="369" class="small" text-anchor="middle">χρόνος επαφής</text><text x="185" y="435" class="small" text-anchor="middle">Όχι κατ’ ανάγκη σπόροι</text></g>
<g transform="translate(808 90)"><rect class="panel" width="370" height="485" rx="20"/><text class="label" x="185" y="44" text-anchor="middle">3. Αποστείρωση</text><rect x="47" y="105" width="276" height="117" rx="15" fill="#d7e6ef" stroke="#47758d" stroke-width="4"/><rect x="62" y="120" width="246" height="85" rx="10" fill="#eef5f9" stroke="#7092a7" stroke-width="3"/><path d="M92 166h140m-30-17 30 17-30 17" stroke="#46778d" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="278" cy="165" r="16" fill="#6e9eae"/><text x="185" y="254" class="small" text-anchor="middle">Επικυρωμένη διαδικασία</text><text x="185" y="284" class="small" text-anchor="middle">για κατάλληλα εργαλεία</text><text x="185" y="338" class="small" text-anchor="middle">Στόχος: όλες οι μορφές</text><text x="185" y="369" class="small" text-anchor="middle">μικροβιακής ζωής</text><text x="185" y="435" class="small" text-anchor="middle">Συμπεριλαμβανομένων σπόρων</text></g><text x="600" y="616" text-anchor="middle" class="small">Σχηματική σύγκριση — όχι πρωτόκολλο εφαρμογής ή εγγύηση αποτελεσματικότητας</text></svg>