<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Πνευμονική κυκλοφορία από τη δεξιά προς την αριστερή καρδιά</title><desc id="d">Σχηματικό διάγραμμα: η δεξιά κοιλία στέλνει αίμα χαμηλότερου οξυγόνου προς τους πνεύμονες μέσω πνευμονικού κορμού και αρτηριών. Στους πνευμονικούς τριχοειδείς γίνεται ανταλλαγή αερίων και οι πνευμονικές φλέβες επιστρέφουν οξυγονωμένο αίμα στον αριστερό κόλπο. Όχι ανατομική κλίμακα.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347e75"/></marker><marker id="flowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3277a5"/></marker><marker id="flowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b34d50"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#347e75"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="555" y="30" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 03</text><text x="555" y="72" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Κυκλοφορία και αιμάτωση</text>
