<title id="t">Οδοί χορήγησης και έλεγχοι ασφάλειας — αναγνώριση σημείων</title><desc id="d">Σχηματικά μνημονικά για τα θέματα της λεζάντας: ταυτοποίηση προσώπου δίπλα σε φάρμακο με έλεγχο, δοχείο χωρίς βαθμονόμηση δίπλα σε σύμβολο οδού, και έγγραφο με σημάδι ελέγχου. Δεν αποτελούν checklist, δοσολογικό υπολογισμό ή ελληνικό πρωτόκολλο.</desc>
