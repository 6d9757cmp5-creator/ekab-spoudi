<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Ασφαλής απόρριψη χρησιμοποιημένων αιχμηρών</title><desc id="desc">Σχηματική χρησιμοποιημένη σύριγγα με βελόνα εισέρχεται απευθείας σε ειδικό άκαμπτο δοχείο αιχμηρών. Σημειώνονται άνοιγμα, ανθεκτικό περίβλημα, γραμμή μέγιστης πλήρωσης και απαγόρευση επανακάλυψης βελόνας. Το σχήμα δεν αποτυπώνει συγκεκριμένο μοντέλο περιέκτη.</desc><rect width="1200" height="700" fill="#f5f9fc"/><style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#153a52}.head{font-size:31px;font-weight:700}.sub{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:18px}.panel{fill:#fff;stroke:#b8cbd9;stroke-width:2}.leader{fill:none;stroke:#277f9e;stroke-width:4;stroke-linecap:round}.red{stroke:#bd4341;stroke-width:11;stroke-linecap:round}</style><text x="600" y="49" class="head" text-anchor="middle">Ασφαλής απόρριψη αιχμηρών αντικειμένων</text><rect class="panel" x="20" y="80" width="810" height="565" rx="20"/><rect class="panel" x="848" y="80" width="330" height="565" rx="20"/><text x="420" y="118" class="sub" text-anchor="middle">Άμεση απόρριψη σε ειδικό περιέκτη</text><rect x="337" y="285" width="324" height="317" rx="16" fill="#f7dc73" stroke="#936f27" stroke-width="6"/><rect x="315" y="247" width="368" height="65" rx="14" fill="#e8bc4d" stroke="#936f27" stroke-width="5"/><rect x="423" y="258" width="135" height="20" rx="8" fill="#415a64" stroke="#27414d" stroke-width="3"/><path d="M365 453h260" stroke="#a34931" stroke-width="5" stroke-dasharray="12 8"/><path d="M366 471h259" stroke="#a34931" stroke-width="2" stroke-dasharray="4 6"/><path d="M405 532h195" stroke="#936f27" stroke-width="4"/><path d="M503 489v68M469 523h68" stroke="#936f27" stroke-width="8" stroke-linecap="round"/><g transform="translate(190 120) rotate(28)"><rect x="0" y="0" width="170" height="43" rx="7" fill="#d8edf5" stroke="#527e97" stroke-width="4"/><rect x="25" y="8" width="70" height="27" rx="4" fill="#a5d5e7"/><path d="M0 21h-55M-55 6v30M170 10h24v23h-24" stroke="#527e97" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M194 21h106" stroke="#596d78" stroke-width="3"/><path d="M300 21l-11-4v8z" fill="#596d78"/></g><path class="leader" d="M215 360L310 310L428 267"/><path class="leader" d="M671 452h80"/><path class="leader" d="M338 535L230 535"/><circle cx="428" cy="267" r="5" fill="#277f9e"/><text x="40" y="360" class="sub" >Άνοιγμα</text><text x="40" y="387" class="sub" >απόρριψης</text><text x="673" y="440" class="sub" >Όριο</text><text x="673" y="470" class="sub" >πλήρωσης</text><text x="40" y="521" class="sub" >Άκαμπτο,</text><text x="40" y="550" class="sub" >ανθεκτικό</text><text x="40" y="579" class="sub" >σε διάτρηση</text><text x="420" y="627" class="small" text-anchor="middle">Ο περιέκτης τοποθετείται κοντά στο σημείο χρήσης.</text><text x="1013" y="120" class="sub" text-anchor="middle">Μην επανακαλύπτεις</text><text x="1013" y="151" class="sub" text-anchor="middle">χρησιμοποιημένη βελόνα</text><g transform="translate(900 220)"><rect x="10" y="0" width="115" height="36" rx="6" fill="#d8edf5" stroke="#527e97" stroke-width="4"/><path d="M125 18h87" stroke="#596d78" stroke-width="4"/><rect x="208" y="9" width="52" height="18" rx="5" fill="#e9d6bd" stroke="#926f56" stroke-width="3"/><path class="red" d="M0 -24L275 77M275 -24L0 77"/></g><text x="1013" y="359" class="body" text-anchor="middle">Όχι κάμψη ή θραύση</text><text x="1013" y="391" class="body" text-anchor="middle">της βελόνας</text><rect x="875" y="427" width="275" height="151" rx="13" fill="#e8f5f4" stroke="#9ccdc5" stroke-width="2"/><text x="1013" y="468" class="sub" text-anchor="middle">Αμέσως μετά</text><text x="1013" y="499" class="sub" text-anchor="middle">τη χρήση</text><text x="1013" y="535" class="body" text-anchor="middle">Μην υπερπληρώνεις</text><text x="1013" y="560" class="body" text-anchor="middle">τον περιέκτη</text></svg>