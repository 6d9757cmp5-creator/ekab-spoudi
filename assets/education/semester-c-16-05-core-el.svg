<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Σενάριο αδιάγνωστου ασταθούς ασθενούς — Βασικά σημεία</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 16, κεφάλαιο 5: Ξεκινάμε από άμεσες απειλές ζωής και όχι από αναζήτηση ονόματος πάθησης.; SOS · Ασταθής αδιάγνωστος ασθενής: πρώτα αντιμετώπιση απειλών ζωής; Συνείδηση, αναπνοή, κυκλοφορία και ορατή αιμορραγία εκτιμώνται γρήγορα και επαναλαμβάνονται…. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#66569b"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦ. 05</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Σενάριο αδιάγνωστου ασταθούς ασθενούς</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">Βασικά σημεία</text><polygon points="556,251 769,386 556,510 343,386" fill="#efedf9" stroke="#66569b" stroke-width="4"/><text x="556" y="381" font-size="25" font-weight="730" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΚΛΙΝΙΚΗ</text><text x="556" y="414" font-size="25" font-weight="730" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">ΕΚΤΙΜΗΣΗ</text><path d="M462 501L196 572" stroke="#66569b" stroke-width="3"/><rect x="48" y="567" width="296" height="141" rx="19" fill="#ffffff" stroke="#66569b" stroke-width="2.5"/><text x="196" y="606" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Ξεκινάμε από άμεσες</text><text x="196" y="633" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">απειλές ζωής και όχι από</text><text 