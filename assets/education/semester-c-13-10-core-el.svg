<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Συντονισμός σε αιφνίδια κρίση — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 13, κεφάλαιο 10. Παρουσιάζονται: Μαζικό συμβάν ή πυρκαγιά; Πλημμύρα ή απειλή σκηνής; Πολλοί εμπλεκόμενοι φορείς. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#256e91"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 13 · ΚΕΦΑΛΑΙΟ 10</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Συντονισμός σε αιφνίδια κρίση</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#256e91">Σημεία αναγνώρισης</text><path d="M274 391H492 M688 391H906" stroke="#256e91" stroke-width="7" stroke-linecap="round"/><circle cx="205" cy="391" r="67" fill="#e3f0f6" stroke="#256e91" stroke-width="4"/><text x="205" y="404" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="750" fill="#256e91">ΚΑΛΩΝ</text><rect x="47" y="518" width="316" height="166" rx="22" fill="#ffffff" stroke="#256e91" stroke-width="2.5"/><text x="205" y="570" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">Μαζικό συμβάν ή πυρκαγιά</text><path d="M163 667C151 655 157 643 169 630C168 641 183 645 180 657C179 664 173 668 163 667Z" fill="#f4a261" stroke="#c2410c" stroke-width="3"/><circle cx="228" cy="630" r="8" fill="#6b8797"/><path d="M213 663Q213 643 228 643Q243 643 243 663" fill="none" stroke="#507c97" stroke-width="4" stroke-linecap="round"/><circle cx="260" cy="630" r="8" fill="#6b8797"/><path d="M245 663Q2