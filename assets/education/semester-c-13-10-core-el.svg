<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Συντονισμός σε αιφνίδια κρίση — Ενδεικτικά στοιχεία σκηνής</title><desc id="d">Τρεις ενδεικτικές κατηγορίες: μαζικό συμβάν ή πυρκαγιά, πλημμύρα ή κίνδυνος σκηνής, πολλοί εμπλεκόμενοι φορείς. Τα παραδείγματα δεν περιγράφουν ελληνική υπηρεσιακή ροή ή επιχειρησιακό πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="57" y="261" width="328" height="408" rx="24" fill="#ffffff" stroke="#256e91" stroke-width="3"/><rect x="426" y="261" width="328" height="408" rx="24" fill="#ffffff" stroke="#256e91" stroke-width="3"/><rect x="795" y="261" width="328" height="408" rx="24" fill="#ffffff" stroke="#256e91" stroke-width="3"/><text x="221" y="316" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#213f53">Μαζικό συμβάν ή πυρκαγιά</text><text x="221" y="346" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="550" fill="#506579">Ενδεικτικά σύμβολα</text><path d="M154 457C141 442 148 427 164 410C163 425 182 431 178 448C177 456 167 461 154 457Z" fill="#f4a261" stroke="#c2410c" stroke-width="4"/><circle cx="247" cy="420" r="13" fill="#6b8797"/><path d="M222 471Q222 441 247 441Q272 441 272 471" fill="none" stroke="#507c97" stroke-width="6" stroke-linecap="round"/><circle cx="294" cy="420" r="13" fill="#6b8797"/><path d="M269 471Q269 441 294 441Q319 441 319 471" fill="none" stroke="#507c97" stroke-width="6" stroke-linecap="round"/><text x="221" y="532" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="600" fill="#506579">Φωτιά · πολλοί άνθρωποι</text><text x="221" y="562" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="600" fill="#506579">(παραδείγματα, όχι πλήρης λίστα)</text><text x="590" y="316" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#213f53">Πλημμύρα ή κίνδυνος σκηνής</text><text x="590" y="346" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="550" fill="#506579">Ενδεικτικά σύμβολα</text><path d="M482 444Q505 425 528 444T574 444T620 444T666 444M482 472Q505 453 528 472T574 472T620 472T666 472" fill="none" stroke="#2b7a9b" stroke-width="7" stroke-linecap="round"/><path d="M590 510L617 557H563Z" fill="#fff2cc" stroke="#b7791f" stroke-width="4" stroke-linejoin="round"/><path d="M590 523V540" stroke="#8a4b08" stroke-width="4" stroke-linecap="round"/><circle cx="590" cy="549" r="2.5" fill="#8a4b08"/><text x="590" y="599" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="600" fill="#506579">Νερό · πιθανός κίνδυνος</text><text x="590" y="629" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="600" fill="#506579">(χωρίς οδηγία προσέγγισης)</text><text x="959" y="316" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#213f53">Πολλοί εμπλεκόμενοι φορείς</text><text x="959" y="346" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="550" fill="#506579">Ενδεικτικό δίκτυο συνεργασίας</text><circle cx="881" cy="427" r="11" fill="#31708e"/><path d="M860 465Q861 442 881 442Q901 442 902 465" fill="none" stroke="#31708e" stroke-width="5" stroke-linecap="round"/><circle cx="959" cy="427" r="11" fill="#b94d4d"/><path d="M938 465Q939 442 959 442Q979 442 980 465" fill="none" stroke="#b94d4d" stroke-width="5" stroke-linecap="round"/><circle cx="1037" cy="427" r="11" fill="#59697b"/><path d="M1016 465Q1017 442 1037 442Q1057 442 1058 465" fill="none" stroke="#59697b" stroke-width="5" stroke-linecap="round"/><path d="M902 447H938M980 447H1016" stroke="#7b8c99" stroke-width="3" stroke-dasharray="5 6"/><text x="959" y="519" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif