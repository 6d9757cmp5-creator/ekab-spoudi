<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Επικοινωνία και διαχείριση πληροφοριών — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 12. Παρουσιάζονται ως διακριτά θέματα: ενημέρωση Κέντρου, επιβεβαίωση αναφοράς και επικοινωνία ΜΜΕ από εξουσιοδοτημένο φορέα. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="52" y="265" width="336" height="424" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="220" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΚΕΝΤΡΟ</text><circle cx="220" cy="406" r="45" fill="#4d7d70"/><path d="M196 391H244V421H196Z" fill="none" stroke="#ffffff" stroke-width="5"/><path d="M204 399H236M204 408H229" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/><path d="M220 422V432M210 432H230" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/><text x="220" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Περιοδική ενημέρωση</text><text x="220" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">του Κέντρου</text><rect x="422" y="265" width="336" height="424" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><text x="590" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΕΠΙΒΕΒΑΙΩΣΗ</text><circle cx="590" cy="406" r="45" fill="#4d7d70"/><circle cx="590" cy="406" r="25" fill="none" stroke="#ffffff" stroke-width="5"/><path d="M577 406L586 415L604 396" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size=