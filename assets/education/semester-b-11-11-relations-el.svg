<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Εξοπλισμός ασθενοφόρου — απινιδωτής, φιάλη, έλεγχος υλικού</title><desc id="d">Απλοποιημένα εικονίδια αυτόματου εξωτερικού απινιδωτή, φιάλης οξυγόνου και λίστας ελέγχου εξοπλισμού. Χωρίς ρυθμίσεις, ιατρικές οδηγίες ή checklist πρωτοκόλλου.</desc><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#506bb0"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#506bb0"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ffffff" font-weight="690" text-anchor="middle">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 11 · ΚΕΦΑΛΑΙΟ 11</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#ffffff" font-weight="720" text-anchor="middle">Εξοπλισμός ασθενοφόρου · λεξιλόγιο</text>
