<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Μεταφορές ειδικών πληθυσμών: παιδί, νεογνό, έγκυος, ηλικιωμένος</title><desc id="desc">Τέσσερις σχηματικές μορφές ασθενών σε ξεχωριστές θέσεις, που οπτικοποιούν τη διαφορετική σωματομετρία και την ανάγκη κατάλληλης ομάδας και μέσων: νεογνό σε ειδική κλίνη, παιδί με καθιστή μορφή, έγκυος και ηλικιωμένος. Δεν αποτυπώνει ιατρικό πρωτόκολλο ή συγκεκριμένο τύπο συγκράτησης.</desc><rect width="1200" height="720" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#183d54}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.line{fill:none;stroke:#53839d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#abc6d4;stroke-width:3}</style>
<text x="600" y="50" text-anchor="middle" class="h">Ειδικοί πληθυσμοί · ανάγκες μεταφοράς</text>
<text x="600" y="84" text-anchor="middle" class="s">Κατάλληλος εξοπλισμός και ομάδα καθορίζονται από την κλινική κατάσταση</text>
