<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d"><title id="t">Ασφάλεια κλινικών δεδομένων — Σχετικές έννοιες και παρατηρήσεις</title><desc id="d">Αυτόνομο εκπαιδευτικό διάγραμμα του Β΄ εξαμήνου, μάθημα 8, κεφάλαιο 7. Οι τρεις θεματικές έννοιες είναι: Όχι προσωπικά κοινωνικά δίκτυα; Ελάχιστη αναγκαία πληροφορία; Ασφαλής παράδοση δεδομένων. Χρειάζεται έλεγχος ειδικού για κλινικές πράξεις.</desc><rect width="1100" height="720" fill="#f8fbfe"/><rect width="1100" height="141" fill="#27767f"/><text x="550" y="31" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 08 · ΚΕΦ. 07</text><text x="550" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="750" text-anchor="middle" fill="#ffffff">Ασφάλεια κλινικών δεδομένων</text><text x="550" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="740" text-anchor="middle" fill="#27767f">Σχετικές έννοιες και παρατηρήσεις</text><rect x="399" y="249" width="302" height="92" rx="28" fill="#27767f"/><text x="550" y="286" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="740" text-anchor="middle" fill="#ffffff">ΣΤΟΧΟΣ ΚΕΦΑΛΑΙΟΥ</text><text x="550" y="316" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" text-anchor="middle" fill="#ffffff">Β02 · 07</text><path d="M550 342v34M550 375H187V402M550 375v27M550 375h364v27" stroke="#27767f" stroke-width="3.4" fill="none"/><rect x="51" y="407" width="280" height="207" rx="24" fill="#ffffff" stroke="#27767f" stroke-width="2.6"/><circle cx="191" cy="452" r="23" fill="#e3eff8" stroke="#27767f" stroke-width="2.4"/><text x="191" y="461" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="750" text-anchor="middle" fill="#27767f">1</text><text x="191" y="516" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#233c4e">Όχι προσωπικά κοινωνικά</text><text x="191" y="544" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#233c4e">δίκτυα</text><rect x="411" y="407" width="280" height="207" rx="24" fill="#ffffff" stroke="#27767f" stroke-width="2.6"/><circle cx="551" cy="452" r="23" fill="#e3eff8" stroke="#27767f" stroke-width="2.4"/><text x="551" y="461" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="750" text-anchor="middle" fill="#27767f">2</text><text x="551" y="516" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#233c4e">Ελάχιστη αναγκαία</text><text x="551" y="544" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#233c4e">πληροφορία</text><rect x="771" y="407" width="280" height="207" rx="24" fill="#ffffff" stroke="#27767f" stroke-width="2.6"/><circle cx="911" cy="452" r="23" fill="#e3eff8" stroke="#27767f" stroke-width="2.4"/><text x="911" y="461" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="750" text-anchor="middle" fill="#27767f">3</text><text x="911" y="516" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#233c4e">Ασφαλής παράδοση</text><text x="911" y="544" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#233c4e">δεδομένων</text><rect x="59" y="651" width="982" height="43" rx="12" fill="#e4eff8"/><text x="550" y="680" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="650" text-anchor="middle" fill="#27767f">Εκπαιδευτική απεικόνιση · ερμήνευσέ τη με τη θεωρία.</text></svg>