<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d">
<title id="t">Οδοί χορήγησης και έλεγχοι ασφάλειας — τρίτη εικόνα, διαφορετικά σημεία</title><desc id="d">Θεματικά σύμβολα για αναφορά αλλεργιών, κατάσταση/συναίνεση και καταγραφή πράξης: έντυπο με προειδοποίηση, πρόσωπο με φούσκα συναίνεσης, και έντυπο με σημάδι ελέγχου. Δεν αξιολογούν ασθενή και δεν ορίζουν διαδικασία, συγκατάθεση ή αρμοδιότητα.</desc>
