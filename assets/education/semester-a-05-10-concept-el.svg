<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Επίπεδο συνείδησης και νευρολογική παρατήρηση — Βασικές σχέσεις</title><desc id="desc">Εκπαιδευτικό σχηματικό διάγραμμα για κεφάλαιο 05-10: Η γρήγορη εκτίμηση της συνείδησης μπορεί να περιγραφεί με απλή δομημένη κλίμακα…; Παρατηρούνται επίσης κινητικότητα, ομιλία, συμμετρία προσώπου και οξύτητα μεταβολής…; SOS · Συνείδηση: AVPU ή κατάλληλη κλίμακα, κόρες, νέα εστιακά σημεία και γλυκόζη όπου…. Δεν αποτελεί ανεξάρτητη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f9fbfd"/><rect width="1100" height="133" fill="#ae5448"/><text x="550" y="36" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 05 · ΚΕΦΑΛΑΙΟ 10</text><text x="550" y="80" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="26" font-family="DejaVu Sans,Arial,sans-serif">Επίπεδο συνείδησης και νευρολογική παρατήρηση</text><text x="550" y="184" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές σχέσεις</text><rect x="55" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#ae5448" stroke-width="2.5"/><circle cx="208" cy="315" r="46" fill="#edf4fa" stroke="#ae5448" stroke-width="3"/><path d="M180 315h56m-28-28v56" stroke="#ae5448" stroke-width="3"/><text x="208" y="420" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="208" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Η γρήγορη εκτίμηση της</text><text x="208" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">συνείδησης μπορεί να</text><text x="208" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">περιγραφεί με απλή</text><text x="208" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">δομημένη κλίμακα…</text><rect x="400" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#ae5448" stroke-width="2.5"/><circle cx="553" cy="315" r="46" fill="#edf4fa" stroke="#ae5448" stroke-width="3"/><path d="M525 315h56m-28-28v56" stroke="#ae5448" stroke-width="3"/><text x="553" y="420" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="553" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">Παρατηρούνται επίσης</text><text x="553" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">κινητικότητα, ομιλία,</text><text x="553" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">συμμετρία προσώπου και</text><text x="553" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">οξύτητα μεταβολής…</text><rect x="745" y="221" width="306" height="345" rx="24" fill="#fff" stroke="#ae5448" stroke-width="2.5"/><circle cx="898" cy="315" r="46" fill="#edf4fa" stroke="#ae5448" stroke-width="3"/><path d="M870 315h56m-28-28v56" stroke="#ae5448" stroke-width="3"/><text x="898" y="420" text-anchor="middle" fill="#ae5448" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">3</text><text x="898" y="467" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">SOS · Συνείδηση: AVPU ή</text><text x="898" y="495" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">κατάλληλη κλίμακα,</text><text x="898" y="523" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">κόρες, νέα εστιακά</text><text x="898" y="551" text-anchor="middle" fill="#233d4f" font-weight="650" font-size="21" font-family="DejaVu Sans,Arial,sans-serif">σημεία και γλυκόζη όπου…</text><rect x="55" y="607" width="990" height="62" rx="14" fill="#e4eef7"/><text x="550" y="648" text-anchor="middle" fill="#ae5448" font-weight="650" font-size="20" font-family="DejaVu Sans,Arial,sans-serif">Σχηματική επεξήγηση · συνδύασέ τη με την πλήρη θεωρία.</text></svg>