<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Κατώτερο αναπνευστικό: τραχεία, βρόγχοι, πνεύμονες και υπεζωκότας</title>
<desc id="desc">Πρόσθιο σχηματικό διάγραμμα. Η τραχεία διχάζεται σε δεξιό και αριστερό κύριο βρόγχο. Ο δεξιός πνεύμονας έχει τρεις λοβούς και ο αριστερός δύο, με καρδιακή εντομή. Κάτω βρίσκεται το διάφραγμα. Σε μεγεθυμένη τομή φαίνονται το τοιχωματικό πέταλο του υπεζωκότα, η υπεζωκοτική κοιλότητα και το σπλαχνικό πέταλο. Η απόσταση στην τομή είναι υπερβολική για διδακτική σαφήνεια· το σχήμα δεν είναι υπό κλίμακα.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315e79"/></marker></defs>
<rect width="1100" height="760" fill="#f7fbfd"/>
<style>
text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183b52}.title{font-size:29px;font-weight:700}.sub{font-size:16px;fill:#48677a}.label{font-size:17px;font-weight:650}.small{font-size:14px}.leader{fill:none;stroke:#315e79;stroke-width:2.5;marker-end:url(#arrow)}
</style>
<text x="550" y="42" text-anchor="middle" class="title">Κατώτερο αναπνευστικό σύστημα</text>
<text x="550" y="70" text-anchor="middle" class="sub">Πρόσθια προβολή · δεξιά/αριστερά ως προς τον ασθενή · σχηματικό, όχι υπό κλίμακα</text>
