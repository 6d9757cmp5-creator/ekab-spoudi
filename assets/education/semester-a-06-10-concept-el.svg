<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Μεταφορά και παράδοση – handover — Βασικές έννοιες, κεφάλαιο 06-10</title><desc id="d">Πρωτότυπο διάγραμμα του κεφαλαίου 06-10. Περιλαμβάνει Transport σημαίνει μεταφορά, transfer διακομιδή/μεταφορά κατά περίπτωση, stretcher φορείο, receiving hospital…; η, stretcher φορείο, receiving hospital νοσοκομείο υποδοχής και handov; er παράδοση κλινικών πληροφοριών.. Απλουστευμένη οπτική υποστήριξη της θεωρίας, όχι αυτόνομη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f7fafd"/><rect width="1100" height="132" fill="#3973a0"/><text x="550" y="34" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">ΣΑΕΚ · Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 06 · ΚΕΦΑΛΑΙΟ 10</text><text x="550" y="79" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">Μεταφορά και παράδοση – handover</text><text x="550" y="174" text-anchor="middle" fill="#3973a0" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές έννοιες</text><rect x="55" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#3973a0" stroke-width="2.5"/><circle cx="207" cy="314" r="52" fill="#e7f0f7" stroke="#3973a0" stroke-width="3"/><circle cx="207" cy="314" r="20" fill="none" stroke="#3973a0" stroke-width="4"/><text x="207" y="415" text-anchor="middle" fill="#3973a0" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">01</text><text x="207" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Transport σημαίνει</text><text x="207" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">μεταφορά, transfer</text><text x="207" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">διακομιδή/μεταφορά</text><text x="207" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">κατά περίπτωση,</text><rect x="400" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#3973a0" stroke-width="2.5"/><circle cx="552" cy="314" r="52" fill="#e7f0f7" stroke="#3973a0" stroke-width="3"/><circle cx="552" cy="314" r="27" fill="none" stroke="#3973a0" stroke-width="4"/><text x="552" y="415" text-anchor="middle" fill="#3973a0" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">02</text><text x="552" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">η, stretcher φορείο,</text><text x="552" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">receiving hospital</text><text x="552" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">νοσοκομείο υποδοχής</text><text x="552" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">και handov</text><rect x="745" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#3973a0" stroke-width="2.5"/><circle cx="897" cy="314" r="52" fill="#e7f0f7" stroke="#3973a0" stroke-width="3"/><circle cx="897" cy="314" r="34" fill="none" stroke="#3973a0" stroke-width="4"/><text x="897" y="415" text-anchor="middle" fill="#3973a0" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">03</text><text x="897" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">er παράδοση κλινικών</text><text x="897" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">πληροφοριών.</text><rect x="55" y="596" width=