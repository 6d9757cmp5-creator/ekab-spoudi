<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Καρδιακή ανεπάρκεια και πνευμονική συμφόρηση: σχηματική σχέση</title><desc id="desc">Δύο πνεύμονες με κυψελίδες, κεντρική καρδιά και μικροσκοπικό μεγεθυμένο τμήμα κυψελίδας που δείχνει συσσώρευση υγρού σε ορισμένες μορφές καρδιακής ανεπάρκειας. Η απεικόνιση δεν αποτελεί αιτία ή διάγνωση κάθε δύσπνοιας.</desc><rect width="1200" height="710" fill="#f4f8fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163a52}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.sub{font-size:17px}.line{fill:none;stroke:#587e9c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#b9d2df;stroke-width:3}</style>
