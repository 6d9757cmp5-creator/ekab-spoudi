<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Ασφαλής διαχείριση δεδομένων υγείας και επαγγελματικό απόρρητο</title><desc id="desc">Οπτική αναπαράσταση μιας κλινικής καταγραφής που μεταδίδεται μόνο προς εξουσιοδοτημένο επαγγελματία μέσω προστατευμένου καναλιού. Αντίθετα, η μη εξουσιοδοτημένη κοινοποίηση από προσωπικό κινητό σε κοινωνικό δίκτυο επισημαίνεται ως μη επιτρεπτή. Η εικόνα δεν αποτελεί νομική γνωμοδότηση.</desc><rect width="1200" height="700" fill="#f3f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173d53}.head{font-size:34px;font-weight:700}.small{font-size:20px}.label{font-size:24px;font-weight:700}.fine{font-size:18px}.panel{fill:#fff;stroke:#b7cedd;stroke-width:3}.line{fill:none;stroke:#5989a2;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
