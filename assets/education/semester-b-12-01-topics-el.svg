<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d">
<title id="t">Δράση, ένδειξη και αντένδειξη — αναγνώριση σημείων</title><desc id="d">Τρεις ονομασμένες έννοιες με διαφορετικά σύμβολα: κάψουλα ως σχηματική δραστική ουσία, ανθρωπόμορφο σύμβολο με σταυρό ως ένδειξη, και ανθρωπόμορφο σύμβολο με προειδοποιητικό τρίγωνο ως αντένδειξη. Τα βέλη οδηγούν στα σύμβολα. Δεν παριστάνονται συγκεκριμένο φάρμακο ή οδηγίες χορήγησης.</desc>
