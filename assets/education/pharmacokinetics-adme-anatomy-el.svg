<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Φαρμακοκινητική: απορρόφηση, κατανομή, μεταβολισμός, αποβολή</title>
<desc id="desc">Σχηματική ανθρώπινη μορφή με κύκλο απορρόφησης από το γαστρεντερικό, κατανομής μέσω κυκλοφορίας, μεταβολισμού στο ήπαρ και αποβολής στους νεφρούς. Το διάγραμμα περιγράφει τις τέσσερις γενικές έννοιες ADME χωρίς συγκεκριμένο φάρμακο, δοσολογία ή οδό χορήγησης που να εφαρμόζεται σε ασθενή.</desc>
<rect width="1200" height="740" fill="#f5f9fc"/>
<style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#183b53}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.en{font-size:17px;fill:#46718a}.panel{fill:#fff;stroke:#b9cfdc;stroke-width:3}.lead{fill:none;stroke:#57839f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="600" y="50" text-anchor="middle" class="h">Φαρμακοκινητική · πορεία φαρμάκου στο σώμα</text>
<text x="600" y="82" text-anchor="middle" class="s">Γενικό μοντέλο ADME — δεν ισχύει με τον ίδιο τρόπο για όλες τις ουσίες</text>
