<text x="78" y="46" class="t">Απορρόφηση</text><text x="18" y="87" class="en">Absorption</text><text x="18" y="122" class="s">Είσοδος στην κυκλοφορία</text></g>
<g transform="translate(24 349)"><rect width="317" height="152" rx="19" class="panel"/>
<circle cx="39" cy="41" r="26" fill="#d8ecf4" stroke="#4b85a1" stroke-width="3"/><text x="39" y="50" text-anchor="middle" class="t">2</text>
<text x="78" y="46" class="t">Κατανομή</text><text x="18" y="87" class="en">Distribution</text><text x="18" y="122" class="s">Μεταφορά στους ιστούς</text></g>
<g transform="translate(859 138)"><rect width="317" height="150" rx="19" class="panel"/>
<circle cx="39" cy="41" r="26" fill="#f9e8d6" stroke="#b58b61" stroke-width="3"/><text x="39" y="50" text-anchor="middle" class="t">3</text>
