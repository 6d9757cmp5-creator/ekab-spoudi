<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Πνευμονική εμβολή: σχηματική απόφραξη κλάδου πνευμονικής αρτηρίας</title><desc id="desc">Σχηματικοί δύο πνεύμονες και καρδιά με κλάδο πνευμονικής αρτηρίας. Μεγεθυμένη τομή αγγείου παρουσιάζει θρόμβο που εμποδίζει μέρος του αυλού και διαταράσσει την πνευμονική αιμάτωση. Δεν είναι διαγνωστική απεικόνιση συγκεκριμένου περιστατικού.</desc><rect width="1200" height="710" fill="#f4f8fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163a52}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.sub{font-size:17px}.line{fill:none;stroke:#587e9c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#b9d2df;stroke-width:3}</style>
<text x="600" y="49" text-anchor="middle" class="h">Πνευμονική εμβολή · εμπόδιο στην αιμάτωση</text>
<text x="600" y="84" text-anchor="middle" class="s">Η δύσπνοια χρειάζεται συνολική κλινική εκτίμηση και επείγουσα αξιολόγηση</text>
