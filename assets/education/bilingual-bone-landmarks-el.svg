<text x="24" y="135" class="t">Κρανίο</text><text x="24" y="159" class="en">Skull</text><text x="24" y="274" class="t">Πλευρές</text><text x="24" y="298" class="en">Ribs</text><text x="24" y="354" class="t">Στέρνο</text><text x="24" y="378" class="en">Sternum</text><text x="24" y="429" class="t">Πύελος</text><text x="24" y="453" class="en">Pelvis</text><text x="24" y="481" class="t">Βραχιόνιο</text><text x="24" y="505" class="en">Humerus</text><text x="24" y="565" class="t">Κερκίδα / ωλένη</text><text x="24" y="589" class="en">Radius / ulna</text><text x="820" y="134" class="t">Σπονδυλική στήλη</text><text x="820" y="158" class="en">Spine</text><text x="820" y="273" class="t">Θωρακικός κλωβός</text><text x="820" y="297" class="en">Rib cage</text><text x="820" y="338" class="t">Άνω άκρο</text><text x="820" y="362" class="en">Upper limb</text><text x="820" y="513" class="t">Μηριαίο</text><text x="820" y="537" class="en">Femur</text><text x="820" y="607" class="t">Κνήμη</text><text x="820" y="631" class="en">Tibia</text><text x="820" y="659" class="t">Περόνη</text><text x="820" y="683" class="en">Fibula</text>
<text x="600" y="716" text-anchor="middle" class="s">Σχηματική απεικόνιση για δίγλωσση απομνημόνευση, όχι ανατομική κλίμακα</text></svg>