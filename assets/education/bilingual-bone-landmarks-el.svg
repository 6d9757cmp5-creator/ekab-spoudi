<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">Οστά και ανατομικές κατευθύνσεις — ελληνικά και αγγλικά</title><desc id="desc">Πρόσθια σχηματική όψη σκελετού με κρανίο, πλευρές, στέρνο, σπονδυλική στήλη, λεκάνη, βραχιόνιο, κερκίδα, ωλένη, μηριαίο, κνήμη και περόνη. Ελληνικοί και αγγλικοί όροι αναγράφονται δίπλα σε αντίστοιχα μέρη. Δεν αποτελεί πλήρες ανατομικό άτλαντα.</desc><rect width="1200" height="730" rx="16" fill="#f3f8fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163950}.h{font-size:32px;font-weight:700}.t{font-size:23px;font-weight:700}.s{font-size:19px}.en{font-size:17px;fill:#396e88}.lead{fill:none;stroke:#58869f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.line{fill:none;stroke:#587f96;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.blue{fill:#deedf6;stroke:#6392aa;stroke-width:4}</style>
<text x="600" y="52" text-anchor="middle" class="h">Οστά · Bones / Αнатτομική ορολογία</text>
<text x="600" y="87" text-anchor="middle" class="s">Πρόσθια όψη — δεξί/αριστερό αναφέρονται στον εξεταζόμενο</text>
<g stroke="#6b8da7" stroke-width="15" fill="none" stroke-linejoin="round" stroke-linecap="round">
