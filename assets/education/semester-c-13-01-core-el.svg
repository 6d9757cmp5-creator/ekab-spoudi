<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Προτεραιοποίηση και κριτήρια — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 13, κεφάλαιο 1. Παρουσιάζονται τρία διακριτά μνημονικά σύμβολα: ανθρώπινη μορφή για ανταπόκριση, σχηματικοί πνεύμονες για αναπνοή και σταγόνα αίματος για σοβαρή αιμορραγία. Τα βέλη συνδέουν τις ελληνικές λεζάντες με τα αντίστοιχα σύμβολα. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><g fill="none" stroke="#52677d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M205 508V466m-8 12 8-12 8 12"/><path d="M590 508V466m-8 12 8-12 8 12"/><path d="M975 508V466m-8 12 8-12 8 12"/></g><circle cx="205" cy="391" r="67" fill="#e3f0f6" stroke="#256e91" stroke-width="4"/><g fill="none" stroke="#256e91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="205" cy="369" r="16"/><path d="M171 427c3-25 17-35 34-35s31 10 34 35"/><path d="M229 352l10-7m-8 19h11"/></g><rect x="47" y="518" width="316" height="166" rx="22" fill="#ffffff" stroke="#256e91" stroke-width="2.5"/><text x="205" y="570" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">Συνείδηση ασθενούς</text><text x="205" y="608" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="550" fill="#506579">Ανταπόκριση · παρατήρηση</text><circle cx="590" cy="391" r="67" fill="#e3f0f6" stroke="#256e91" stroke-width="4"/><g fill="none" stroke="#256e91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M590 345v30m0 0-15 12m15-12 15 12"/><path d="M579 363c-17 0-31 22-30 45 1 16 15 25 28 17 10-6 10-22 10-40"/><path d="M601 363c17 0 31 22 30 45-1 16-15 25-28 17-10-6-10-22-10-40"/></g><rect x="432" y="518" width="316" height="166" rx="22" fill="#ffffff" stroke="#256e91" stroke-width="2.5"/><text x="590" y="570" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">Ποιότητα αναπνοής</text><text x="590" y="608" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="550" fill="#506579">Ρυθμός · ποιότητα</text><circle cx="975" cy="391" r="67" fill="#e3f0f6" stroke="#256e91" stroke-width="4"/><path d="M975 346c-9 15-28 38-28 55a28 28 0 0 0 56 0c0-17-19-40-28-55z" fill="#ffe8e8" stroke="#b33a43" stroke-width="4"/><path d="M962 404c1 7 6 12 13 14" fill="none" stroke="#b33a43" stroke-width="3.5" stroke-linecap="round"/><rect x="817" y="518" width="316" height="166" rx="22" fill="#ffffff" stroke="#256e91" stroke-width="2.5"/><text x="975" y="570" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">Σοβαρή αιμορραγία</text><text x="975" y="608" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="550" fill="#506579">Ορατή απώλεια αίματος</text></svg>