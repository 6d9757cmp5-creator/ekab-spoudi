<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Επανεκτίμηση και απολογισμός — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 13. Παρουσιάζονται ως διακριτά θέματα: καταγραφή μετά το συμβάν, ανασκόπηση και υποστήριξη πληρωμάτων. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="52" y="265" width="336" height="424" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="220" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΚΑΤΑΓΡΑΦΗ</text><circle cx="220" cy="406" r="45" fill="#4d7d70"/><path d="M202 383H233L240 390V430H202Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/><path d="M232 383V392H240M210 401H230M210 411H230M210 421H226" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/><text x="220" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Καταγραφή μετά</text><text x="220" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">το συμβάν</text><rect x="422" y="265" width="336" height="424" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><text x="590" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΑΝΑΣΚΟΠΗΣΗ</text><circle cx="590" cy="406" r="45" fill="#4d7d70"/><path d="M565 406C571 395 579 390 590 390C601 390 609 395 615 406C609 417 601 422 590 422C579 422 571 417 565 406Z" fill="none" stroke="#ffffff" stroke-width="5"/><circle cx="590" cy="406" r="9" fill="none" stroke="#ffffff" stroke-width="5"/><text x="590" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">