<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Επείγουσα φαρμακολογία και επίβλεψη — ασφαλής συνεργασία</title><desc id="d">Μνημονικά του μαθήματος: διαγραμμένος υπολογισμός για αποφυγή αυθαίρετης δοσολογίας, διαδρομή με προειδοποίηση για οδό/αντενδείξεις, και δύο πρόσωπα με κοινό φύλλο ελέγχου για επίβλεψη. Δεν είναι δοσολογικός υπολογιστής, checklist ή υπηρεσιακό πρωτόκολλο.</desc><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6f7396"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#6f7396"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 12 · ΚΕΦΑΛΑΙΟ 03</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Επείγουσα φαρμακολογία και επίβλεψη</text><circle cx="197" cy="299" r="85" fill="#eef4f8" stroke="#6f7396" stroke-width="2.4"/><g transform="translate(197 299)" fill="none" stroke="#6f7396" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M-40-34h80v57h-80z"/><path d="M-24-19h9m12 0h9m12 0h9M-24-2h9m12 0h9m12 0h9M-24 15h9m12 0h9m12 0h9"/><path d="m-47 40 94-80"/></g><path d="M197 478L197 361" stroke="#6f7396" stroke-width="3.5" marker-end="url(#arr)"/><rect x="48" y="487" width="298" height="93" rx="17" fill="#fff" stroke="#6f7396" stroke-width="2"/><text x="197" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#253f52" font-weight="700" text-anchor="middle">Ποτέ αυθαίρετη δοσολογία</text><circle cx="553" cy="299" r="85" fill="#eef4f8" stroke="#6f7396" stroke-width="2.4"/><g transform="translate(553 299)" fill="none" stroke="#6f7396" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M-39-31h18m-9-9v18M-