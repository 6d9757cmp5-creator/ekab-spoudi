<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 640" role="img" aria-labelledby="title description">
<title id="title">Ανδρικό αναπαραγωγικό σύστημα: βασικές δομές σε σχηματική πλάγια όψη</title>
<desc id="description">Σχηματική πλάγια όψη με όρχι, επιδιδυμίδα, σπερματικό πόρο, σπερματοδόχο κύστη, προστάτη, πέος, ουρήθρα και ουροδόχο κύστη. Η χωρική προβολή απλοποιείται για να είναι ορατές οι σχέσεις των οργάνων.</desc>
<rect width="1050" height="640" fill="#f7fafc"/>
<text x="525" y="44" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-size="27" font-weight="bold" fill="#193b53">Ανδρικό αναπαραγωγικό σύστημα</text>
<text x="525" y="75" font-family="Arial,DejaVu Sans,sans-serif" text-anchor="middle" font-size="17" fill="#456176">Σχηματική πλάγια όψη · όχι σε κλίμακα</text>
<!-- Bladder: anterior left, posterior right in this stylized side view -->
<path d="M425 196 C426 170 456 160 478 170 C510 157 533 181 530 212 C530 246 504 269 480 272 C446 265 425 238 425 196Z" fill="#f8d49e" stroke="#a56a31" stroke-width="4"/>
<path d="M478 270 L478 312" stroke="#e7ae65" stroke-width="11" stroke-linecap="round"/>
<!-- Seminal vesicle posterior to bladder -->
<path d="M555 222 C575 209 590 225 581 240 C599 246 590 262 575 263 C589 278 568 289 555 276 C537 275 536 253 549 248 C537 236 543 225 555 222Z" fill="#e5ac9c" stroke="#9b5a55" stroke-width="3"/>
<!-- Prostate around proximal urethra -->
<ellipse cx="480" cy="320" rx="49" ry="35" fill="#c7b5dd" stroke="#6f5c94" stroke-width="4"/>
<!-- Penis in left-pointing side projection -->
<path d="M467 380 C433 389 403 392 359 392 L298 392 C282 392 273 404 273 418 C273 434 285 444 300 444 L369 444 C411 444 443 442 480 438 L502 404Z" fill="#e9b39d" stroke="#a56b5c" stroke-width="4"/>
<!-- Scrotum and testis -->
<path d="M550 420 C530 442 536 502 566 527 C590 547 632 539 650 508 C665 474 648 437 621 426Z" fill="#f0c3a7" stroke="#a56b5c" stroke-width="4"/>
<ellipse cx="592" cy="477" rx="36" ry="49" transform="rotate(12 592 477)" fill="#f7d59f" stroke="#ad7c41" stroke-width="3"/>
<!-- Epididymis curves around testis, connects to duct -->
<path d="M619 439 C640 447 646 469 638 490 C632 511 620 521 612 522" fill="none" stroke="#b65b6a" stroke-width="13" stroke-linecap="round"/>
<!-- Ductus deferens ascends from epididymis and loops posteriorly to gland region -->
<path d="M630 440 C660 392 667 318 665 260 C663 192 627 166 598 185 C577 197 578 215 572 229 C564 250 549 284 505 309" fill="none" stroke="#a44e66" stroke-width="9" stroke-linecap="round"/>
<!-- Seminal vesicle duct toward ejaculatory duct -->
<path d="M557 273 Q530 290 497 318" fill="none" stroke="#9b5a55" stroke-width="6" stroke-linecap="round"/>
<!-- Urethra from bladder, through prostate, curves along penis -->
<path d="M478 272 L478 335 Q477 371 449 399 L301 418" fill="none" stroke="#fff4dd" stroke-width="9" stroke-linecap="round"/>
<path d="M478 272 L478 335 Q477 371 449 399 L301 418" fill="none" stroke="#a56a31" stroke-width="2.5" stroke-linecap="round"/>
<!-- Anatomical leader lines and endpoint dots -->
<g fill="none" stroke="#315c75" stroke-width="2.5" stroke-linejoin="round">
<path d="M235 177 L365 177 L446 207"/>
<path d="M230 313 L386 313 L435 320"/>
<path d="M230 364 L333 364 L357 410"/>
<path d="M225 488 L285 488 L315 438"/>
<path d="M789 167 L707 167 L659 262"/>
<path d="M788 255 L666 255 L577 247"/>
<path d="M786 484 L710 484 L615 482"/>
<path d="M787 551 L699 551 L631 485"/>
</g>
<g fill="#315c75"><circle cx="446" cy="207" r="4"/><circle cx="435" cy="320" r="4"/><circle cx="357" cy="410" r="4"/><circle cx="315" cy="438" r="4"/><circle cx="659" cy="262" r="4"/><circle cx="577" cy="247" r="4"/><circle cx="615" cy="482" r="4"/><circle cx="631" cy="485" r="4"/></g>
<g font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#193b53">
<text x="35" y="171">Ουροδόχος κύστη</text>
<text x="90" y="307">Προστάτης</text>
<text x="90" y="358">Ουρήθρα</text>
<text x="140" y="482">Πέος</text>
<text x="790" y="160">Σπερματικός πόρος</text>
<text x="790" y="248">Σπερματοδόχος κύστη</text>
<text x="790" y="477">Όρχις</text>
<text x="790" y="544">Επιδιδυμίδα</text>
</g>
<text x="525" y="590" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#42596c">Η ουρήθρα διέρχεται από τον προστάτη και συνεχίζεται στο πέος.</text>
<text x="525" y="616" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" fill="#61788b">Πρωτότυπο σχέδιο · CC BY 4.0 · έλεγχος εκκρεμεί</text>
</svg>