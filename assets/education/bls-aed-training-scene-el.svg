<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Βασική αναζωογόνηση: εκπαιδευτική σκηνή ΚΑΡΠΑ και AED</title><desc id="desc">Εκπαιδευτικός χώρος με κούκλα ενηλίκου σε ύπτια θέση, εκπαιδευόμενο γονατιστό δίπλα στο πρόπλασμα και αυτόματο εξωτερικό απινιδωτή δίπλα, με οθόνη που συμβολίζει ηχητικές οδηγίες. Η εικόνα δεν δείχνει θέση χεριών ή σωστή τεχνική συμπιέσεων και δεν παρέχει αναλογίες, ταχύτητες ή σημεία τοποθέτησης αυτοκόλλητων.</desc><rect width="1200" height="690" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#153950}.h{font-size:33px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.line{stroke:#5a88a1;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#b7cad8;stroke-width:3}</style>
<text x="600" y="49" text-anchor="middle" class="h">Βασική αναζωογόνηση · εκπαιδευτική σκηνή</text>
<text x="600" y="84" text-anchor="middle" class="s">Αναγνώριση επείγοντος · κλήση βοήθειας · ΚΑΡΠΑ/AED σύμφωνα με εκπαίδευση</text>
<rect x="58" y="188" width="821" height="395" rx="23" class="card"/>
