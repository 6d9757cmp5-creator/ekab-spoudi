<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Αναγνώριση κινδύνων στη σκηνή πριν από την προσέγγιση ασθενούς</title>
<desc id="desc">Σχηματικός δρόμος με αυτοκίνητο σε σύγκρουση, κυκλοφορία οχημάτων, καπνό και φθαρμένο ηλεκτρικό καλώδιο. Εικονίζονται διαφορετικές πιθανές πηγές κινδύνου και η ανάγκη για εκτίμηση ασφάλειας, μέσα ατομικής προστασίας και πρόσθετη υποστήριξη. Οι θέσεις δεν αποτελούν επιχειρησιακό σχέδιο.</desc>
<rect width="1200" height="700" rx="18" fill="#f3f8fb"/>
<style>text[fill='#fff']{fill:#fff}text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#183c52}.heading{font-size:35px;font-weight:700}.subtitle{font-size:21px}.h{font-size:25px;font-weight:700}.s{font-size:20px}.small{font-size:17px}.road{fill:#dbe4eb;stroke:#a9bdc9;stroke-width:3}.warn{fill:#fff3ee;stroke:#ce633b;stroke-width:3}.side{fill:#fff;stroke:#b2c9d7;stroke-width:3}.leader{stroke:#ac4b2b;stroke-width:4;fill:none;stroke-linecap:round}</style>
<text x="600" y="51" class="heading" text-anchor="middle">Ασφάλεια σκηνής: τι παρατηρώ πριν πλησιάσω;</text>
<text x="600" y="88" class="subtitle" text-anchor="middle">Οι κίνδυνοι αφορούν ασθενή, πλήρωμα και παρευρισκομένους</text>
<rect x="35" y="123" width="754" height="492" rx="20" class="road"/>
<rect x="73" y="165" width="678" height="406" rx="20" fill="#a9bccb"/>
<path d="M95 362H728" stroke="#fff" stroke-width="9" stroke-dasharray="48 28"/>
<path d="M92 183H733M92 552H733" stroke="#f6fafc" stroke-width="7"/>
<!-- Damaged vehicle -->
<g transform="translate(390 238)">
 <rect x="0" y="8" width="275" height="105" rx="30" fill="#eff5f9" stroke="#336985" stroke-width="6"/>
 <path d="M51 12L82 -41H196L234 12" fill="#d3edf7" stroke="#336985" stroke-width="6" stroke-linejoin="round"/>
 <path d="M139 -38V11" stroke="#336985" stroke-width="5"/>
 <circle cx="58" cy="112" r="28" fill="#314f62"/><circle cx="218" cy="112" r="28" fill="#314f62"/>
 <path d="M0 25L-25 3L-11 65L9 81" fill="#f4c5b2" stroke="#ce633b" stroke-width="5"/>
 <path d="M99 -58Q77 -89 107 -114M134 -62Q159 -94 132 -123M168 -59Q191 -83 179 -110" stroke="#687d89" stroke-width="12" fill="none" stroke-linecap="round" opacity=".8"/>
</g>
<!-- Approaching traffic -->
<g transform="translate(129 236)"><rect width="164" height="78" rx="21" fill="#387b99"/><rect x="21" y="10" width="52" height="57" rx="8" fill="#cbe5f2"/><rect x="95" y="10" width="49" height="57" rx="8" fill="#cbe5f2"/><circle cx="29" cy="80" r="17" fill="#25485b"/><circle cx="137" cy="80" r="17" fill="#25485b"/></g>
<path d="M172 194H274M256 178L277 194L256 209" stroke="#386e86" stroke-width="7" fill="none" stroke-linecap="round"/>
<!-- Cable hazard -->
<path d="M360 467Q410 396 457 452T556 451" fill="none" stroke="#374b58" stroke-width="8"/>
<path d="M522 429L495 476H515L505 505" fill="none" stroke="#e0ad31" stroke-width="8" stroke-linejoin="round"/>
<circle cx="482" cy="471" r="78" fill="none" stroke="#cb523b" stroke-width="6" stroke-dasharray="13 9"/>
<rect x="88" y="448" width="254" height="67" rx="15" class="warn"/><text x="215" y="488" text-anchor="middle" class="h">Ηλεκτρικός κίνδυνος</text>
<path d="M344 478L405 469" class="leader"/>
<rect x="94" y="127" width="229" height="53" rx="13" class="warn"/><text x="209" y="161" class="h" text-anchor="middle">Κίνηση οχημάτων</text>
<rect x="521" y="149" width="212" height="53" rx="13" class="warn"/><text x="627" y="184" class="h" text-anchor="middle">Καπνός / φωτιά</text>
<path d="M616 204L542 215" class="leader"/>
<!-- Right-side evaluation -->
<rect x="813" y="123" width="351" height="492" rx="20" class="side"/>
<rect x="838" y="153" width="300" height="82" rx="15" fill="#dff1ea" stroke="#3b8d68" stroke-width="3"/>
<path d="M871 170L902 182V208L871 228L840 208V182Z" fill="#fff" stroke="#3b8d68" stroke-width="5"/><path d="M855 197L866 207L889 187" fill="none" stroke="#3b8d68" stroke-width="6" stroke-linecap="round"/>
<text x="1015" y="191" text-anchor="middle" class="h">Πριν την είσοδο</text><text x="1015" y="219" text-anchor="middle" class="s">Εκτιμώ τον χώρο</text>
<g transform="translate(839 260)">
<circle cx="21" cy="25" r="19" fill="#dc7552"/><text x="21" y="33" text-anchor="middle" font-size="24" fill="#fff">1</text>
<text x="58" y="31" class="s">Υπάρχουν ενεργοί κίνδυνοι;</text>
<circle cx="21" cy="117" r="19" fill="#4c86a8"/><text x="21" y="125" text-anchor="middle" font-size="24" fill="#fff">2</text>
<text x="58" y="123" class="s">Κατάλληλα ΜΑΠ για τον κίνδυνο;</text>
<circle cx="21" cy="209" r="19" fill="#3b8d68"/><text x="21" y="217" text-anchor="middle" font-size="24" fill="#fff">3</text>
<text x="58" y="201" class="s">Χρειάζεται υποστήριξη</text><text x="58" y="226" class="s">από άλλες υπηρεσίες;</text>
</g>
<text x="599" y="648" text-anchor="middle" class="h">Μη ασφαλής σκηνή → παραμονή εκτός κινδύνου και αίτημα κατάλληλης συνδρομής</text>
<text x="600" y="680" text-anchor="middle" class="small">Σχηματικό εκπαιδευτικό παράδειγμα · όχι καθορισμός ζωνών, αποστάσεων ή επιχειρησιακών χειρισμών</text>
</svg>