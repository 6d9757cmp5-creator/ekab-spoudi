<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Καταστροφική αιμορραγία — Επανέλεγχος και ασφάλεια</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 2. Παρουσιάζονται: Καταγραφή ώρας παρέμβασης; Παρατήρηση αιμάτωσης; Μεταφορά σύμφωνα με ισχύουσες οδηγίες. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><g fill="#ffffff" stroke="#a75749" stroke-width="3"><rect x="42" y="286" width="340" height="360" rx="24"/><rect x="420" y="286" width="340" height="360" rx="24"/><rect x="798" y="286" width="340" height="360" rx="24"/></g>
