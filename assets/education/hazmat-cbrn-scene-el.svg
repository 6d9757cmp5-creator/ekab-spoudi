<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Απειλές χημικών, βιολογικών και ραδιολογικών παραγόντων σε σκηνή</title><desc id="desc">Σχηματική βιομηχανική σκηνή με ανεστραμμένο δοχείο, γενικό προειδοποιητικό τρίγωνο και αποκλεισμένη άγνωστη περιοχή. Το σύμβολο δεν προσδιορίζει χημικό, βιολογικό ή ραδιολογικό παράγοντα. Ένας διασώστης παραμένει εκτός σκηνής. Δεν απεικονίζονται ΜΑΠ, ασφαλής απόσταση ή διαδικασία απορρύπανσης και το σχέδιο δεν τις καθορίζει.</desc><rect width="1200" height="690" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163a53}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.line{fill:none;stroke:#56839e;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#aec8d9;stroke-width:3}</style>


