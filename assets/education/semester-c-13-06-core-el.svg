<title id="t">Κατανομή διαθέσιμων πληρωμάτων — τρεις παράγοντες</title>
<desc id="d">Τρεις ανεξάρτητοι παράγοντες περιγραφής χωρίς αριθμημένη σειρά: απαιτούμενη ικανότητα πόρου, πραγματική διαθεσιμότητα, θέση και χρόνος πρόσβασης. Δεν αποτελεί επιχειρησιακή εντολή ή πρωτόκολλο κατανομής.</desc>
