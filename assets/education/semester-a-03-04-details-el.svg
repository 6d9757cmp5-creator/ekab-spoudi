<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Σχηματική διαδρομή από τη σκηνή στο ασθενοφόρο και στα ΤΕΠ</title><desc id="d">Τρία διακριτά στάδια σε ενδεικτική διαδρομή: τόπος συμβάντος, ασθενοφόρο και Τμήμα Επειγόντων Περιστατικών. Τα οριζόντια βέλη δείχνουν τη σειρά του παραδείγματος και τα κατακόρυφα δείχνουν τις λεζάντες· δεν καθορίζεται αν ή πότε χρειάζεται μεταφορά.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#735998"/></marker></defs><rect width="1200" height="700" fill="#f9fbfd"/><rect width="1200" height="112" fill="#735998"/><text x="600" y="39" fill="#fff" font-family="DejaVu Sans,Arial" font-size="18" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 03 · ΚΕΦΑΛΑΙΟ 04</text><text x="600" y="80" fill="#fff" font-family="DejaVu Sans,Arial" font-size="25" font-weight="700" text-anchor="middle">Σκηνή συμβάντος, ασθενοφόρο και ΤΕΠ</text><circle cx="200" cy="300" r="91" fill="#eef4f8" stroke="#735998" stroke-width="3"/><circle cx="600" cy="300" r="91" fill="#eef4f8" stroke="#735998" stroke-width="3"/><circle cx="1000" cy="300" r="91" fill="#eef4f8" stroke="#735998" stroke-width="3"/><g transform="translate(200 300)" stroke="#526c86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M-67 48H67M-33 48V31M0 48V31M33 48V31" fill="none"/><path d="M-23-40C-39-25-38-7 0 28C38-7 39-25 23-40C10-52-10-52-23-40Z" fill="#e6def0"/><circle cx="0" cy="-31" r="9" fill="#735998" stroke="none"/></g><path d="M303 300H390" stroke="#735998" stroke-width="5" marker-end="url(#a)"/><g transform="translate(600 300)" stroke="#526c86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M-61-25H19Q27-25 27-17V31H-61Z" fill="#fff"/><path d="M27-6H45L64 12V31H27Z" fill="#fff"/><path d="M-54-17H12V-3H-54Z" fill="#bfe0eb" stroke="none"/><path d="M33 0H43L54 12H33Z" fill="#bfe0eb" stroke="none"/>