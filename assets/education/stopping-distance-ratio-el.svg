<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
<title id="title">Η απόσταση αντίδρασης και η απόσταση πέδησης όταν διπλασιάζεται η ταχύτητα</title>
<desc id="desc">Αναλογική σύγκριση 30 και 60 km/h υπό ίδιες συνθήκες: διπλάσια ταχύτητα διπλασιάζει την απόσταση αντίδρασης και τετραπλασιάζει την απόσταση πέδησης σε ένα απλοποιημένο φυσικό μοντέλο.</desc>
<rect width="1100" height="640" fill="#f6fafc"/>
<style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#16394e}.head{font-size:33px;font-weight:bold}.sub{font-size:20px}.lab{font-size:25px;font-weight:700}.small{font-size:19px}.react{fill:#f1d28d;stroke:#b28742;stroke-width:2}.brake{fill:#ea9892;stroke:#ab5851;stroke-width:2}.car{fill:#e7f2f8;stroke:#3e7290;stroke-width:4}</style>
<text x="550" y="53" text-anchor="middle" class="head">Ταχύτητα και απόσταση ακινητοποίησης</text><text x="550" y="91" text-anchor="middle" class="sub">Ίδιες συνθήκες οχήματος, οδοστρώματος και αντίδρασης</text>
<g transform="translate(60 147)"><text x="10" y="0" class="lab">30 km/h</text><rect x="5" y="25" width="135" height="83" rx="16" class="car"/><rect x="31" y="42" width="77" height="37" rx="9" fill="#95c1d8"/><circle cx="29" cy="103" r="14" fill="#26495c"/><circle cx="115" cy="103" r="14" fill="#26495c"/><rect x="165" y="32" width="110" height="66" class="react"/><rect x="275" y="32" width="80" height="66" class="brake"/><text x="220" y="128" text-anchor="middle" class="small">Αντίδραση</text><text x="315" y="154" text-anchor="middle" class="small">Πέδηση</text></g>
<path d="M62 342H1012" stroke="#b2cbd6" stroke-width="5"/>
<g transform="translate(60 375)"><text x="10" y="0" class="lab">60 km/h</text><rect x="5" y="25" width="135" height="83" rx="16" class="car"/><rect x="31" y="42" width="77" height="37" rx="9" fill="#95c1d8"/><circle cx="29" cy="103" r="14" fill="#26495c"/><circle cx="115" cy="103" r="14" fill="#26495c"/><rect x="165" y="32" width="220" height="66" class="react"/><rect x="385" y="32" width="320" height="66" class="brake"/><text x="275" y="128" text-anchor="middle" class="small">Αντίδραση ×2</text><text x="545" y="128" text-anchor="middle" class="small">Πέδηση ×4</text></g>
<rect x="785" y="157" width="257" height="155" rx="16" fill="white" stroke="#b2cbd6" stroke-width="2"/><rect x="805" y="180" width="30" height="25" class="react"/><text x="847" y="200" class="small">Αντίδραση</text><rect x="805" y="226" width="30" height="25" class="brake"/><text x="847" y="246" class="small">Πέδηση</text><text x="805" y="282" class="small">Μήκη αναλογικά</text>
<text x="550" y="581" text-anchor="middle" class="sub">Συνολική απόσταση = αντίδραση + πέδηση</text><text x="550" y="614" text-anchor="middle" class="small">Δεν δίνονται πραγματικά μέτρα: πρόσφυση, φορτίο και αντίδραση αλλάζουν το αποτέλεσμα.</text></svg>