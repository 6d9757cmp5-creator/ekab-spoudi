<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Αρχική αξιολόγηση τραύματος XABCDE — Βασικά σημεία</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 14, κεφάλαιο 5: Προηγείται ασφάλεια σκηνής και έλεγχος καταστροφικής εξωτερικής αιμορραγίας όταν υπάρχει; SOS · XABCDE: ανεξέλεγκτη αιμορραγία → αεραγωγός → αναπνοή → κυκλοφορία → νευρολογική εικόνα →…; Το XABCDE δεν είναι απλή απομνημόνευση γραμμάτων αλλά μέθοδος προτεραιοτήτων.. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#a55c4d"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦ. 05</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Αρχική αξιολόγηση τραύματος XABCDE</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">Βασικά σημεία</text><ellipse cx="555" cy="301" rx="46" ry="53" fill="#edd2ba" stroke="#516f80" stroke-width="3"/><path d="M521 361Q487 373 495 413L507 547L530 544L535 492L546 667L568 667L581 492L593 667L615 667L624 495L630 548L650 544L641 410Q629 373 595 360Z" fill="#dbeaf0" stroke="#516f80" stroke-width="4"/><circle cx="555" cy="403" r="33" fill="#eaa28e" fill-opacity=".55" stroke="#a55c4d" stroke-width="4"/><path d="M555 403L321 287" stroke="#a55c4d" fill="none" stroke-width="2.5"/><text x="242" y="287" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Προηγείται ασφάλεια σκηνής</text><text x="242" y="313" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">και έλεγχος καταστροφικής</text><text x="242" y="339" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">εξωτερικής αιμορραγίας</text><text x="242" y="365" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">όταν υπάρχει</text><path d="M555 403L740 426" stroke="#a55c4d" fill="none" stroke-width="2.5"/><text x="843" y="426" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">SOS · XABCDE: ανεξέλεγκτη</text><text x="843" y="452" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">αιμορραγία → αεραγωγός →</text><text x="843" y="478" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">αναπνοή → κυκλοφορία →</text><text x="843" y="504" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">νευρολογική εικόνα →…</text><path d="M555 403L321 565" stroke="#a55c4d" fill="none" stroke-width="2.5"/><text x="242" y="565" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Το XABCDE δεν είναι απλή</text><text x="242" y="591" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">απομνημόνευση γραμμάτων</text><text x="242" y="617" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">αλλά μέθοδος</text><text x="242" y="643" font-size="20" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">προτεραιοτήτων.</text><rect x="53" y="733" width="1005" height="40" rx="12" fill="#e5edf3"/><text x="555" y="760" font-size="16" font-weight="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#a55c4d">Σχηματική εικόνα από τη θεωρία · όχι αυτόνομο κλινικό ή υπηρεσιακό πρωτόκολλο.</text></svg>