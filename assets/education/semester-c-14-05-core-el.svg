<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Αρχική αξιολόγηση τραύματος XABCDE — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 5. Παρουσιάζονται: X: καταστροφική αιμορραγία; A: αεραγωγός; B: αναπνοή. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 05</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Αρχική αξιολόγηση τραύματος XABCDE</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Σημεία αναγνώρισης</text><ellipse cx="592" cy="310" rx="49" ry="55" fill="#e9d8cb" stroke="#506b82" stroke-width="3"/><path d="M552 377Q522 395 520 444L531 567L548 563L556 514L568 690L589 690L601 519L613 690L636 690L646 510L654 566L673 562L659 435Q649 394 623 378Z" fill="#daecf5" stroke="#506b82" stroke-width="4"/><circle cx="592" cy="410" r="35" fill="#e9a28c" fill-opacity=".6" stroke="#a75749" stroke-width="4"/><path d="M592 410L370 315" stroke="#a75749" stroke-width="2.4" fill="none"/><text x="254" y="306" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">X: καταστροφική αιμορραγία</text><path d="M592 410L817 466" stroke="#a75749" stroke-width="2.4" fill="none"/><text x="936" y="457" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" fill="#213f53">A: αεραγωγός</text><path d="M592 410L370 617" stroke="#a75749" stroke-width="2.4" fill="none"/><text x="254" y="608" text-anchor="middle" font-f