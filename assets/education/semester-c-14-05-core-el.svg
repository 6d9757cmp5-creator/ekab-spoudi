<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Αρχική αξιολόγηση τραύματος XABCDE — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 5. Τρεις θεματικές κάρτες για X: καταστροφική αιμορραγία, A: αεραγωγός, B: αναπνοή. Τα σύμβολα είναι σχηματικά και δεν υποκαθιστούν το τοπικό πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/>
