<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Οστά του κορμού και των άκρων — Αναλυτικές σχέσεις, κεφάλαιο 01-02</title><desc id="d">Πρωτότυπο διάγραμμα του κεφαλαίου 01-02. Περιλαμβάνει Αξονικός σκελετός: κρανίο, σπονδυλική στήλη, πλευρές, στέρνο; στο κάτω άκρο μηριαίο, επιγονατίδα, κνήμη και περόνη; Η σωστή αναγνώριση βοηθά στην περιγραφή κακώσεων και στην αποφυγή ακατάλληλων χειρισμών. Απλουστευμένη οπτική υποστήριξη της θεωρίας, όχι αυτόνομη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f7fafd"/><rect width="1100" height="132" fill="#286a89"/><text x="550" y="34" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">ΣΑΕΚ · Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 01 · ΚΕΦΑΛΑΙΟ 02</text><text x="550" y="79" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">Οστά του κορμού και των άκρων</text><text x="550" y="174" text-anchor="middle" fill="#286a89" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Αναλυτικές σχέσεις</text><rect x="85" y="207" width="930" height="91" rx="17" fill="#ffffff" stroke="#286a89" stroke-width="2"/><rect x="105" y="224" width="56" height="56" rx="14" fill="#286a89"/><text x="133" y="261" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">1</text><text x="191" y="249" text-anchor="start" fill="#213c51" font-weight="600" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Αξονικός σκελετός: κρανίο, σπονδυλική στήλη, πλευρές, στέρνο</text><rect x="85" y="317" width="930" height="91" rx="17" fill="#e7f0f7" stroke="#286a89" stroke-width="2"/><rect x="105" y="334" width="56" height="56" rx="14" fill="#286a89"/><text x="133" y="371" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">2</text><text x="191" y="359" text-anchor="start" fill="#213c51" font-weight="600" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">στο κάτω άκρο μηριαίο, επιγονατίδα, κνήμη και περόνη</text><rect x="85" y="427" width="930" height="91" rx="17" fill="#ffffff" stroke="#286a89" stroke-width="2"/><rect x="105" y="444" width="56" height="56" rx="14" fill="#286a89"/><text x="133" y="481" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">3</text><text x="191" y="469" text-anchor="start" fill="#213c51" font-weight="600" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">Η σωστή αναγνώριση βοηθά στην περιγραφή κακώσεων και στην αποφυγή ακατάλληλων</text><text x="191" y="498" text-anchor="start" fill="#213c51" font-weight="600" font-size="22" font-family="DejaVu Sans,Arial,sans-serif">χειρισμών</text><rect x="55" y="596" width="990" height="69" rx="16" fill="#e7f0f7"/><text x="550" y="639" text-anchor="middle" fill="#286a89" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Ειδικό εκπαιδευτικό σχήμα · δεν αντικαθιστά την πλήρη θεωρία.</text></svg>