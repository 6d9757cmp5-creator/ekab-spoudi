<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Θωρακικό τραύμα και αναπνευστική δυσχέρεια — Σχέσεις και προτεραιότητες</title><desc id="d">Τρία ορατά στάδια με κάρτες για πιθανότητα οξυγόνωσης, αξιολόγηση αιμοδυναμικής εικόνας και προτεραιότητα εξέτασης. Σχηματική εκπαιδευτική απεικόνιση, όχι κλινικό πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#fff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 07</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#fff">Θωρακικό τραύμα και αναπνευστική δυσχέρεια</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Σχέσεις και προτεραιότητες</text><path d="M178 357H1002" stroke="#a75749" stroke-width="6" stroke-linecap="round"/><circle cx="205" cy="357" r="52" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><text x="205" y="370" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="760" fill="#a75749">1</text><circle cx="590" cy="357" r="52" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><text x="590" y="370" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="760" fill="#a75749">2</text><circle cx="975" cy="357" r="52" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><text x="975" y="370" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="760" fill="#a75749">3</text><rect x="55" y="455" width="300" height="190" rx="22" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="440" y="455" width="300" height="190" rx="22" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="825" y="455" width="300"