<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Επικοινωνία με ΤΕΠ πριν την άφιξη — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 13, κεφάλαιο 11. Παρουσιάζονται τρία διαφορετικά εικονίδια με ελληνικές λεζάντες: ασθενής με ένδειξη προτεραιότητας για βαρύτητα και ηλικία, οθόνη παρακολούθησης για κύριο πρόβλημα και ζωτικά, γράφημα μεταβολής για αλλαγές κατά τη μεταφορά. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#256e91"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 13 · ΚΕΦΑΛΑΙΟ 11</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Επικοινωνία με ΤΕΠ πριν την άφιξη</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#256e91">Σημεία αναγνώρισης</text><path d="M165 391H1023" stroke="#256e91" stroke-width="7" stroke-linecap="round"/><path d="M205 458V508 M590 458V508 M975 458V508" fill="none" stroke="#256e91" stroke-width="3.5" stroke-linecap="round"/><path d="M198 505l7 10 7-10 M583 505l7 10 7-10 M968 505l7 10 7-10" fill="none" stroke="#256e91" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="205" cy="391" r="67" fill="#e3f0f6" stroke="#256e91" stroke-width="4"/><g fill="none" stroke="#256e91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="191" cy="372" r="11"/><path d="M170 418q1-26 21-26t21 26"/><path d="M226 373l13 23h-26z"/><path d="M226 381v7"/></g><circle cx="226" cy="392" r="2.5" fill="#256e91"/><rect x="47" y="518" width="316" height="166" rx="22" fill="#ffffff" stroke="#256e91" stroke-width="2.5"/><text x