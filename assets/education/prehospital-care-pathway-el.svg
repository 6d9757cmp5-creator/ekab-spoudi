<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc"><title id="title">Η διαδρομή ενός επείγοντος περιστατικού από την κλήση στην παράδοση</title><desc id="desc">Έξι διακριτές εικονογραφημένες φάσεις: τηλεφωνική κλήση, συντονισμός και αποστολή, άφιξη ασθενοφόρου, εκτίμηση και φροντίδα, ασφαλής διακομιδή και παράδοση σε υγειονομικό σχηματισμό.</desc><rect width="1160" height="720" fill="#f3f8fb"/><style>.t{font-family:Arial,'DejaVu Sans',sans-serif;fill:#183c50}.head{font-size:29px;font-weight:700}.sub{font-size:19px}.lab{font-size:22px;font-weight:700}.tiny{font-size:17px}.line{fill:none;stroke:#236d88;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#acc6d4;stroke-width:2}</style><text x="580" y="52" text-anchor="middle" class="t head">Η αλυσίδα της προνοσοκομειακής φροντίδας</text><text x="580" y="85" text-anchor="middle" class="t sub">Οργανωμένη συνέχεια από την επείγουσα κλήση έως την παράδοση</text>
<rect x="42" y="125" width="333" height="214" rx="18" class="card"/><circle cx="72" cy="155" r="19" fill="#246e8c"/><text x="72" y="162" text-anchor="middle" style="font:bold 21px Arial;fill:white">1</text><rect x="417" y="125" width="333" height="214" rx="18" class="card"/><circle cx="447" cy="155" r="19" fill="#246e8c"/><text x="447" y="162" text-anchor="middle" style="font:bold 21px Arial;fill:white">2</text><rect x="792" y="125" width="333" height="214" rx="18" class="card"/><circle cx="822" cy="155" r="19" fill="#246e8c"/><text x="822" y="162" text-anchor="middle" style="font:bold 21px Arial;fill:white">3</text><rect x="42" y="380" width="333" height="214" rx="18" class="card"/><circle cx="72" cy="410" r="19" fill="#246e8c"/><text x="72" y="417" text-anchor="middle" style="font:bold 21px Arial;fill:white">4</text><rect x="417" y="380" width="333" height="214" rx="18" class="card"/><circle cx="447" cy="410" r="19" fill="#246e8c"/><text x="447" y="417" text-anchor="middle" style="font:bold 21px Arial;fill:white">5</text><rect x="792" y="380" width="333" height="214" rx="18" class="card"/><circle cx="822" cy="410" r="19" fill="#246e8c"/><text x="822" y="417" text-anchor="middle" style="font:bold 21px Arial;fill:white">6</text>
<!-- 1: telephone and caller -->
<rect x="135" y="176" width="102" height="114" rx="17" fill="#dbeaf2" stroke="#417b96" stroke-width="5"/><rect x="146" y="189" width="80" height="71" rx="6" fill="white"/><path d="M171 207c-10 17 12 37 25 31" stroke="#327c9b" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="186" cy="273" r="6" fill="#417b96"/><text x="209" y="318" text-anchor="middle" class="t lab">Επείγουσα κλήση</text>
<!-- 2: dispatch screen and headset -->
<rect x="502" y="170" width="131" height="100" rx="9" fill="#c8dfe9" stroke="#497a93" stroke-width="5"/><path d="M568 270v19m-42 0h83" class="line"/><path d="M530 192h78m-78 20h62m-62 20h70" stroke="#4783a1" stroke-width="6"/><path d="M641 191c-13-21-44-21-56 0m56 0v36m-56-36v36" stroke="#d47a60" stroke-width="9" fill="none" stroke-linecap="round"/><text x="584" y="318" text-anchor="middle" class="t lab">Συντονισμός – αποστολή</text>
<!-- 3: ambulance at scene -->
<rect x="842" y="222" width="228" height="67" rx="12" fill="#fff" stroke="#46748c" stroke-width="5"/><path d="M994 222v67" stroke="#46748c" stroke-width="5"/><path d="M1004 235h48l14 21h-62z" fill="#a9d5e5"/><path d="M883 238v35m-18-18h36" stroke="#d66a6a" stroke-width="12"/><circle cx="888" cy="291" r="18" fill="#34576b"/><circle cx="1027" cy="291" r="18" fill="#34576b"/><rect x="930" y="207" width="56" height="13" rx="5" fill="#438ac1"/><text x="959" y="318" text-anchor="middle" class="t lab">Άφιξη πληρώματος</text>
<!-- 4: patient and medic -->
<circle cx="162" cy="451" r="25" fill="#e5b5a0"/><path d="M162 478v64m0-45-42 31m42-31 44 31m-44 14-28 30m28-30 28 30" stroke="#5c94aa" stroke-width="18" stroke-linecap="round" fill="none"/><circle cx="252" cy="461" r="25" fill="#e5b5a0"/><path d="M252 488v68m0-42-32 26m32-26 30 25" stroke="#b8dce9" stroke-width="20" stroke-linecap="round"/><path d="M252 504v32m-15-16h30" stroke="#d45d61" stroke-width="7"/><text x="209" y="575" text-anchor="middle" class="t lab">Εκτίμηση – φροντίδα</text>
<!-- 5: ambulance moving along road -->
<path d="M443 536h267" stroke="#a2b2bb" stroke-width="18"/><path d="M460 536h245" stroke="white" stroke-width="3" stroke-dasharray="18 15"/><rect x="502" y="455" width="162" height="66" rx="12" fill="#fff" stroke="#447a94" stroke-width="5"/><rect x="609" y="465" width="42" height="29" rx="4" fill="#b9dce8"/><path d="M545 466v38m-19-19h38" stroke="#d15f62" stroke-width="10"/><circle cx="540" cy="525" r="15" fill="#31576b"/><circle cx="628" cy="525" r="15" fill="#31576b"/><path d="M675 488h28m-14-10 14 10-14 10" class="line"/><text x="584" y="575" text-anchor="middle" class="t lab">Ασφαλής διακομιδή</text>
<!-- 6: hospital handover -->
<rect x="856" y="447" width="197" height="111" rx="7" fill="#e4f1f6" stroke="#5b91a7" stroke-width="5"/><rect x="929" y="430" width="51" height="29" fill="#fff" stroke="#5b91a7" stroke-width="4"/><path d="M953 434v20m-10-10h20" stroke="#d35c64" stroke-width="8"/><rect x="880" y="476" width="35" height="37" fill="#a6cbdc"/><rect x="995" y="476" width="35" height="37" fill="#a6cbdc"/><rect x="937" y="507" width="35" height="51" fill="#fff" stroke="#5b91a7" stroke-width="3"/><text x="959" y="575" text-anchor="middle" class="t lab">Παράδοση περιστατικού</text>
<path d="M375 233h40m-13-11 13 11-13 11M751 233h40m-13-11 13 11-13 11M959 353v24H209v-24m0 24v27m-11-12 11 12 11-12M375 489h40m-13-11 13 11-13 11M751 489h40m-13-11 13 11-13 11" class="line"/>
<text x="580" y="665" text-anchor="middle" class="t sub">Η πληροφορία και η ευθύνη φροντίδας μεταβιβάζονται με οργανωμένο τρόπο.</text><text x="580" y="694" text-anchor="middle" class="t tiny">Εκπαιδευτικό σχήμα — όχι επιχειρησιακό πρωτόκολλο συγκεκριμένης υπηρεσίας.</text></svg>