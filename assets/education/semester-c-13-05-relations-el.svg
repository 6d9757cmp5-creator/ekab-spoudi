<title id="t">Κάρτα συμβάντος — τρεις έννοιες τεκμηρίωσης</title>
<desc id="d">Τρεις παράλληλες έννοιες χωρίς αριθμημένη σειρά: γνωστοί κίνδυνοι στη σκηνή, διάκριση αναφερόμενης μαρτυρίας από καταγεγραμμένο εύρημα, και ιστορικό ανάθεσης και αλλαγών. Δεν αποτελεί κλινική ή επιχειρησιακή εντολή.</desc>
