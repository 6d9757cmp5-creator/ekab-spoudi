<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Ειδικές διακομιδές με ελικόπτερο και πλωτό ασθενοφόρο</title><desc id="desc">Δύο πραγματολογικά σχηματικά μέσα: ελικόπτερο με στροφείο και σύστημα προσγείωσης πάνω από χώρο πτήσης, και ταχύπλοο πλωτό μέσο με γάστρα και καμπίνα. Επισημαίνονται καιρός, θόρυβος, πρόσβαση και συντονισμός με αρμόδιο πλήρωμα. Το σχήμα δεν καθορίζει ασφαλείς διαδρομές προσέγγισης ή διαδικασίες φόρτωσης.</desc><rect width="1200" height="690" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173b52}.h{font-size:33px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.en{font-size:17px;fill:#40718b}.path{stroke:#5a86a0;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#b6cbd7;stroke-width:3}</style>
<text x="600" y="51" class="h" text-anchor="middle">Ειδικές διακομιδές: αέρας και θάλασσα</text>
<text x="600" y="86" class="s" text-anchor="middle">Συντονισμός με το υπεύθυνο πλήρωμα και τις υπηρεσιακές διαδικασίες</text>
