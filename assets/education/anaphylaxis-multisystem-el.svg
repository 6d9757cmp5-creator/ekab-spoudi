<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Αναφυλαξία: σχηματική ταυτόχρονη συμμετοχή πολλών συστημάτων</title><desc id="desc">Ανθρώπινο περίγραμμα με επισημάνσεις για πιθανό οίδημα αεραγωγού, δερματικές εκδηλώσεις, αναπνευστική δυσχέρεια και επιπτώσεις στην κυκλοφορία. Οι εκδηλώσεις δεν εμφανίζονται υποχρεωτικά όλες μαζί και η εικόνα δεν αποτελεί διαγνωστικό κριτήριο.</desc><rect width="1200" height="710" fill="#f4f8fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163a52}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.sub{font-size:17px}.line{fill:none;stroke:#587e9c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#b9d2df;stroke-width:3}</style>
<text x="600" y="49" class="h" text-anchor="middle">Σοβαρή αλλεργική αντίδραση · αναφυλαξία</text>
<text x="600" y="84" class="s" text-anchor="middle">Μπορούν να επηρεαστούν πολλαπλά συστήματα — επείγουσα αξιολόγηση</text>
