<text x="212" y="510" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="720" fill="#213f53">Η απόσταση δεν αρκεί</text><text x="212" y="544" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="540" fill="#405b6c">Θέση και χρόνος πρόσβασης</text>
<text x="590" y="510" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="720" fill="#213f53">Επιλογή από το Κέντρο</text><text x="590" y="544" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="540" fill="#405b6c">Αρμόδια επιχειρησιακή απόφαση</text>
<text x="968" y="510" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="720" fill="#213f53">Επιβεβαίωση πληρώματος</text><text x="968" y="544" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="540" fill="#405b6c">Διαθεσιμότητα και αποδοχή</text>
