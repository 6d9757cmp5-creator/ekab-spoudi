<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Εκπαίδευση με κλινικά σενάρια — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 3. Παρουσιάζονται: Ανάθεση ρόλων σε ομάδα; Αίτημα κατάλληλης βοήθειας; Επανεκτίμηση μετά από πράξη. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><circle cx="200" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><circle cx="200" cy="399" r="25" fill="none" stroke="#64569b" stroke-width="4"/><circle cx="200" cy="399" r="8" fill="#64569b"/><rect x="42" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="200" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Ανάθεση ρόλων σε ομάδα</text><circle cx="590" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><path d="M562 399H618M608 389L618 399L608 409M572 389L562 399L572 409" fill="none" stroke="#64569b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="432" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="590" y="558" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" fill="#213f53">Αίτημα κατάλληλης</text><text x="590" y="586" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" fill="#213f53">βοήθειας</text><circle cx="980" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><path d="M963 376H987L997 386V422H963Z" fill="none" stroke="#64569b" stroke-width="4" stroke-linejoin="round"/><path d="M986 376V387H997M970 395H987M970 405H987M949 409H961M955 403L961 409L955 415" fill="none" stroke="#64569b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rec