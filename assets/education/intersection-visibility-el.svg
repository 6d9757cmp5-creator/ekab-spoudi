<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" role="img" aria-labelledby="title desc"><title id="title">Προσέγγιση διασταύρωσης: οπτικά εμπόδια και διασταυρούμενη κυκλοφορία</title><desc id="desc">Κάτοψη διασταύρωσης τεσσάρων οδών με ασθενοφόρο που πλησιάζει, επιβατικό αυτοκίνητο σε εγκάρσια οδό και κτίριο που εμποδίζει την ορατότητα. Ορατή σημειωμένη περιοχή πιθανής σύγκρουσης στο κέντρο, χωρίς νομικούς ισχυρισμούς προτεραιότητας.</desc><rect width="1160" height="700" fill="#f4f7f8"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#17394d}.heading{font-size:30px;font-weight:750}.sub{font-size:19px}.tag{font-size:22px;font-weight:700}.note{font-size:17px}.line{stroke:#277699;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#b8ccd8;stroke-width:2}.arrow{fill:#247b91}</style><text x="580" y="51" text-anchor="middle" class="heading">Διασταύρωση: ορατότητα πριν από την είσοδο</text>
