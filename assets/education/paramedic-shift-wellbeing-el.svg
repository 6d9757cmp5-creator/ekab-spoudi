<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Επαγγελματική κόπωση διασώστη και αναζήτηση υποστήριξης</title><desc id="desc">Σχηματική νυχτερινή βάρδια δίπλα σε ασθενοφόρο, ένας επαγγελματίας με σημάδια κόπωσης, ρολόι και δεύτερος επαγγελματίας που ακούει σε συνάντηση συναδελφικής υποστήριξης. Δεν παρουσιάζει ιατρική διάγνωση ή υποκαθιστά επαγγελματική φροντίδα.</desc><rect width="1200" height="680" fill="#f3f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#193b53}.h{font-size:33px;font-weight:700}.t{font-size:23px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.path{stroke:#5b88a1;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#b8ccd8;stroke-width:3}</style>
<text x="600" y="49" class="h" text-anchor="middle">Κόπωση, στρες και επαγγελματικά όρια</text>
<text x="600" y="85" class="s" text-anchor="middle">Αναγνωρίζουμε επιβάρυνση · ενημερώνουμε · ζητάμε υποστήριξη</text>
