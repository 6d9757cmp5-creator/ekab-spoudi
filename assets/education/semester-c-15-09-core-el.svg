<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Χώροι διαλογής και συγκέντρωσης — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 9. Παρουσιάζονται: Χώρος πρώτης διαλογής; Χώρος αρχικής φροντίδας; Χώρος φόρτωσης. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="81" y="253" width="1015" height="469" rx="25" fill="#eaf3ef" stroke="#8aa79b" stroke-width="3"/><rect x="106" y="293" width="305" height="328" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="258" y="336" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΔΙΑΛΟΓΗ</text><circle cx="258" cy="415" r="37" fill="#4d7d70"/><g aria-hidden="true"><path d="M258 386C245 386 236 396 236 409C236 425 258 443 258 443C258 443 280 425 280 409C280 396 271 386 258 386Z" fill="none" stroke="#ffffff" stroke-width="5"/><circle cx="258" cy="408" r="7" fill="none" stroke="#ffffff" stroke-width="4"/></g><text x="258" y="486" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Χώρος πρώτης διαλογής</text><rect x="443" y="293" width="305" height="328" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><g transform="translate(0,-35)"><text x="595" y="371" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΑΡΧΙΚΗ ΦΡΟΝΤΙΔΑ</text><circle cx="595" cy="450" r="37" fill="#4d7d70"/><g aria-hidden="true"><path d="M574 450H616M595 429V471" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/><circle cx="595" cy="450" r="26" fill="none" stroke="#ffffff" stroke-width="4"/></g><text x="595" y="521" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Χώρος αρχικής φροντίδας</text></g>