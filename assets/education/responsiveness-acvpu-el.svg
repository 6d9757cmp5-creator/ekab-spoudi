<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Κλίμακα ανταπόκρισης AVPU και πρόσθετη κατηγορία σύγχυσης ACVPU</title><desc id="desc">Απεικονίζονται πέντε κατηγορίες παρατήρησης επιπέδου συνείδησης: εγρήγορση, νέα σύγχυση, απόκριση σε φωνή, απόκριση σε κατάλληλο ερέθισμα, καμία ανταπόκριση. Η σύγχυση είναι πρόσθετο στοιχείο της ACVPU και δεν περιλαμβάνεται στην απλή AVPU.</desc><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173c51}.h{font-size:34px;font-weight:700}.sub{font-size:20px}.label{font-size:24px;font-weight:700}.small{font-size:19px}.card{fill:#fff;stroke:#b5cad6;stroke-width:2.4}.line{stroke:#527f95;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}</style><rect width="1200" height="780" fill="#f3f8fb"/><text x="600" y="54" text-anchor="middle" class="h">Νευρολογική παρατήρηση · ανταπόκριση</text><text x="600" y="87" text-anchor="middle" class="sub">AVPU = A, V, P, U · ACVPU = A, C, V, P, U</text>
<circle cx="600" cy="305" r="98" fill="#dfedf5" stroke="#5a89a4" stroke-width="5"/>
<path d="M546 301Q522 279 537 254Q535 230 558 226Q576 204 598 221Q616 200 638 223Q672 216 678 247Q700 281 663 302Q623 339 546 301Z" fill="#efcad1" stroke="#b77385" stroke-width="5"/>
<path d="M601 218Q575 249 605 269Q584 291 599 325M644 237Q635 258 655 278" stroke="#b77385" stroke-width="4" fill="none"/>
<path d="M546 390Q508 422 494 469M653 390Q691 421 706 469" class="line"/>
<text x="600" y="494" text-anchor="middle" class="label">Εκτίμηση και επανεκτίμηση</text><g transform="translate(30 148)"><rect width="350" height="144" rx="18" class="card"/><circle cx="52" cy="50" r="33" fill="#dcefe3" stroke="#97aebe" stroke-width="3"/><text x="52" y="61" class="label" text-anchor="middle">A</text><text x="99" y="46" class="label" style="font-size:21px">Εγρήγορση</text><text x="21" y="110" class="small">Άμεση ανταπόκριση</text></g><g transform="translate(820 148)"><rect width="350" height="144" rx="18" class="card"/><circle cx="52" cy="50" r="33" fill="#fff0d5" stroke="#97aebe" stroke-width="3"/><text x="52" y="61" class="label" text-anchor="middle">C</text><text x="99" y="46" class="label" style="font-size:21px">Νέα σύγχυση</text><text x="21" y="110" class="small">Επιπλέον στην ACVPU</text></g><g transform="translate(30 343)"><rect width="350" height="144" rx="18" class="card"/><circle cx="52" cy="50" r="33" fill="#e2edf8" stroke="#97aebe" stroke-width="3"/><text x="52" y="61" class="label" text-anchor="middle">V</text><text x="99" y="46" class="label" style="font-size:21px">Απόκριση στη φωνή</text><text x="21" y="110" class="small">Αντιδρά στην ομιλία</text></g><g transform="translate(820 343)"><rect width="350" height="144" rx="18" class="card"/><circle cx="52" cy="50" r="33" fill="#f7dfdc" stroke="#97aebe" stroke-width="3"/><text x="52" y="61" class="label" text-anchor="middle">P</text><text x="99" y="46" class="label" style="font-size:21px">Απόκριση σε ερέθισμα</text><text x="21" y="110" class="small">Αξιολόγηση από εκπαιδευμένο</text></g><g transform="translate(336 573)"><rect width="530" height="144" rx="18" class="card"/><circle cx="52" cy="50" r="33" fill="#ede8f8" stroke="#97aebe" stroke-width="3"/><text x="52" y="61" class="label" text-anchor="middle">U</text><text x="99" y="46" class="label" style="font-size:21px">Χωρίς ανταπόκριση</text><text x="21" y="110" class="small">Δεν ανταποκρίνεται</text></g><path d="M380 230H480M820 230H720M380 413H481M820 413H720M600 510V570" class="line" stroke-dasharray="9 10"/>
</svg>