<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Δευτεροβάθμια εξέταση και ιστορικό τραύματος — Επανέλεγχος και ασφάλεια</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 14. Παρουσιάζονται: Όχι καθυστέρηση ασταθούς ασθενούς; Δομημένη ενημέρωση ΤΕΠ; Επανεκτίμηση κατά τη μεταφορά. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 14</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Δευτεροβάθμια εξέταση και ιστορικό τραύματος</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Επανέλεγχος και ασφάλεια</text><rect x="59" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#a75749" stroke-width="3"/><circle cx="226" cy="377" r="50" fill="#f0edf9" stroke="#a75749" stroke-width="3"/><path d="M204 389h44m-36-22h28m-28 44h28" stroke="#a75749" stroke-width="5" stroke-linecap="round"/><text x="226" y="476" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#a75749">Αστάθεια</text><text x="226" y="521" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="650" fill="#213f53">Άμεση προτεραιότητα</text><rect x="448" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#a75749" stroke-width="3"/><circle cx="615" cy="377" r="50" fill="#f0edf9" stroke="#a75749" stroke-width="3"/><path d="M591 365h48v28h-48z m8-18 16 18 16-18" fill="none" stroke="#a75749" stroke-width="4"/><text x="615" y="476" text-anchor="middle