<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Οξυγόνο και εξοπλισμός αναπνευστικής υποστήριξης – δομική αναγνώριση</title><desc id="desc">Σχηματική φιάλη οξυγόνου με ασφαλή στήριξη, βαλβίδα και ρυθμιστή και ενδεικτικό σωλήνα προς συσκευή παροχής. Επισημαίνονται βασικά μέρη χωρίς ποσότητες, ρυθμίσεις ροής, συγκεντρώσεις ή θεραπευτικές ενδείξεις.</desc><rect width="1200" height="720" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#183d54}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.line{fill:none;stroke:#53839d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#abc6d4;stroke-width:3}</style>
<text x="600" y="51" class="h" text-anchor="middle">Οξυγόνο · αναγνώριση βασικού εξοπλισμού</text>
<text x="600" y="84" class="s" text-anchor="middle">Η συσκευή δεν αποτελεί από μόνη της ένδειξη θεραπείας</text>
