<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Αρχική αξιολόγηση τραύματος XABCDE — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 5. Παρουσιάζονται: C: κυκλοφορία; D: νευρολογική εκτίμηση; E: έκθεση και περιβάλλον. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M160 399H1020" stroke="#a75749" stroke-width="7" stroke-linecap="round"/><circle cx="200" cy="399" r="60" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><text x="200" y="412" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="760" fill="#a75749">3</text><rect x="42" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#a75749" stroke-width="2.8"/><text x="200" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">C: κυκλοφορία</text><circle cx="590" cy="399" r="60" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><text x="590" y="412" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="760" fill="#a75749">4</text><rect x="432" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#a75749" stroke-width="2.8"/><text x="590" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">D: νευρολογική εκτίμηση</text><circle cx="980" cy="399" r="60" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><text x="980" y="412" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="760" fill="#a75749">5</text><rect x="822" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#a75749" stroke-width="2.8"/><text x="980" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">E: έκθεση και περιβάλλον</text></svg>