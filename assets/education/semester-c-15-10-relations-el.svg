<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Διακομιδές σε πολλά νοσοκομεία — Συσχέτιση και εξήγηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 15, κεφάλαιο 10: Η ανακατεύθυνση οχήματος ή η αλλαγή προορισμού επιβεβαιώνεται από τον αρμόδιο συντονισμό.; Η συνολική κατανομή έχει σημασία.; Σε μαζικό συμβάν ο προσωπικός ρόλος εντάσσεται στη διοίκηση συμβάντος και στην εικόνα…. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#4c8274"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 15 · ΚΕΦ. 10</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Διακομιδές σε πολλά νοσοκομεία</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">Συσχέτιση και εξήγηση</text><path d="M112 388H999" stroke="#4c8274" stroke-width="7"/><circle cx="190" cy="388" r="58" fill="#ebf3f8" stroke="#4c8274" stroke-width="4"/><text x="190" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">1</text><rect x="41" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#4c8274" stroke-width="2.6"/><text x="190" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η ανακατεύθυνση οχήματος</text><text x="190" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ή η αλλαγή προορισμού</text><text x="190" y="587" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">επιβεβαιώνεται από τον</text><text x="190" y="613" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">αρμόδιο συντονισμό.</text><circle cx="550" cy="388" r="58" fill="#ebf3f8" stroke="#4c8274" stroke-width="4"/><text x="550" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">2</text><rect x="401" y="240" width="298" height="151" rx="19" fill="#ffffff" stroke="#4c8274" stroke-width="2.6"/><text x="550" y="278" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η συνολική κατανομή έχει</text><text x="550" y="304" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">σημασία.</text><circle cx="910" cy="388" r="58" fill="#ebf3f8" stroke="#4c8274" stroke-width="4"/><text x="910" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">3</text><rect x="761" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#4c8274" stroke-width="2.6"/><text x="910" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Σε μαζικό συμβάν ο</text><text x="910" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">προσωπικός ρόλος</text><text x="910" y="587" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">εντάσσεται στη διοίκηση</text><text x="910" y="613" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">συμβάντος και στην</text><text x="910" y="639" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">εικόνα…</text><rect x="53" y="733" width="1005" height="40" rx="12" fill="#e5edf3"/><text x="555" y="760" font-size="16" font-weight="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">Σχηματική εικόνα από τη θεωρία · όχι αυτόνομο κλινικό ή υπηρεσιακό πρωτόκολλο.</text></svg>