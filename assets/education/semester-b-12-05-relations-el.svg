<title id="t">Φαρμακοκινητική: εννοιολογικές συνδέσεις — αποβολή, νεφροί, ήπαρ</title><desc id="d">Τρία διαφορετικά αφαιρετικά σύμβολα: απομάκρυνση από το σώμα, νεφροί και ήπαρ. Τα βέλη συνδέουν κάθε λεζάντα με το αντίστοιχο σύμβολο. Η αποβολή δεν γίνεται αποκλειστικά από τους νεφρούς· το σχήμα δεν δείχνει διαγνωστικό έλεγχο ή οδηγία δοσολογίας.</desc>
