<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Κύκλος δημόσιας υγείας: επιτήρηση, εκτίμηση, παρέμβαση, αξιολόγηση</title><desc id="desc">Τέσσερα συνδεδεμένα βήματα δημόσιας υγείας με παραδείγματα, από συλλογή δεδομένων πληθυσμού μέχρι αξιολόγηση αποτελεσμάτων. Συμβολική εκπαιδευτική ροή.</desc><rect width="1120" height="650" fill="#f6fafc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#17394d}.head{font-size:32px;font-weight:700}.step{font-size:26px;font-weight:700}.small{font-size:20px}.box{fill:white;stroke:#9ebccf;stroke-width:3}.arrow{stroke:#2b799a;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="560" y="57" text-anchor="middle" class="head">Πώς λειτουργεί η δημόσια υγεία</text><text x="560" y="93" text-anchor="middle" class="small">Από τα δεδομένα πληθυσμού στη βελτίωση των παρεμβάσεων</text>
<g><rect x="60" y="145" width="450" height="165" rx="22" class="box"/><circle cx="115" cy="197" r="22" fill="#a6d8ec"/><path d="M102 198l10 10 20-24" stroke="#1e6585" stroke-width="5" fill="none"/><text x="155" y="197" class="step">1. Επιτήρηση</text><text x="95" y="246" class="small">Καταγραφή κρουσμάτων και τάσεων</text><text x="95" y="277" class="small">σε έναν πληθυσμό</text></g>
<g><rect x="610" y="145" width="450" height="165" rx="22" class="box"/><circle cx="665" cy="197" r="22" fill="#ffdeb1"/><path d="M655 210l10-28 11 28z" fill="none" stroke="#99642b" stroke-width="4"/><text x="705" y="197" class="step">2. Εκτίμηση</text><text x="645" y="246" class="small">Ποιος κινδυνεύει, πού και γιατί;</text><text x="645" y="277" class="small">Προτεραιότητες και ανάγκες</text></g>
<g><rect x="610" y="395" width="450" height="165" rx="22" class="box"/><circle cx="665" cy="447" r="22" fill="#b8e7c7"/><path d="M652 447h26m-13-13v26" stroke="#26774d" stroke-width="6"/><text x="705" y="447" class="step">3. Παρέμβαση</text><text x="645" y="496" class="small">Π.χ. στοχευμένη ενημέρωση</text><text x="645" y="527" class="small">και μέτρα πρόληψης</text></g>
<g><rect x="60" y="395" width="450" height="165" rx="22" class="box"/><circle cx="115" cy="447" r="22" fill="#d8cef5"/><path d="M101 455l11-11 10 6 12-17" stroke="#62549a" stroke-width="5" fill="none"/><text x="155" y="447" class="step">4. Αξιολόγηση</text><text x="95" y="496" class="small">Μετράμε αποτελέσματα</text><text x="95" y="527" class="small">και αναπροσαρμόζουμε</text></g>
<path d="M518 225h80m-13-13 13 13-13 13M835 320v64m-13-13 13 13 13-13M602 475h-80m13-13-13 13 13 13M285 386v-65m-13 13 13-13 13 13" class="arrow"/><text x="560" y="619" text-anchor="middle" class="small">Σχηματικός κύκλος· τα στάδια μπορεί να αλληλεπικαλύπτονται στην πράξη.</text></svg>