<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Καταστροφική αιμορραγία — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 2. Παρουσιάζονται: Άμεση πίεση με εκπαίδευση; Κατάλληλο αιμοστατικό βοήθημα; Έλεγχος αποτελεσματικότητας. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M160 399H1020" stroke="#a75749" stroke-width="7" stroke-linecap="round"/><circle cx="200" cy="399" r="60" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><text x="200" y="412" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="760" fill="#a75749">1</text><rect x="42" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#a75749" stroke-width="2.8"/><text x="200" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Άμεση πίεση</text><text x="200" y="595" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">με εκπαίδευση</text><circle cx="590" cy="399" r="60" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><text x="590" y="412" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="760" fill="#a75749">2</text><rect x="432" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#a75749" stroke-width="2.8"/><text x="590" y="562" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Κατάλληλο αιμοστατικό</text><text x="590" y="591" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">βοήθημα</text><circle cx="980" cy="399" r="60" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><text x="980" y="412" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-