<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Σενάριο ηλικιωμένου με πολυνοσηρότητα — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 12. Παρουσιάζονται τρία διακριτά στοιχεία χωρίς σειρά προτεραιότητας: ιστορικό νοσημάτων, νέα σύγχυση ή πτώση, μεταβολή λειτουργικής κατάστασης. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="42" y="300" width="316" height="380" rx="22" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><circle cx="200" cy="394" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><rect x="177" y="365" width="20" height="27" rx="3" fill="none" stroke="#64569b" stroke-width="3"/><path d="M182 372h10m-10 6h10m-10 6h6" stroke="#64569b" stroke-width="2.5" stroke-linecap="round"/><rect x="202" y="376" width="20" height="27" rx="3" fill="none" stroke="#64569b" stroke-width="3"/><path d="M207 384h10m-10 6h10" stroke="#64569b" stroke-width="2.5" stroke-linecap="round"/><text x="200" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Ιστορικό νοσημάτων</text><rect x="432" y="300" width="316" height="380" rx="22" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><circle cx="590" cy="394" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><circle cx="579" cy="380" r="10" fill="none" stroke="#64569b" stroke-width="3"/><path d="M579 390v21m-12-12h19m-15 12-9 8m17-8 8 8m18-40h15m-7-8v16" fill="none" stroke="#64569b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" fill="#213f53">Νέα σύγχυση ή πτώση</text><rect x="822" y="300" width="316" height="380" rx="22" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><circle cx="980" cy="394" r="54" f