<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Σενάριο ηλικιωμένου με πολυνοσηρότητα — Συσχέτιση και εξήγηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 16, κεφάλαιο 12: Ο διασώστης αναζητά τη συνήθη κατάσταση του ασθενούς και πότε αυτή άλλαξε; Η περιγραφή του συνηθισμένου επιπέδου λειτουργίας μπορεί να αποτελέσει σημαντική πληροφορία.; Σε ομαδική άσκηση ο εκπαιδευόμενος εξηγεί τον λόγο κάθε επιλογής. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#66569b"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦ. 12</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Σενάριο ηλικιωμένου με πολυνοσηρότητα</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">Συσχέτιση και εξήγηση</text><path d="M112 388H999" stroke="#66569b" stroke-width="7"/><circle cx="190" cy="388" r="58" fill="#ebf3f8" stroke="#66569b" stroke-width="4"/><text x="190" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">1</text><rect x="41" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#66569b" stroke-width="2.6"/><text x="190" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Ο διασώστης αναζητά τη</text><text x="190" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">συνήθη κατάσταση του</text><text x="190" y="587" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">ασθενούς και πότε αυτή</text><text x="190" y="613" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">άλλαξε</text><circle cx="550" cy="388" r="58" fill="#ebf3f8" stroke="#66569b" stroke-width="4"/><text x="550" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">2</text><rect x="401" y="240" width="298" height="151" rx="19" fill="#ffffff" stroke="#66569b" stroke-width="2.6"/><text x="550" y="278" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η περιγραφή του</text><text x="550" y="304" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">συνηθισμένου επιπέδου</text><text x="550" y="330" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">λειτουργίας μπορεί να</text><text x="550" y="356" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">αποτελέσει σημαντική</text><text x="550" y="382" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">πληροφορία.</text><circle cx="910" cy="388" r="58" fill="#ebf3f8" stroke="#66569b" stroke-width="4"/><text x="910" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">3</text><rect x="761" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#66569b" stroke-width="2.6"/><text x="910" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Σε ομαδική άσκηση ο</text><text x="910" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">εκπαιδευόμενος εξηγεί τον</text><text x="910" y="587" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">λόγο κάθε επιλογής</text><rect x="53" y="733" width="1005" height="40" rx="12" fill="#e5edf3"/><text x="555" y="760" font-size="16" font-weight="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#66569b">Σχηματική εικόνα από τη θεωρία · όχι αυτόνομο κλινικό ή υπηρεσιακό πρωτόκολλο.</text></svg>