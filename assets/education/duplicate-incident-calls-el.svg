<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Πολλαπλές επείγουσες κλήσεις για την ίδια τοποθεσία</title><desc id="desc">Σχηματικό δύο τηλέφωνα από διαφορετικούς καλούντες που συνδέονται με ένα κοινό σημείο χάρτη και έναν διαβιβαστή, ο οποίος ελέγχει αν αναφέρονται στο ίδιο συμβάν. Ο πίνακας ξεχωρίζει τα διαφορετικά στοιχεία μαρτυρίας χωρίς βεβαιότητα ή αυθαίρετη διαγραφή.</desc><rect width="1200" height="680" fill="#f3f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#193b53}.h{font-size:33px;font-weight:700}.t{font-size:23px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.path{stroke:#5b88a1;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#b8ccd8;stroke-width:3}</style>
<text x="600" y="48" class="h" text-anchor="middle">Δύο κλήσεις · πιθανώς ένα συμβάν</text>
<text x="600" y="82" class="s" text-anchor="middle">Η συσχέτιση αναφορών απαιτεί έλεγχο θέσης, χρόνου και περιγραφής</text>
