<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Ινσουλίνη και γλυκαγόνη ρυθμίζουν τη γλυκόζη αίματος</title><desc id="d">Υψηλότερη γλυκόζη διεγείρει τα βήτα κύτταρα του παγκρέατος να εκκρίνουν ινσουλίνη, ώστε κύτταρα να προσλάβουν και ήπαρ/μύες να αποθηκεύσουν γλυκόζη. Χαμηλότερη γλυκόζη διεγείρει τα άλφα κύτταρα να εκκρίνουν γλυκαγόνη, που προάγει απελευθέρωση γλυκόζης από το ήπαρ. Οι δύο αποκρίσεις δρουν αντίρροπα.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347e75"/></marker><marker id="flow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b34d50"/></marker><marker id="flow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3277a5"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#347e75"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="555" y="30" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 02 · ΚΕΦΑΛΑΙΟ 04</text><text x="555" y="72" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Νευρική ρύθμιση και μεταβολισμός</text>
<!-- pancreas + duodenum --> <path d="M360 208Q390 181 425 195Q456 174 485 191Q518 180 540 199Q568 184 593 203Q624 190 651 211Q625 236 592 232Q568 254 539 237Q508 256 483 237Q452 252 427 232Q391 248 360 224Z" fill="#e9c57b" stroke="#b28a42" stroke-width="4"/><path d="M660 201Q704 204 711 238Q712 262 688 275" fill="none" stroke="#b47748" stroke-width="14" stroke-linecap="round"/><g fill="#7c5e9c" stroke="#fff" stroke-width="2"><circle cx="412" cy="216" r="8"/><circle cx="471" cy="212" r="8"/><circle cx="529" cy="219" r="8"/><circle cx="582" cy="215" r="8"/></g>
<!-- callout to pancreas --> <path d="M255 220L353 219" stroke="#347e75" stroke-width="3" marker-end="url(#arr)"/><text x="112" y="226" font-size="18" fill="#253f52" font-weight="700">Πάγκρεας</text><text x="555" y="282" font-size="15" fill="#526b78" text-anchor="middle">Νησίδια παγκρέατος: βήτα κύτταρα → ινσουλίνη · άλφα κύτταρα → γλυκαγόνη</text>
<!-- two paths --> <rect x="65" y="337" width="455" height="180" rx="18" fill="#f8e9e6" stroke="#b34d50" stroke-width="2"/><rect x="590" y="337" width="455" height="180" rx="18" fill="#e6f0f6" stroke="#3277a5" stroke-width="2"/>
<text x="292" y="371" font-size="18" fill="#8d4245" font-weight="700" text-anchor="middle">Υψηλή γλυκόζη αίματος</text><text x="817" y="371" font-size="18" fill="#2f6384" font-weight="700" text-anchor="middle">Χαμηλή γλυκόζη αίματος</text>
<path d="M105 398H476" stroke="#b34d50" stroke-width="4" marker-end="url(#flow1)"/><path d="M630 398H1001" stroke="#3277a5" stroke-width="4" marker-end="url(#flow2)"/>
<text x="155" y="430" font-size="16" fill="#253f52" text-anchor="middle">βήτα κύτταρο</text><text x="292" y="430" font-size="17" fill="#8d4245" font-weight="700" text-anchor="middle">Ινσουλίνη</text><text x="425" y="430" font-size="16" fill="#253f52" text-anchor="middle">πρόσληψη / αποθήκευση</text>
<text x="682" y="430" font-size="16" fill="#253f52" text-anchor="middle">άλφα κύτταρο</text><text x="817" y="430" font-size="17" fill="#2f6384" font-weight="700" text-anchor="middle">Γλυκαγόνη</text><text x="950" y="430" font-size="16" fill="#253f52" text-anchor="middle">ήπαρ: απελευθέρωση</text>
<text x="292" y="478" font-size="17" fill="#8d4245" font-weight="700" text-anchor="middle">Γλυκόζη αίματος ↓</text><text x="817" y="478" font-size="17" fill="#2f6384" font-weight="700" text-anchor="middle">Γλυκόζη αίματος ↑</text>
<!-- hormone pointers --> 
<text x="555" y="564" font-size="15" fill="#526b78" text-anchor="middle">Απλουστευμένος έλεγχος γλυκόζης — όχι μέτρηση ή θεραπευτική οδηγία</text></g></svg>