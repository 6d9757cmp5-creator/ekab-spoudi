<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Υποθερμία τραυματία και πρόληψη — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 13. Παρουσιάζονται: Περιορισμός περιττής έκθεσης; Στεγνή κάλυψη και μόνωση; Μέτρηση θερμοκρασίας όπου εφικτό. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 13</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Υποθερμία τραυματία και πρόληψη</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Σχέσεις και προτεραιότητες</text><rect x="65" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="427" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="789" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#a75749" stroke-width="3"/><circle cx="227" cy="389" r="48" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><path d="M205 403l20-29 13 15 13-22" fill="none" stroke="#a75749" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="227" y="485" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#a75749">Περιορισμός έκθεσης</text><text x="227" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="650" fill="#213f53">Στο περιβάλλον και στον αέρα</text><circle cx="589" cy="389" r="48" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><path d="M573 372h32v36h-32z m-8 41h48" fill="none" stroke="#a75749" stroke-width="4" stroke-linejoin="round"/><text x="589" y="485" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#a75749">Στεγνή κάλυψη</text><text x="589" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="650" fill="#213f53">Μόνωση από το ψύχος</text><circle cx="951" cy="389" r="48" fill="#e8f1f7" stroke="#a75749" stroke-width="4"/><path d="M951 354v49m-10-9a12 12 0 1 0 20 0v-40a10 10 0 0 0-20 0v40" fill="none" stroke="#a75749" stroke-width="4" stroke-linecap="round"/><path d="M951 389v16" stroke="#a75749" stroke-width="5" stroke-linecap="round"/><text x="951" y="485" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#a75749">Θερμοκρασία</text><text x="951" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="650" fill="#213f53">Μέτρηση όπου εφικτό</text><rect x="51" y="759" width="1076" height="45" rx="13" fill="#e8eef3"/><text x="590" y="788" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="610" fill="#a75749">Εκπαιδευτική απεικόνιση · συμβουλεύσου την πλήρη θεωρία και τις ισχύουσες οδηγίες.</text></svg>