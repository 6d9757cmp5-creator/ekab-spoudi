<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Αρθρώσεις, σύνδεσμοι και μύες — αναγνώριση σημείων</title><desc id="d">Τρία διαφορετικά σχηματικά σύμβολα: μακρό οστό, άρθρωση δύο οστών με χόνδρινες επιφάνειες και σκελετικός μυς με τένοντες και γραμμώσεις. Απλοποιημένη αναγνώριση, όχι ανατομική τομή ούτε σε κλίμακα.</desc><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d6f91"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#2d6f91"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ffffff" font-weight="690" text-anchor="middle">Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 01 · ΚΕΦΑΛΑΙΟ 09</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#ffffff" font-weight="720" text-anchor="middle">Αρθρώσεις, σύνδεσμοι και μύες</text><circle cx="197" cy="299" r="85" fill="#eef4f8" stroke="#2d6f91" stroke-width="2.4"/><g transform="translate(197 299)" stroke="#2d6f91" stroke-width="4" stroke-linejoin="round" fill="#f3dfbd"><path d="M-49-24C-58-39-47-55-31-53C-21-52-15-45-10-39L17-18C24-14 27-9 26-3L47 16C62 29 52 52 34 52C23 52 16 45 12 35L-16 14C-22 10-25 4-23-2L-42-17C-45-19-47-22-49-24Z"/><path d="M-39-27L-17-10M-12 3L17 25M24 31L38 43" fill="none" stroke="#d3ad79" stroke-width="2.5" stroke-linecap="round"/></g><path d="M197 478L197 361" stroke="#2d6f91" stroke-width="3.5" marker-end="url(#arr)"/><rect x="48" y="487" width="298" height="93" rx="17" fill="#ffffff" stroke="#2d6f91" stroke-width="2"/><text x="197" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#253f52" font-weight="700" text-anchor="middle">Οστό</text><circle cx="553" cy="303" r="85" fill="#eef4f8" stroke="#2d6f91" stroke-width="2.4"/><g transform="translate(553 303)" stroke="#2d6f91" stroke-width="3.5" stroke-linejoin="round"><path