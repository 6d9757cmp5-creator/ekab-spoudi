<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Αιφνίδια νευρολογικά σημεία: πρόσωπο, χέρι, ομιλία και χρόνος</title><desc id="desc">Πρωτότυπη εικόνα ανθρώπινου προσώπου με συμβολικά ασύμμετρη έκφραση, δύο άνω άκρα με διαφορετική θέση, κύμα ομιλίας και ρολόι έναρξης συμπτωμάτων. Τα εικονιζόμενα σημεία απαιτούν έγκαιρη αξιολόγηση αλλά δεν επαρκούν για διάγνωση εγκεφαλικού.</desc><rect width="1200" height="710" fill="#f4f8fc"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163a52}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.sub{font-size:17px}.line{fill:none;stroke:#587e9c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#b9d2df;stroke-width:3}</style>
<text x="600" y="49" text-anchor="middle" class="h">Αιφνίδια νευρολογικά σημεία · αναγνωρίζω και αναφέρω</text>
<text x="600" y="85" text-anchor="middle" class="s">Η αναγνώριση δεν υποκαθιστά διάγνωση · αναζητείται επείγουσα βοήθεια</text>
