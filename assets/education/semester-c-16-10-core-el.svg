<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Σενάριο κρίσης και μετακριτικής σύγχυσης — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 10. Παρουσιάζονται με αντίστοιχα σύμβολα: χρονική καταγραφή της κρίσης; προστασία από τραυματισμό; αποφυγή τοποθέτησης αντικειμένων στο στόμα. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><polygon points="590,250 824,399 590,542 356,399" fill="#edebf9" stroke="#64569b" stroke-width="4"/><text x="590" y="393" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="750" fill="#64569b">ΕΚΤΙΜΗΣΗ</text><text x="590" y="433" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="750" fill="#64569b">ΕΥΡΗΜΑΤΩΝ</text><path d="M485 478L203 573" stroke="#64569b" stroke-width="3"/><rect x="46" y="573" width="314" height="159" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.6"/><text x="203" y="617" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Διάρκεια κρίσης</text><circle cx="203" cy="681" r="25" fill="#f0edf9" stroke="#64569b" stroke-width="2.5"/><circle cx="203" cy="681" r="13" fill="none" stroke="#64569b" stroke-width="3"/><path d="M203 672v10l7 5" fill="none" stroke="#64569b" stroke-width="3" stroke-linecap="round"/><path d="M590 542L590 573" stroke="#64569b" stroke-width="3"/><rect x="433" y="573" width="314" height="159" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.6"/><text x="590" y="617" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Προστασία από τραυματισμό</text><circle cx="590" cy="681" r="25" fill="#f0edf9" stroke="#64569b" stroke-width="2.5"/><path d="M590 662l14 6v11c0 10-6 17-14 21-8-4-14-11-14-21v-11z" fill="non