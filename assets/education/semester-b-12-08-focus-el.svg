<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d"><title id="t">Αλλεργία και ανεπιθύμητη αντίδραση — Πρόσθετη θεματική εικόνα</title><desc id="d">Αυτόνομο εκπαιδευτικό διάγραμμα του Β΄ εξαμήνου, μάθημα 12, κεφάλαιο 8. Οι τρεις θεματικές έννοιες είναι: Αλλεργία: ανοσολογικός μηχανισμός; Βαρύτητα και χρόνος; Καταγραφή στο ιστορικό. Χρειάζεται έλεγχος ειδικού για κλινικές πράξεις.</desc><rect width="1100" height="720" fill="#f8fbfe"/><rect width="1100" height="141" fill="#876232"/><text x="550" y="31" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 12 · ΚΕΦ. 08</text><text x="550" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="750" text-anchor="middle" fill="#ffffff">Αλλεργία και ανεπιθύμητη αντίδραση</text><text x="550" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="740" text-anchor="middle" fill="#876232">Πρόσθετη θεματική εικόνα</text><rect x="84" y="256" width="298" height="247" rx="27" fill="#ffffff" stroke="#876232" stroke-width="3"/><g transform="translate(233 336)" fill="none" stroke="#876232" stroke-width="4"><rect x="-17" y="-45" width="34" height="90" rx="13" transform="rotate(42)"/><path d="M-39-20h78" transform="rotate(42)"/></g><text x="233" y="421" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="680" text-anchor="middle" fill="#293c50">Αλλεργία: ανοσολογικός</text><text x="233" y="448" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="680" text-anchor="middle" fill="#293c50">μηχανισμός</text><rect x="424" y="295" width="298" height="247" rx="27" fill="#ffffff" stroke="#876232" stroke-width="3"/><g transform="translate(573 375)" fill="none" stroke="#876232" stroke-width="4"><rect x="-17" y="-45" width="34" height="90" rx="13" transform="rotate(42)"/><path d="M-39-20h78" transform="rotate(42)"/></g><text x="573" y="460" fon