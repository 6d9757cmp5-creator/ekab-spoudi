<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Σενάριο οξείας δύσπνοιας — Στοιχεία αξιολόγησης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 8. Παρουσιάζονται: Κορεσμός όπου διατίθεται; Κυκλοφορία και συνείδηση; Αξιολόγηση βαρύτητας. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#64569b"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦΑΛΑΙΟ 08</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Σενάριο οξείας δύσπνοιας</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#64569b">Στοιχεία αξιολόγησης</text><circle cx="200" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><rect x="181" y="383" width="38" height="31" rx="5" fill="none" stroke="#64569b" stroke-width="4"/><path d="M188 391H212M188 399H201M188 406H205" stroke="#64569b" stroke-width="3" stroke-linecap="round"/><rect x="42" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="200" y="558" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Κορεσμός οξυγόνου</text><text x="200" y="586" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" fill="#213f53">αν διατίθεται</text><circle cx="590" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><path d="M590 371C582 363 568 371 572 384C576 395 590 404 590 404S604 395 608 384C612 371 598 363 590 371Z" fill="none" stroke="#64569b" stroke-width="4" stroke-linejoin="round"/><path d="M574 384H