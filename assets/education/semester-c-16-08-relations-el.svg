<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Σενάριο οξείας δύσπνοιας — Στοιχεία αξιολόγησης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 8. Παρουσιάζονται: Κορεσμός όπου διατίθεται; Κυκλοφορία και συνείδηση; Αξιολόγηση βαρύτητας. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><circle cx="200" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><rect x="181" y="383" width="38" height="31" rx="5" fill="none" stroke="#64569b" stroke-width="4"/><path d="M188 391H212M188 399H201M188 406H205" stroke="#64569b" stroke-width="3" stroke-linecap="round"/><rect x="42" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="200" y="558" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Κορεσμός οξυγόνου</text><text x="200" y="586" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" fill="#213f53">αν διατίθεται</text><circle cx="590" cy="399" r="60" fill="#e8f1f7" stroke="#64569b" stroke-width="4"/><path d="M590 371C582 363 568 371 572 384C576 395 590 404 590 404S604 395 608 384C612 371 598 363 590 371Z" fill="none" stroke="#64569b" stroke-width="4" stroke-linejoin="round"/><path d="M574 384H584L589 377L595 391L600 384H606" fill="none" stroke="#64569b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="622" cy="374" r="6" fill="none" stroke="#64569b" stroke-width="3.5"/><path d="M613 394Q622 382 631 394" fill="none" stroke="#64569b" stroke-width="3.5" stroke-linecap="round"/><rect x="432" y="515" width="316" height="169" rx="21" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><text x="590" y="566" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53