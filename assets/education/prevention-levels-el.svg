<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Τρία επίπεδα πρόληψης: πριν από τη νόσο, έγκαιρη ανίχνευση, περιορισμός επιπλοκών</title>
<desc id="desc">Τρία επίπεδα πρόληψης με παραδείγματα: εμβολιασμός πριν από τη νόσο, προσυμπτωματικός έλεγχος για έγκαιρη ανίχνευση και αποκατάσταση μετά τη διάγνωση. Η ταξινόμηση δεν αποτελεί υποχρεωτική αλληλουχία για κάθε άτομο ούτε ατομική ιατρική οδηγία.</desc>
<rect width="1100" height="650" fill="#f5f9fc"/>
<style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#14384e}.h{font-size:32px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.small{font-size:17px}.card{fill:#fff;stroke:#c5d6e0;stroke-width:2}.line{stroke:#567e95;stroke-width:5;fill:none;stroke-linecap:round}.blue{fill:#d9eefa;stroke:#247ca8;stroke-width:3}.orange{fill:#fff0d9;stroke:#c47b2c;stroke-width:3}.green{fill:#dff4e7;stroke:#32865c;stroke-width:3}</style>
<text x="550" y="52" text-anchor="middle" class="h">Τρία επίπεδα πρόληψης</text>
<text x="550" y="85" text-anchor="middle" class="s">Η παρέμβαση αλλάζει ανάλογα με το στάδιο της νόσου</text>
<path d="M110 154H985" class="line"/><path d="M978 143L998 154L978 165" class="line"/>
