<text x="165" y="295" text-anchor="middle" class="t">Έγκαιρη ανίχνευση</text><text x="165" y="329" text-anchor="middle" class="s">Παράδειγμα: προληπτικός</text><text x="165" y="354" text-anchor="middle" class="s">προσυμπτωματικός έλεγχος</text></g>
<g transform="translate(740 190)"><rect width="330" height="390" rx="22" class="card"/><rect x="18" y="18" width="294" height="65" rx="14" class="green"/><text x="165" y="59" text-anchor="middle" class="t">Τριτογενής</text>
