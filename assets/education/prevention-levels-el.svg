<text x="165" y="295" text-anchor="middle" class="t">Μετά τη διάγνωση</text><text x="165" y="329" text-anchor="middle" class="s">Παράδειγμα: αποκατάσταση</text><text x="165" y="355" text-anchor="middle" class="small">Στόχος: λιγότερες επιπλοκές</text></g>

