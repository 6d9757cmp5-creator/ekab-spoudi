<g transform="translate(90 108)"><path d="M75 0L138 24V85Q125 131 75 153Q25 131 12 85V24Z" fill="#e6f3ff" stroke="#247ca8" stroke-width="5"/><path d="M75 32V107M38 69H112" stroke="#247ca8" stroke-width="14" stroke-linecap="round"/></g>
<text x="165" y="295" text-anchor="middle" class="t">Πριν από τη νόσο</text><text x="165" y="329" text-anchor="middle" class="s">Παράδειγμα: εμβολιασμός</text><text x="165" y="355" text-anchor="middle" class="small">Στόχος: αποφυγή νόσου</text></g>
<g transform="translate(385 190)"><rect width="330" height="390" rx="22" class="card"/><rect x="18" y="18" width="294" height="65" rx="14" class="orange"/><text x="165" y="59" text-anchor="middle" class="t">Δευτερογενής</text>
