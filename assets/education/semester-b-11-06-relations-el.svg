<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d"><title id="t">Αεραγωγός και οξυγόνωση — Σχετικές έννοιες και παρατηρήσεις</title><desc id="d">Αυτόνομο εκπαιδευτικό διάγραμμα του Β΄ εξαμήνου, μάθημα 11, κεφάλαιο 6. Οι τρεις θεματικές έννοιες είναι: Oxygenation — οξυγόνωση; Airway obstruction — απόφραξη; Respiratory effort — προσπάθεια. Χρειάζεται έλεγχος ειδικού για κλινικές πράξεις.</desc><rect width="1100" height="720" fill="#f8fbfe"/><rect width="1100" height="141" fill="#3d719a"/><text x="550" y="31" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 11 · ΚΕΦ. 06</text><text x="550" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="750" text-anchor="middle" fill="#ffffff">Αεραγωγός και οξυγόνωση</text><text x="550" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="740" text-anchor="middle" fill="#3d719a">Σχετικές έννοιες και παρατηρήσεις</text><rect x="399" y="249" width="302" height="92" rx="28" fill="#3d719a"/><text x="550" y="286" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="740" text-anchor="middle" fill="#ffffff">ΣΤΟΧΟΣ ΚΕΦΑΛΑΙΟΥ</text><text x="550" y="316" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" text-anchor="middle" fill="#ffffff">Β05 · 06</text><path d="M550 342v34M550 375H187V402M550 375v27M550 375h364v27" stroke="#3d719a" stroke-width="3.4" fill="none"/><rect x="51" y="407" width="280" height="207" rx="24" fill="#ffffff" stroke="#3d719a" stroke-width="2.6"/><circle cx="191" cy="452" r="23" fill="#e3eff8" stroke="#3d719a" stroke-width="2.4"/><text x="191" y="461" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="750" text-anchor="middle" fill="#3d719a">1</text><text x="191" y="516" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#233c4e">Oxygenation — οξυγόνωση</text><rect x="411" y="407" width="280" height="207" rx="24" fill="#ffffff" stroke="#3d719a" stroke-width="2.6"/><circle cx="551" cy="452" r="23" fill="#e3eff8" stroke="#3d719a" stroke-width="2.4"/><text x="551" y="461" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="750" text-anchor="middle" fill="#3d719a">2</text><text x="551" y="516" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#233c4e">Airway obstruction —</text><text x="551" y="544" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#233c4e">απόφραξη</text><rect x="771" y="407" width="280" height="207" rx="24" fill="#ffffff" stroke="#3d719a" stroke-width="2.6"/><circle cx="911" cy="452" r="23" fill="#e3eff8" stroke="#3d719a" stroke-width="2.4"/><text x="911" y="461" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="750" text-anchor="middle" fill="#3d719a">3</text><text x="911" y="516" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#233c4e">Respiratory effort —</text><text x="911" y="544" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="middle" fill="#233c4e">προσπάθεια</text><rect x="59" y="651" width="982" height="43" rx="12" fill="#e4eff8"/><text x="550" y="680" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="650" text-anchor="middle" fill="#3d719a">Δίγλωσση ορολογία για κατανόηση εννοιών.</text></svg>