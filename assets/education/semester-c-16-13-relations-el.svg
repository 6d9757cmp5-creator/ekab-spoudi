<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Ομαδική επικοινωνία και ανατροφοδότηση σεναρίου — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 13. Παρουσιάζονται τρεις συμπληρωματικές δεξιότητες χωρίς υποχρεωτική σειρά: συνεργασία και επικοινωνία, ασφάλεια ρόλων, χρόνος κρίσιμης απόφασης. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="42" y="300" width="316" height="380" rx="22" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><circle cx="200" cy="394" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><path d="M174 374h35a11 11 0 0 1 11 11v9a11 11 0 0 1-11 11h-12l-13 11v-11h-10a11 11 0 0 1-11-11v-9a11 11 0 0 1 11-11zm31 35h10l11 9v-11a11 11 0 0 0 9-11v-9" fill="none" stroke="#64569b" stroke-width="3" stroke-linejoin="round"/><text x="200" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" fill="#213f53">Επικοινωνία ομάδας</text><rect x="432" y="300" width="316" height="380" rx="22" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><circle cx="590" cy="394" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><path d="M590 364l25 9v19c0 17-11 28-25 35-14-7-25-18-25-35v-19z" fill="none" stroke="#64569b" stroke-width="3" stroke-linejoin="round"/><circle cx="583" cy="384" r="4" fill="none" stroke="#64569b" stroke-width="2.5"/><circle cx="597" cy="384" r="4" fill="none" stroke="#64569b" stroke-width="2.5"/><path d="M581 398q9 7 18 0" fill="none" stroke="#64569b" stroke-width="2.5" stroke-linecap="round"/><text x="590" y="500" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Ασφάλεια ρόλων</text><rect x="822" y="300" width="316" height="380" rx="22" fill="#ffffff" stroke="#64569b" stroke-width="2.8"/><circle cx="980" cy="394" r="54