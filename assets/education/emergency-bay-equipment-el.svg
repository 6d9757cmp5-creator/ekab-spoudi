<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Χώρος αναζωογόνησης στο ΤΕΠ: θέσεις φορείου και βασικού εξοπλισμού</title>
<desc id="desc">Εκπαιδευτική κάτοψη χώρου αναζωογόνησης με κλίνη ασθενούς, μόνιτορ, διαθέσιμο απινιδωτή AED, εξοπλισμό οξυγόνου, δοχείο αιχμηρών και ελεύθερη οδό πρόσβασης. Το σχήμα δεν καθορίζει επίσημη αρχιτεκτονική διάταξη, εξοπλισμό υποχρεωτικό για όλες τις μονάδες ή αλγόριθμο ανάνηψης.</desc>
<rect width="1200" height="700" fill="#f3f8fb"/>
<style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173b54}.title{font-size:35px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:19px}.card{fill:#fff;stroke:#adc7d6;stroke-width:3}.leader{fill:none;stroke:#4f809b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="600" y="51" text-anchor="middle" class="title">Χώρος αναζωογόνησης · προσανατολισμός εξοπλισμού</text>
<text x="600" y="86" text-anchor="middle" class="small">Σχηματική κάτοψη · ενδεικτικές θέσεις, όχι επιχειρησιακή διάταξη</text>
<rect x="32" y="116" width="1136" height="492" rx="20" fill="#e3edf4" stroke="#8caebf" stroke-width="5"/>
<!-- stretcher -->
<g transform="translate(416 178)">
<rect width="356" height="286" rx="32" fill="#fff" stroke="#608ca4" stroke-width="9"/>
<rect x="27" y="29" width="299" height="222" rx="21" fill="#d3e5f0" stroke="#7da1b8" stroke-width="4"/>
<rect x="75" y="52" width="207" height="50" rx="19" fill="#f0f6f9" stroke="#9ab9c8" stroke-width="3"/>
<ellipse cx="178" cy="151" rx="60" ry="32" fill="#d8e9f2" stroke="#668da4" stroke-width="4"/>
<path d="M178 181V231M158 211H198" stroke="#668da4" stroke-width="8" stroke-linecap="round"/>
</g>
<text x="595" y="501" text-anchor="middle" class="label">Κλίνη / φορείο ασθενούς</text>
<!-- monitor -->
<rect x="78" y="179" width="239" height="183" rx="16" class="card"/>
<rect x="99" y="203" width="197" height="115" rx="9" fill="#1f4c62"/>
