<text x="982" y="330" text-anchor="middle" class="label">Απινιδωτής / AED</text>
<!-- oxygen -->
<rect x="88" y="430" width="246" height="143" rx="15" class="card"/>
<path d="M178 464Q178 452 190 452H222Q234 452 234 464V515Q234 528 221 528H191Q178 528 178 515Z" fill="#d8eff0" stroke="#548b93" stroke-width="5"/>
