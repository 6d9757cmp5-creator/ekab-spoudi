<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Διαδοχική επανεκτίμηση κατά τη διακομιδή</title><desc id="desc">Σχηματική χρονική πορεία που δείχνει αρχική παρατήρηση, επανεκτίμηση κατά τη μεταφορά και τεκμηριωμένη παράδοση. Τρεις ανεξάρτητες μετρήσεις απεικονίζονται ως σημεία χωρίς επινοημένες κλινικές τιμές, ώστε να φαίνεται η σημασία της μεταβολής στον χρόνο.</desc>
<rect width="1200" height="700" fill="#f4f8fc"/>
<style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173a52}.h{font-size:34px;font-weight:700}.sub{font-size:20px}.lbl{font-size:24px;font-weight:700}.small{font-size:18px}.panel{fill:#fff;stroke:#b8cfdf;stroke-width:3}.ink{stroke:#4b819c;stroke-width:5;fill:none;stroke-linejoin:round;stroke-linecap:round}.red{stroke:#c65d68;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="600" y="53" class="h" text-anchor="middle">Επανεκτίμηση κατά τη διακομιδή</text>
<text x="600" y="86" class="sub" text-anchor="middle">Κάθε μέτρηση έχει ώρα · η τάση ερμηνεύεται μαζί με την κλινική εικόνα</text>
<rect x="32" y="122" width="1136" height="492" rx="22" class="panel"/>
<path d="M134 240H1050" stroke="#88b4be" stroke-width="12" stroke-linecap="round"/>
<path d="M1026 225L1063 240L1026 255" class="ink"/>
<circle cx="184" cy="240" r="29" fill="#dbeef7" stroke="#568ba0" stroke-width="5"/><text x="184" y="249" text-anchor="middle" style="font-size:24px;font-weight:700">1</text><circle cx="593" cy="240" r="29" fill="#fce9dc" stroke="#568ba0" stroke-width="5"/><text x="593" y="249" text-anchor="middle" style="font-size:24px;font-weight:700">2</text><circle cx="982" cy="240" r="29" fill="#dff0e5" stroke="#568ba0" stroke-width="5"/><text x="982" y="249" text-anchor="middle" style="font-size:24px;font-weight:700">3</text>
<g transform="translate(68 299)"><rect width="238" height="215" rx="16" fill="#f1f7fc" stroke="#b8cfdf" stroke-width="3"/><text x="119" y="37" text-anchor="middle" class="lbl">Πρώτη εκτίμηση</text><circle cx="119" cy="85" r="25" fill="#d5e9f4" stroke="#53859f" stroke-width="4"/><path d="M91 113L78 164L157 164L145 113Z" fill="#d5e9f4" stroke="#53859f" stroke-width="4"/><text x="119" y="193" text-anchor="middle" class="small">Σημεία και ώρα</text></g>
<g transform="translate(474 299)"><rect width="238" height="215" rx="16" fill="#f1f7fc" stroke="#b8cfdf" stroke-width="3"/><text x="119" y="37" text-anchor="middle" class="lbl">Στη διαδρομή</text><path d="M25 115H211" stroke="#81a1b4" stroke-width="4"/><rect x="43" y="69" width="151" height="74" rx="13" fill="#dcecf7" stroke="#52849d" stroke-width="4"/><path d="M111 80V131M88 105H135" stroke="#c75d68" stroke-width="8"/><circle cx="75" cy="146" r="15" fill="#375b70"/><circle cx="166" cy="146" r="15" fill="#375b70"/><text x="119" y="193" text-anchor="middle" class="small">Νέα εκτίμηση</text></g>
<g transform="translate(862 299)"><rect width="238" height="215" rx="16" fill="#f1f7fc" stroke="#b8cfdf" stroke-width="3"/><text x="119" y="37" text-anchor="middle" class="lbl">Παράδοση</text><rect x="55" y="61" width="128" height="111" rx="6" fill="#fff" stroke="#53859f" stroke-width="4"/><path d="M75 91H166M75 111H166M75 130H149M75 150H138" class="ink" stroke-width="3"/><text x="119" y="193" text-anchor="middle" class="small">Τι άλλαξε, πότε</text></g>
<text x="600" y="558" text-anchor="middle" class="sub">Μεταβολή ή επιδείνωση → νέα αξιολόγηση και έγκαιρη ενημέρωση</text>
<text x="600" y="648" text-anchor="middle" class="sub">Σχηματικό παράδειγμα · δεν επιβάλλει σταθερά διαστήματα ή συγκεκριμένο πρωτόκολλο</text></svg>