<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Συντονισμός σε αιφνίδια κρίση — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 13, κεφάλαιο 10. Παρουσιάζονται: Κοινή επιχειρησιακή εικόνα; Κλιμάκωση διαθέσιμων μέσων; Σημεία παραλαβής κατά σχέδιο. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><g fill="#ffffff" stroke="#256e91" stroke-width="2.8"><rect x="42" y="286" width="340" height="360" rx="22"/><rect x="420" y="286" width="340" height="360" rx="22"/><rect x="798" y="286" width="340" height="360" rx="22"/></g>
