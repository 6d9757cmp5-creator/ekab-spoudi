<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc"><title id="title">Τρία βασικά ανατομικά επίπεδα</title><desc id="desc">Τρεις όρθιες σχηματικές ανθρώπινες μορφές σε πρόσθια όψη. Ημιδιαφανείς τομές δείχνουν οβελιαίο, μετωπιαίο και εγκάρσιο επίπεδο. Οι τομές έχουν συμβολική προοπτική.</desc><rect width="1080" height="600" fill="#f7fbff"/><style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#143a50}.head{font-size:30px;font-weight:bold}.label{font-size:23px;font-weight:bold}.small{font-size:17px}.person{fill:#c7dbe8;stroke:#325a73;stroke-width:3}.cut{fill:#e98b45;fill-opacity:.48;stroke:#b85c23;stroke-width:3}.panel{fill:white;stroke:#c7dbe8;stroke-width:2}</style><text x="540" y="48" text-anchor="middle" class="head">Ανατομικά επίπεδα — σχηματική απεικόνιση</text>
<g transform="translate(30 85)"><rect class="panel" x="0" y="0" width="320" height="480" rx="18"/><g transform="translate(160 10)"><circle class="person" cx="0" cy="45" r="31"/><path class="person" d="M-47 91Q0 76 47 91L56 230L32 239L28 370L5 370L0 243L-5 370L-28 370L-32 239L-56 230Z"/><path d="M-47 106L-82 225M47 106L82 225" fill="none" stroke="#325a73" stroke-width="22" stroke-linecap="round"/><path class="cut" d="M-17 7L26 24L26 374L-17 390Z"/></g><text x="160" y="435" text-anchor="middle" class="label">Οβελιαίο</text><text x="160" y="463" text-anchor="middle" class="small">Χωρίζει δεξιά / αριστερά</text></g>
<g transform="translate(380 85)"><rect class="panel" x="0" y="0" width="320" height="480" rx="18"/><g transform="translate(160 10)"><circle class="person" cx="0" cy="45" r="31"/><path class="person" d="M-47 91Q0 76 47 91L56 230L32 239L28 370L5 370L0 243L-5 370L-28 370L-32 239L-56 230Z"/><path d="M-47 106L-82 225M47 106L82 225" fill="none" stroke="#325a73" stroke-width="22" stroke-linecap="round"/><path class="cut" d="M-79 29L79 29L63 387L-63 387Z"/></g><text x="160" y="435" text-anchor="middle" class="label">Μετωπιαίο</text><text x="160" y="463" text-anchor="middle" class="small">Χωρίζει εμπρός / πίσω</text></g>
<g transform="translate(730 85)"><rect class="panel" x="0" y="0" width="320" height="480" rx="18"/><g transform="translate(160 10)"><circle class="person" cx="0" cy="45" r="31"/><path class="person" d="M-47 91Q0 76 47 91L56 230L32 239L28 370L5 370L0 243L-5 370L-28 370L-32 239L-56 230Z"/><path d="M-47 106L-82 225M47 106L82 225" fill="none" stroke="#325a73" stroke-width="22" stroke-linecap="round"/><path class="cut" d="M-83 204L83 204L61 240L-61 240Z"/></g><text x="160" y="435" text-anchor="middle" class="label">Εγκάρσιο</text><text x="160" y="463" text-anchor="middle" class="small">Χωρίζει άνω / κάτω</text></g><text x="540" y="588" text-anchor="middle" class="small">Οι τομές είναι εννοιολογικές· δεν αποδίδουν ανατομική κλίμακα ή πραγματικό πάχος.</text></svg>
