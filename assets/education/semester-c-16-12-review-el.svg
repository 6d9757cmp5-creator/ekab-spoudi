<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Σενάριο ηλικιωμένου με πολυνοσηρότητα — Επανέλεγχος και ασφάλεια</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 16, κεφάλαιο 12. Παρουσιάζονται τρία συμπληρωματικά θέματα: αναγνώριση άμεσων απειλών, πληροφορίες από συνοδό, δομημένη παράδοση. Δεν ορίζεται υποχρεωτική σειρά. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#64569b"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 16 · ΚΕΦΑΛΑΙΟ 12</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Σενάριο ηλικιωμένου με πολυνοσηρότητα</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#64569b">Επανέλεγχος και ασφάλεια</text><rect x="59" y="260" width="335" height="372" rx="24" fill="#ffffff" stroke="#64569b" stroke-width="3"/><circle cx="226" cy="351" r="54" fill="#f0edf9" stroke="#64569b" stroke-width="3"/><path d="M226 319l30 52h-60z" fill="none" stroke="#64569b" stroke-width="4" stroke-linejoin="round"/><path d="M226 334v18m0 8v1" stroke="#64569b" stroke-width="4" stroke-linecap="round"/><text x="226" y="457" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="760" fill="#64569b">ΑΜΕΣΕΣ ΑΠΕΙΛΕΣ</text><text x="226" y="510" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Δεν αγνοούνται</text><text x="226" y="539" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">άμεσες απειλές</text><rect x="448" y="260" width="335" height="372" rx="24" f