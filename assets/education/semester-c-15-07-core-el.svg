<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Αρχική διαλογή τραυματιών — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 7. Παρουσιάζονται: Γρήγορη αρχική διαλογή; Προσωρινή κατηγορία; Αλγόριθμος της υπηρεσίας. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="81" y="253" width="1015" height="469" rx="25" fill="#eaf3ef" stroke="#8aa79b" stroke-width="3"/><rect x="106" y="293" width="305" height="328" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="258" y="336" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΣΚΗΝΗ</text><circle cx="258" cy="415" r="37" fill="#4d7d70"/><g aria-hidden="true"><circle cx="258" cy="415" r="22" fill="none" stroke="#ffffff" stroke-width="5"/><path d="M258 415L258 400M258 415L270 421" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/></g><text x="258" y="486" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Γρήγορη αρχική διαλογή</text><rect x="443" y="293" width="305" height="328" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><g transform="translate(0,-35)"><text x="595" y="371" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΚΑΤΗΓΟΡΙΑ</text><circle cx="595" cy="450" r="37" fill="#4d7d70"/><g aria-hidden="true"><path d="M577 431H613V469H577Z" fill="none" stroke="#ffffff" stroke-width="5"/><path d="M584 440H606M584 450H602M584 460H598" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/></g><text x="595" y="521" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Προσωρινή κατηγορία</text></g><rect x="780" y="293" width="305" height="328" rx="25" fill=