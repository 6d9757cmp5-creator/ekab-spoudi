<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Αρχική διαλογή τραυματιών — Βασικά σημεία</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 15, κεφάλαιο 7: Η διαλογή είναι γρήγορη δυναμική ταξινόμηση προτεραιότητας με επικαιροποιημένο αλγόριθμο υπηρεσίας.; SOS · Αρχική διαλογή με το προβλεπόμενο σύστημα· επανεκτίμηση όταν αλλάζει κατάσταση ή πόροι.; Δεν αποτελεί τελική διάγνωση ούτε αποδίδει οριστική πρόγνωση.. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#4c8274"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 15 · ΚΕΦ. 07</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Αρχική διαλογή τραυματιών</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">Βασικά σημεία</text><rect x="94" y="246" width="923" height="448" rx="21" fill="#eaf2ee" stroke="#87a39d" stroke-width="3"/><rect x="119" y="285" width="264" height="300" rx="22" fill="#fbe4db" stroke="#4c8274" stroke-width="3"/><text x="251" y="330" font-size="18" font-weight="720" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">ΣΥΜΒΑΝ</text><circle cx="251" cy="394" r="34" fill="#4c8274"/><text x="251" y="404" font-size="28" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#ffffff">1</text><text x="251" y="459" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Η διαλογή είναι</text><text x="251" y="485" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">γρήγορη δυναμική</text><text x="251" y="511" font-size="19" 