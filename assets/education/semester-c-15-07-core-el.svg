<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Αρχική διαλογή τραυματιών — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 7. Παρουσιάζονται: Γρήγορη αρχική διαλογή; Προσωρινή κατηγορία; Αλγόριθμος της υπηρεσίας. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#4d7d70"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 15 · ΚΕΦΑΛΑΙΟ 07</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Αρχική διαλογή τραυματιών</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#4d7d70">Σημεία αναγνώρισης</text><rect x="81" y="253" width="1015" height="469" rx="25" fill="#eaf3ef" stroke="#8aa79b" stroke-width="3"/><rect x="106" y="293" width="305" height="328" rx="25" fill="#f8e0d9" stroke="#4d7d70" stroke-width="3"/><text x="258" y="336" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="750" fill="#4d7d70">ΣΚΗΝΗ</text><circle cx="258" cy="415" r="37" fill="#4d7d70"/><g aria-hidden="true"><circle cx="258" cy="415" r="22" fill="none" stroke="#ffffff" stroke-width="5"/><path d="M258 415L258 400M258 415L270 421" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/></g><text x="258" y="486" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="650" fill="#213f53">Γρήγορη αρχική διαλογή</text><rect x="443" y="328" width="305" height="328" rx="25" fill="#fff0d1" stroke="#4d7d70" stroke-width="3"/><text x="595" y="371" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weig