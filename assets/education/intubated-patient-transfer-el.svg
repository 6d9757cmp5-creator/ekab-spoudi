<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Διακομιδή διασωληνωμένου ασθενούς: κύρια σημεία προετοιμασίας συσκευών</title><desc id="desc">Σχηματικός ασθενής σε φορείο με ενδοτραχειακό σωλήνα προς την τραχεία, κύκλωμα προς φορητό αναπνευστήρα, οθόνη παρακολούθησης και στερέωση εξοπλισμού, με ένδειξη ειδικής συνοδευτικής ομάδας. Δεν αποτελεί τεχνική διασωλήνωσης, διαπίστωση θέσης σωλήνα, ρυθμίσεις αναπνευστήρα ή οδηγία κλινικής μεταφοράς.</desc><rect width="1200" height="690" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#173b52}.h{font-size:33px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.en{font-size:17px;fill:#40718b}.path{stroke:#5a86a0;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#b6cbd7;stroke-width:3}</style>
