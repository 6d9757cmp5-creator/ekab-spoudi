<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Κρανιοεγκεφαλική κάκωση – σχηματική τομή δέρματος, κρανίου, εγκεφάλου</title><desc id="desc">Σχηματική πλάγια όψη ανθρώπινου κεφαλιού με τομή που δείχνει δέρμα, κρανιακό οστό και εγκέφαλο, σημείο πρόσκρουσης και την ανάγκη παρατήρησης ανταπόκρισης/μεταβολής. Η εικόνα δεν αναπαριστά συγκεκριμένη ενδοκρανιακή βλάβη, πίεση ή θεραπεία.</desc><rect width="1200" height="690" fill="#f4f8fb"/><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#163a53}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:19px}.fine{font-size:17px}.line{fill:none;stroke:#56839e;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fff;stroke:#aec8d9;stroke-width:3}</style>
<text x="600" y="49" class="h" text-anchor="middle">Κρανιοεγκεφαλική κάκωση · ανατομική επισκόπηση</text>
<text x="600" y="85" class="s" text-anchor="middle">Ο μηχανισμός και η αλλαγή της συνείδησης έχουν σημασία στην εκτίμηση</text>
