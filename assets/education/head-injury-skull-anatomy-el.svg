<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Κρανιοεγκεφαλική κάκωση — σχηματική στρωμάτωση κεφαλής</title><desc id="d">Σχηματική αναπαράσταση στρώσεων δέρματος, κρανιακού οστού και εγκεφαλικού ιστού, χωρίς ανατομική κλίμακα ή διάγνωση.</desc><rect width="1180" height="820" fill="#f3f7fa"/><text x="590" y="88" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="740" fill="#213f53">Κρανιοεγκεφαλική κάκωση · στρώσεις κεφαλής</text><text x="590" y="137" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="520" fill="#506b82">Σχηματικό διάγραμμα, όχι ανατομική τομή και όχι υπό κλίμακα</text><rect x="70" y="260" width="690" height="360" rx="28" fill="#fff" stroke="#a9c6d8" stroke-width="3"/><text x="415" y="235" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#213f53">Σχηματική στρωμάτωση — όχι υπό κλίμακα</text><path d="M190 330h450v38H190z" fill="#e9c9bd" stroke="#a75749" stroke-width="3"/><path d="M190 368h450v94H190z" fill="#e5d2b7" stroke="#a75749" stroke-width="3"/><path d="M190 462h450v100H190z" fill="#efd8e0" stroke="#ae758c" stroke-width="3"/><path d="M410 270v48m-15-15 15 15 15-15" fill="none" stroke="#c75460" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="415" y="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" fill="#213f53">Ενδεικτικό σημείο πρόσκρουσης</text><path d="M645 349h75m-75 66h75m-75 96h75" stroke="#506b82" stroke-width="4"/><text x="750" y="357" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="680" fill="#213f53">Δέρμα</text><text x="750" y="423" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="680" fill="#213f53">Κρανιακό οστό</text><text x="750" y="503" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="680" fill="#213f53">Εγκεφαλικός ιστός</text><text x="590" y="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="580" fill="#506b82">Οι στρώσεις είναι αφαιρετικές· δεν απεικονίζονται κάταγμα, αιμορραγία ή διάγνωση.</text></svg>