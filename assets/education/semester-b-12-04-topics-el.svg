<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d"><title id="t">Παρακολούθηση και ανεπιθύμητες ενέργειες — αναγνώριση σημείων</title><desc id="d">Μνημονικά θεματικής αναγνώρισης: μάτι και ρολόι για παρακολούθηση στον χρόνο, πρόσωπο δίπλα σε οθόνη χωρίς αριθμητικές τιμές για κλινική ανταπόκριση, και πρόσωπο με προειδοποίηση για νέα αντίδραση. Δεν ορίζονται μετρήσεις ή κλινικά κριτήρια.</desc><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6f7396"/></marker></defs><rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#6f7396"/><text x="555" y="30" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#fff" font-weight="690" text-anchor="middle">Β΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 12 · ΚΕΦΑΛΑΙΟ 04</text><text x="555" y="72" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#fff" font-weight="720" text-anchor="middle">Παρακολούθηση και ανεπιθύμητες ενέργειες</text><circle cx="197" cy="299" r="85" fill="#eef4f8" stroke="#6f7396" stroke-width="2.4"/><g transform="translate(197 299)" fill="none" stroke="#6f7396" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M-50-14q24-27 48 0-24 27-48 0Z"/><circle cx="-26" cy="-14" r="7"/><circle cx="22" cy="16" r="28"/><path d="M22 0v17l12 8"/></g><path d="M197 478L197 361" stroke="#6f7396" stroke-width="3.5" marker-end="url(#arr)"/><rect x="48" y="487" width="298" height="93" rx="17" fill="#fff" stroke="#6f7396" stroke-width="2"/><text x="197" y="516" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#253f52" font-weight="700" text-anchor="middle">Παρακολούθηση μετά</text><text x="197" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#253f52" font-weight="700" text-anchor="middle">χορήγηση</text><circle cx="553" cy="299" r="85" fill="#eef4f8" stroke="#6f7396" stroke-width="2.4"/><g transform="transl