<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d">
<title id="t">Φυσιολογία της αναπνοής — εισπνοή, διάφραγμα και πνεύμονες</title>
<desc id="d">Απλοποιημένο πρόσθιο σχήμα θώρακα. Κατά την εισπνοή το διάφραγμα συσπάται και κατεβαίνει, ο θώρακας και οι πνεύμονες διατείνονται. Δεν παρουσιάζεται ανατομική τομή.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347e75"/></marker></defs>
<rect width="1110" height="630" fill="#f9fbfd"/><rect width="1110" height="113" fill="#347e75"/>
