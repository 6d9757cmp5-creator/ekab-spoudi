<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d">
<title id="t">Φυσιολογία της αναπνοής — εισπνοή, διάφραγμα και πνεύμονες</title><desc id="d">Απλοποιημένο πρόσθιο σχήμα θώρακα. Κατά την εισπνοή το διάφραγμα συσπάται και κατεβαίνει, ο θώρακας και οι πνεύμονες διατείνονται. Δεν παρουσιάζεται ανατομική τομή.</desc>
