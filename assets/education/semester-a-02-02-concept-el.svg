</g>
<text x="555" y="535" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#253f52" font-weight="700" text-anchor="middle">Εισπνοή · Διάφραγμα · Πνεύμονες</text>
<text x="555" y="582" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#526b78" text-anchor="middle">Σχηματική φυσιολογία — όχι εικόνα για διάγνωση ή διδασκαλία τεχνικής αερισμού</text>
