<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-labelledby="t d"><title id="t">Εγκαύματα και εισπνευστική κάκωση — Σημεία αναγνώρισης</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 14, κεφάλαιο 12. Παρουσιάζονται: Μηχανισμός θερμικού εγκαύματος; Έκταση και εντόπιση; Ένδειξη εισπνοής καπνού. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><path d="M0 0H1180V153H0Z" fill="#a75749"/><text x="590" y="39" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="690" fill="#ffffff">ΕΚΑΒ ΣΠΟΥΔΗ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 14 · ΚΕΦΑΛΑΙΟ 12</text><text x="590" y="85" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="760" fill="#ffffff">Εγκαύματα και εισπνευστική κάκωση</text><text x="590" y="197" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="740" fill="#a75749">Σημεία αναγνώρισης</text><text x="590" y="258" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="650" fill="#506b82">Τρεις διαφορετικές όψεις της κάκωσης</text><rect x="69" y="300" width="322" height="350" rx="22" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="429" y="300" width="322" height="350" rx="22" fill="#fff" stroke="#a75749" stroke-width="3"/><rect x="789" y="300" width="322" height="350" rx="22" fill="#fff" stroke="#a75749" stroke-width="3"/><path d="M230 367c-26 32-30 87-5 124h42c25-37 21-92-5-124z" fill="#daecf5" stroke="#506b82" stroke-width="4"/><path d="M240 385c-18 13-18 28 0 40m22-40c18 13 18 28 0 40" fill="none" stroke="#a75749" stroke-width="5"/><text x="230" y="541" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#213f53">Θερμική έκθεση</text><text x="230" y="575" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="650" fill="#213f53">Τρόπος και πηγή</text><path d="M590 363c-30 45-28 96 0 139 28-43 30-94 0-139z" fill="#daecf5" stroke="#506b82" stroke-width="4"/><path d="M590 383c-15 24-14 53 0 75 14-22 15-51 0-75z" fill="#f0b18d" stroke="#a75749" stroke-width="3"/><text x="590" y="541" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#213f53">Εντόπιση στο σώμα</text><text x="590" y="575" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="650" fill="#213f53">Σχηματική, όχι σε κλίμακα</text><path d="M930 367v70m-31-43c17-26 45-26 62 0m-62 27c17 26 45 26 62 0" fill="none" stroke="#506b82" stroke-width="7" stroke-linecap="round"/><path d="M918 418q-7 10-3 17m70-17q7 10 3 17" fill="none" stroke="#a75749" stroke-width="5"/><text x="950" y="541" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#213f53">Πιθανή εισπνοή καπνού</text><text x="950" y="575" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="650" fill="#213f53">Αναπνευστική εκτίμηση</text><rect x="51" y="759" width="1076" height="45" rx="13" fill="#e8eef3"/><text x="590" y="788" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="610" fill="#a75749">Εκπαιδευτική απεικόνιση · συμβουλεύσου την πλήρη θεωρία και τις ισχύουσες οδηγίες.</text></svg>