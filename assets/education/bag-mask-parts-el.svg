<text x="387" y="531" text-anchor="middle" class="t">Βαλβίδα</text>
<text x="682" y="531" text-anchor="middle" class="t">Ασκός</text>
<text x="600" y="619" text-anchor="middle" class="s">Η απεικόνιση αφορά τα μέρη του εξοπλισμού, όχι τεχνική αερισμού ασθενούς</text>
<text x="600" y="655" text-anchor="middle" class="fine">Η παροχή οξυγόνου, οι ρυθμίσεις και οι χειρισμοί ακολουθούν την εκπαίδευση και το εγκεκριμένο πρωτόκολλο</text></svg>
