<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Βασικές έννοιες επιδημιολογίας — Βασικές έννοιες, κεφάλαιο 04-05</title><desc id="d">Πρωτότυπο διάγραμμα του κεφαλαίου 04-05. Περιλαμβάνει Η επίπτωση περιγράφει νέα περιστατικά μιας νόσου σε συγκεκριμένο πληθυσμό και χρονικό διάστημα; Ο επιπολασμός περιγράφει το σύνολο των υπαρχόντων περιστατικών σε συγκεκριμένη χρονική στιγμή ή περίοδο; Η διάκριση βοηθά στην κατανόηση της εξάπλωσης και του βάρους νοσημάτων. Απλουστευμένη οπτική υποστήριξη της θεωρίας, όχι αυτόνομη ιατρική οδηγία.</desc><rect width="1100" height="700" fill="#f7fafd"/><rect width="1100" height="132" fill="#956b31"/><text x="550" y="34" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">ΣΑΕΚ · Α΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 04 · ΚΕΦΑΛΑΙΟ 05</text><text x="550" y="79" text-anchor="middle" fill="#ffffff" font-weight="750" font-size="27" font-family="DejaVu Sans,Arial,sans-serif">Βασικές έννοιες επιδημιολογίας</text><text x="550" y="174" text-anchor="middle" fill="#956b31" font-weight="750" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">Βασικές έννοιες</text><rect x="55" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#956b31" stroke-width="2.5"/><circle cx="207" cy="314" r="52" fill="#e7f0f7" stroke="#956b31" stroke-width="3"/><circle cx="207" cy="314" r="20" fill="none" stroke="#956b31" stroke-width="4"/><text x="207" y="415" text-anchor="middle" fill="#956b31" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">01</text><text x="207" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Η επίπτωση περιγράφει</text><text x="207" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">νέα περιστατικά μιας</text><text x="207" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">νόσου σε συγκεκριμένο</text><text x="207" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">πληθυσμό και χρονικό</text><rect x="400" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#956b31" stroke-width="2.5"/><circle cx="552" cy="314" r="52" fill="#e7f0f7" stroke="#956b31" stroke-width="3"/><circle cx="552" cy="314" r="27" fill="none" stroke="#956b31" stroke-width="4"/><text x="552" y="415" text-anchor="middle" fill="#956b31" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">02</text><text x="552" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Ο επιπολασμός</text><text x="552" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">περιγράφει το σύνολο</text><text x="552" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">των υπαρχόντων</text><text x="552" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">περιστατικών σε</text><rect x="745" y="215" width="305" height="345" rx="20" fill="#ffffff" stroke="#956b31" stroke-width="2.5"/><circle cx="897" cy="314" r="52" fill="#e7f0f7" stroke="#956b31" stroke-width="3"/><circle cx="897" cy="314" r="34" fill="none" stroke="#956b31" stroke-width="4"/><text x="897" y="415" text-anchor="middle" fill="#956b31" font-weight="750" font-size="29" font-family="DejaVu Sans,Arial,sans-serif">03</text><text x="897" y="466" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">Η διάκριση βοηθά στην</text><text x="897" y="495" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">κατανόηση της</text><text x="897" y="524" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">εξάπλωσης και του</text><text x="897" y="553" text-anchor="middle" fill="#1e3b50" font-weight="650" font-size="23" font-family="DejaVu Sans,Arial,sans-serif">βάρους νοσημάτων</text><rect x="55" y="596" width="990" height="69" rx="16" fill="#e7f0f7"/><text x="550" y="639" text-anchor="middle" fill="#956b31" font-weight="600" font-size="19" font-family="DejaVu Sans,Arial,sans-serif">Ειδικό εκπαιδευτικό σχήμα · δεν αντικαθιστά την πλήρη θεωρία.</text></svg>