<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 630" role="img" aria-labelledby="t d">
<title id="t">Καρδιακός κύκλος — κοιλότητες και κατεύθυνση ροής</title>
<desc id="d">Σχηματική τομή της καρδιάς με δεξιό και αριστερό κόλπο και κοιλία. Βέλη δείχνουν την πορεία από δεξιά καρδιά προς πνεύμονες, επιστροφή στον αριστερό κόλπο και εξώθηση από την αριστερή κοιλία προς το σώμα.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2475a5"/></marker><marker id="red" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c94747"/></marker></defs>
