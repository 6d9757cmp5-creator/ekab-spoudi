<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 785" role="img" aria-labelledby="t d"><title id="t">Τι αλλάζει σε μαζικό συμβάν — Συσχέτιση και εξήγηση</title><desc id="d">Εκπαιδευτικό διάγραμμα για μάθημα 15, κεφάλαιο 1: Ο ορισμός δεν εξαρτάται μόνο από τον αριθμό θυμάτων, αλλά και από τη δυνατότητα ανταπόκρισης.; Σε εκπαιδευτικό σενάριο σχετικό με «Τι αλλάζει σε μαζικό συμβάν»; Δεν αλλάζουμε αυθαίρετα σχέδιο ή ζώνη.. Δεν αποτελεί κλινική πράξη.</desc><rect width="1110" height="785" fill="#f9fbfd"/><rect width="1110" height="147" fill="#4c8274"/><text x="555" y="35" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">ΣΑΕΚ · Γ΄ ΕΞΑΜΗΝΟ · ΜΑΘΗΜΑ 15 · ΚΕΦ. 01</text><text x="555" y="87" font-size="26" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#fff">Τι αλλάζει σε μαζικό συμβάν</text><text x="555" y="194" font-size="25" font-weight="750" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">Συσχέτιση και εξήγηση</text><path d="M112 388H999" stroke="#4c8274" stroke-width="7"/><circle cx="190" cy="388" r="58" fill="#ebf3f8" stroke="#4c8274" stroke-width="4"/><text x="190" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">1</text><rect x="41" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#4c8274" stroke-width="2.6"/><text x="190" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Ο ορισμός δεν εξαρτάται</text><text x="190" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">μόνο από τον αριθμό</text><text x="190" y="587" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">θυμάτων, αλλά και από τη</text><text x="190" y="613" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">δυνατότητα ανταπόκρισης.</text><circle cx="550" cy="388" r="58" fill="#ebf3f8" stroke="#4c8274" stroke-width="4"/><text x="550" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">2</text><rect x="401" y="240" width="298" height="151" rx="19" fill="#ffffff" stroke="#4c8274" stroke-width="2.6"/><text x="550" y="278" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Σε εκπαιδευτικό σενάριο</text><text x="550" y="304" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">σχετικό με «Τι αλλάζει σε</text><text x="550" y="330" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">μαζικό συμβάν»</text><circle cx="910" cy="388" r="58" fill="#ebf3f8" stroke="#4c8274" stroke-width="4"/><text x="910" y="400" font-size="35" font-weight="760" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">3</text><rect x="761" y="493" width="298" height="151" rx="19" fill="#ffffff" stroke="#4c8274" stroke-width="2.6"/><text x="910" y="535" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">Δεν αλλάζουμε αυθαίρετα</text><text x="910" y="561" font-size="19" font-weight="650" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#253d51">σχέδιο ή ζώνη.</text><rect x="53" y="733" width="1005" height="40" rx="12" fill="#e5edf3"/><text x="555" y="760" font-size="16" font-weight="600" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#4c8274">Σχηματική εικόνα από τη θεωρία · όχι αυτόνομο κλινικό ή υπηρεσιακό πρωτόκολλο.</text></svg>