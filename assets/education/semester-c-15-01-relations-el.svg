<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1180 615" role="img" aria-labelledby="t d"><title id="t">Τι αλλάζει σε μαζικό συμβάν — Σχέσεις και προτεραιότητες</title><desc id="d">Πρωτότυπο, ειδικό διάγραμμα Γ΄ εξαμήνου, μάθημα 15, κεφάλαιο 1. Παρουσιάζονται: Ασφάλεια πριν από διαλογή; Ενεργοποίηση υπηρεσιακού σχεδίου; Συνεργασία πολλών φορέων. Πρόκειται για διδακτικό σχήμα και όχι για κλινική εντολή ή πρωτόκολλο.</desc><rect width="1180" height="820" fill="#f9fbfd"/><rect x="65" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#4d7d70" stroke-width="3"/><rect x="427" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#4d7d70" stroke-width="3"/><rect x="789" y="286" width="325" height="335" rx="24" fill="#fff" stroke="#4d7d70" stroke-width="3"/><circle cx="227" cy="389" r="48" fill="#e8f1f7" stroke="#4d7d70" stroke-width="4"/><path d="M227 363l22 8v17q-2 18-22 28-20-10-22-28v-17z" fill="none" stroke="#4d7d70" stroke-width="4" stroke-linejoin="round"/><path d="M216 389l8 8 15-17" fill="none" stroke="#4d7d70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="227" y="485" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#4d7d70">Ασφάλεια</text><text x="227" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="650" fill="#213f53">Πριν από τη διαλογή</text><circle cx="589" cy="389" r="48" fill="#e8f1f7" stroke="#4d7d70" stroke-width="4"/><path d="M575 366h28v45h-28z m6 10h16m-16 8h12" fill="none" stroke="#4d7d70" stroke-width="4" stroke-linecap="round"/><path d="M599 395l-5 9h7l-5 9" fill="none" stroke="#4d7d70" stroke-width="3" stroke-linejoin="round"/><text x="589" y="485" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#4d7d70">Υπηρεσιακό σχέδιο</text><text x="589" y="531" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weigh