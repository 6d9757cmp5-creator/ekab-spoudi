name: Extended 3D anatomy and MENTOR workflows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deep-anatomy-mentor.yml'
      - 'scripts/verify-anatomy-browser.mjs'
      - 'tools/anatomy-3d/**'
      - 'ui-tools/anatomy-3d/**'
      - 'scripts/verify-mentor-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anatomy-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-anatomy-browser.mjs
      - name: Save anatomy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekab-anatomy-3d-evidence
          path: browser-qa-results/
          if-no-files-found: warn
  mentor-os:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-mentor-browser.mjs
      - name: Save MENTOR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekab-mentor-os-evidence
          path: mentor-foundation-mobile*.png
          if-no-files-found: warn
