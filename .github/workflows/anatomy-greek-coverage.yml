name: 3D Ανατομία — πλήρης έλεγχος ελληνικής μετάφρασης
on:
  pull_request:
    paths:
      - ui-tools/anatomy-3d/greek-names.js
      - ui-tools/anatomy-3d/audit-greek-coverage.mjs
      - .github/workflows/anatomy-greek-coverage.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-complete-atlases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test precise Greek terminology examples
        run: node --test ui-tools/anatomy-3d/test-greek-names.mjs
      - name: Check every part from both pinned atlases
        run: node ui-tools/anatomy-3d/audit-greek-coverage.mjs
      - name: Archive translation queue for anatomy terminology review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-greek-translation-report
          path: ui-tools/anatomy-3d/translation-audit/
          if-no-files-found: warn
      - name: Coverage note
        if: always()
        run: |
          echo "The report enumerates untranslated mesh names. Medical review is independent from numerical coverage." >> "$GITHUB_STEP_SUMMARY"
          echo "Full Greek coverage is a hard requirement before publication." >> "$GITHUB_STEP_SUMMARY"
      - name: Full Greek translation completion gate
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = 'ui-tools/anatomy-3d/translation-audit/summary.json';
          const info = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (info.untranslated !== 0) {
            console.error('Greek naming coverage: '+info.translated+'/'+info.meshes+' ('+info.coverage+'%).');
            console.error(info.untranslated+' labels still untranslated. Do not merge this PR yet.');
            process.exit(1);
          }
          console.log('All '+info.meshes+' anatomy mesh labels have Greek names. Medical nomenclature review is still separately required.');
          NODE
