name: ATLA Full BodyParts3D Atlases 4.0 and 4.3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atla-bp3d43-local-atlas-check.yml'
      - 'scripts/verify-atla-full-atlas*.mjs'
      - 'ui-tools/anatomy-full-atlas.html'
      - 'tools/anatomy-3d/vendor/open-anatomy-atlas/src/renderer/app.js'
      - 'tools/anatomy-3d/index.html'
      - 'ui-tools/anatomy-3d/index.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atla-local-full-atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and verify every stored BodyParts3D source shard
        run: |
          node --check tools/anatomy-3d/vendor/open-anatomy-atlas/src/renderer/app.js
          node --check scripts/verify-atla-full-atlas.mjs
          node scripts/verify-atla-full-atlas.mjs
      - name: Install Chromium automation
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser verification of both real local 3D atlases
        run: node scripts/verify-atla-full-atlas-browser.mjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atla-full-bp3d43-browser-evidence
          path: browser-qa-results/atla-*-full-atlas.png
          if-no-files-found: warn
