name: UI and tool fastlane
# One-time bootstrap: this workflow must reach main through the existing protected PR path.
# Never checks out a PR or runs untrusted PR code. The API only reads changed files.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["Media publication gate", "Release quality smoke checks"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
  pull-requests: write
  checks: read
  pages: write
jobs:
  ui-fastlane:
    runs-on: ubuntu-latest
    concurrency:
      group: ui-fastlane-main
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const vm = require('node:vm');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const permitted = new Set([
              'index.html', 'home.css', 'home-tracker-v2.js',
              'home-mini-progress.js', 'ui-guide.js', 'continue-study.js',
              'global-tools.js', 'global-tools.css',
              'saek-hub.js', 'saek-hub.css',
              'eoppep-hub.js', 'eoppep-hub.css',
              'theme-init.js', 'sw.js'
            ]);
            // New purely presentational or tool modules go in these two folders.
            const toolPath = /^(?:ui-tools|ui-components)\/(?:[a-z0-9_-]+\/)*[a-z0-9_-]+\.(?:js|css|html)$/i;
            const acceptable = f => (permitted.has(f.filename) || toolPath.test(f.filename))
              && (f.status === 'added' || f.status === 'modified');
            let candidates = [];
            if (context.eventName === 'pull_request_target') {
              candidates = [context.payload.pull_request];
            } else {
              candidates = await github.paginate(github.rest.pulls.list,
                {owner, repo, state:'open', base:'main', per_page:100});
              if (context.eventName === 'workflow_run') {
                const run = context.payload.workflow_run;
                if (run.conclusion !== 'success') return;
                candidates = candidates.filter(pr => pr.head.sha === run.head_sha ||
                  (run.pull_requests || []).some(x => x.number === pr.number));
              }
            }
            let merged = 0;
            for (const candidate of candidates) {
              const {data:pr} = await github.rest.pulls.get({
                owner, repo, pull_number:candidate.number
              });
              if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main') continue;
              // The fastlane is only for the repository owner's own same-repo branches.
              if (pr.user.login !== owner || pr.head.repo?.full_name !== owner+'/'+repo) continue;
              const files = await github.paginate(github.rest.pulls.listFiles,
                {owner, repo, pull_number:pr.number, per_page:100});
              if (!files.length || files.length > 20 || !files.every(acceptable)) {
                core.info('PR #'+pr.number+': protected/content/mixed files; manual review.');
                continue;
              }
              // Parse all changed browser JS without evaluating it.
              let syntaxOK = true;
              for (const file of files.filter(f => f.filename.endsWith('.js'))) {
                try {
                  const response = await github.rest.repos.getContent({
                    owner, repo, path:file.filename, ref:pr.head.sha
                  });
                  if (!response.data.content || response.data.encoding !== 'base64') throw Error('non-text file');
                  const js = Buffer.from(response.data.content, 'base64').toString('utf8');
                  new vm.Script(js, {filename:file.filename});
                } catch (error) {
                  core.warning('PR #'+pr.number+': failed JS syntax check in '+file.filename+': '+error.message);
                  syntaxOK = false;
                  break;
                }
              }
              if (!syntaxOK) continue;
              // UX-only changes require quick technical checks, not content/media approval.
            // The repository branch rule may still require media-gate to report success.
            // This is a no-media pass, not a review of lessons or images.
              const checks = await github.paginate(github.rest.checks.listForRef,
                {owner, repo, ref:pr.head.sha, per_page:100});
              const passed = name => checks.some(check =>
                check.name === name && check.head_sha === pr.head.sha &&
                check.status === 'completed' && check.conclusion === 'success');
              if (!passed('media-gate') || !passed('release-smoke')) {
                core.info('PR #'+pr.number+': waiting for media-gate and release-smoke.');
                continue;
              }
              // Fail closed on conflicts, stale bases, other branch protections.
              if (pr.mergeable !== true || !['clean','blocked','unstable'].includes(pr.mergeable_state)) {
                core.info('PR #'+pr.number+': not yet mergeable ('+pr.mergeable_state+').');
                continue;
              }
              try {
                const result = await github.rest.pulls.merge({
                  owner, repo, pull_number:pr.number, sha:pr.head.sha, merge_method:'squash',
                  commit_title:'UI fastlane: '+pr.title
                });
                if (!result.data.merged) throw Error('GitHub did not merge');
                merged++;
                core.info('PR #'+pr.number+' automatically merged after approved UI-only checks.');
                // GITHUB_TOKEN-triggered merges may not trigger a GitHub Pages push build.
                // Request a branch-source Pages rebuild when supported.
                try {
                  await github.request('POST /repos/{owner}/{repo}/pages/builds', {owner, repo});
                  core.info('GitHub Pages rebuild requested.');
                } catch (buildError) {
                  core.warning('Pages rebuild not confirmed: '+buildError.message+
                    '. Check the configured deployment source.');
                }
              } catch (error) {
                core.warning('PR #'+pr.number+': merge rejected by GitHub: '+error.message);
              }
            }
            core.info('Automatically merged eligible PRs: '+merged);
