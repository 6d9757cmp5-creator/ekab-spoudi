name: Mentor public bibliography smoke
on:
  pull_request:
    paths:
      - mentor-library.html
      - mentor-library.js
      - mentor/library/source-index.json
      - mentor/library/catalog-search.mjs
      - scripts/test-mentor-source-index.mjs
      - .github/workflows/mentor-bibliography.yml
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bibliography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check mentor-library.js && node --check mentor/library/catalog-search.mjs
      - run: node --test scripts/test-mentor-source-index.mjs
