name: Official Crete AED API compatibility check
on:
  pull_request:
    paths:
      - .github/workflows/map-provider-api-probe.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read official AED API public fields and availability indicators
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from collections import Counter
          import json
          url='https://apinidotes-api.crete.gov.gr/apinidotesApi/api/Defibrillators'
          try:
              req=Request(url,headers={'User-Agent':'EKAB-Spoudi-Interoperability-Check/1.0','Origin':'https://6d9757cmp5-creator.github.io'})
              with urlopen(req,timeout=20) as r:
                  payload=r.read(4000000)
                  print('HTTP',r.status,'SIZE',len(payload),'CORS',r.headers.get('Access-Control-Allow-Origin'))
              data=json.loads(payload)
              print('ITEM_COUNT',len(data))
              print('STATE_COUNTS',dict(Counter((str(x.get('availability')),str(x.get('functional')),str(x.get('public'))) for x in data)))
              print('HAS_WORKING_HOURS',sum(bool(x.get('workingHours')) for x in data))
              print('TWENTY_FOUR_SEVEN',sum(bool(x.get('twentyFourSeven')) for x in data))
              for item in data[:2]:
                  for k in ['availability','functional','public','twentyFourSeven','workingHours','address','position']:
                      v=item.get(k)
                      if k in ('address','position'):v='[redacted]'
                      elif k=='workingHours':v=str(v)[:300]
                      print('FIELD',k,type(item.get(k)).__name__,v)
          except Exception as exc:
              print('API_ERROR',repr(exc))
              raise
          PY
