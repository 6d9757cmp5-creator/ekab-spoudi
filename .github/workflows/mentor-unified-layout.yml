name: MENTOR unified directory validation
on:
  pull_request:
    paths:
      - 'mentor/**'
      - 'mentor-*'
      - 'assets/mentor-*'
      - 'index.html'
      - 'scripts/test-mentor-*'
      - 'scripts/verify-mentor-layout-browser.mjs'
      - '.github/workflows/mentor-unified-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all legacy paths and centralized imports/assets
        run: |
          node --test scripts/test-mentor-layout.mjs
          node --test scripts/test-mentor-voice.mjs
          node --test scripts/test-mentor-3d.mjs
          node --test scripts/test-mentor-cinematic.mjs
          node --test scripts/test-mentor-v1-unified.cjs
          for f in mentor/app/*.js mentor/voice/*.mjs mentor/avatar/*.mjs; do node --check "$f"; done
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Load all public Mentor pages from centralized modules
        run: node scripts/verify-mentor-layout-browser.mjs
      - name: Protect legacy grades, notes and sync source
        run: |
          git fetch --depth=1 origin main:refs/remotes/origin/main
          git diff --name-only origin/main...HEAD
          if git diff --name-only origin/main...HEAD | grep -E '^(app\.js|progress\.js|sync-local\.js|sync-model\.js|cloud-sync\.js|saek-exam-engine\.js|notes-store\.js|ai-grading-client\.js|functions/answer-grader/|workers/answer-grader/)'; then
            echo "Protected learner-progress files were modified"
            exit 1
          fi
