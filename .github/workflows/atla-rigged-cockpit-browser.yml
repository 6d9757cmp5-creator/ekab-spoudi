name: Retired patient-simulation URLs and surviving ECG acceptance
on:
  push:
    branches: [main]
    paths:
      - 'mentor-next.html'
      - 'mentor-live.html'
      - 'mentor-scenarios.html'
      - 'mentor-ecg.html'
      - '.github/workflows/atla-rigged-cockpit-browser.yml'
  pull_request:
    paths:
      - 'mentor-next.html'
      - 'mentor-live.html'
      - 'mentor-scenarios.html'
      - 'mentor-ecg.html'
      - 'scripts/verify-retired-simulations-browser.mjs'
      - '.github/workflows/atla-rigged-cockpit-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify retired routes and preserved independent ECG
        run: |
          node scripts/verify-unified-scene.mjs
          node --test tools/ecg-lab/core/ecg-synthetic.test.mjs tools/ecg-lab/core/ecg-practice.test.mjs
      - name: Install Chromium for mobile and desktop
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate retired simulator URLs in real browser
        run: node scripts/verify-retired-simulations-browser.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retired-patient-simulator-route-evidence
          path: audit-results/retired-sim/
          if-no-files-found: warn
