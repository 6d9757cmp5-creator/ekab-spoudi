name: ATLA NIH3D biomedical scope research catalog (no indiscriminate copying)
on:
  push:
    branches: [feat/nih3d-biomedical-only-scope-20261103]
    paths:
      - tools/atla-ai/nih3d-biomedical-scope.mjs
      - scripts/nih3d-build-biomedical-scope.mjs
      - scripts/nih3d-biomedical-scope.test.mjs
      - .github/workflows/atla-nih3d-biomedical-scope.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atla-nih3d-biomedical-scope
  cancel-in-progress: false
jobs:
  classify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/atla-ai/nih3d-biomedical-scope.mjs
            scripts/nih3d-biomedical-scope.test.mjs
            scripts/nih3d-build-biomedical-scope.mjs
            tools/atla-ai/resources/nih3d-master-plan-2026/
            tools/atla-ai/resources/nih3d-biomedical-scope-2026/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scientific/research safety and source license fixture checks
        run: |
          set -euo pipefail
          node --check tools/atla-ai/nih3d-biomedical-scope.mjs
          node --check scripts/nih3d-build-biomedical-scope.mjs
          node scripts/nih3d-biomedical-scope.test.mjs
      - name: Classify ALL saved NIH metadata while retaining full original catalog
        run: node scripts/nih3d-build-biomedical-scope.mjs
      - name: Verify all NIH sources accounted for and no unsanctioned clinical validity claim
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const index=JSON.parse(readFileSync('tools/atla-ai/resources/nih3d-master-plan-2026/catalog-index.json'));
          const s=JSON.parse(readFileSync('tools/atla-ai/resources/nih3d-biomedical-scope-2026/summary.json'));
          if(s.uniqueSourceModelRecords!==index.publishedEntriesFound||s.sourceSegments!==50)
            throw Error('NIH original source identity omitted');
          if(s.totalOriginalModelFileReferences!==204346)throw Error('NIH original file reference count mismatch');
          if(Object.values(s.byScope).reduce((a,b)=>a+b,0)!==s.uniqueSourceModelRecords)
            throw Error('Scientific source domain coverage has gaps');
          if(s.independentlyScientificModelsApproved!==0||s.medicalUseApprovedModels!==0||s.sourceFilesActuallyCopiedByThisTool!==0)
            throw Error('False clinical scientific approval or archival claim');
          console.log('ATLA NIH3D research scope verified:',JSON.stringify({source:s.uniqueSourceModelRecords,status:s.byScope,files:s.totalOriginalModelFileReferences}));
          NODE
      - name: Commit inspectable medical research shortlist and review queue
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/atla-ai/resources/nih3d-biomedical-scope-2026/
          if ! git diff --cached --quiet; then
            git commit -m 'data(atla): scope all NIH 3D sources and retain biomedical review uncertainty'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
