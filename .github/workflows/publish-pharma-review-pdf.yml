name: Publish one-page pharmacology review note
on:
  push:
    paths:
      - 'scripts/generate-pharma-review-note.py'
      - '.github/workflows/publish-pharma-review-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-reviewed-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build a genuine one-page document
        run: |
          python -m pip install reportlab==4.4.9 pypdf==5.9.0
          python scripts/generate-pharma-review-note.py
          python - <<'PY'
          from pypdf import PdfReader
          p='docs/pharmacology-review-status-2026-10-26.pdf'
          r=PdfReader(p)
          assert len(r.pages)==1, 'The document must contain exactly one page'
          assert not r.pages[0].get('/Annots'), 'Embedded links or PDF annotations are not permitted'
          assert b'/URI' not in open(p, 'rb').read(), 'PDF contains a URL action'
          t=r.pages[0].extract_text()
          assert 'EKAB SPOUDI' in t and 'Academic Content Review' in t and 'independent clinical sign-off remain' in t, 'Academic identity or evidence limitations missing'
          print('Verified one-page English academic review PDF with no embedded links or URL actions')
          PY
      - name: Commit the PDF into GitHub Pages source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pharmacology-review-status-2026-10-26.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish one-page review-status PDF [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Report PDF is already current"
          fi
