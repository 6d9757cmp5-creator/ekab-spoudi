name: Media publication gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: media-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  media-gate:
    name: media-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout history to compare changed media
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require verifiable review for every added or modified media file
        env:
          MEDIA_GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/media_gate.py
      - name: Collect pending review queue without granting approval
        if: always()
        env:
          MEDIA_GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/media_review_queue.py
      - name: Publish pending review queue for human inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-review-queue
          path: media-review-queue.json
          retention-days: 30
          if-no-files-found: warn
