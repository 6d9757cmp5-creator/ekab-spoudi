name: Independent educational ECG Lab verification
on:
  pull_request:
    paths:
      - 'mentor-ecg.html'
      - 'mentor-next.html'
      - 'mentor-live.html'
      - 'mentor-scenarios.html'
      - 'tools/ecg-lab/**'
      - 'scripts/verify-cockpit-shared-ecg-browser.mjs'
      - '.github/workflows/cockpit-shared-ecg.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ecg-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent ECG generator, practice and retired routes
        run: |
          node --check tools/ecg-lab/app/ecg.js
          node --check tools/ecg-lab/app/ecg-practice.js
          node --check scripts/verify-cockpit-shared-ecg-browser.mjs
          node --test tools/ecg-lab/core/ecg-synthetic.test.mjs tools/ecg-lab/core/ecg-practice.test.mjs
          node scripts/verify-unified-scene.mjs
      - name: Real Chromium on mobile and desktop
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check standalone ECG and QRS learner exercise
        run: node scripts/verify-cockpit-shared-ecg-browser.mjs
      - name: Verify ECG ownership and no patient engine import
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=p=>readFileSync(p,'utf8');
          const html=read('mentor-ecg.html'),ecg=read('tools/ecg-lab/app/ecg.js');
          const practice=read('tools/ecg-lab/app/ecg-practice.js');
          assert.match(html,/id="ecg-curve"/);
          assert.match(html,/id="ecg-practice-curve"/);
          assert.match(html,/tools\/ecg-lab\/app\/ecg-practice.js/);
          assert.match(ecg,/ecg-synthetic.mjs/);
          assert.match(practice,/ecg-practice.mjs/);
          assert.doesNotMatch(html,/tools\/patient-simulator|mentor-next\.html/);
          for(const path of ['mentor-next.html','mentor-live.html','mentor-scenarios.html']){
            assert.match(read(path),/http-equiv="refresh"/);
          }
          console.log('PASS: one independent ECG engine, retired patient-simulator entrypoints');
          NODE
      - name: Publish independent ECG visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-ecg-learning
          path: audit-results/shared-ecg/
          if-no-files-found: warn
          retention-days: 30
