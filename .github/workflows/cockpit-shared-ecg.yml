name: Cockpit shared educational ECG verification
on:
  pull_request:
    paths:
      - 'mentor-next.html'
      - 'tools/patient-simulator/**'
      - 'tools/ecg-lab/**'
      - 'scripts/verify-cockpit-shared-ecg-browser.mjs'
      - '.github/workflows/cockpit-shared-ecg.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-ecg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and shared educational ECG unit tests
        run: |
          node --check tools/patient-simulator/app/next-sim.mjs
          node --check tools/patient-simulator/app/cockpit-ecg.mjs
          node --check tools/patient-simulator/app/cockpit-ecg.test.mjs
          node --test tools/ecg-lab/core/ecg-synthetic.test.mjs tools/patient-simulator/app/cockpit-ecg.test.mjs
      - name: Install Chromium and WebKit for mobile and desktop acceptance
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Real browser acceptance of shared ECG display
        run: node scripts/verify-cockpit-shared-ecg-browser.mjs
      - name: Source-level UI integration and forbidden duplicate engine check
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const html=fs.readFileSync('mentor-next.html','utf8');
          const js=fs.readFileSync('tools/patient-simulator/app/next-sim.mjs','utf8');
          const adapter=fs.readFileSync('tools/patient-simulator/app/cockpit-ecg.mjs','utf8');
          assert.equal((html.match(/id="next-ecg-wave"/g)||[]).length,1);
          assert.match(html,/Ενδεικτικό εκπαιδευτικό ΗΚΓ/);
          assert.match(html,/ΑΠ \/ κλινικό ΗΚΓ/);
          assert.match(js,/ecgWave\.setAttribute\('points',buildCockpitEcgPoints\(v\.hr\)\)/);
          assert.match(adapter,/import \{createSyntheticEcg,toSvgPoints\} from '\.\.\/\.\.\/ecg-lab\/core\/ecg-synthetic\.mjs'/);
          console.log('Cockpit shared ECG wiring verified; no change to clinical patient engine');
          NODE
