name: NIH3D read-only historical rescue inventory
on:
  pull_request:
    paths:
      - 'scripts/nih3d_readonly_recovery_audit.py'
      - 'scripts/test_nih3d_readonly_recovery_audit.py'
      - '.github/workflows/nih3d-readonly-recovery-audit.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verify-and-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/nih3d_stream_restore.py
            scripts/nih3d_readonly_recovery_audit.py
            scripts/test_nih3d_readonly_recovery_audit.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure audit is safe and deterministic
        run: |
          python -m py_compile scripts/nih3d_readonly_recovery_audit.py
          python -m unittest discover -s scripts -p 'test_nih3d_readonly_recovery_audit.py' -v
      - name: Read-only full API inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIH3D_AUDIT_JSON: nih3d-recovery-inventory.json
        run: python scripts/nih3d_readonly_recovery_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: nih3d-readonly-inventory-json
          path: nih3d-recovery-inventory.json
          retention-days: 7
