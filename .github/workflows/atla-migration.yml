name: ATLA staged migration validation

on:
  pull_request:
    paths:
      - "atla/**"
      - "index.html"
      - "saek.html"
      - "eoppep.html"
      - "saek-course-*.html"
      - "learning-surface.mjs"
      - "medical-terms.json"
      - "workers/mentor-chat/**"
      - ".github/workflows/atla-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atla-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and integration-contract tests
        run: |
          node --check atla/assistant.mjs
          node --check atla/practice/saek-practice.mjs
          node --check atla/practice/cockpit-entry.mjs
          node --check tools/patient-simulator/core/mission-activity-engine.mjs
          node --check learning-surface.mjs
          node --test atla/assistant.contract.test.mjs atla/atlas-boundaries.test.mjs tools/patient-simulator/core/mission-migration.test.mjs atla/contextual-practice.test.mjs atla/student/profile.test.mjs atla/practice/tool-selector.test.mjs
          node --test mentor/knowledge/retrieve.test.mjs mentor/context/bridge.test.mjs mentor/ai/client.test.mjs
          # Verify server-owned evidence, both AI providers and fail-closed streaming.
          node --check workers/mentor-chat/src/index.js
          node --test workers/mentor-chat/*.test.mjs
