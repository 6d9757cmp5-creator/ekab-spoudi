name: ΕΚΑΒ Σπουδή — Έλεγχος εκπαιδευτικών εικόνων

on:
  push:
    paths:
      - 'saek-image-audit-2026.json'
      - 'scripts/check-saek-images.mjs'
      - '.github/workflows/saek-image-review.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  chapter-image-audit:
    name: Έλεγχος 247 κεφαλαίων και επαλήθευση συνδέσμων
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sources, chapter mappings and media links
        run: node scripts/check-saek-images.mjs --remote
      - name: Publish machine-readable audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saek-image-audit-report
          path: saek-image-report.json
          retention-days: 30
          if-no-files-found: warn
