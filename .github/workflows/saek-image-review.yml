name: ΕΚΑΒ Σπουδή — Έλεγχος εκπαιδευτικών εικόνων

on:
  push:
    paths:
      - 'saek-image-audit-2026.json'
      - 'scripts/check-saek-images.mjs'
      - 'scripts/verify-saek-image-integration.mjs'
      - 'saek-course-*.html'
      - 'saek-reviewed-image-ui.js'
      - 'saek-visual-ui.js'
      - 'saek-visual-ui.css'
      - 'sw.js'
      - 'scripts/validate-saek-svg.py'
      - 'scripts/render-saek-contact-sheets.py'
      - 'scripts/validate-semester-c-diagram-text.mjs'
      - 'scripts/validate-semester-ab-arrows.mjs'
      - 'scripts/validate-semester-d-diagrams.mjs'
      - 'assets/education/*.svg'
      - '.github/workflows/saek-image-review.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  chapter-image-audit:
    name: Έλεγχος 247 κεφαλαίων και επαλήθευση συνδέσμων
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sources, chapter mappings and media links
        run: node scripts/check-saek-images.mjs --remote
      - name: Check 247 actual lesson DOM insertion points and offline image precache
        run: node scripts/verify-saek-image-integration.mjs
      - name: Validate local SVG XML, accessibility, Greek labels and SHA-256
        run: python3 scripts/validate-saek-svg.py
      - name: Validate entire four-semester image coverage and D arrows
        run: node scripts/validate-semester-d-diagrams.mjs
      - name: Validate A and B concise-arrow diagrams
        run: node scripts/validate-semester-ab-arrows.mjs
      - name: Reject truncated or generic semester C diagrams
        run: node scripts/validate-semester-c-diagram-text.mjs
      - name: Publish machine-readable audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saek-image-audit-report
          path: |
            saek-image-report.json
            saek-image-integration-report.json
          retention-days: 30
          if-no-files-found: warn

  image-contact-sheets:
    name: Render all registered images for manual visual inspection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderers
        run: python -m pip install "CairoSVG>=2.7,<3" "Pillow>=11,<13"
      - name: Generate image contact sheets and text-review candidates
        run: python scripts/render-saek-contact-sheets.py
      - name: Upload review sheets and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saek-image-contact-sheets
          path: image-contact-sheets/
          retention-days: 30
          if-no-files-found: error
