name: ATLA NIH3D verified originals archive ledger
on:
  push:
    branches: [feat/nih3d-complete-seven-original-models-20261103]
    paths:
      - 'scripts/nih3d-build-verified-archive-registry.mjs'
      - '.github/workflows/atla-nih3d-verified-originals.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/nih3d-build-verified-archive-registry.mjs
            docs/ATLA_NIH3D_GHCR_ARCHIVE_PROOF_2026.json
            docs/ATLA_NIH3D_GHCR_ANATOMY_BATCH_2026.json
            docs/ATLA_NIH3D_GHCR_NEURO_BATCH_2026.json
            docs/ATLA_NIH3D_GHCR_MOLECULAR_BATCH_2026.json
            docs/ATLA_NIH3D_GHCR_SHOULDER_00334_2026.json
            tools/atla-ai/resources/nih3d-master-plan-2026/
            tools/atla-ai/resources/nih3d-verified-originals-2026.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile each NIH SHA256 and original file against catalog
        run: |
          node --check scripts/nih3d-build-verified-archive-registry.mjs
          node scripts/nih3d-build-verified-archive-registry.mjs
      - name: Ensure no metadata-only URL is counted as archived
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('tools/atla-ai/resources/nih3d-verified-originals-2026.json','utf8'));
          assert.equal(r.catalogSourceEntries,15688);
          assert.equal(r.archiveModelsWithAnyOriginal,r.models.length);
          assert.equal(r.modelsWithAllCatalogOriginalFilesVerified,r.models.length);
          assert.equal(r.modelsWithPartialCatalogOriginalsVerified,0);
          assert.equal(r.uniqueVerifiedOriginalFiles,r.models.reduce((n,m)=>n+m.verifiedFiles.length,0));
          assert.equal(r.totalDistinctVerifiedOriginalBytes,r.models.reduce((n,m)=>n+m.verifiedFiles.reduce((s,f)=>s+f.size,0),0));
          assert(r.models.some(m=>m.entryId===334),'New independently verified shoulder original missing');
          assert.equal(r.fullNIHArchiveComplete,false);
          assert.equal(r.clinicalScientificReviewComplete,false);
          assert(r.models.every(m=>m.clinicalUseApproved===false));
          console.log('Verified source-file reconciliation:',r.uniqueVerifiedOriginalFiles,'unique files of',r.catalogSourceEntries,'original NIH model IDs');
          NODE
      - name: Preserve evidence registry in Git
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/atla-ai/resources/nih3d-verified-originals-2026.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(atla): reconcile independently retrieved GHCR model SHA256 coverage'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
