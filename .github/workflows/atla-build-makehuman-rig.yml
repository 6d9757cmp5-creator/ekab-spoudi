name: ATLA Build MakeHuman CC0 Rigged Educational Model
on:
  push:
    branches: [main, feature/atla-full-model-workspace-20261103]
    paths:
      - '.github/workflows/atla-build-makehuman-rig.yml'
      - 'scripts/build-atla-makehuman-rig.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atla-rigged-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rigged-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Blender source builder
        run: python3 -m py_compile scripts/build-atla-makehuman-rig.py
      - name: Install Blender offline converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
      - name: Build educational patient directly from pinned original mesh, skeleton, and weights
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --threads 2 --python scripts/build-atla-makehuman-rig.py
      - name: Verify glTF 2.0 export is really skinned and animated
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const prefix='tools/patient-simulator/assets/patients/';
          const manifest=JSON.parse(readFileSync(prefix+'atla-makehuman-rigged-manifest.json'));
          const model=manifest.assets[0];
          const file=readFileSync(model.path);
          assert.equal(file.toString('ascii',0,4),'glTF');
          assert.equal(file.readUInt32LE(4),2);
          assert.equal(file.readUInt32LE(8),file.length);
          assert.equal(file.length,model.size);
          assert.equal(createHash('sha256').update(file).digest('hex'),model.sha256);
          const n=file.readUInt32LE(12);
          assert.equal(file.toString('ascii',16,20),'JSON');
          const gltf=JSON.parse(file.subarray(20,20+n).toString());
          assert(gltf.meshes?.length>0);
          assert(gltf.skins?.length>0,'Real skin matrices required');
          assert(gltf.animations?.length>=2,'Two actual animation clips required');
          assert(gltf.nodes?.length>=130);
          assert(model.skinnedCoverage>=.86);
          console.log('RIGGED_MAKEHUMAN_PASS',JSON.stringify({
           skins:gltf.skins.length,animations:gltf.animations.map(a=>a.name),
           nodes:gltf.nodes.length,bytes:file.length,coverage:model.skinnedCoverage}));
          JS
      - name: Commit only verified, original-source educational rigged GLB
        env:
          ATLA_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test $(stat -c%s tools/patient-simulator/assets/patients/atla-makehuman-rigged-educational.glb) -lt 90000000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/patient-simulator/assets/patients/atla-makehuman-rigged-educational.glb tools/patient-simulator/assets/patients/atla-makehuman-rigged-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "assets(ATLA): source-verifiable CC0 MakeHuman skinned avatar and nonclinical animations"
          git pull --rebase origin "$ATLA_BRANCH"
          git push origin "HEAD:$ATLA_BRANCH"
