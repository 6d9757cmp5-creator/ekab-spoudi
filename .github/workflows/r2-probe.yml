name: Cloudflare R2 availability probe (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/r2-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List R2 buckets without changing anything
        run: |
          set +e
          npx --yes wrangler@4 r2 bucket list 2>&1 | tail -n 15
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 600
          echo
          curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 300
