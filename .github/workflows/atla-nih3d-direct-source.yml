name: ATLA NIH 3D direct original-source verification
on:
  push:
    branches:
      - main
      - feat/nih3d-source-on-demand-20261103
      - feat/nih3d-browser-cors-check-20261103
    paths:
      - 'tools/atla-ai/nih3d-original-source-gateway.mjs'
      - 'scripts/verify-nih3d-direct-source.mjs'
      - 'scripts/verify-nih3d-direct-source.test.mjs'
      - '.github/workflows/atla-nih3d-direct-source.yml'
      - 'tools/atla-ai/resources/nih3d-master-plan-2026/catalog-index.json'
      - 'tools/atla-ai/resources/nih3d-master-plan-2026/segments/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atla-nih3d-direct-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            scripts/verify-nih3d-direct-source.mjs
            scripts/verify-nih3d-direct-source.test.mjs
            tools/atla-ai/nih3d-original-source-gateway.mjs
            tools/atla-ai/resources/nih3d-master-plan-2026/
            docs/ATLA_NIH3D_DIRECT_SOURCE_STATUS_2026.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static source access and schema tests
        run: |
          node --check tools/atla-ai/nih3d-original-source-gateway.mjs
          node --check scripts/verify-nih3d-direct-source.mjs
          node scripts/verify-nih3d-direct-source.test.mjs
      - name: Audit every registered NIH 3D source file reference (no binary downloads)
        run: node scripts/verify-nih3d-direct-source.mjs
      - name: Commit reproducible source reference counts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ATLA_NIH3D_DIRECT_SOURCE_STATUS_2026.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(atla): verify NIH direct-source metadata coverage, no mirrored assets'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Final truthfulness checks
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('docs/ATLA_NIH3D_DIRECT_SOURCE_STATUS_2026.json','utf8'));
          if(j.publishedEntries!==15688||j.sourceSegments!==50||!j.catalogMetadataVerified)throw Error('Unexpected catalog');
          if(j.permanentlyStoredModelFilesByThisGateway!==0||j.independentSHA256VerifiedModelFilesByThisGateway!==0)throw Error('Incorrect archive claim');
          console.log('NIH source registry coverage verified:',j.uniqueIDs,'models and',j.validatedDirectFileRefs,'original file URLs');
          NODE
