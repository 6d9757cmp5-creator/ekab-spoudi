name: Private pilot | real 3D anatomy MP4
on:
  push:
    branches:
      - feature/saek-visual-pilot-20261111
    paths:
      - "pilots/heart/**"
      - ".github/workflows/saek-heart-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saek-heart-preview
  cancel-in-progress: true
jobs:
  preview:
    name: Isolated draft only (no release)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            pilots/heart
      - name: Install offline render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender xvfb libgl1-mesa-dri python3-numpy
          blender --background --factory-startup --python-expr "import numpy; print('NumPy ready')"
          blender --version | head -3
      - name: Real Blender scene (HuBMAP HRA CC BY)
        run: |
          mkdir -p pilots/heart/public/render /tmp/hra-source
          curl --fail --location --retry 3 -sS -o /tmp/hra-source/VH_F_Heart.glb https://raw.githubusercontent.com/hubmapconsortium/ccf-releases/b036a91aaf7234f462b1249d4a5f4fb0e982f412/v1.2/models/VH_F_Heart.glb
          curl --fail --location --retry 3 -sS -o /tmp/hra-source/VH_F_Lung.glb https://raw.githubusercontent.com/hubmapconsortium/ccf-releases/b036a91aaf7234f462b1249d4a5f4fb0e982f412/v1.2/models/VH_F_Lung.glb
          echo '9afdfb2ccf926869813582cfe150dce8cb28377417a968a4f29a5b8dc060428b  /tmp/hra-source/VH_F_Heart.glb' | sha256sum --check
          echo 'a6a81718f4d0974bcbab47c6dc38efc941ad5c7f5f256bf7ff112c710a7fd932  /tmp/hra-source/VH_F_Lung.glb' | sha256sum --check
          HRA_PREVIEW_MODEL_DIR=/tmp/hra-source xvfb-run -a blender --background --factory-startup --python pilots/heart/scene.py -- "$PWD" "$PWD/pilots/heart/public/render" > /tmp/blender-preview.log 2>&1 || { tail -100 /tmp/blender-preview.log; exit 1; }
          tail -100 /tmp/blender-preview.log
          echo "Rendered frames: $(find pilots/heart/public/render -type f -name 'frame_*.png' | wc -l)"
          test "$(find pilots/heart/public/render -type f -name 'frame_*.png' | wc -l)" -eq 60
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Remotion video composition
        working-directory: pilots/heart
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx remotion browser ensure
          npm run render
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 ../heart-pilot-preview.mp4
      - name: Draft-only review record
        run: |
          mkdir -p pilots/heart/review-output
          cp pilots/heart/pilot-status.json pilots/heart/review-output/
          sha256sum pilots/heart-pilot-preview.mp4 > pilots/heart/review-output/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: saek-heart-pilot-3d-UNPUBLISHED
          path: |
            pilots/heart-pilot-preview.mp4
            pilots/heart/review-output/
          retention-days: 7
