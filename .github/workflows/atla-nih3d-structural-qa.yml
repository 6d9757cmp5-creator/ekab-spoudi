name: ATLA NIH3D independently restored source geometry QA
on:
  push:
    branches:
      - feat/nih3d-structural-qa-all-verified-20261103
    paths:
      - 'scripts/nih3d-structural-qa.mjs'
      - 'scripts/nih3d-structural-qa.test.mjs'
      - 'scripts/nih3d-build-scientific-evidence.mjs'
      - '.github/workflows/atla-nih3d-structural-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  structural-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/nih3d-structural-qa.mjs
            scripts/nih3d-structural-qa.test.mjs
            scripts/nih3d-build-scientific-evidence.mjs
            tools/atla-ai/nih3d-scientific-ontology.mjs
            tools/atla-ai/resources/nih3d-master-plan-2026/
            tools/atla-ai/resources/nih3d-educational-evidence-2026/
            saek-course-01.html
            tools/atla-ai/resources/nih3d-verified-originals-2026.json
            docs/ATLA_NIH3D_GEOMETRY_STRUCTURAL_QA_2026.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test geometry parsers and clinical safety boundaries
        run: |
          set -euo pipefail
          node --check scripts/nih3d-structural-qa.mjs
          node scripts/nih3d-structural-qa.test.mjs
      - name: Restore actual archived NIH originals from public GHCR
        env:
          STAGING: ${{ runner.temp }}/nih3d-qa-originals
        run: |
          set -euo pipefail
          mkdir -p "$STAGING"
          mapfile -t images < <(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('tools/atla-ai/resources/nih3d-verified-originals-2026.json','utf8'));
          const images=[...new Set(r.models.flatMap(m=>m.verifiedFiles.map(f=>f.verifiedOCI.digest)))].sort();
          for(const img of images){if(!/^ghcr\.io\/6d9757cmp5-creator\/atla-nih3d-archive@sha256:[a-f0-9]{64}$/.test(img))throw Error('Untrusted image');console.log(img);}
          NODE
          )
          test "${#images[@]}" -ge 1
          for image in "${images[@]}"; do
            digest="${image##*@sha256:}"
            docker pull "$image"
            cid="$(docker create "$image" /MANIFEST.json)"
            mkdir -p "$STAGING/$digest/originals"
            docker cp "$cid:/originals/." "$STAGING/$digest/originals/"
            docker rm "$cid"
          done
          mkdir -p docs
          node scripts/nih3d-structural-qa.mjs tools/atla-ai/resources/nih3d-verified-originals-2026.json "$STAGING" docs/ATLA_NIH3D_GEOMETRY_STRUCTURAL_QA_2026.json
      - name: Verify ALL current NIH GHCR originals and mark clinical accuracy pending
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('docs/ATLA_NIH3D_GEOMETRY_STRUCTURAL_QA_2026.json','utf8'));
          const r=JSON.parse(fs.readFileSync('tools/atla-ai/resources/nih3d-verified-originals-2026.json','utf8'));
          if(s.sourceModels!==r.archiveModelsWithAnyOriginal||s.counts.sha256Verified!==r.uniqueVerifiedOriginalFiles||s.verifiedBytes!==r.totalDistinctVerifiedOriginalBytes)throw Error('Structural QA source SHA coverage mismatch');
          if(s.clinicallyApprovedModels!==0||s.scientificAccuracyValidated!==0)throw Error('Unsupported medical approval');
          if(s.counts.sha256Verified!==s.counts.formatPassed+s.counts.formatNeedsReview+s.counts.formatInvalid)throw Error('Format screen dropped data');
          console.log('Medical 3D structural triage, original integrity verified:',JSON.stringify(s.counts));
          NODE
      - name: Recompute educational-source evidence from current SHA-verified structure QA
        env:
          REQUIRE_VERIFIED_ORIGINAL_ARCHIVES: '1'
        run: |
          node scripts/nih3d-build-scientific-evidence.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('docs/ATLA_NIH3D_GEOMETRY_STRUCTURAL_QA_2026.json','utf8'));
          const e=JSON.parse(fs.readFileSync('tools/atla-ai/resources/nih3d-educational-evidence-2026/summary.json','utf8'));
          if(e.counts.sourceRecords!==15688||e.counts.originalStructuralQaModels!==s.sourceModels||
            e.counts.originalStructuralQaFiles!==s.counts.sha256Verified||e.counts.scholarlyClinicalApprovals!==0)
            throw Error('Source research evidence does not match restored structural QA');
          console.log('All verified NIH structures now linked to conservative educational evidence:',s.sourceModels);
          NODE
      - name: Preserve auditable 3D structure review without binary duplication
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ATLA_NIH3D_GEOMETRY_STRUCTURAL_QA_2026.json tools/atla-ai/resources/nih3d-educational-evidence-2026/
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(atla): structural QA of independently recovered original NIH 3D files'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
