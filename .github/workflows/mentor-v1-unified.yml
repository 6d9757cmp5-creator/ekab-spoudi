name: MENTOR V1 unified tutor
on:
  push:
    branches: [feature/mentor-unified-personalization-v1]
  pull_request:
    paths:
      - 'mentor-adaptive.js'
      - 'mentor-personal-v1.js'
      - 'mentor-lab.html'
      - 'mentor-lab.css'
      - 'scripts/test-mentor-v1-unified.cjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check mentor-adaptive.js
      - run: node --check mentor-personal-v1.js
      - run: node scripts/test-mentor-v1-unified.cjs
