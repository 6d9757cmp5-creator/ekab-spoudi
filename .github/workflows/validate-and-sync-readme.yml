name: Validate app and sync README version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Appwrite stays optional and sends only one ping
        run: node --experimental-vm-modules scripts/verify-appwrite.mjs
      - name: Validate app files and normalize README
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path(".")
          version = json.loads((root / "version.json").read_text(encoding="utf-8"))["version"]
          json.loads((root / "manifest.webmanifest").read_text(encoding="utf-8"))
          json.loads((root / "official_questions.json").read_text(encoding="utf-8"))
          required = ["index.html", "saek.html", "practical_exam.html", "eclass.html",
                      "sw.js", "app.js", "styles.css", "progress.js"]
          required += [f"saek-course-{i:02d}.html" for i in range(1, 21)]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit("Missing application files: " + ", ".join(missing))
          sw = (root / "sw.js").read_text(encoding="utf-8")
          if f"ekab-spoudi-v{version}" not in sw:
              raise SystemExit("Service worker cache version does not match version.json")
          path = root / "README.md"
          readme = path.read_text(encoding="utf-8")
          updated, count = re.subn(r"(\*\*Έκδοση v)[^ *·]+", lambda m: m.group(1) + version, readme, count=1)
          if count != 1:
              raise SystemExit("README version line not found")
          updated = re.sub(r"(?m)^#{1,6}\s*$\n?", "", updated)
          updated = re.sub(r"\n{3,}", "\n\n", updated).strip() + "\n"
          if updated != readme:
              path.write_text(updated, encoding="utf-8")
          print("Verified app metadata, required pages and README:", version)
          PY
      - name: Commit README version synchronization
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: sync README version [skip ci]"
            git push
          fi
