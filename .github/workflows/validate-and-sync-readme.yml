name: Validate app and sync README version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Appwrite stays optional and sends only one ping
        run: node --experimental-vm-modules scripts/verify-appwrite.mjs
      - name: Verify Google login setup gate and return URLs
        run: node --experimental-vm-modules scripts/verify-account.mjs
      - name: Verify private sync merges
        run: node scripts/verify-sync.mjs
      - name: Verify EOPPEP question bank and source-trace labels
        run: node scripts/verify-eoppep.mjs
      - name: Verify dated recall schedule and legacy progress
        run: node scripts/verify-study-scheduler.mjs
      - name: Validate browser JavaScript syntax
        run: node --check app.js && node --check study-scheduler.js && node --check progress.js && node --check ai-grading-client.js && node --check saek-exams.js
      - name: Verify one-attempt grading and clear student-facing labels
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict');
          const read=name=>fs.readFileSync(name,'utf8');
          const shared=read('ai-grading-client.js');
          const seminar=read('seminar-prep.js');
          const saek=read('saek-exams.js');
          const eoppep=read('app.js');
          const pages=['seminar-prep.html','saek-exams.html','theory.html'];
          for(const path of pages){
            const html=read(path);
            assert(html.includes('Υποβολή αξιολόγησης'),path+' missing submit label');
            assert(!html.includes('Αξιολόγηση με AI'),path+' exposes old grading label');
            assert(html.includes('ai-grading-client.js?v=grading-compact-lock-1'),path+' stale grading client');
          }
          assert(shared.includes("section('Σωστή απάντηση'"));
          assert(shared.includes("section('Γιατί'"));
          assert(!shared.includes('Διευκρίνισε την απάντησή σου και δοκίμασε ξανά'));
          assert(seminar.includes("else gradeWritten('skipped')"));
          assert(seminar.includes("$('seminarQuestionNotes').readOnly=true"));
          assert(seminar.includes("p.scenarioGrades[oral]"));
          assert(saek.includes("current().feedback=result;current().revealed=true"));
          assert(saek.includes("$('examManual').hidden=true"));
          assert(eoppep.includes('lockedThisRun.add(qid)'));
          assert(eoppep.includes("$('#draft').readOnly=true"));
          console.log('Validated concise grading, fresh scripts and one-attempt locks.');
          JS
      - name: Verify mixed seminar assessment bank and 70/30 scoring rule
        run: |
          node --check seminar-tracks.js
          node --check seminar-prep.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const sandbox={window:{}};
          vm.runInNewContext(fs.readFileSync('seminar-tracks.js','utf8'),sandbox);
          const courses=sandbox.window.EkabSeminarTracks;
          const mcq=sandbox.window.EkabSeminarMCQ;
          assert.strictEqual(courses.length,5);
          for(const c of courses){
            assert.strictEqual(c.units.length,12);
            assert.strictEqual(mcq[c.id].length,12);
            for(const q of mcq[c.id]){
              assert.strictEqual(q.length,6);
              assert.strictEqual(new Set(q.slice(1,5)).size,4);
            }
          }
          const script=fs.readFileSync('seminar-prep.js','utf8');
          const html=fs.readFileSync('seminar-prep.html','utf8');
          const css=fs.readFileSync('seminar-prep.css','utf8');
          for(const id of ['seminarMCQChoices','seminarMCQFeedback','seminarMultipleBody','seminarWrittenBody',
                           'seminarMixedResults','seminarMixedQuestion','seminarRestartQuiz','seminarRepeatQuiz',
                           'seminarQuestionNotes','seminarScenarioSubmit','seminarScenarioStatus','seminarScenarioResult','seminarOralNotes']){
            assert(html.includes('id="'+id+'"'),id+' missing from HTML');
            assert(script.includes(id),id+' missing from script');
          }
          assert(!html.includes('data-seminar-format='));
          assert(!html.includes('id="seminarMCQCheck"'));
          assert(!html.includes('id="seminarMarkOral"'));
          assert(!html.includes('id="seminarGradeRight"'));
          assert(!html.includes('id="seminarGradeNeeds"'));
          assert(script.includes("section:'seminar_case'"));
          assert(script.includes("current().scenarioGrades[caseId]"));
          assert(!script.includes("seminarMarkOral"));
          assert(!script.includes("autoTimer=setTimeout("));
          assert(script.includes("if(run.responses[pos])showFeedback();"));
          assert(script.includes("if(!run.responses[run.pos])return;"));
          assert(script.includes("next.textContent=pos===TOTAL-1?'Δες αποτελέσματα':'Επόμενη ερώτηση'"));
          assert(script.includes("p[correct?'mcRight':'mcNeeds'].push(index)"));
          assert(css.includes('.seminar-mcq-option.is-correct'));
          assert(css.includes('.seminar-mcq-option.is-incorrect'));
          const first=script.indexOf('const shuffle=');
          const last=script.indexOf('function cleanRecord(',first);
          assert(first>0&&last>first);
          const make=vm.runInNewContext('(function(){const TOTAL=10,MULTIPLE=7,WRITTEN=3;'+script.slice(first,last)+';return {createRun,validRun};})()',{});
          for(let i=0;i<200;i++){
            const run=make.createRun();
            assert.strictEqual(run.items.length,10);
            assert.strictEqual(run.items.filter(q=>q.type==='multiple').length,7);
            assert.strictEqual(run.items.filter(q=>q.type==='written').length,3);
            assert.strictEqual(new Set(run.items.map(q=>q.unit)).size,10);
            assert(make.validRun(run));
          }
          console.log('Verified 5 seminars, 60 MCQs, mixed 7/3 exam rule, independent grading, and accessible feedback.');
          JS
      - name: Test authenticated clinical-scenario AI evaluator (mocked model, no real requests)
        run: |
          node --check functions/answer-grader/main.js
          node --test functions/answer-grader/test.mjs
      - name: Verify 247-chapter search, 314 SOS and separated reader
        run: node scripts/verify-reader-search.mjs
      - name: Check shared search script syntax
        run: node --check global-tools.js
      - name: Verify rescuer act lookup references and UI behavior
        run: node scripts/verify-profession-acts.mjs
      - name: Validate app files and normalize README
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path(".")
          version = json.loads((root / "version.json").read_text(encoding="utf-8"))["version"]
          json.loads((root / "manifest.webmanifest").read_text(encoding="utf-8"))
          json.loads((root / "official_questions.json").read_text(encoding="utf-8"))
          required = ["index.html", "saek.html", "practical_exam.html", "eclass.html",
                      "sw.js", "app.js", "styles.css", "progress.js"]
          required += [f"saek-course-{i:02d}.html" for i in range(1, 21)]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit("Missing application files: " + ", ".join(missing))
          sw = (root / "sw.js").read_text(encoding="utf-8")
          if f"ekab-spoudi-v{version}" not in sw:
              raise SystemExit("Service worker cache version does not match version.json")
          path = root / "README.md"
          readme = path.read_text(encoding="utf-8")
          updated, count = re.subn(r"(\*\*Έκδοση v)[^ *·]+", lambda m: m.group(1) + version, readme, count=1)
          if count != 1:
              raise SystemExit("README version line not found")
          updated = re.sub(r"(?m)^#{1,6}\s*$\n?", "", updated)
          updated = re.sub(r"\n{3,}", "\n\n", updated).strip() + "\n"
          if updated != readme:
              path.write_text(updated, encoding="utf-8")
          print("Verified app metadata, required pages and README:", version)
          PY
      - name: Commit README version synchronization
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: sync README version [skip ci]"
            git push
          fi
