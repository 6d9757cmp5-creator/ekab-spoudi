name: AED contacts integration checks
on:
  pull_request:
    paths:
      - contacts.html
      - contacts-aed.css
      - contacts-nearby-aed.js
      - assets/aed-first-aid-poster.webp
      - .github/workflows/contacts-aed-check.yml
permissions:
  contents: read
jobs:
  validate-aed-contacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate nearby-map JavaScript syntax
        run: node --check contacts-nearby-aed.js
      - name: Check poster binary, one map, GPS controls and safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          html=Path('contacts.html').read_text(encoding='utf-8')
          js=Path('contacts-nearby-aed.js').read_text(encoding='utf-8')
          css=Path('contacts-aed.css').read_text(encoding='utf-8')
          poster=Path('assets/aed-first-aid-poster.webp').read_bytes()
          assert poster[:4] == b'RIFF' and poster[8:12] == b'WEBP' and len(poster) > 10000
          assert html.count('id="aedNearbyMap"') == 1
          assert html.count('id="aedSearchRadius"') == 1
          assert 'assets/aed-first-aid-poster.webp' in html
          assert 'id="aedFindNearby"' in html
          assert 'href="tel:112"' in html and 'href="tel:166"' in html
          assert 'aed-step' not in html and 'aed-poster-head' not in html
          assert 'aedNearbyResults' not in html and 'aedNearbyCount' not in html
          assert '<iframe' not in html
          assert 'https://apinidotes.crete.gov.gr/Map' in html
          assert 'https://apinidotes-api.crete.gov.gr/apinidotesApi/api/Defibrillators' in js
          assert 'item.availability !== true || item.public !== true' in js
          assert 'navigator.geolocation.getCurrentPosition' in js
          assert "permission.state === 'granted'" in js
          assert "cache: 'no-store'" in js
          assert 'localStorage' not in js and 'sessionStorage' not in js
          assert 'aed-nearby-map[hidden]' in css
          print('Minimal official AED map + authentic poster checks passed.')
          PY
