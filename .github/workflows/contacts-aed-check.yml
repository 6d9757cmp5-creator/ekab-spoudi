name: AED contacts integration checks
on:
  pull_request:
    paths:
      - contacts.html
      - contacts-aed.css
      - contacts-nearby-aed.js
      - .github/workflows/contacts-aed-check.yml
permissions:
  contents: read
jobs:
  validate-aed-contacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check geolocation and official map JavaScript syntax
        run: node --check contacts-nearby-aed.js
      - name: Verify official data source, emergency actions, accessibility, and privacy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('contacts.html').read_text(encoding='utf-8')
          js=Path('contacts-nearby-aed.js').read_text(encoding='utf-8')
          css=Path('contacts-aed.css').read_text(encoding='utf-8')
          for required in [
              'href="tel:112"', 'href="tel:166"',
              'src="https://apinidotes.crete.gov.gr/Map"',
              'allow="geolocation"',
              'id="aedFindNearby"', 'id="aedNearbyMap"',
              'id="aedNearbyStatus"', 'id="aedNearbyResults"',
              'id="aedSearchRadius"',
              'role="status"', 'aria-live="polite"',
              'Πρόγραμμα «ΖΩΗ»',
              'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=',
          ]:
              assert required in html, required
          assert 'https://apinidotes-api.crete.gov.gr/apinidotesApi/api/Defibrillators' in js
          assert 'item.availability !== true || item.public !== true' in js
          assert "item.longtitude" in js
          assert 'navigator.geolocation.getCurrentPosition' in js
          assert "permission.state === 'granted'" in js
          assert "cache: 'no-store'" in js
          assert 'localStorage' not in js and 'sessionStorage' not in js
          assert 'overpass-api' not in js
          assert 'aed-nearby-map[hidden]' in css
          assert 'AED' in html
          print('Official Crete AED map static integration passed.')
          PY
