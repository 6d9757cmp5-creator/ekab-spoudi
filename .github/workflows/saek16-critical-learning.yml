name: SAEK 16 educational content regression (not clinical certification)
on:
  pull_request:
    paths:
      - 'saek-course-16.html'
      - 'scripts/verify-saek16-critical-learning.mjs'
      - 'scripts/verify-saek16-learning-browser.mjs'
      - '.github/workflows/saek16-critical-learning.yml'
  push:
    branches: [main]
    paths:
      - 'saek-course-16.html'
      - 'scripts/verify-saek16-critical-learning.mjs'
      - 'scripts/verify-saek16-learning-browser.mjs'
      - '.github/workflows/saek16-critical-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teaching-regression:
    name: Verify retained risk-boundary statements (technical only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check SAEK 16 safety wording and source links (not medical validation)
        run: |
          node --check scripts/verify-saek16-critical-learning.mjs
          node scripts/verify-saek16-critical-learning.mjs
          node scripts/verify-saek.mjs
      - name: Install Chromium for actual browser QA of SAEK 16
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test mobile and desktop chapter UI, navigation, sources and self-check
        run: node scripts/verify-saek16-learning-browser.mjs
      - name: Preserve browser acceptance evidence (technical, not clinical)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saek16-learning-browser-evidence
          path: audit-results/saek16-learning-browser.json
          if-no-files-found: warn
          retention-days: 30
