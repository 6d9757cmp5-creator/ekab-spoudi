name: ATLA source-fidelity negative cases — isolated dry run
on:
  push:
    branches: [audit/atla-source-fidelity-20261104]
    paths: ['.github/workflows/atla-source-fidelity-dry-run.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real ATLA worker and source-audit syntax
        run: |
          node --check atla/ai/teaching-policy.mjs
          node --check workers/mentor-chat/src/index.js
      - name: Run source fidelity and AI safety unit suites without a model call
        run: |
          node --test atla/ai/teaching-policy.test.mjs atla/ai/safe-stream.test.mjs mentor/ai/client.test.mjs workers/mentor-chat/*.test.mjs
