name: Exam browser flows (simulated)
on:
  push:
    branches: [qa/exam-flows-20261028]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/test-exam-browser.mjs'
      - '.github/workflows/exam-flow-qa.yml'
      - 'app.js'
      - 'saek-exams.js'
      - 'seminar-prep.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-student-exams:
    name: SAEK EOPPEP seminars UI interactions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM simulator
        run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts jsdom@26
      - name: Click through all three training exams
        run: node scripts/test-exam-browser.mjs
