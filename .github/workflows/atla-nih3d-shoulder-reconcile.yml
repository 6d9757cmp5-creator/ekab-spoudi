name: ATLA NIH3D reconcile and anonymously reverify complete original ledger
on:
  push:
    branches: [feat/nih3d-public-domain-shoulder-originals-20261103]
    paths:
      - 'scripts/nih3d-build-verified-archive-registry.mjs'
      - 'scripts/nih3d-verify-ghcr-ledger.mjs'
      - '.github/workflows/atla-nih3d-shoulder-reconcile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/nih3d-build-verified-archive-registry.mjs
            scripts/nih3d-build-scientific-evidence.mjs
            scripts/nih3d-scientific-ontology.test.mjs
            scripts/nih3d-verify-ghcr-ledger.mjs
            tools/atla-ai/nih3d-scientific-ontology.mjs
            tools/atla-ai/resources/nih3d-master-plan-2026/
            tools/atla-ai/resources/nih3d-verified-originals-2026.json
            tools/atla-ai/resources/nih3d-educational-evidence-2026/
            docs/ATLA_NIH3D_GHCR_ARCHIVE_PROOF_2026.json
            docs/ATLA_NIH3D_GHCR_ANATOMY_BATCH_2026.json
            docs/ATLA_NIH3D_GHCR_NEURO_BATCH_2026.json
            docs/ATLA_NIH3D_GHCR_MOLECULAR_BATCH_2026.json
            docs/ATLA_NIH3D_GHCR_SHOULDER_00334_2026.json
            saek-course-01.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile source bytes, licenses, versions, provenance and science review status
        env:
          REQUIRE_VERIFIED_ORIGINAL_ARCHIVES: '1'
        run: |
          set -euo pipefail
          node --check scripts/nih3d-build-verified-archive-registry.mjs
          node --check scripts/nih3d-verify-ghcr-ledger.mjs
          node --check scripts/nih3d-build-scientific-evidence.mjs
          node scripts/nih3d-build-verified-archive-registry.mjs
          node scripts/nih3d-scientific-ontology.test.mjs
          node scripts/nih3d-build-scientific-evidence.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('tools/atla-ai/resources/nih3d-verified-originals-2026.json','utf8'));
          const e=JSON.parse(fs.readFileSync('tools/atla-ai/resources/nih3d-educational-evidence-2026/summary.json','utf8'));
          assert.equal(r.catalogSourceEntries,15688);
          assert.equal(r.archiveModelsWithAnyOriginal,8);
          assert.equal(r.modelsWithAllCatalogOriginalFilesVerified,8);
          assert.equal(r.uniqueVerifiedOriginalFiles,53);
          assert.equal(r.totalDistinctVerifiedOriginalBytes,88164099);
          assert.equal(r.duplicateCopiesAcrossOCIImages,2);
          assert.equal(r.fullNIHArchiveComplete,false);
          assert.equal(e.counts.sourceRecords,15688);
          assert.equal(e.counts.sourceSegments,50);
          assert.equal(e.counts.verifiedOriginalArchiveModels,8);
          assert.equal(e.counts.scholarlyClinicalApprovals,0);
          assert.equal(e.scientificApprovalStatus,'NOT_COMPLETED');
          assert(r.models.every(m=>m.clinicalUseApproved===false));
          console.log('PASS 8-model catalog SHA256 registry and zero clinical approvals');
          NODE
      - name: Anonymously retrieve every referenced GHCR image by immutable digest
        env:
          NIH_RESTORE_DIR: ${{ runner.temp }}/nih3d-independent-restore
        run: |
          set -euo pipefail
          mkdir -p "$NIH_RESTORE_DIR"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('tools/atla-ai/resources/nih3d-verified-originals-2026.json','utf8'));
          const images=[...new Set(r.models.flatMap(m=>m.verifiedFiles.map(f=>f.verifiedOCI.digest)))].sort();
          fs.writeFileSync(process.env.NIH_RESTORE_DIR+'/images.txt',images.join('\n')+'\n');
          console.log('Immutable images to restore:',images.length);
          NODE
          docker logout ghcr.io || true
          while IFS= read -r image; do
            test -n "$image"
            hash="${image##*:}"
            docker pull "$image"
            docker create --name "atla-$hash" "$image" /MANIFEST.json
            mkdir -p "$NIH_RESTORE_DIR/$hash/originals"
            docker cp "atla-$hash:/originals/." "$NIH_RESTORE_DIR/$hash/originals/"
            docker rm "atla-$hash"
          done < "$NIH_RESTORE_DIR/images.txt"
          node scripts/nih3d-verify-ghcr-ledger.mjs
      - name: Preserve only successful independently revalidated evidence on branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/atla-ai/resources/nih3d-verified-originals-2026.json
          git add tools/atla-ai/resources/nih3d-educational-evidence-2026/
          git add docs/ATLA_NIH3D_GHCR_LEDGER_REVALIDATION_2026.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(ATLA NIH3D): independently restore and reconcile 8 complete originals'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
