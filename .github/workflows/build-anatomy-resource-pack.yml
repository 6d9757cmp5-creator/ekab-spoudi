name: Build verified anatomy GLB research pack
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-anatomy-resource-pack.yml'
      - 'scripts/import-approved-3d-assets.mjs'
      - 'tools/anatomy-3d/resources/catalog.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  anatomy-resource-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source catalog and import validation
        run: |
          node --check scripts/import-approved-3d-assets.mjs
          node scripts/import-approved-3d-assets.mjs --dry-run --max-total-mb=200
      - name: Retrieve licensed GLB files into Anatomy Lab regional folders
        run: node scripts/import-approved-3d-assets.mjs --approved --max-total-mb=200
      - name: Verify asset integrity and GLB payloads
        run: node scripts/import-approved-3d-assets.mjs --verify-local --max-total-mb=200
      - name: Upload verified Anatomy Lab assets
        uses: actions/upload-artifact@v4
        with:
          name: atla-anatomy-hra-licensed-glb-pack
          path: |
            tools/anatomy-3d/resources/hra-v1.2/
            tools/anatomy-3d/resources/imported-manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified models to Anatomy Lab resource folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/anatomy-3d/resources/hra-v1.2 tools/anatomy-3d/resources/imported-manifest.json
          if git diff --cached --quiet; then
            echo "Verified models already present"
          else
            git commit -m "assets(anatomy): add validated CC-BY HRA models by region"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
