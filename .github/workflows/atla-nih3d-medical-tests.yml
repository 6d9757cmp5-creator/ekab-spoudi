name: ATLA NIH3D medical classifier tests
on:
  push:
    paths:
      - 'scripts/nih3d-medical-classify.mjs'
      - 'scripts/nih3d-medical-classify.test.mjs'
      - '.github/workflows/atla-nih3d-medical-tests.yml'
      - '.github/workflows/atla-nih3d-model-archive.yml'
      - '.github/workflows/atla-nih3d-release-audit.yml'
      - 'scripts/audit-atla-nih3d-release.mjs'
  pull_request:
    paths:
      - 'scripts/nih3d-medical-classify.mjs'
      - 'scripts/nih3d-medical-classify.test.mjs'
      - '.github/workflows/atla-nih3d-medical-tests.yml'
      - '.github/workflows/atla-nih3d-model-archive.yml'
      - '.github/workflows/atla-nih3d-release-audit.yml'
      - 'scripts/audit-atla-nih3d-release.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/nih3d-medical-classify.mjs
      - run: node scripts/nih3d-medical-classify.test.mjs
      - name: Validate archive and audit YAML syntax
        run: ruby -e "require 'yaml'; ARGV.each { |f| YAML.load_file(f) }" .github/workflows/atla-nih3d-model-archive.yml .github/workflows/atla-nih3d-release-audit.yml
      - name: Validate fail-closed NIH release audit
        run: |
          node --check scripts/audit-atla-nih3d-release.mjs
          node scripts/audit-atla-nih3d-release.mjs --self-test
