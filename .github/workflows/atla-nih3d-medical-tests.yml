name: ATLA NIH3D medical classifier tests
on:
  push:
    paths:
      - 'scripts/nih3d-medical-classify.mjs'
      - 'scripts/nih3d-medical-classify.test.mjs'
      - '.github/workflows/atla-nih3d-medical-tests.yml'
  pull_request:
    paths:
      - 'scripts/nih3d-medical-classify.mjs'
      - 'scripts/nih3d-medical-classify.test.mjs'
      - '.github/workflows/atla-nih3d-medical-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/nih3d-medical-classify.mjs
      - run: node scripts/nih3d-medical-classify.test.mjs
