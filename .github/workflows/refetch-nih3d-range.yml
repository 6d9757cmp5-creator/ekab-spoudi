name: EKAB - Re-fetch NIH3D ranges from source
# Each finished range becomes an artifact that the rescue workflow picks up.
on:
  workflow_dispatch:
    inputs:
      starts:
        description: 'JSON list of range starts, for example [12701,12801]'
        required: true
        type: string
      parallel:
        description: 'How many ranges to download at once'
        required: true
        default: '2'
        type: string
      size:
        description: 'Entries in each range; other than 100 only for SPLIT_RANGES in the rescue script'
        required: true
        default: '100'
        type: string
permissions:
  contents: read
jobs:
  refetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        start: ${{ fromJSON(inputs.starts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download all published NIH 3D formats with lossless compression
        env:
          RANGE_START: ${{ matrix.start }}
          RANGE_SIZE: ${{ inputs.size }}
        run: |
          set -euo pipefail
          case "$RANGE_START$RANGE_SIZE" in *[!0-9]*|'') exit 1;; esac
          [ "$RANGE_SIZE" != 100 ] || [ $((RANGE_START % 100)) -eq 1 ] || { echo 'A range starts at xx01'; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -qq -y zstd
          node scripts/mirror-nih3d-model-files.mjs --start="$RANGE_START" --end="$((RANGE_START+RANGE_SIZE-1))" --out="tmp/nih3d-mirror-$RANGE_START"
      # Only a finished run has a RESULT manifest, so a partial download cannot replace anything.
      - name: Preserve the finished range for the rescue workflow
        uses: actions/upload-artifact@v4
        with:
          name: nih3d-originals-${{ matrix.start }}
          path: |
            tmp/nih3d-mirror-${{ matrix.start }}/*.tar.zst*
            tmp/nih3d-mirror-${{ matrix.start }}/*-RESULT.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Start the rescue of the finished range
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run recover-nih3d-large.yml --repo "$GITHUB_REPOSITORY" --ref main
