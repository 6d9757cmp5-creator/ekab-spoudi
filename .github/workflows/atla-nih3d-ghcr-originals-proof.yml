name: ATLA NIH3D lossless public GHCR original-files pilot
on:
  push:
    branches: [feat/nih3d-ghcr-real-originals-20261103]
    paths:
      - 'scripts/nih3d-ghcr-originals-proof.sh'
      - '.github/workflows/atla-nih3d-ghcr-originals-proof.yml'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  archive-and-independently-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/nih3d-ghcr-originals-proof.sh
            docs/ATLA_NIH3D_LIVE_ORIGINAL_PROBE_2026.json
            docs/ATLA_NIH3D_GHCR_ARCHIVE_PROOF_2026.json
            tools/atla-ai/resources/nih3d-master-plan-2026/segments/entries-1-500.json
          sparse-checkout-cone-mode: false
      - name: Verify original NIH3D files, upload to GHCR, and independently restore anonymously
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/nih3d-ghcr-originals-proof.sh
      - name: Commit immutable GHCR digest and independent SHA-256 verification evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ATLA_NIH3D_GHCR_ARCHIVE_PROOF_2026.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(atla): independently restored NIH original bytes from public GHCR'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
