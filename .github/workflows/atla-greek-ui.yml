name: ATLA Greek-first learner UI validation
on:
  pull_request:
    paths:
      - 'index.html'
      - 'protocols.html'
      - 'ui-tools/anatomy-3d/index.html'
      - 'ui-tools/anatomy-full-atlas.html'
      - 'ui-tools/atla-resource-preview.html'
      - 'mentor-live.html'
      - 'mentor-lab.html'
      - 'theory.html'
      - 'scripts/verify-atla-greek-ui.mjs'
      - 'scripts/verify-atlas-provider-cleanup.mjs'
      - 'educational-animation-sources.js'
      - 'tools/anatomy-3d/index.html'
      - 'atla/assistant.mjs'
      - 'scripts/verify-atla-greek-ui-browser.mjs'
      - '.github/workflows/atla-greek-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  greek-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted Greek labels and preserved learner routes
        run: |
          node --test scripts/verify-atla-greek-ui.mjs
          node --test scripts/verify-atlas-provider-cleanup.mjs
          node --test scripts/verify-mentor-roadmap.test.mjs
          node --check scripts/verify-atla-greek-ui-browser.mjs
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Browser smoke in Greek
        run: node scripts/verify-atla-greek-ui-browser.mjs
