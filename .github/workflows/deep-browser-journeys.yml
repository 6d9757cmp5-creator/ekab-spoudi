name: Deep browser journeys
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-browser-journeys.mjs'
      - '.github/workflows/deep-browser-journeys.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/audit-browser-journeys.mjs
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekab-deep-browser-journeys
          path: audit-results/browser-journeys.json
          if-no-files-found: warn
