name: PR124 shared Greek recall cards — safe candidate checks
on:
  pull_request:
    paths:
      - 'content/library/greek-foundations-30.mjs'
      - 'content/library/greek-foundations-query.mjs'
      - 'content/library/greek-foundations.test.mjs'
      - 'docs/PR124_GREEK_CARDS_ATLAS_HANDOFF_2026-11-02.md'
      - '.github/workflows/pr124-greek-cards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-knowledge:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of shareable data and query modules
        run: |
          node --check content/library/greek-foundations-30.mjs
          node --check content/library/greek-foundations-query.mjs
          node --check content/library/greek-foundations.test.mjs
      - name: Data inventory, sources format, zero clinical approvals, no live AI ingestion
        run: node --test content/library/greek-foundations.test.mjs
      - name: Existing lesson / progress code unaffected
        run: node scripts/verify-saek-reader-safety.cjs
