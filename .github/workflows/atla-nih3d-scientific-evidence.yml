name: ATLA NIH3D reproducible scientific evidence crosswalk
on:
  push:
    branches: [feat/nih3d-science-archive-evidence-14-20261103]
    paths:
      - tools/atla-ai/nih3d-scientific-ontology.mjs
      - scripts/nih3d-build-scientific-evidence.mjs
      - scripts/nih3d-scientific-ontology.test.mjs
      - .github/workflows/atla-nih3d-scientific-evidence.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atla-nih3d-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluate-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/atla-ai/nih3d-scientific-ontology.mjs
            tools/atla-ai/resources/nih3d-master-plan-2026/
            tools/atla-ai/resources/nih3d-educational-evidence-2026/
            scripts/nih3d-build-scientific-evidence.mjs
            scripts/nih3d-scientific-ontology.test.mjs
            tools/atla-ai/resources/nih3d-verified-originals-2026.json
            docs/ATLA_NIH3D_GEOMETRY_STRUCTURAL_QA_2026.json
            saek-course-01.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify rules do not overclaim science or diagnoses
        run: |
          set -euo pipefail
          node --check tools/atla-ai/nih3d-scientific-ontology.mjs
          node --check scripts/nih3d-build-scientific-evidence.mjs
          node scripts/nih3d-scientific-ontology.test.mjs
      - name: Screen ALL NIH original metadata and create source-grounded evidence
        env:
          REQUIRE_VERIFIED_ORIGINAL_ARCHIVES: '1'
        run: node scripts/nih3d-build-scientific-evidence.mjs
      - name: Ensure no source omitted and no unsupported clinical approvals
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('tools/atla-ai/resources/nih3d-educational-evidence-2026/summary.json','utf8'));
          if(s.counts.sourceRecords!==15688||s.counts.sourceSegments!==50)throw Error('NIH source coverage gap');
          if(s.counts.scholarlyClinicalApprovals!==0||s.scientificApprovalStatus!=='NOT_COMPLETED')throw Error('False clinical approval');
          if(s.counts.sourceRecords!==s.counts.conceptMatched+s.counts.unmatchedRetained)throw Error('Dropped NIH source');
          if(s.relatedSourceAnatomyEvidenceLinks!==6)throw Error('NIH CT segmentation relationships unsupported');
          if(s.counts.verifiedOriginalArchiveModels!==14)throw Error('Scientific evidence archive status lagging behind seven verified original models');
          if(s.counts.originalStructuralQaModels!==14||s.counts.originalStructuralQaFiles!==99)throw Error('Source structural QA has incomplete coverage');
          console.log('Verified source ledger',JSON.stringify(s.counts));
          NODE
      - name: Store versioned evidence and educational relevance proposals
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/atla-ai/resources/nih3d-educational-evidence-2026/
          if ! git diff --cached --quiet; then
            git commit -m 'data(atla): source-grounded scientific relevance and review queue for all NIH entries'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
