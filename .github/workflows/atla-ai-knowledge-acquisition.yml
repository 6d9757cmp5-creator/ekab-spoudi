name: ATLA AI knowledge acquisition (review-gated)
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/atla-ai/knowledge-refresh/**'
      - '.github/workflows/atla-ai-knowledge-acquisition.yml'
permissions:
  contents: read
concurrency:
  group: atla-ai-knowledge-acquisition-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository also contains large binary 3D archives; they are not needed
          # for source discovery or test execution. Preserve main deployment checkout.
          filter: blob:none
          sparse-checkout: |
            tools/atla-ai/knowledge-refresh
            .github/workflows
            mentor/library
            mentor/knowledge
            mentor/clinical-desk
            mentor/ai/claude-adapter.mjs
            scripts/educational-scientific-review.mjs
            scripts/test-educational-scientific-review.mjs
            docs/INDEPENDENT_EDUCATIONAL_SCIENTIFIC_AUDIT.md
            docs/primary-source-crosscheck-2026-10-28/EDUCATIONAL_COMPLETION_RULE.md
            official_questions.json
            tools/anatomy-3d/resources/imported-manifest.json
            tools/anatomy-3d/resources/hra-v1.2/pelvis/VH_F_Ovary_R.glb
            tools/anatomy-3d/resources/hra-v1.2/thorax/VH_F_Thymus.glb
            tools/anatomy-3d/resources/hra-v1.2/abdomen/VH_F_Pancreas.glb
            tools/anatomy-3d/resources/hra-v1.2/limbs/VH_F_Knee_L.glb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic discovery and AI research gate tests
        run: |
          node --check tools/atla-ai/knowledge-refresh/pipeline.mjs
          node --check tools/atla-ai/knowledge-refresh/live-full-discovery.mjs
          node --check tools/atla-ai/knowledge-refresh/scientific-qa.mjs
          node --test tools/atla-ai/knowledge-refresh/scan.test.mjs tools/atla-ai/knowledge-refresh/pipeline.test.mjs tools/atla-ai/knowledge-refresh/scientific-qa.test.mjs tools/atla-ai/knowledge-refresh/upstream-evidence.test.mjs
          node --test scripts/test-educational-scientific-review.mjs
          node --test tools/atla-ai/knowledge-refresh/verify-originals.test.mjs
      - name: Independently verify HRA source originals (read-only, no AI charge)
        run: node tools/atla-ai/knowledge-refresh/verify-originals.mjs
          # Legacy checked-in 2026-11-02 scan lacks the newer topic-count field.
          # Deterministic unit tests run here; the unified scientific audit runs
          # on the FRESH current PubMed scan in live-full-discovery, fail-closed.
  live-pubmed-probe:
    # Both live jobs use unauthenticated NCBI E-utilities; run them serially
    # so the independent per-process request pacing does not overlap in CI.
    needs: live-full-discovery
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository also contains large binary 3D archives; they are not needed
          # for source discovery or test execution. Preserve main deployment checkout.
          filter: blob:none
          sparse-checkout: |
            tools/atla-ai/knowledge-refresh
            .github/workflows
            mentor/library
            mentor/knowledge
            mentor/clinical-desk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real NCBI PubMed search and matched PMID abstracts (read-only)
        run: node tools/atla-ai/knowledge-refresh/live-pubmed-probe.mjs

  live-full-discovery:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository also contains large binary 3D archives; they are not needed
          # for source discovery or test execution. Preserve main deployment checkout.
          filter: blob:none
          sparse-checkout: |
            tools/atla-ai/knowledge-refresh
            .github/workflows
            mentor/library
            mentor/knowledge
            mentor/clinical-desk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full curated sources and PubMed discovery - no AI credits, no writes
        run: node tools/atla-ai/knowledge-refresh/live-full-discovery.mjs

  acquire:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: write
    env:
      # HARD OFF by owner decision: do not spend AI credits on scheduled runs.
      # A future explicit reviewed PR is required to enable billable AI.
      ATLA_RESEARCH_AI_ENABLED: 'false'
      ATLA_RESEARCH_SPENDING_APPROVED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Curated source discovery and AI evidence triage (review queue only)
        run: node tools/atla-ai/knowledge-refresh/pipeline.mjs
      - name: Reject any automatic clinical publication
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {validateQueueFiles} from './tools/atla-ai/knowledge-refresh/pipeline.mjs';
          import {audit,enforce} from './tools/atla-ai/knowledge-refresh/scientific-qa.mjs';
          const path='tools/atla-ai/knowledge-refresh/queue/';
          const read=name=>JSON.parse(readFileSync(path+name,'utf8'));
          const evidence={
            report:read('ai-research-review.json'),
            metadata:read('last-scan.json'),
            health:read('source-health.json'),
            pending:read('pending-pubmed.json')
          };
          validateQueueFiles(evidence);
          const scientific=audit({pending:evidence.pending,metadata:evidence.metadata,
            health:evidence.health,review:evidence.report});
          enforce(scientific);
          if(scientific.confirmed_clinical_claims!==0 ||
             scientific.clinical_publication_allowed!==false)throw Error('unsafe-clinical-claims');
          console.log(JSON.stringify({scientific_qa:scientific.technical_research_gate,
            clinical_approval:false,medical_claims_approved:0}));
          NODE
      - name: Commit isolated review queue only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/atla-ai/knowledge-refresh/queue/last-scan.json \
                  tools/atla-ai/knowledge-refresh/queue/source-health.json \
                  tools/atla-ai/knowledge-refresh/queue/pending-pubmed.json \
                  tools/atla-ai/knowledge-refresh/queue/ai-research-review.json
          if git diff --cached --quiet; then
            echo "No changes to research review queue"
          else
            git commit -m "chore(atla): update isolated research candidates"
            # Fail closed if main advanced after verification; never rebase unverified code.
            # The next approved scheduled run can retry against a fresh checkout.
            git push origin HEAD:main
          fi
      - name: Research evidence review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atla-ai-research-review
          path: tools/atla-ai/knowledge-refresh/queue/
          if-no-files-found: ignore
          retention-days: 14
