name: ATLA AI knowledge acquisition (review-gated)
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/atla-ai/knowledge-refresh/**'
      - '.github/workflows/atla-ai-knowledge-acquisition.yml'
permissions:
  contents: read
concurrency:
  group: atla-ai-knowledge-acquisition-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository also contains large binary 3D archives; they are not needed
          # for source discovery or test execution. Preserve main deployment checkout.
          filter: blob:none
          sparse-checkout: |
            tools/atla-ai/knowledge-refresh
            .github/workflows
            mentor/library
            mentor/knowledge
            mentor/clinical-desk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic discovery and AI research gate tests
        run: |
          node --check tools/atla-ai/knowledge-refresh/pipeline.mjs
          node --check tools/atla-ai/knowledge-refresh/live-full-discovery.mjs
          node --check tools/atla-ai/knowledge-refresh/scientific-qa.mjs
          node --test tools/atla-ai/knowledge-refresh/scan.test.mjs tools/atla-ai/knowledge-refresh/pipeline.test.mjs tools/atla-ai/knowledge-refresh/scientific-qa.test.mjs tools/atla-ai/knowledge-refresh/review-dossiers.test.mjs
          node tools/atla-ai/knowledge-refresh/scientific-qa.mjs
          node --check tools/atla-ai/knowledge-refresh/review-dossiers.mjs
          node tools/atla-ai/knowledge-refresh/review-dossiers.mjs > "$RUNNER_TEMP/atla-clinical-review-dossiers.json"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const d=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/atla-clinical-review-dossiers.json","utf8")); if(d.dossier_count<1||d.clinical_publications!==0||d.clinical_approval!==false)process.exit(1); console.log("ATLA independent-review dossier records:",d.dossier_count)'
      - name: Review packets for independent medical reviewers (never published to learners)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atla-independent-clinical-review-dossiers
          path: ${{ runner.temp }}/atla-clinical-review-dossiers.json
          if-no-files-found: ignore
          retention-days: 14
  live-pubmed-probe:
    # Both live jobs use unauthenticated NCBI E-utilities; run them serially
    # so the independent per-process request pacing does not overlap in CI.
    needs: live-full-discovery
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository also contains large binary 3D archives; they are not needed
          # for source discovery or test execution. Preserve main deployment checkout.
          filter: blob:none
          sparse-checkout: |
            tools/atla-ai/knowledge-refresh
            .github/workflows
            mentor/library
            mentor/knowledge
            mentor/clinical-desk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real NCBI PubMed search and matched PMID abstracts (read-only)
        run: node tools/atla-ai/knowledge-refresh/live-pubmed-probe.mjs

  live-full-discovery:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository also contains large binary 3D archives; they are not needed
          # for source discovery or test execution. Preserve main deployment checkout.
          filter: blob:none
          sparse-checkout: |
            tools/atla-ai/knowledge-refresh
            .github/workflows
            mentor/library
            mentor/knowledge
            mentor/clinical-desk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full curated sources and PubMed discovery - no AI credits, no writes
        run: node tools/atla-ai/knowledge-refresh/live-full-discovery.mjs

  acquire:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: write
    env:
      ATLA_RESEARCH_AI_ENABLED: ${{ vars.ATLA_RESEARCH_AI_ENABLED }}
      ATLA_RESEARCH_SPENDING_APPROVED: ${{ vars.ATLA_RESEARCH_SPENDING_APPROVED }}
      ATLA_RESEARCH_ANTHROPIC_API_KEY: ${{ secrets.ATLA_RESEARCH_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Curated source discovery and AI evidence triage (review queue only)
        run: node tools/atla-ai/knowledge-refresh/pipeline.mjs
      - name: Reject any automatic clinical publication
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {validateQueueFiles} from './tools/atla-ai/knowledge-refresh/pipeline.mjs';
          const path='tools/atla-ai/knowledge-refresh/queue/';
          const read=name=>JSON.parse(readFileSync(path+name,'utf8'));
          validateQueueFiles({
            report:read('ai-research-review.json'),
            metadata:read('last-scan.json'),
            health:read('source-health.json'),
            pending:read('pending-pubmed.json')
          });
          NODE
      - name: Commit isolated review queue only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/atla-ai/knowledge-refresh/queue/last-scan.json \
                  tools/atla-ai/knowledge-refresh/queue/source-health.json \
                  tools/atla-ai/knowledge-refresh/queue/pending-pubmed.json \
                  tools/atla-ai/knowledge-refresh/queue/ai-research-review.json
          if git diff --cached --quiet; then
            echo "No changes to research review queue"
          else
            git commit -m "chore(atla): update isolated research candidates"
            # Fail closed if main advanced after verification; never rebase unverified code.
            # The next approved scheduled run can retry against a fresh checkout.
            git push origin HEAD:main
          fi
      - name: Research evidence review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atla-ai-research-review
          path: tools/atla-ai/knowledge-refresh/queue/
          if-no-files-found: ignore
          retention-days: 14
