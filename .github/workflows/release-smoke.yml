name: Release quality smoke checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required pages, Greek metadata and review registry
        run: python3 scripts/release_smoke.py
      - name: Check JavaScript syntax when Node.js is available
        shell: bash
        run: |
          set -euo pipefail
          for file in sw.js; do
            node --check "$file"
          done
