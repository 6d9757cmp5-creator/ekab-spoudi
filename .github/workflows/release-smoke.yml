name: Release quality smoke checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required pages, Greek metadata and review registry
        run: python3 scripts/release_smoke.py
      - name: Verify SAEK reading safety, storage and all 247 chapters
        run: node scripts/verify-saek-reader-safety.cjs
      - name: Check JavaScript syntax when Node.js is available
        shell: bash
        run: |
          set -euo pipefail
          for file in sw.js saek-reader-safe.js saek-hub.js progress.js updates.js home-tracker-v2.js theme-init.js global-tools.js; do
            node --check "$file"
          done
          for file in account-ui.js appwrite-client.js; do
            node --input-type=module --check < "$file"
          done
