name: PR89 AED poster candidate integrity

on:
  pull_request:
    paths:
      - 'assets/aed-first-aid-poster.webp'
      - 'media-review.json'
      - 'contacts.html'
      - 'contacts-nearby-aed.js'
      - 'scripts/test-aed-poster-candidate.mjs'
      - '.github/workflows/pr89-aed-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify proposed poster is not published and existing map survives
        run: node --test scripts/test-aed-poster-candidate.mjs
      - name: Verify official AED map JavaScript parses
        run: node --check contacts-nearby-aed.js
