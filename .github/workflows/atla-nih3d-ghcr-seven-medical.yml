name: ATLA NIH3D archive 51 original files for seven medical source records
on:
  push:
    branches: [feat/nih3d-originals-seven-medical-batch-20261103]
    paths:
      - scripts/nih3d-ghcr-seven-medical-batch.mjs
      - .github/workflows/atla-nih3d-ghcr-seven-medical.yml
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/nih3d-ghcr-seven-medical-batch.mjs
            tools/atla-ai/nih3d-credibility-gate.mjs
            tools/atla-ai/resources/nih3d-credibility-approvals.json
            tools/atla-ai/resources/nih3d-master-plan-2026/segments/entries-1-500.json
            tools/atla-ai/resources/nih3d-verified-originals-2026.json
            docs/ATLA_NIH3D_GHCR_MEDICAL_SEVEN_BATCH_2026.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download 51 originals under a 70 MB total cap with SHA256
        env:
          NIH_BATCH_DIR: ${{ runner.temp }}/atla-nih3d-seven-medical
        run: |
          set -euo pipefail
          node --check scripts/nih3d-ghcr-seven-medical-batch.mjs
          node scripts/nih3d-ghcr-seven-medical-batch.mjs prepare
      - name: Publish original bytes as GitHub Container Registry OCI image
        env:
          NIH_BATCH_DIR: ${{ runner.temp }}/atla-nih3d-seven-medical
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/6d9757cmp5-creator/atla-nih3d-archive
          TAG: originals-medical-00105-00451-20261103-v1
        run: |
          set -euo pipefail
          cat > "$NIH_BATCH_DIR/Dockerfile" <<'DOCKER'
          FROM scratch
          LABEL org.opencontainers.image.source="https://github.com/6d9757cmp5-creator/ekab-spoudi"
          LABEL org.opencontainers.image.description="Original NIH 3D seven biomedical records, all source formats"
          COPY originals/ /originals/
          COPY MANIFEST.json /MANIFEST.json
          CMD ["/MANIFEST.json"]
          DOCKER
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:$TAG" "$NIH_BATCH_DIR"
          docker push "$IMAGE:$TAG"
      - name: Independently restore all 51 files anonymously, verify every SHA256
        env:
          NIH_BATCH_DIR: ${{ runner.temp }}/atla-nih3d-seven-medical
          IMAGE: ghcr.io/6d9757cmp5-creator/atla-nih3d-archive
          TAG: originals-medical-00105-00451-20261103-v1
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker image rm "$IMAGE:$TAG"
          docker pull "$IMAGE:$TAG"
          docker create --name nih3d-restore-test "$IMAGE:$TAG" /MANIFEST.json
          mkdir -p "$NIH_BATCH_DIR/recovered/originals"
          docker cp nih3d-restore-test:/originals/. "$NIH_BATCH_DIR/recovered/originals/"
          docker cp nih3d-restore-test:/MANIFEST.json "$NIH_BATCH_DIR/recovered/MANIFEST.json"
          docker rm nih3d-restore-test
          node scripts/nih3d-ghcr-seven-medical-batch.mjs verify
          digest="$(docker image inspect "$IMAGE:$TAG" --format '{{index .RepoDigests 0}}')"
          export NIH_GHCR_IMAGE_DIGEST="$digest"
          mkdir -p docs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const source=JSON.parse(fs.readFileSync(process.env.NIH_BATCH_DIR+'/MANIFEST.json','utf8'));
          assert(source.originalFileCount===51&&source.modelCount===7);
          const digest=process.env.NIH_GHCR_IMAGE_DIGEST;
          assert.equal(source.originalByteCount,55278017);
          assert(/^ghcr\.io\/6d9757cmp5-creator\/atla-nih3d-archive@sha256:[a-f0-9]{64}$/.test(digest));
          const result={schemaVersion:2,status:'ALL_51_LISTED_ORIGINALS_PERSISTED_AND_ANONYMOUSLY_RESTORED',
            scope:'Seven public-domain NIH medical research records only; not full NIH',
            imageTag:'ghcr.io/6d9757cmp5-creator/atla-nih3d-archive:originals-medical-00105-00451-20261103-v1',
            immutableDigest:digest,models:source.models.length,files:source.files.length,
            totalOriginalBytes:source.originalByteCount,completeForTheseCatalogEntries:true,
            allListedOriginalFormatsForTheseCatalogEntries:true,fullNIHArchiveComplete:false,
            everySourceSHA256CheckedAfterRecovery:true,scientificallyApproved:false,
            copyrightAndAttribution:source.models,filesByFormat:source.files.reduce((m,f)=>(m[f.format]=(m[f.format]??0)+1,m),{}),
            sourceManifest:{originalModels:source.models, originalFiles:source.files.map(f=>({entryId:f.entryId,accession:f.accession,originalFormat:f.format,url:f.sourceURL,verifiedBytes:f.verifiedBytes,sha256:f.sha256,archivePath:f.archivePath,originalName:f.originalName}))}};
          fs.writeFileSync('docs/ATLA_NIH3D_GHCR_MEDICAL_SEVEN_BATCH_2026.json',JSON.stringify(result,null,2)+'\n');
          console.log('VERIFIED PERSISTENT NIH BATCH',JSON.stringify({digest,models:result.models,files:result.files,bytes:result.totalOriginalBytes}));
          NODE
      - name: Save published SHA256 evidence to Git main-independent feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ATLA_NIH3D_GHCR_MEDICAL_SEVEN_BATCH_2026.json
          git commit -m 'evidence(atla): 51 files from seven medical NIH records independently recovered from GHCR'
          git push origin "HEAD:${GITHUB_REF_NAME}"
