name: ATLA NIH3D publish verified pilot archives permanently
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atla-nih3d-publish-existing-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified original NIH model packages from successful pilot
        uses: actions/download-artifact@v4
        with:
          name: atla-nih3d-originals-160-175
          run-id: 41357774397
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: tmp/nih3d-recovered
      - name: Upload previously downloaded lossless NIH models to permanent release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: atla-nih3d-master-2026
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tmp/nih3d-recovered/*.tar.zst* tmp/nih3d-recovered/*-RESULT.json)
          if [ "${#files[@]}" -lt 2 ]; then
            echo "::error::Source archive or RESULT.json missing"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Uploading original package: $(basename "$f")"
            gh release upload "$TAG" "$f" --clobber
          done
          gh release view "$TAG" --json assets > tmp/nih3d-recovered/published-assets.json
          for f in "${files[@]}"; do
            filename="$(basename "$f")"
            bytes="$(stat -c%s "$f")"
            jq -e --arg filename "$filename" --argjson bytes "$bytes"               '.assets | any(.name == $filename and .size == $bytes)'               tmp/nih3d-recovered/published-assets.json >/dev/null
            echo "VERIFIED PERMANENT RELEASE ASSET: $filename bytes=$bytes"
          done
