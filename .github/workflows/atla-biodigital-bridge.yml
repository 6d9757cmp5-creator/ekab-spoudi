name: ATLA BioDigital Bridge - isolated smoke checks
on:
  pull_request:
    paths:
      - 'tools/anatomy-3d/biodigital-bridge*'
      - 'tools/anatomy-3d/index.html'
      - '.github/workflows/atla-biodigital-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/anatomy-3d/index.html
            tools/anatomy-3d/biodigital-bridge-core.mjs
            tools/anatomy-3d/biodigital-bridge.mjs
            tools/anatomy-3d/biodigital-bridge.html
            tools/anatomy-3d/biodigital-bridge.test.mjs
            tools/anatomy-3d/vendor/biodigital-human-api-3.0.0.min.js
            tools/anatomy-3d/vendor/BIODIGITAL_HUMAN_API_LICENSE.txt
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and API validation
        run: |
          node --check tools/anatomy-3d/biodigital-bridge-core.mjs
          node --check tools/anatomy-3d/biodigital-bridge.mjs
          node --test tools/anatomy-3d/biodigital-bridge.test.mjs
      - name: Verify upstream MIT artifacts unchanged
        run: |
          test "$(git hash-object tools/anatomy-3d/vendor/biodigital-human-api-3.0.0.min.js)" = d6539d90fd77d594a358acdcd423de2a0fd50464
          test "$(git hash-object tools/anatomy-3d/vendor/BIODIGITAL_HUMAN_API_LICENSE.txt)" = 04f4f423fa3a3d43e53b06f511c237e0755db3a7
      - name: Verify wired standalone entry and no credential exports
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const base='tools/anatomy-3d/';
          const index=readFileSync(base+'index.html','utf8');
          const page=readFileSync(base+'biodigital-bridge.html','utf8');
          const script=readFileSync(base+'biodigital-bridge.mjs','utf8');
          // Legacy compatibility files remain available, but current anatomy is a single first-party page.
          assert.doesNotMatch(index,/href=["'][^"']*biodigital-bridge\.html/,'Legacy viewer must not be linked from anatomy');
          assert.ok(index.includes("location.replace('../../ui-tools/anatomy-3d/index.html'"),'Anatomy forwards to the one public atlas');
          assert.match(page,/biodigital-bridge\.mjs/);
          for(const id of ['providerFrame','nativeFrame','viewerUrl','openProvider','openTopic','xray','labels','next','previous','isolate','restoreScene','tourPlay','tourPause','quizEnter','quizExit']){
            assert.ok(page.includes('id="'+id+'"'),'Missing UI: '+id);
          }
          assert.ok(!/localStorage|sessionStorage|document\.cookie/.test(script),'Unexpected local persistent storage');
          assert.ok(!/labels\.setEnabled|scene\.pickingMode/.test(script),'Undocumented API command');
          assert.ok(!/sk-proj-|BEGIN PRIVATE KEY/.test(page+script),'Unexpected secret');
          assert.match(script,/Δεν επιβεβαιώθηκε σύνδεση BioDigital Viewer API/,'Missing auth-failure user feedback');
          console.log('Standalone integration smoke: PASS');
          NODE
