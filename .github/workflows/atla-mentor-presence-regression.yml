name: ATLA MENTOR local-answer regression (migration-aware)
on:
  push:
    branches:
      - fix/atla-mentor-presence-local-fallback-20261103
    paths:
      - 'scripts/verify-atla-presence-browser.mjs'
      - '.github/workflows/atla-mentor-presence-regression.yml'
  pull_request:
    paths:
      - 'scripts/verify-atla-presence-browser.mjs'
      - 'mentor/presence/**'
      - 'mentor/core/quick-answer.mjs'
      - 'atla/assistant.mjs'
      - 'scripts/verify-mentor-layout-browser.mjs'
permissions:
  contents: read
concurrency:
  group: atla-mentor-presence-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mentor-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify legacy and replacement test syntax
        run: |
          node --check scripts/verify-atla-presence-browser.mjs
          node --check scripts/verify-mentor-layout-browser.mjs
      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      # The integration intentionally removes the old floating MENTOR presence.
      # Test the replacement ATLA entry and the retained legacy learning URLs;
      # keep the old presence regression available for the original main surface.
      - name: Run real-browser ATLA replacement and legacy route regression
        run: node scripts/verify-mentor-layout-browser.mjs
