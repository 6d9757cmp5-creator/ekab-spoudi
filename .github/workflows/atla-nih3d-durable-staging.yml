name: ATLA NIH3D durable storage staging test
on:
  workflow_dispatch:
    inputs:
      shard_dir:
        description: 'Existing local shard directory (for a self-hosted runner only)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging uploader
        run: bash -n scripts/nih3d-dual-store.sh
      - name: Guard against premature execution
        run: |
          echo "This workflow validates code only. GitHub-hosted runners do not contain prior shard files."
          echo "No NIH files are uploaded until storage credentials and a shard source are configured."
