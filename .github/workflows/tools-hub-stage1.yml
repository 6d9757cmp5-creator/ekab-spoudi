name: Stage 1 — tools hub safety
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tools.html'
      - 'scripts/test-tools-hub-stage1.mjs'
      - 'scripts/verify-tools-hub-browser.mjs'
      - '.github/workflows/tools-hub-stage1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools-hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-tools-hub-stage1.mjs
      - run: node scripts/verify-saek-reader-safety.cjs
      - run: node scripts/verify-tool-boundaries.mjs
      - name: Browser smoke for iPhone and desktop
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ekab-stage1-http.log 2>&1 &
          node scripts/verify-tools-hub-browser.mjs
