name: Verify symlink safety regression
on:
  push:
    branches:
      - fix/atla-verifier-symlink-20261102
permissions:
  contents: read
jobs:
  symlink-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated verifier regression tests
        run: python -m unittest discover -s tests -p 'test_verify_tasks_symlinks.py' -v
