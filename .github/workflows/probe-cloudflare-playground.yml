name: Cloudflare public playground Greek online probe
on:
  push:
    branches: [main]
    paths:
      - scripts/probe-cloudflare-playground.mjs
      - .github/workflows/probe-cloudflare-playground.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/probe-cloudflare-playground.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-public-playground-probe
          path: audit-results/cloudflare-playground-probe.json
          retention-days: 7
          if-no-files-found: warn
