name: Έλεγχος ποιότητας ΣΑΕΚ

on:
  push:
    paths:
      - 'saek-course-*.html'
      - 'README.md'
      - 'version.json'
      - 'updates.js'
      - 'sw.js'
      - 'scripts/verify-saek.mjs'
      - 'scripts/verify-education.mjs'
      - 'official_questions.json'
      - 'docs/EOPPEP-SOURCE-INVENTORY-2026-10-26.json'
      - 'saek-chapter-visuals.js'
      - 'saek-visual-ui.js'
      - 'saek-visual-ui.css'
      - '.github/workflows/saek-verify.yml'
  pull_request:
    paths:
      - 'saek-course-*.html'
      - 'README.md'
      - 'version.json'
      - 'updates.js'
      - 'sw.js'
      - 'scripts/verify-saek.mjs'
      - 'scripts/verify-education.mjs'
      - 'official_questions.json'
      - 'docs/EOPPEP-SOURCE-INVENTORY-2026-10-26.json'
      - 'saek-chapter-visuals.js'
      - 'saek-visual-ui.js'
      - 'saek-visual-ui.css'
      - '.github/workflows/saek-verify.yml'

permissions:
  contents: read

jobs:
  verify-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SAEK learning chapters and version consistency
        run: node scripts/verify-saek.mjs
      - name: Check EOPPEP references, 103 lesson-specific drills, 5 answers and 247 visual recaps
        run: node scripts/verify-education.mjs
      - name: Validate lesson-visual JavaScript syntax
        run: node --check saek-chapter-visuals.js && node --check saek-visual-ui.js && node --check saek-reviewed-image-ui.js
