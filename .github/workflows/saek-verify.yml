name: Έλεγχος ποιότητας ΣΑΕΚ

on:
  push:
    paths:
      - 'saek-course-*.html'
      - 'README.md'
      - 'version.json'
      - 'updates.js'
      - 'sw.js'
      - 'scripts/verify-saek.mjs'
      - 'scripts/verify-education.mjs'
      - 'scripts/verify-eoppep-read-progress.mjs'
      - 'official_questions.json'
      - 'docs/EOPPEP-SOURCE-INVENTORY-2026-10-26.json'
      - 'saek-visual-ui.js'
      - 'saek-visual-ui.css'
      - '.github/workflows/saek-verify.yml'
  pull_request:
    paths:
      - 'saek-course-*.html'
      - 'README.md'
      - 'version.json'
      - 'updates.js'
      - 'sw.js'
      - 'scripts/verify-saek.mjs'
      - 'scripts/verify-education.mjs'
      - 'scripts/verify-eoppep-read-progress.mjs'
      - 'official_questions.json'
      - 'docs/EOPPEP-SOURCE-INVENTORY-2026-10-26.json'
      - 'saek-visual-ui.js'
      - 'saek-visual-ui.css'
      - '.github/workflows/saek-verify.yml'

permissions:
  contents: read

jobs:
  verify-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SAEK learning chapters and version consistency
        run: node scripts/verify-saek.mjs
      - name: Check EOPPEP references, lesson-specific drills, answers and source illustration registry
        run: node scripts/verify-education.mjs
      - name: Check EOPPEP reader read-completion, undo and sync
        run: node scripts/verify-eoppep-read-progress.mjs
      - name: Validate lesson-visual JavaScript syntax
        run: node --check saek-visual-ui.js && node --check saek-reviewed-image-ui.js
