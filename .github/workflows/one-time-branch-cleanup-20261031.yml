name: One-time verified branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-branch-cleanup-20261031.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune-verified:
    if: github.repository == '6d9757cmp5-creator/ekab-spoudi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only four verified ancestral, unprotected and PR-free branches
        uses: actions/github-script@v7
        with:
          script: |
            const targets = [
              { branch: 'feature/combined-eclass-pdf-card', sha: 'a0f543a9f4575ab098a4ad110071685e2498daab' },
              { branch: 'fix/compact-sources-independent-cards', sha: '598f3a7f71e70fec4747d5e7dd6e144c2abb46dd' },
              { branch: 'feature/saek-in-app-reader-20261025', sha: 'd7b553a2e763ad0d18d91985d29a96efaf18cde9' },
              { branch: 'test-phase-two-smoke-rules', sha: 'c6368544e4909b8e9315f18d85937ac35a414034' }
            ];
            const { owner, repo } = context.repo;
            if (owner !== '6d9757cmp5-creator' || repo !== 'ekab-spoudi') {
              core.setFailed('Unexpected repository');
              return;
            }
            let removed = 0;
            for (const target of targets) {
              const { branch, sha } = target;
              const { data: current } = await github.rest.repos.getBranch({ owner, repo, branch });
              if (current.protected || current.commit.sha !== sha) {
                core.setFailed('Protected or changed branch: ' + branch);
                continue;
              }
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: 'main...' + branch
              });
              if (comparison.ahead_by !== 0) {
                core.setFailed('Contains unmerged commits: ' + branch);
                continue;
              }
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, head: owner + ':' + branch, state: 'open', per_page: 100
              });
              if (prs.length !== 0) {
                core.setFailed('Branch has an active pull request: ' + branch);
                continue;
              }
              await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + branch });
              core.info('Deleted verified redundant branch: ' + branch);
              removed++;
            }
            await core.summary.addHeading('Branch cleanup outcome')
              .addRaw('Deleted ' + removed + ' of 4 explicitly approved branches. ')
              .addRaw('Protected: main, free-only-ai-grading, ekab-spoudi-v2-android-staging, all PR branches.')
              .write();
            if (removed !== 4) core.setFailed('Incomplete cleanup');
