name: Validate private sync and compression
on:
  push:
    paths: ['sync-*.js', 'cloud-sync.js', 'scripts/verify-sync*.mjs', '.github/workflows/sync-verify.yml']
  pull_request:
    paths: ['sync-*.js', 'cloud-sync.js', 'scripts/verify-sync*.mjs', '.github/workflows/sync-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-sync.mjs
      - run: node scripts/verify-sync-codec.mjs
