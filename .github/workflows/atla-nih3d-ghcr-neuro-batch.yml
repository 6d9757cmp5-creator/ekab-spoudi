name: ATLA NIH3D archive all original files for 3 neuroanatomical models
on:
  push:
    branches: [feat/nih3d-ghcr-neuro-originals-20261103]
    paths:
      - scripts/nih3d-ghcr-neuro-batch.mjs
      - .github/workflows/atla-nih3d-ghcr-neuro-batch.yml
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/nih3d-ghcr-neuro-batch.mjs
            tools/atla-ai/resources/nih3d-master-plan-2026/segments/entries-1-500.json
            docs/ATLA_NIH3D_GHCR_NEURO_BATCH_2026.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download all 25 originals with exact sizes and SHA256
        env:
          NIH_BATCH_DIR: ${{ runner.temp }}/atla-nih3d-neuro-batch
        run: |
          set -euo pipefail
          node --check scripts/nih3d-ghcr-neuro-batch.mjs
          node scripts/nih3d-ghcr-neuro-batch.mjs prepare
      - name: Publish original bytes as GitHub Container Registry OCI image
        env:
          NIH_BATCH_DIR: ${{ runner.temp }}/atla-nih3d-neuro-batch
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/6d9757cmp5-creator/atla-nih3d-archive
          TAG: originals-neuro-00252-00278-v1
        run: |
          set -euo pipefail
          cat > "$NIH_BATCH_DIR/Dockerfile" <<'DOCKER'
          FROM scratch
          LABEL org.opencontainers.image.source="https://github.com/6d9757cmp5-creator/ekab-spoudi"
          LABEL org.opencontainers.image.description="Original NIH3D corpus callosum, medulla oblongata, brain ventricles, all available formats"
          COPY originals/ /originals/
          COPY MANIFEST.json /MANIFEST.json
          CMD ["/MANIFEST.json"]
          DOCKER
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:$TAG" "$NIH_BATCH_DIR"
          docker push "$IMAGE:$TAG"
      - name: Independently restore all 15 files anonymously, verify every SHA256
        env:
          NIH_BATCH_DIR: ${{ runner.temp }}/atla-nih3d-neuro-batch
          IMAGE: ghcr.io/6d9757cmp5-creator/atla-nih3d-archive
          TAG: originals-neuro-00252-00278-v1
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker image rm "$IMAGE:$TAG"
          docker pull "$IMAGE:$TAG"
          docker create --name nih3d-restore-test "$IMAGE:$TAG" /MANIFEST.json
          mkdir -p "$NIH_BATCH_DIR/recovered/originals"
          docker cp nih3d-restore-test:/originals/. "$NIH_BATCH_DIR/recovered/originals/"
          docker cp nih3d-restore-test:/MANIFEST.json "$NIH_BATCH_DIR/recovered/MANIFEST.json"
          docker rm nih3d-restore-test
          node scripts/nih3d-ghcr-neuro-batch.mjs verify
          digest="$(docker image inspect "$IMAGE:$TAG" --format '{{index .RepoDigests 0}}')"
          export NIH_GHCR_IMAGE_DIGEST="$digest"
          mkdir -p docs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const source=JSON.parse(fs.readFileSync(process.env.NIH_BATCH_DIR+'/MANIFEST.json','utf8'));
          assert(source.originalFileCount===25&&source.originalModelCount===3);
          const digest=process.env.NIH_GHCR_IMAGE_DIGEST;
          assert(/^ghcr\.io\/6d9757cmp5-creator\/atla-nih3d-archive@sha256:[a-f0-9]{64}$/.test(digest));
          const result={schemaVersion:1,status:'ALL_25_LISTED_ORIGINALS_PERSISTED_AND_ANONYMOUSLY_RESTORED',
            scope:'Three neuroanatomy source records only, not all NIH 3D models',
            imageTag:'ghcr.io/6d9757cmp5-creator/atla-nih3d-archive:originals-neuro-00252-00278-v1',
            immutableDigest:digest,models:source.originalModels.length,files:source.originalFiles.length,
            totalOriginalBytes:source.originalByteCount,completeForTheseCatalogEntries:true,
            allListedOriginalFormatsForTheseCatalogEntries:true,fullNIHArchiveComplete:false,
            everySourceSHA256CheckedAfterRecovery:true,scientificallyApproved:false,
            copyrightAndAttribution:source.originalModels,filesByFormat:source.originalFiles.reduce((m,f)=>(m[f.originalFormat]=(m[f.originalFormat]??0)+1,m),{}),
            sourceManifest:source};
          fs.writeFileSync('docs/ATLA_NIH3D_GHCR_NEURO_BATCH_2026.json',JSON.stringify(result,null,2)+'\n');
          console.log('VERIFIED PERSISTENT NIH BATCH',JSON.stringify({digest,models:result.models,files:result.files,bytes:result.totalOriginalBytes}));
          NODE
      - name: Save published SHA256 evidence to Git main-independent feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ATLA_NIH3D_GHCR_NEURO_BATCH_2026.json
          git commit -m 'evidence(atla): all formats of three NIH neuroanatomy source records recovered from GHCR'
          git push origin "HEAD:${GITHUB_REF_NAME}"
