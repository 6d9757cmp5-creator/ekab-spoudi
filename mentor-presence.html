<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MENTOR — ζωντανή παρουσία 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#11528a,#041326 70%);color:#d6f5ff;font:13px system-ui,-apple-system,sans-serif}
#mentor-cinematic-stage{height:100%;width:100%;position:relative;isolation:isolate;overflow:hidden}
#mentor-real3d-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
#mentor-real3d-canvas[hidden]{display:none}
.cinematic-character,#mentor-real3d-toggle,#mentor-real3d-photo,#mentor-avatar,#mentor-real3d-rotation,#mentor-real3d-motion{display:none!important}
.cinematic-stage-label{position:absolute;top:10px;left:12px;font-size:.65rem;letter-spacing:.19em;z-index:2;color:#adeaf9;text-shadow:0 0 12px #0fd1ff}
html.holo,html.holo body{background:transparent}
html.holo #mentor-real3d-canvas{filter:sepia(1) hue-rotate(150deg) saturate(2.4) brightness(1.25) contrast(1.05);opacity:.86}
html.holo #mentor-cinematic-stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
 background:repeating-linear-gradient(0deg,#7df3ff1f 0 1px,transparent 1px 4px);mix-blend-mode:screen;animation:holo-scan 6s linear infinite;
 -webkit-mask-image:radial-gradient(ellipse 48% 52% at 50% 52%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 48% 52% at 50% 52%,#000 40%,transparent 100%)}
html.holo #mentor-cinematic-stage::before{content:"";position:absolute;left:12%;right:12%;bottom:1%;height:7%;z-index:0;pointer-events:none;
 background:radial-gradient(ellipse at center,#2fd8ffaa,#2fd8ff00 70%)}
html.holo .cinematic-stage-label{display:none}
@keyframes holo-scan{to{background-position:0 40px}}
@media (prefers-reduced-motion:reduce){html.holo #mentor-cinematic-stage::after{animation:none}}
#mentor-real3d-status{position:absolute;inset:auto 12px 10px;z-index:3;text-align:center;font-size:.73rem;line-height:1.4;color:#bce5ff;background:#021a31b0;border-radius:8px;padding:8px}
#mentor-cinematic-stage[data-real3d="ready"] html.holo,html.holo body{background:transparent}
html.holo #mentor-real3d-canvas{filter:sepia(1) hue-rotate(150deg) saturate(2.4) brightness(1.25) contrast(1.05);opacity:.86}
html.holo #mentor-cinematic-stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
 background:repeating-linear-gradient(0deg,#7df3ff1f 0 1px,transparent 1px 4px);mix-blend-mode:screen;animation:holo-scan 6s linear infinite;
 -webkit-mask-image:radial-gradient(ellipse 48% 52% at 50% 52%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 48% 52% at 50% 52%,#000 40%,transparent 100%)}
html.holo #mentor-cinematic-stage::before{content:"";position:absolute;left:12%;right:12%;bottom:1%;height:7%;z-index:0;pointer-events:none;
 background:radial-gradient(ellipse at center,#2fd8ffaa,#2fd8ff00 70%)}
html.holo .cinematic-stage-label{display:none}
@keyframes holo-scan{to{background-position:0 40px}}
@media (prefers-reduced-motion:reduce){html.holo #mentor-cinematic-stage::after{animation:none}}
#mentor-real3d-status{display:none}
#mentor-cinematic-stage[data-real3d="loading"] #mentor-real3d-status,
#mentor-cinematic-stage[data-real3d="photo"] #mentor-real3d-status{display:block}
</style>
<script type="module" src="mentor-real3d.bundle.mjs" defer></script>
</head><body>
<div id="mentor-cinematic-stage" data-real3d="loading">
  <canvas id="mentor-real3d-canvas" width="320" height="720" hidden role="img" aria-label="Ζωντανός τρισδιάστατος εκπαιδευτής MENTOR"></canvas>
  <span class="cinematic-character" hidden aria-hidden="true"></span>
  <button type="button" id="mentor-real3d-toggle" hidden disabled></button>
  <button type="button" id="mentor-real3d-photo" hidden></button>
  <span class="cinematic-stage-label">MENTOR · 3D</span>
  <input type="range" id="mentor-real3d-rotation" min="-110" max="110" value="0" hidden>
  <input type="checkbox" id="mentor-real3d-motion" checked hidden>
  <div id="mentor-avatar" data-viseme="rest" hidden aria-hidden="true"></div>
  <p id="mentor-real3d-status" role="status">Φόρτωση 3D εκπαιδευτή…</p>
</div>
<script>
(function(){
 const stage=document.getElementById("mentor-cinematic-stage"),avatar=document.getElementById("mentor-avatar");
 window.addEventListener("message",event=>{
   if(event.origin!==location.origin||event.source!==window.parent)return;
   const d=event.data||{};
   if(d.type==="mentor:speech"){
     avatar.classList.toggle("is-speaking",!!d.speaking);
     avatar.dataset.viseme=typeof d.viseme==="string"?d.viseme:"rest";
   }
   if(d.type==="mentor:holo")document.documentElement.classList.toggle("holo",d.on===true);
   if(d.type==="mentor:presence"&&d.detail&&typeof d.detail.id==="string")
     document.dispatchEvent(new CustomEvent("mentor:presence",{detail:d.detail}));
 });
 const observer=new MutationObserver(()=>{
   const state=stage.dataset.real3d;
   if(state==="ready"||state==="photo")window.parent.postMessage({type:"mentor:stage",state},location.origin);
 });
 observer.observe(stage,{attributes:true,attributeFilter:["data-real3d"]});
 window.addEventListener("pagehide",()=>observer.disconnect(),{once:true});
})();
</script></body></html>
