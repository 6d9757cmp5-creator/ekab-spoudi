const RENAME={

 // Plain long-sleeve shirt: recolour every clothing pixel to one navy keeping the fabric shading, remove stripes/panels, flatten the pocket relief.
 const shirtify=cv=>{
  const k=cv.width/1024,ctx=cv.getContext("2d");ctx.setTransform(1,0,0,1,0,0);

  for(let y=0;y<H;y++){let s=0;const row=y*W;for(let x=-rad;x<=rad;x++)s+=L[row+Math.min(W-1,Math.max(0,x))];for(let x=0;x<W;x++){tmp[row+x]=s/(2*rad+1);s+=L[row+Math.min(W-1,x+rad+1)]-L[row+Math.max(0,x-rad)];}}

  for(let x=0;x<W;x++){let s=0;for(let y=-rad;y<=rad;y++)s+=tmp[Math.min(H-1,Math.max(0,y))*W+x];for(let y=0;y<H;y++){sm[y*W+x]=s/(2*rad+1);s+=tmp[Math.min(H-1,y+rad+1)*W+x]-tmp[Math.max(0,y-rad)*W+x];}}
