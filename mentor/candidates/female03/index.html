<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MENTOR — υποψήφιο μοντέλο</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0b2a3a;color:#eaf6ff;font:15px/1.4 system-ui,Segoe UI,sans-serif;display:grid;grid-template-rows:1fr auto;height:100vh}
#stage{width:100%;height:100%;display:block;min-height:0}
.panel{padding:12px 16px;background:#06202c;border-top:1px solid #1d4a60;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{background:#12506b;color:#fff;border:1px solid #2b7da1;border-radius:8px;padding:8px 12px;font:inherit;min-height:40px;cursor:pointer}
button:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
#status{flex-basis:100%;opacity:.85;font-size:13px}
</style></head><body>
<canvas id="stage" aria-label="Υποψήφιο τρισδιάστατο μοντέλο MENTOR"></canvas>
<div class="panel">
 <button data-mood="welcoming">Καλωσόρισμα</button><button data-mood="explanatory">Εξήγηση</button><button data-mood="supportive">Ενθάρρυνση</button>
 <button data-mood="caring">Φροντίδα</button><button data-mood="examiner">Εξεταστής</button><button data-mood="strict">Αυστηρή</button>
 <button id="speak">▶ Δοκιμή ομιλίας (μόνο στόμα)</button>
 <button id="zoom">Κοντινό / Ολόσωμο</button>
 <span id="status" role="status">Φόρτωση…</span>
 <span style="flex-basis:100%;font-size:12px;opacity:.7">Υποψήφιο μοντέλο: Microsoft Rocketbox Medical_Female_03 (MIT). Δεν είναι επίσημη στολή ΕΚΑΒ. Το στόμα κινείται από το κείμενο, όχι από ήχο — δεν είναι ακριβές lip-sync.</span>
</div>
<script type="module" src="candidate.bundle.mjs"></script>
<script type="module">
document.addEventListener("click",e=>{
 const m=e.target.closest("[data-mood]");if(m)window.__avatar?.setMood(m.dataset.mood);
 if(e.target.id==="zoom")window.__setView(window.__view==="bust"?"full":"bust");
 if(e.target.id==="speak")window.__avatar?.speakText("Η καρδιοπνευμονική αναζωογόνηση ξεκινά με θωρακικές συμπιέσεις και ασφάλεια της σκηνής.");
});
</script>
</body></html>
