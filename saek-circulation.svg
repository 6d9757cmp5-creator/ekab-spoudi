<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Πνευμονική και συστηματική κυκλοφορία</title><desc id="desc">Δύο συνδεδεμένοι κύκλοι: δεξιό τμήμα καρδιάς προς πνεύμονες και αριστερό τμήμα προς σώμα.</desc><rect width="800" height="480" fill="#f5f9fc"/><text x="400" y="43" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif" fill="#163d55">Οι δύο κυκλοφορίες του αίματος</text><g font-family="sans-serif" font-size="17" text-anchor="middle" font-weight="600"><rect x="45" y="175" width="170" height="100" rx="16" fill="#e1eef8" stroke="#7ca5c4" stroke-width="3"/><text x="130" y="216" fill="#163d55">Δεξιά</text><text x="130" y="239" fill="#163d55">κοιλία</text><rect x="315" y="90" width="170" height="100" rx="16" fill="#e0f4fc" stroke="#70b0ce" stroke-width="3"/><text x="400" y="130" fill="#163d55">Πνεύμονες</text><text x="400" y="154" fill="#163d55">(ανταλλαγή αερίων)</text><rect x="585" y="175" width="170" height="100" rx="16" fill="#fbe5e6" stroke="#bd7685" stroke-width="3"/><text x="670" y="215" fill="#6b3145">Αριστερή</text><text x="670" y="239" fill="#6b3145">καρδιά</text><rect x="315" y="320" width="170" height="100" rx="16" fill="#f2edf9" stroke="#9b83bb" stroke-width="3"/><text x="400" y="361" fill="#463d60">Ιστοί σώματος</text><text x="400" y="385" fill="#463d60">(μεταφορά O₂)</text></g><g fill="none" stroke-width="10" stroke-linecap="round"><path d="M210 205 Q265 170 315 143" stroke="#4b9ac3"/><path d="M485 143 Q540 168 584 205" stroke="#d17e86"/><path d="M668 278 Q620 377 485 372" stroke="#d17e86"/><path d="M315 370 Q180 365 130 278" stroke="#4b9ac3"/></g><g font-size="29" fill="#163d55" font-family="sans-serif" text-anchor="middle"><text x="260" y="167">›</text><text x="542" y="166">›</text><text x="558" y="364">‹</text><text x="235" y="358">‹</text></g><text x="400" y="461" text-anchor="middle" font-size="13" fill="#627889" font-family="sans-serif">Σχηματικό · το δεξί τμήμα της καρδιάς τροφοδοτεί τους πνεύμονες, το αριστερό το σώμα</text></svg>